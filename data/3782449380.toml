["Building.EarthRecalculator.Pointdexters.Description"]
status = "normal"
raw = "Recalculates the best course of action to restore Earth. When launched, makes the beavers in the area extra happy."
enUS = "Recalculates the best course of action to restore Earth. When launched, makes the beavers in the area extra happy."
zhCN = "“重新计算恢复地球的最佳行动方案。发射时，使该区域内的海狸额外快乐。”"
zhTW = "重新計算最佳行動路徑以恢復地球。啟動後，會讓該區域的海狸感到特別快樂。"
ruRU = "Пересчитывает лучший курс действий для восстановления Земли. При запуске вызывает у бобров в этом районе дополнительное счастье."
jaJP = "地球を復元するための最良の行動コースを再計算します。発動すると、その地域のビーバーを特別に幸せにします。"
frFR = "Recalcule le meilleur plan d'action pour restaurer la Terre. Lorsqu'il est lancé, rend les castors de la zone encore plus heureux."
deDE = "Berechnet den besten Handlungsverlauf zur Wiederherstellung der Erde. Bei der Aktivierung macht es die Biber in der Umgebung besonders glücklich."
plPL = "Przelicza najlepszy sposób, aby przywrócić Ziemię. Po uruchomieniu sprawia, że bobry w okolicy są wyjątkowo szczęśliwe."
ptBR = "Recalcula o melhor curso de ação para restaurar a Terra. Ao ser ativado, faz com que os castores na área fiquem mais felizes."
koKR = "지구를 복원하기 위한 최선의 행동 방침을 재계산합니다. 발사되면, 해당 지역의 비버들이 더욱 행복해집니다."
csCZ = "Rekalibruje nejlepší způsob, jak obnovit Zemi. Když je spuštěn, činí bobry v oblasti extra šťastnými."
viVN = "Tính toán lại hướng đi tốt nhất để phục hồi Trái Đất. Khi được kích hoạt, làm cho những con nhím trong khu vực trở nên vui vẻ hơn."
trTR = "Yerin yeniden hesaplanması için en iyi eylem planını hesaplar. Başlatıldığında, bölgedeki kunduzları ekstra mutlu eder."

