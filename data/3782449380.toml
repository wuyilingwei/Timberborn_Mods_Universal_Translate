["Faction.Pointdexters.Description"]
status = "normal"
raw = "The Pointdexters are an extremely advanced colony of beavers. They prioritize science above all else.\nTheir motto: <i>Excelsior!</i>"
enUS = "The Pointdexters are an extremely advanced colony of beavers. They prioritize science above all else. Their motto: <i>Excelsior!</i>"
zhCN = "Pointdexters是一个极其先进的海狸殖民地。他们将科学置于首位。  \n他们的座右铭：<i>激昂向上！</i>"
zhTW = "Pointdexters 是一個非常先進的海狸殖民地。他們優先考慮科學，超越一切。  \n他們的座右銘：<i>卓越不凡！</i>"
ruRU = "Поинтдекстерс - это чрезвычайно развитая колония бобров. Они ставят науку выше всего остального. Их девиз: <i>Экскельсиор!</i>"
jaJP = "ポイントデクスターは非常に進んだビーバーのコロニーです。彼らは何よりも科学を優先します。彼らのモットー: <i>エクセルシオール！</i>"
frFR = "Les Pointdexters sont une colonie de castors extrêmement avancée. Ils privilégient la science avant tout.  \nLeur devise : <i>Excelsior !</i>"
deDE = "Die Pointdexters sind eine äußerst fortschrittliche Kolonie von Bibern. Sie stellen die Wissenschaft über alles. Ihr Motto: <i>Excelsior!</i>"
plPL = "Pointdexters to niezwykle zaawansowana kolonia bobrów. Priorytetem dla nich jest nauka ponad wszystko. \nIch motto: <i>Excelsior!</i>"
ptBR = "Os Pointdexters são uma colônia de castores extremamente avançada. Eles priorizam a ciência acima de tudo. Seu lema: <i>Excelsior!</i>"
koKR = "포인터 덱스터스는 매우 발전된 비버 식민지입니다. 그들은 모든 것보다 과학을 우선시합니다. 그들의 모토: <i>엑셀시오르!</i>"
csCZ = "Pointdexters jsou extrémně pokročilá kolonie bobrů. Upřednostňují vědu nade vše. Jejich motto: <i>Excelsior!</i>"
viVN = "Pointdexters là một thuộc địa cực kỳ tiến bộ của loài hải ly. Họ đặt khoa học lên hàng đầu.  \nKhẩu hiệu của họ: <i>Excelsior!</i>"
trTR = "Pointdexters, son derece gelişmiş bir kunduz kolonisi. Bilimi her şeyin üstünde tutuyorlar. Sloganları: <i>Excelsior!</i>"

