["Faction.Pointdexters.WonderCompletionFlavor"]
status = "normal"
raw = "After studying as much as they can about their new environment, they are ready to create a new path to the restoration of the Earth. As always, Excelsior!"
enUS = "After studying as much as they can about their new environment, they are ready to create a new path to the restoration of the Earth. As always, Excelsior!"
zhCN = "“在尽可能多地研究了他们的新环境后，他们准备开辟一条通往地球恢复的新道路。和往常一样，奋发向上！”"
zhTW = "在盡可能多地研究他們的新環境後，他們已準備好開創一條恢復地球的新道路。和往常一樣，卓越無比！"
ruRU = "После того как они изучили всё, что могли, о своей новой среде, они готовы проложить новый путь к восстановлению Земли. Как всегда, Экскельсиор!"
jaJP = "新しい環境についてできる限り学んだ後、彼らは地球の復興への新たな道を切り開く準備ができました。いつものように、エクセルシオール！"
frFR = "Après avoir étudié autant qu'ils le pouvaient sur leur nouvel environnement, ils sont prêts à tracer un nouveau chemin vers la restauration de la Terre. Comme toujours, Excelsior !"
deDE = "Nachdem sie so viel wie möglich über ihre neue Umgebung gelernt haben, sind sie bereit, einen neuen Weg zur Wiederherstellung der Erde zu schaffen. Wie immer, Excelsior!"
plPL = "Po zbadaniu jak najwięcej o swoim nowym środowisku, są gotowi stworzyć nową drogę do przywrócenia Ziemi. Jak zawsze, Excelsior!"
ptBR = "Depois de estudar o máximo que puderam sobre seu novo ambiente, eles estão prontos para criar um novo caminho para a restauração da Terra. Como sempre, Excelsior!"
koKR = "새로운 환경에 대해 가능한 한 많은 연구를 한 후, 그들은 지구 복원의 새로운 길을 만들 준비가 되었습니다. 항상 그렇듯이, 엑셀시어!"
csCZ = "Po co nejvíce nastudovali o svém novém prostředí, jsou připraveni vytvořit novou cestu k obnovení Země. Jako vždy, Excelsior!"
viVN = "Sau khi nghiên cứu càng nhiều càng tốt về môi trường mới của họ, họ đã sẵn sàng để tạo ra một con đường mới cho việc phục hồi Trái Đất. Như mọi khi, Excelsior!"
trTR = "Yeni çevreleri hakkında mümkün olduğunca çok şey öğrendikten sonra, Dünya'nın yeniden tesisi için yeni bir yol yaratmaya hazırlar. Her zamanki gibi, Excelsior!"

["Faction.Pointdexters.WonderCompletionMessage"]
status = "normal"
raw = "Eureka, you've done it! By devoting yourself to the pursuit of science you managed to master the Pointdexters and harness this map's resources to build the faction's wonder."
enUS = "Eureka, you've done it! By dedicating yourself to the pursuit of science, you have mastered the Pointdexters and harnessed this map's resources to construct the faction's wonder."
zhCN = "“好极了，你成功了！通过致力于科学的追求，你掌握了Pointdexters，并利用这片地图的资源建造了这个派系的奇迹。”"
zhTW = "「太好了，你成功了！通過專注於科學的探索，你掌握了點智族並利用這張地圖的資源建立了該派系的奇觀。」"
ruRU = "Эврика, вы это сделали! Посвятив себя научным исследованиям, вы смогли овладеть Поинтдекстерами и использовать ресурсы этой карты для строительства чуда фракции."
jaJP = "「ユーレカ、あなたはやりました！科学の探求に身を捧げることで、ポイントデクスターをマスターし、このマップの資源を活用して派閥の驚異を建設しました。」"
frFR = "Eureka, vous l'avez fait ! En vous consacrant à la recherche scientifique, vous avez réussi à maîtriser les Pointdexters et à exploiter les ressources de cette carte pour construire la merveille de la faction."
deDE = "Eureka, du hast es geschafft! Indem du dich der Wissenschaft gewidmet hast, hast du es geschafft, die Pointdexters zu meistern und die Ressourcen dieser Karte zu nutzen, um das Wunder der Fraktion zu bauen."
plPL = "Eureka, udało ci się! Poświęcając się dążeniu do nauki, udało ci się opanować Pointdexters i wykorzystać zasoby tej mapy do zbudowania cudów frakcji."
ptBR = "Eureka, você conseguiu! Ao dedicar-se à busca pela ciência, você conseguiu dominar os Pointdexters e aproveitar os recursos deste mapa para construir a maravilha da facção."
koKR = "유레카, 당신이 해냈습니다! 과학 탐구에 헌신함으로써 포인텍스터스를 정복하고 이 맵의 자원을 활용하여 종족의 경이로움을 건설했습니다."
csCZ = "Eureka, dokázali jste to! Díky svému oddání vědeckému bádání se vám podařilo ovládnout Pointdexters a využít zdroje na této mapě k postavení zázraku frakce."
viVN = "Thật tuyệt vời, bạn đã làm được! Bằng cách cống hiến cho việc theo đuổi khoa học, bạn đã thành thạo các Pointdexters và khai thác tài nguyên của bản đồ này để xây dựng kỳ quan của phe."
trTR = "Eureka, başardın! Bilim peşinde kendini adayıp Pointdexters'ı ustaca yönetmeyi ve bu haritanın kaynaklarını kullanarak fraksiyonun harikasını inşa etmeyi başardın."

["Building.AdvancedBreedingPodPointdexters.FlavorDescription"]
status = "normal"
