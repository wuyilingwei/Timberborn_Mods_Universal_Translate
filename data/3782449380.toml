["Faction.Pointdexters.GameOver.Flavor"]
status = "normal"
raw = "It's in moments like these that failing to learn the lessons of our predecessors is the most detrimental."
enUS = "It's in moments like these that failing to learn the lessons of our predecessors is the most detrimental."
zhCN = "正是在这样的时刻，未能吸取前人教训是最具破坏性的。"
zhTW = "在這樣的時刻，不學習前人的教訓是最具危害性的。"
ruRU = "Именно в такие моменты несоблюдение уроков наших предшественников является самым разрушительным."
jaJP = "「こうした瞬間に、先人たちの教訓を学ぶことを怠ることが最も有害である。」"
frFR = "C'est dans des moments comme ceux-ci que ne pas apprendre les leçons de nos prédécesseurs est le plus nuisible."
deDE = "Es sind Momente wie diese, in denen das Versäumnis, die Lehren unserer Vorgänger zu lernen, am schädlichsten ist."
plPL = "W takich chwilach, gdy zawiodą nas lekcje naszych poprzedników, skutki są najbardziej dotkliwe."
ptBR = "É em momentos como este que falhar em aprender as lições de nossos predecessores é o mais prejudicial."
koKR = "선조들의 교훈을 배우지 못하는 것이 가장 해로운 순간이다."
csCZ = "Právě v takových chvílích je selhání v učení se lekcím našich předchůdců nejvíce škodlivé."
viVN = "Trong những khoảnh khắc như thế này, việc không học hỏi từ những bài học của tổ tiên chúng ta là điều gây hại nhất."
trTR = "Bu gibi anlarda, atalarımızın derslerini öğrenmemek en zararlı olanıdır."

["Faction.Pointdexters.GameOver.Message"]
status = "normal"
raw = "Your Pointdexters perished during their quest for knowledge. This is the end."
