["Building.RefrigeratedWarehouse.FlavorDescription"]
status = "normal"
raw = "\"Specially cooled to keep our ice extra icy. Warranty not included.\" -Dr. Icy Mc'Icytail"
enUS = "\"Specially cooled to keep our ice extra icy. Warranty not included.\" -Dr. Icy Mc'Icytail"
zhCN = "“特别降温以保持我们的冰块更加冰冷。不包括保修。” - 冰博士 麦克·冰尾"
zhTW = "\"特別冷卻，以保持我們的冰更加冰冷。不含保固。\" -冰博士 麥克'冰尾"
ruRU = "\"Специально охлаждено, чтобы наш лед оставался особенно холодным. Гарантия не включена.\" - Др. Айси Макайситайл"
jaJP = "「特別に冷却され、氷をさらに冷たく保ちます。保証は含まれていません。」-Dr. Icy Mc'Icytail"
frFR = "\"Spécialement refroidi pour garder notre glace extra froide. Garantie non incluse.\" - Dr. Icy Mc'Icytail"
deDE = "\"Speziell gekühlt, um unser Eis extra eisig zu halten. Garantie nicht enthalten.\" - Dr. Icy Mc'Icytail"
plPL = "\"Specjalnie schłodzone, aby nasze lód było jeszcze bardziej lodowe. Gwarancja nie jest zawarta.\" -Dr. Icy Mc'Icytail"
ptBR = "\"Especialmente resfriado para manter nosso gelo super gelado. Garantia não incluída.\" -Dr. Icy Mc'Icytail"
koKR = "\"특별히 냉각되어 우리의 얼음을 더욱 차갑게 유지합니다. 보증은 포함되어 있지 않습니다.\" - 드. 아이시 맥'아이시테일"
csCZ = "\"Speciálně chlazeno, aby naše led bylo extra ledové. Záruka není zahrnuta.\" - Dr. Icy Mc'Icytail"
viVN = "\"Được làm lạnh đặc biệt để giữ cho đá của chúng ta luôn lạnh hơn. Bảo hành không bao gồm.\" -Dr. Icy Mc'Icytail"
trTR = "\"Özel olarak soğutulmuş, buzlarımızı ekstra serin tutmak için. Garanti dahil değildir.\" - Dr. Icy Mc'Icytail"

