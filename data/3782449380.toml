["NaturalResource.LemonTree.FlavorDescription"]
status = "normal"
raw = "\"When life gives you lemons.\",\nGood.CandyCorn.DisplayName,Candy Corn,A Hallowbeav classic.\""
enUS = "\"When life gives you lemons.\"  \nCandy Corn  \nA Hallowbeav classic."
zhCN = "“当生活给你柠檬时。”  \n好.糖果玉米.显示名称,糖果玉米, 一款万圣节经典。"
zhTW = "\"\"\"當生活給你檸檬時。\",\n好.糖果玉米.顯示名稱,糖果玉米,一個哈洛比夫經典。\"\"\""
ruRU = "\"Когда жизнь дает вам лимоны.\"  \n\"Хорошо. Конфета кукуруза.\"  \n\"Конфета кукуруза, классика Хэллоубива.\""
jaJP = "\"人生がレモンをもたらすとき。\"  \n良い。キャンディコーン。表示名、キャンディコーン、ハロービーバーの名作。\""
frFR = "\"\"\"Quand la vie vous donne des citrons.\",\nBon.BonbonMaïs.NomAffichage,Bonbon Maïs,Un classique de Hallowbeav.\"\"\""
deDE = "\"\"Wenn das Leben dir Zitronen gibt.\",\nGut.Karamellmais.AnzeigeName,Karamellmais,Ein Hallowbeav-Klassiker.\"\""
plPL = "\"Gdy życie daje ci cytryny.\",\nDobry.CukierKukurydziany.NazwaWyświetlana,Cukier kukurydziany,Klasyk Hallowbeav.\""
ptBR = "\"\"Quando a vida lhe dá limões.\",\nBom.CandyCorn.DisplayName,Candy Corn,Um clássico do Hallowbeav.\"\""
koKR = "\"인생이 레몬을 줄 때.\"  \n\"좋음. 캔디 옥수수. 할로우비브의 고전.\""
csCZ = "\"Když ti život dá citrony.\",\nDobré.Popis.Kukuřice na candy,Kukuřice na candy,Klasika Hallowbeav.\""
viVN = "\"Khi cuộc sống cho bạn chanh.\",\nTên hiển thị Good.CandyCorn, Bắp ngô kẹo, Một cổ điển Hallowbeav.\""
trTR = "\"\"Hayat sana limon verirse.\"  \nİyi. Şeker Mısırı.Adi, Şeker Mısırı, Hallowbeav klasiği.\"\""

