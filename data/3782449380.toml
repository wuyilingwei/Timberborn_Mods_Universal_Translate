["Building.IceBath.FlavorDescription"]
status = "normal"
raw = "The beavers can't decide if this is a pleasure or a punishment, but it doesn't stop them from coming here often."
enUS = "The beavers can't decide if this is a pleasure or a punishment, but it doesn't stop them from coming here often."
zhCN = "“海狸们无法决定这是快乐还是惩罚，但这并不妨碍他们经常来到这里。”"
zhTW = "「海狸們無法決定這是享受還是懲罰，但這並不妨礙他們經常來這裡。」"
ruRU = "«Бобры не могут решить, является ли это удовольствием или наказанием, но это не мешает им часто приходить сюда.»"
jaJP = "ビーバーたちはこれが楽しいのか罰なのか決められませんが、だからといってここに頻繁に来るのをやめるわけではありません。"
frFR = "Les castors ne peuvent pas décider s'il s'agit d'un plaisir ou d'une punition, mais cela ne les empêche pas de venir ici souvent."
deDE = "Die Biber können sich nicht entscheiden, ob dies ein Vergnügen oder eine Bestrafung ist, aber das hält sie nicht davon ab, oft hierher zu kommen."
plPL = "Bóbr nie może zdecydować, czy to przyjemność, czy kara, ale to nie powstrzymuje ich przed częstym przychodzeniem tutaj."
ptBR = "Os castores não conseguem decidir se isso é um prazer ou um castigo, mas isso não os impede de vir aqui com frequência."
koKR = "비버들은 이것이 즐거움인지 처벌인지 결정을 내릴 수 없지만, 그렇다고 해서 자주 이곳에 오는 것을 멈추지는 않습니다."
csCZ = "“Někdy si bobři nejsou jisti, jestli je to požitkem nebo trestem, ale to je neodrazuje od toho, aby sem chodili často.”"
viVN = "Những con castor không thể quyết định đây là một niềm vui hay là một hình phạt, nhưng điều đó không ngăn cản chúng đến đây thường xuyên."
trTR = "Kunduzlar bunun bir zevk mi yoksa bir ceza mı olduğuna karar veremiyor, ama bu onları buraya sık sık gelmekten alıkoymuyor."

