["ControllerSupport.NoGamepadDialog.Message"]
raw = "No controller was detected. By default, Steam Input sets a controller to a keyboard and mouse layout, which this mod cannot use. Switch it to a gamepad layout for controller support to work."
status = "normal"
enUS = "No controller was detected. By default, Steam Input sets a controller to a keyboard and mouse layout, which this mod cannot use. Switch it to a gamepad layout for controller support to work."
zhCN = "未检测到控制器。默认情况下，Steam Input 会将控制器设置为键盘和鼠标布局，而该 мод 无法使用。请将其切换到游戏手柄布局，以使控制器支持正常工作。"
zhTW = "未檢測到控制器。預設情況下，Steam Input 將控制器設置為鍵盤和鼠標佈局，而此模組無法使用。請將其切換為遊戲手把佈局，以啟用控制器支持。"
ruRU = "Контроллер не был обнаружен. По умолчанию Steam Input устанавливает контроллер на раскладку клавиатуры и мыши, которую этот мод не может использовать. Переключите его на раскладку игрового контроллера, чтобы поддержка контроллера работала."
jaJP = "「コントローラーが検出されませんでした。デフォルトでは、Steam Inputはコントローラーをキーボードとマウスのレイアウトに設定しますが、このモッドでは使用できません。コントローラーサポートが機能するように、ゲームパッドレイアウトに切り替えてください。」"
frFR = "Aucun contrôleur n'a été détecté. Par défaut, Steam Input configure un contrôleur en tant que disposition clavier et souris, ce que ce mod ne peut pas utiliser. Changez-le en une disposition de manette pour que le support du contrôleur fonctionne."
deDE = "Es wurde kein Controller erkannt. Standardmäßig stellt Steam Input einen Controller auf ein Tastatur- und Mauslayout ein, welches dieses Mod nicht verwenden kann. Wechseln Sie es zu einem Gamepad-Layout, damit die Controller-Unterstützung funktioniert."
plPL = "Nie wykryto kontrolera. Domyślnie Steam Input ustawia kontroler w układzie klawiatury i myszy, którego ten mod nie może używać. Przełącz go na układ gamepada, aby wsparcie dla kontrolera działało."
ptBR = " nenhum controle foi detectado. Por padrão, o Steam Input configura um controle para um layout de teclado e mouse, que este mod não pode usar. Mude para um layout de gamepad para que o suporte ao controle funcione."
koKR = "컨트롤러가 감지되지 않았습니다. 기본적으로 Steam Input은 컨트롤러를 키보드와 마우스 레이아웃으로 설정하며, 이 모드는 이를 사용할 수 없습니다. 컨트롤러 지원이 작동하려면 게임패드 레이아웃으로 전환하세요."
csCZ = "Žádný ovladač nebyl detekován. Ve výchozím nastavení Steam Input nastavuje ovladač na rozložení klávesnice a myši, což tento mod nemůže použít. Přepněte ho na rozložení herního ovladače, aby podpora ovladače fungovala."
viVN = "Không phát hiện thấy bộ điều khiển nào. Theo mặc định, Steam Input đặt bộ điều khiển thành cấu hình bàn phím và chuột, mà bản mod này không thể sử dụng. Chuyển nó sang cấu hình tay cầm để hỗ trợ bộ điều khiển hoạt động."
trTR = "Hiçbir denetleyici tespit edilmedi. Varsayılan olarak, Steam Girişi bir denetleyiciyi klavye ve fare düzenine ayarlar, bu mod bunu kullanamaz. Denetleyici desteğinin çalışması için denetleyiciyi bir gamepad düzenine geçirin."

