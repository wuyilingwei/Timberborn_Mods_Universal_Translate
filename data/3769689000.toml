["Faction.Emberpelts.Description"]
raw = "The Emberpelts have an affinity for the colour red, and like to stay warm. Sometimes they just like to watch things burn.\nThey don't like getting their fur wet.\nTheir motto: <i>Hearts of fire.</i>"
status = "normal"
enUS = "The Emberpelts have an affinity for the color red and like to stay warm. Sometimes they just like to watch things burn. They don't like getting their fur wet. Their motto: <i>Hearts of fire.</i>"
zhCN = "“火焰之皮”对红色有一种亲和力，并且喜欢保持温暖。有时他们只是喜欢看东西燃烧。\n他们不喜欢毛发湿润。\n他们的座右铭：<i>火焰之心。</i>"
zhTW = "「焰皮族對紅色有著強烈的熱愛，喜歡保持溫暖。有時他們只是喜歡看東西燃燒。\n他們不喜歡自己的毛髮弄濕。\n他們的座右銘：<i>火焰之心。</i>」"
ruRU = "Эмберпелты имеют любовь к красному цвету и предпочитают оставаться в тепле. Иногда им просто нравится смотреть, как что-то горит. \nИм не нравится, когда их шуба становится влажной. \nИх девиз: <i>Сердца огня.</i>"
jaJP = "エンバーペルツ族は赤い色に親しみを持ち、温かく過ごすのが好きです。時々、物が燃えるのを眺めるのも楽しみます。彼らは毛が濡れるのを好みません。彼らのモットー：<i>火の心。</i>"
frFR = "Les Emberpelts ont une affinité pour la couleur rouge et aiment rester au chaud. Parfois, ils aiment simplement regarder les choses brûler.  \nIls n'aiment pas avoir leur pelage mouillé.  \nLeur devise : <i>Des cœurs de feu.</i>"
deDE = "Die Emberpelts haben eine Vorliebe für die Farbe Rot und bleiben gerne warm. Manchmal schauen sie einfach nur zu, wie Dinge brennen.  \nSie mögen es nicht, wenn ihr Fell nass wird.  \nIhr Motto: <i>Herzen aus Feuer.</i>"
plPL = "Emberpelts mają zamiłowanie do koloru czerwonego i lubią czuć ciepło. Czasami po prostu lubią patrzeć, jak coś się pali. Nie lubią, gdy ich futro jest mokre. Ich motto: <i>Serca ognia.</i>"
ptBR = "Os Emberpelts têm uma afinidade pela cor vermelha e gostam de se manter aquecidos. Às vezes, eles apenas gostam de ver as coisas pegarem fogo.  \nEles não gostam de molhar sua pelagem.  \nSeu lema: <i>Corações de fogo.</i>"
koKR = "엠버펠츠는 빨간색에 대한 애착이 있으며, 따뜻하게 지내는 것을 좋아합니다. 가끔 그들은 단순히 불에 타는 것을 지켜보는 것을 좋아합니다.\n그들은 털이 젖는 것을 싫어합니다.\n그들의 모토: <i>불의 심장.</i>"
csCZ = "Emberpelts mají náklonnost k červené barvě a rádi zůstávají v teple. Někdy se prostě rádi dívají, jak věci hoří. Nepreferují, aby se jejich srst namočila. Jejich motto: <i>Srdce ohně.</i>"
viVN = "Các Emberpelts có sự yêu thích với màu đỏ và thích giữ ấm. Đôi khi họ chỉ thích ngắm nhìn mọi thứ cháy.\nHọ không thích làm ướt bộ lông của mình.\nL moto của họ: <i>Trái tim của lửa.</i>"
trTR = "Emberpelts'lerin kırmızı renge bir yatkınlığı vardır ve sıcak kalmayı severler. Bazen sadece şeylerin yanışını izlemek isterler. Tüylerini ıslatmayı sevmezler. Sloganları: <i>ateş gibi kalpler.</i>"

