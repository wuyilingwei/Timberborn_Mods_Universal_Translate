["Building.Wonder.Emberpelts.Description"]
raw = "Distributes resources across the Earth. When launched, makes the beavers in the area extra happy."
status = "normal"
enUS = "Distributes resources across the Earth. When activated, makes the beavers in the area extra happy."
zhCN = "“在地球上分配资源。发射时，会让该地区的海狸们特别开心。”"
zhTW = "在地面上分配資源。啟動時，會讓該區域的海狸特別快樂。"
ruRU = "Распределяет ресурсы по всей Земле. При запуске делает бобров в округе особенно счастливыми."
jaJP = "地球全体に資源を分配します。発射されると、そのエリアのビーバーたちを特に幸せにします。"
frFR = "Distribue des ressources à travers la Terre. Lorsqu'il est lancé, rend les castors de la zone particulièrement heureux."
deDE = "„Verteilt Ressourcen über die Erde. Wenn gestartet, macht es die Biber in der Umgebung besonders glücklich.“"
plPL = "Rozprowadza zasoby po Ziemi. Po uruchomieniu sprawia, że bobry w okolicy są wyjątkowo szczęśliwe."
ptBR = "Distribui recursos pela Terra. Quando lançado, torna os castores na área extra felizes."
koKR = "지구 전역에 자원을 분배합니다. 발사될 때, 해당 지역의 비버들을 더욱 행복하게 만듭니다."
csCZ = "Distribuuje zdroje po Zemi. Po spuštění činí bobry v oblasti extra šťastné."
viVN = "Phân phối tài nguyên trên toàn trái đất. Khi được khởi động, làm cho những con nhím trong khu vực trở nên hạnh phúc hơn."
trTR = "Kaynakları Dünya genelinde dağıtır. Başlatıldığında, alandaki kunduzları ekstra mutlu eder."

["Building.Wonder.Emberpelts.FlavorDescription"]
raw = "It looks like a big fire pit to me."
status = "normal"
enUS = "It looks like a big fire pit to me."
zhCN = "对我来说，这看起来像一个大篝火坑。"
zhTW = "在我看來這像是一個大火坑。"
ruRU = "Выглядит как большая костровая яма."
jaJP = "私には大きな火の焚き火のように見えます。"
frFR = "Ça ressemble à un grand foyer pour moi."
deDE = "Das sieht für mich wie ein großes Feuerloch aus."
plPL = "Wydaje mi się, że to duży ognisko."
ptBR = "Me parece uma grande fogueira."
koKR = "저에게는 큰 화로처럼 보입니다."
csCZ = "Vypadá to jako velký ohniště pro mě."
viVN = "Đối với tôi, nó trông giống như một cái hố lửa lớn."
trTR = "Bana büyük bir ateş çukuru gibi görünüyor."

["Faction.Emberpelts.WonderCompletionFlavor"]
raw = "Having collected great wealth and knowledge, your beavers attempted to share the fruits of their labour with the suffering planet. Unfortunately it all went up in flames. At least your beavers got to see things burn!"
status = "normal"
enUS = "Having collected great wealth and knowledge, your beavers attempted to share the fruits of their labor with the suffering planet. Unfortunately, it all went up in flames. At least your beavers got to see things burn!"
zhCN = "在获得了丰富的财富和知识后，你的海狸们试图将他们劳动的果实与受苦的星球分享。不幸的是，这一切都化为灰烬。至少你的海狸们得以目睹这一切燃烧！"
zhTW = "在收集了巨大的財富和知識之後，你的海狸試圖將他們勞動的成果分享給痛苦的星球。不幸的是，一切都燒成了灰燼。至少你的海狸看到了火焰！"
ruRU = "Собрав большое количество богатства и знаний, ваши бобры попытались поделиться плодами своего труда с страдающей планетой. К сожалению, всё это сгорело дотла. По крайней мере, ваши бобры смогли увидеть, как всё горит!"
jaJP = "「大きな富と知識を集めたあなたのビーバーたちは、苦しむ地球とその労働の成果を共有しようとしました。しかし、残念ながらすべてが炎に包まれてしまいました。少なくともあなたのビーバーたちは燃える様子を見ることができました！」"
frFR = "Ayant acquis une grande richesse et des connaissances, vos castors ont tenté de partager les fruits de leur travail avec la planète en souffrance. Malheureusement, tout a pris feu. Au moins, vos castors ont pu voir les choses brûler !"
deDE = "Nachdem sie großen Reichtum und Wissen gesammelt hatten, versuchten deine Biber, die Früchte ihrer Arbeit mit dem leidenden Planeten zu teilen. Leider ging alles in Flammen auf. Zumindest konnten deine Biber sehen, wie alles brannte!"
plPL = "Zbierając ogromne bogactwo i wiedzę, twoje bobry próbowały podzielić się owocami swojej pracy z cierpiącą planetą. Niestety, wszystko poszło z dymem. Przynajmniej twoje bobry mogły zobaczyć, jak wszystko płonie!"
ptBR = "Tendo coletado grande riqueza e conhecimento, seus castores tentaram compartilhar os frutos de seu trabalho com o planeta que sofre. Infelizmente, tudo foi consumido pelas chamas. Pelo menos seus castores puderam ver as coisas pegarem fogo!"
koKR = "막대한 부와 지식을 모은 당신의 비버들은 고통받는 지구와 그들의 노동의 결실을 나누려 했습니다. 불행히도 모든 것이 불타 없어졌습니다. 적어도 당신의 비버들은 불타는 것을 목격할 수 있었습니다!"
csCZ = "Poté, co nashromáždili velké bohatství a znalosti, se vaši bobři pokusili sdílet plody své práce s trpící planetou. Bohužel vše lehlo popelem. Aspoň vaši bobři viděli, jak se věci pálí!"
viVN = "Với việc tích lũy được phong phú tài sản và kiến thức, những con hải ly của bạn đã cố gắng chia sẻ thành quả lao động của họ với hành tinh đang chịu đựng. Thật không may, mọi thứ đều bốc cháy. Ít nhất thì những con hải ly của bạn cũng đã được chứng kiến mọi thứ bùng cháy!"
trTR = " Büyük servet ve bilgi toplayan kunduzlarınız, çalışmalarının meyvelerini acı çeken gezegenle paylaşmaya çalıştılar. Ne yazık ki her şey alev aldı. En azından kunduzlarınız her şeyin yanışını görebildi!"

["Faction.Emberpelts.WonderCompletionMessage"]
raw = "Congratulations! You mastered Emberpelts and used this map's resources to build the faction's wonder."
status = "normal"
enUS = "Congratulations! You mastered Emberpelts and used this map's resources to build the faction's wonder."
zhCN = "恭喜！您掌握了 Emberpelts，并利用此地图的资源建造了该派系的奇迹。"
zhTW = "恭喜！您掌握了 Emberpelts，並利用這張地圖的資源建造了該派系的奇觀。"
