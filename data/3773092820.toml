["LV.SBl.DistroBalancer2Desc"]
status = "normal"
raw = "Upgrades Balancer so storages connect if they <YellowHighlight>share any face</YellowHighlight>, including stacked up/down. Diagonals and corner-only contact do not count.\nRequires Evenload Protocol. Only for Storage buildings."
enUS = "Upgrades the Balancer so storages connect if they <YellowHighlight>share any face</YellowHighlight>, including stacked up/down. Diagonal and corner-only contact do not count. Requires Evenload Protocol. Only for storage buildings."
zhCN = "升级平衡器，使存储设施在<YellowHighlight>共享任何面</YellowHighlight>时连接，包括上下堆叠。对角线和仅角落接触不算。\n需要均载协议。仅适用于存储建筑。"
zhTW = "升級平衡器，使儲存空間連接如果它們<YellowHighlight>共享任何面</YellowHighlight>，包括堆疊上下。對角線和僅角落接觸不計算。\n需要均載協定。僅適用於儲存建築。"
ruRU = "Улучшает балансировщик, так что склады соединяются, если они <YellowHighlight>разделяют любую грань</YellowHighlight>, включая склады, расположенные один над другим. Диагональные и угловые соприкосновения не учитываются.  \nТребуется протокол Evenload. Только для зданий хранения."
jaJP = "バランサーをアップグレードし、ストレージが<YellowHighlight>隣接する面を共有</YellowHighlight>している場合に接続されるようにします。重ねられた上下を含みます。対角線や角のみの接触は含まれません。  \nEvenload Protocolが必要です。ストレージビルディング専用です。"
frFR = "Met à niveau le Balancer afin que les stockages se connectent s'ils <YellowHighlight>partagent une face</YellowHighlight>, y compris empilés haut/bas. Les diagonales et le contact uniquement par coins ne comptent pas.\nNécessite le Protocole Evenload. Seulement pour les bâtiments de stockage."
deDE = "Verbessert den Balancer, sodass Lager verbunden werden, wenn sie <YellowHighlight>eine Fläche teilen</YellowHighlight>, einschließlich gestapelter Oben/Unten. Diagonale und nur Eckkontakte zählen nicht. Erfordert das Evenload-Protokoll. Nur für Lagergebäude."
plPL = "Ulepsza Balancer, aby magazyny łączyły się, jeśli <YellowHighlight>dzielą jakąkolwiek powierzchnię</YellowHighlight>, w tym stakowanie w górę/w dół. Diagonalne i kontakt tylko w rogach się nie liczy. Wymaga protokołu Evenload. Tylko dla budynków magazynowych."
ptBR = "Atualiza o Balancer para que os armazéns se conectem se eles <YellowHighlight>compartilharem qualquer face</YellowHighlight>, incluindo empilhados para cima/baixo. Contato diagonal e apenas de canto não contam. Requer o Protocolo Evenload. Apenas para edifícios de Armazenamento."
koKR = "저장소가 <YellowHighlight>어떠한 면을 공유</YellowHighlight>할 경우 연결되도록 균형 조절기를 업그레이드합니다. 쌓은 상하를 포함합니다. 대각선 및 모서리 접촉은 포함되지 않습니다. 균등 부하 프로토콜이 필요하며, 저장소 건물에만 해당됩니다."
csCZ = "Vylepšuje vyvažovač, takže se úložiště spojí, pokud <YellowHighlight>sdílejí jakoukoliv plochu</YellowHighlight>, včetně stohovaných nahoru/dolů. Diagonály a kontakty pouze v rozích se nezapočítávají.  \nVyžaduje protokol Evenload. Pouze pro budovy na skladování."
viVN = "Cải tiến Balancer để các kho lưu trữ kết nối nếu chúng <YellowHighlight>chia sẻ bất kỳ mặt nào</YellowHighlight>, bao gồm cả xếp chồng lên nhau. Các tiếp xúc chéo và chỉ ở góc không tính.\nCần có Giao thức Evenload. Chỉ dành cho các tòa nhà lưu trữ."
trTR = "Dengeliği yükselterek depolamaların <YellowHighlight>herhangi bir yüzeyi paylaştığında</YellowHighlight> bağlanmasını sağlar; üst üste yığılanlar da dahil. Diyagonal ve yalnızca köşe temasları geçerli değildir.  \nEvenload Protokolü gerektirir. Sadece Depolama binaları için."

["LV.SBl.DistroBalancer2Flavor"]
status = "normal"
raw = "From the lowest floor to the highest shelf, every crate finds its equal place."
enUS = "From the lowest floor to the highest shelf, every crate finds its equal place."
zhCN = "“从最低的楼层到最高的架子，每个箱子都能找到它的平衡位置。”"
zhTW = "從最低的樓層到最高的架子，每個箱子都找到了它的平等位置。"
ruRU = "От самого нижнего этажа до самой верхней полки, каждая коробка находит свое равное место."
jaJP = "「最低階から最高の棚まで、すべての箱がそれぞれの等しい場所を見つける。」"
frFR = "Du rez-de-chaussée à l'étagère la plus haute, chaque caisse trouve sa place égale."
deDE = "Vom niedrigsten Boden bis zum höchsten Regal findet jede Kiste ihren gerechten Platz."
plPL = "Od najniższego poziomu do najwyższej półki, każda skrzynka znajduje swoje równe miejsce."
ptBR = "Do andar mais baixo até a prateleira mais alta, cada caixa encontra seu lugar igual."
koKR = "최하층에서 최고 선반까지, 모든 상자는 제자리에서 균형을 찾습니다."
csCZ = "Od nejnižšího podlaží po nejvyšší policí, každé bedně najde své rovné místo."
viVN = "Từ tầng thấp nhất đến kệ cao nhất, mỗi thùng đều tìm thấy vị trí xứng đáng của nó."
trTR = "En alt katından en yüksek rafına kadar, her kutu eşit yerini bulur."

