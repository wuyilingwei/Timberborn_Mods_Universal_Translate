["LV.SBl.DistroBalancer1Desc"]
status = "normal"
raw = "Balances goods evenly among adjacent storages that also have Balancer.\n<YellowHighlight>Connects only side-by-side on the same level</YellowHighlight> (full shared wall). Does not connect up or down.\nOnly for Storage buildings."
enUS = "Balances goods evenly among adjacent storages that also have Balancer. <YellowHighlight>Connects only side-by-side on the same level</YellowHighlight> (full shared wall). Does not connect up or down. Only for Storage buildings."
zhCN = "在具有平衡器的相邻储存设施之间均匀分配货物。\n<YellowHighlight>仅在同一层级的并排连接</YellowHighlight>（共享完整墙壁）。不进行上下连接。\n仅适用于储存建筑。"
zhTW = "在有平衡器的相鄰儲存區之間均勻分配物品。<YellowHighlight>僅在同一高度的側邊連接</YellowHighlight>（完整共牆）。不會連接上下層。僅限於儲存建築。"
ruRU = "Равномерно распределяет товары между соседними складами, которые также имеют Балансир.  \n<YellowHighlight>Подключается только бок о бок на одном уровне</YellowHighlight> (полная общая стена). Не подключается выше или ниже.  \nТолько для складских зданий."
jaJP = "隣接するストレージがバランサーを持っている場合、商品を均等に分配します。\n<YellowHighlight>同じレベルで隣接している場合のみ接続</YellowHighlight>（完全共有壁）。上下には接続しません。\nストレージビルディング専用です。"
frFR = "Équilibre les marchandises de manière uniforme entre les zones de stockage adjacentes qui ont également un répartiteur.  \n<YellowHighlight>Se connecte uniquement côte à côte au même niveau</YellowHighlight> (mur partagé complet). Ne se connecte pas vers le haut ou vers le bas.  \nUniquement pour les bâtiments de stockage."
deDE = "Balanciert Waren gleichmäßig zwischen benachbarten Lagerräumen, die ebenfalls einen Balancer haben. \n<YellowHighlight>Verbindet nur nebeneinander auf derselben Ebene</YellowHighlight> (vollständige gemeinsame Wand). Verbindet sich nicht nach oben oder unten. \nNur für Lagergebäude."
plPL = "Równoważy towary równomiernie między sąsiednimi magazynami, które również mają Balancer. <YellowHighlight>Łączy tylko z boku na tym samym poziomie</YellowHighlight> (pełna wspólna ściana). Nie łączy się w górę ani w dół. Tylko dla budynków magazynowych."
ptBR = "Equilibra os bens uniformemente entre os armazéns adjacentes que também possuem Balancer.\n<YellowHighlight>Conecta apenas lado a lado no mesmo nível</YellowHighlight> (parede compartilhada completa). Não conecta para cima ou para baixo.\nApenas para edifícios de Armazenamento."
koKR = "균형 조절기가 있는 인접 저장소 간에 상품을 고르게 분배합니다.  \n<YellowHighlight>같은 수준에서 나란히만 연결됩니다</YellowHighlight> (전체 공유 벽). 위아래로는 연결되지 않습니다.  \n저장소 건물 전용입니다."
csCZ = "Vyrovnává zboží rovnoměrně mezi sousedními skladovacími budovami, které také mají vyvažovač.\n<YellowHighlight>Připojuje se pouze vedle sebe na stejné úrovni</YellowHighlight> (plná sdílená zeď). Nepřipojuje se nahoru nebo dolů.\nPouze pro skladovací budovy."
viVN = "Cân bằng hàng hóa đều giữa các kho lưu trữ liền kề cũng có Balancer. \n<YellowHighlight>Kết nối chỉ ở hai bên cạnh trên cùng một cấp độ</YellowHighlight> (tường chung đầy đủ). Không kết nối lên hoặc xuống. \nChỉ dành cho các tòa nhà lưu trữ."
trTR = "Yan yana olan ve aynı seviyede bulunan depolar arasında malları eşit şekilde dengeler ve ayrıca Dengeleyiciye sahiptir.  \n<SarıVurgu>Yalnızca yan yana ve aynı seviyede bağlanır</SarıVurgu> (tam paylaşılan duvar). Yukarı veya aşağı bağlanmaz.  \nSadece Depo binaları için."

["LV.SBl.DistroBalancer1Flavor"]
status = "normal"
raw = "When two storages stand shoulder to shoulder, the goods flow as one."
enUS = "When two storages stand shoulder to shoulder, the goods flow as one."
zhCN = "当两个储存设备并肩而立，货物便如水流般汇聚。"
zhTW = "當兩個倉庫肩並肩而立，貨物便如同一體般流動。"
ruRU = "Когда два склада стоят плечом к плечу, товары текут единым потоком."
jaJP = "「二つの倉庫が肩を寄せ合うと、物資は一つのように流れる。」"
frFR = "Lorsque deux entrepôts se tiennent côte à côte, les marchandises s'écoulent comme un seul flux."
deDE = "Wenn zwei Lagerräume Schulter an Schulter stehen, fließen die Waren als eine Einheit."
plPL = "Kiedy dwa magazyny stoją ramię w ramię, towary płyną jako całość."
ptBR = "Quando dois armazéns estão lado a lado, os bens fluem como um só."
koKR = "두 개의 저장소가 나란히 서 있을 때, 물품이 하나로 흘러간다."
csCZ = "Když stojí dvě skladiště bok po boku, zboží proudí jako jedno."
viVN = "Khi hai kho hàng đứng cạnh nhau, hàng hóa chảy như một."
trTR = "İki depolama yan yana durduğunda, mallar bir bütün olarak akar."

