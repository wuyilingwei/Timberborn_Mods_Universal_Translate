["BeaverFamilyClan.ClanExtinctPrompt.Message"]
status = "normal"
raw = "The «{0}» line has died out. Honor its memory by naming the next matching newborn after it, or let it fade into forgetting? A forgotten name can always be started again later."
enUS = "The «{0}» line has died out. Honor its memory by naming the next matching newborn after it, or let it fade into forgetting? A forgotten name can always be started again later."
zhCN = "“«{0}» 这一支线已经灭绝。通过给下一个匹配的新生儿命名来纪念它，还是让它淡入遗忘？被遗忘的名字可以在以后重新开始。”"
zhTW = "「{0}」這條血脈已經絕跡。通過將下一位符合條件的剛出生的後代命名為它來尊重它的記憶，還是讓它淡入遺忘？遺忘的名字總是可以在以後重新開始。"
ruRU = "«{0}» линия вымерла. Уважите ее память, назвав следующего подходящего новорожденного в ее честь, или позвольте ей исчезнуть в забвении? Забытое имя всегда можно будет восстановить позже."
jaJP = "「{0}」系統は絶滅しました。次の同系統の新生児にこの名を付けてその記憶を称えるか、忘却に沈ませるか？ 忘れられた名前は後で再び始めることができます。"
frFR = "La lignée «{0}» s'est éteinte. Honorez sa mémoire en nommant le prochain nouveau-né correspondant d'après elle, ou laissez-la sombrer dans l'oubli ? Un nom oublié peut toujours être recommencé plus tard."
deDE = "„Die Linie „{0}“ ist ausgestorben. Ehre ihr Andenken, indem du das nächste passende Neugeborene nach ihr benennst, oder lass es in Vergessenheit geraten? Ein vergessener Name kann später immer wieder neu begonnen werden.“"
plPL = "Linia «{0}» wymarła. Uczcij jej pamięć, nazywając następnego nowo narodzonego, który pasuje do niej, lub pozwól jej zniknąć w zapomnieniu? Zapomniane imię zawsze można ponownie użyć później."
ptBR = "A linhagem «{0}» se extinguiu. Honre sua memória nomeando o próximo newborn compatível em sua homenagem, ou deixe-a desaparecer no esquecimento? Um nome esquecido pode sempre ser recomeçado depois."
koKR = "«{0}» 혈통이 사라졌습니다. 다음 유사한 아가에게 이름을 지어 그 기억을 기리시겠습니까, 아니면 잊혀지도록 내버려 두시겠습니까? 잊혀진 이름은 언제든지 나중에 다시 시작할 수 있습니다."
csCZ = "„Linie „{0}“ vymřela. Uctěte její památku tím, že pojmenujete další odpovídající novorozené podle ní, nebo ji nechte upadnout do zapomnění? Zapomenuté jméno lze vždy znovu oživit později.“"
viVN = "Nhánh «{0}» đã tuyệt chủng. Hãy tôn vinh ký ức của nó bằng cách đặt tên cho con non phù hợp tiếp theo theo tên đó, hoặc để nó tan biến vào quên lãng? Một cái tên bị quên có thể được bắt đầu lại sau này."
trTR = "«{0}» hattı yok oldu. Anısını onurlandırmak için, bir sonraki uyumlu yeni doğanı onun adıyla mı adlandıracaksın, yoksa unutulmaya mı terk edeceksin? Unutulan bir isim her zaman daha sonra yeniden kullanılabilir."

