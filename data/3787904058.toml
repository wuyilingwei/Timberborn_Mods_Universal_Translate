["BeaverFamilyClan.CreateClanPrompt.Message"]
status = "normal"
raw = "Make «{0}» the founder of a clan? From now on, the first descendant of «{0}»'s own gender will eventually inherit this name — «{0} II», then «{0} III», and so on for as long as the clan has suitable descendants. If not, this is just a regular rename — nothing else changes."
enUS = "Make «{0}» the founder of a clan? From now on, the first descendant of «{0}»'s own gender will eventually inherit this name — «{0} II», then «{0} III», and so on for as long as the clan has suitable descendants. If not, this is just a regular rename — nothing else changes."
zhCN = "要让 «{0}» 成为家族的创始人吗？从现在开始，«{0}» 同性别的第一个后代最终将继承这个名字 — «{0} II», 然后是 «{0} III», 以此类推，只要家族有合适的后代。如果没有，这只是一个普通的改名 — 其他都不会改变。"
zhTW = "要讓 «{0}» 成為家族的創始人嗎？從現在開始，«{0}» 同性別的第一位後代將最終繼承這個名字——«{0} II」，然後是 «{0} III」，以此類推，只要家族有合適的後代。如果沒有，這只是普通的改名——沒有其他變化。"
ruRU = "Сделать «{0}» основателем клана? С этого момента первый потомок того же пола, что и «{0}», в конечном итоге унаследует это имя — «{0} II», затем «{0} III» и так далее, пока у клана есть подходящие потомки. Если нет, это просто обычное переименование — ничего больше не изменится."
jaJP = "「《{0}》をクランの創設者にしますか？これからは、《{0}》と同じ性別の最初の子孫がこの名前を受け継ぐことになります — 《{0} II》、次に《{0} III》、そしてクランに適した子孫がいる限り続きます。もしそうでなければ、これは単なる名前変更であり、他には何も変わりません。」"
frFR = "Faire de «{0}» le fondateur d'un clan ? Désormais, le premier descendant du même sexe que «{0}» héritera ce nom — «{0} II», puis «{0} III», et ainsi de suite tant que le clan a des descendants appropriés. Sinon, ce n'est qu'un simple changement de nom — rien d'autre ne change."
deDE = "Möchten Sie «{0}» zum Gründer eines Clans machen? Von nun an wird der erste Nachkomme von «{0}» des eigenen Geschlechts letztendlich diesen Namen erben — «{0} II», dann «{0} III», und so weiter, solange der Clan geeignete Nachkommen hat. Andernfalls handelt es sich nur um eine einfache Umbenennung — es ändert sich nichts weiter."
plPL = "Czy uczynić «{0}» założycielem klanu? Od teraz pierwszy potomek «{0}» tej samej płci ostatecznie odziedziczy to imię — «{0} II», następnie «{0} III» i tak dalej, tak długo, jak klan ma odpowiednich potomków. Jeśli nie, to jest to po prostu zwykła zmiana imienia — nic więcej się nie zmienia."
ptBR = "Fazer «{0}» o fundador de um clã? A partir de agora, o primeiro descendente do mesmo gênero de «{0}» herdará eventualmente este nome — «{0} II», depois «{0} III», e assim por diante, enquanto o clã tiver descendentes adequados. Se não, isso é apenas uma renomeação comum — nada mais muda."
koKR = "«{0}»를 클랜의 창립자로 만들까요? 이제부터 «{0}»의 성별이 같은 첫 번째 후손이 이 이름을 물려받게 됩니다 — «{0} II», 그 다음은 «{0} III», 그리고 클랜에 적합한 후손이 있는 한 계속해서 이어집니다. 그렇지 않으면, 이는 단순한 이름 변경일 뿐입니다 — 다른 것은 변하지 않습니다."
csCZ = "Uděláte z «{0}» zakladatele klanu? Od nynějška prvorozený potomek stejného pohlaví jako «{0}» nakonec zdedí toto jméno — «{0} II», pak «{0} III» a tak dále, dokud klan bude mít vhodné potomky. Pokud ne, je to jen obyčejné pře jméno — nic jiného se nemění."
viVN = "Đặt «{0}» làm người sáng lập một clan? Từ bây giờ, thế hệ con cháu đầu tiên cùng giới của «{0}» sẽ kế thừa cái tên này — «{0} II», sau đó là «{0} III», và cứ như vậy miễn là clan có những người thừa kế phù hợp. Nếu không, đây chỉ là một việc đổi tên thông thường — không có gì khác thay đổi."
trTR = "«{0}»ı bir klanın kurucusu mu yapmak istersiniz? Bundan sonra, «{0}»ın kendi cinsiyetinden ilk soy, bu ismi sonunda miras alacak — «{0} II», sonra «{0} III» ve klanın uygun soyları olduğu sürece devam edecek. Eğer yoksa, bu sadece sıradan bir isim değiştirmedir — başka hiçbir şey değişmez."

