[_meta]
name = "Charcoal Beavers"

["Faction.Charcoal.Description"]
status = "normal"
raw = "The Charcoal Beavers have a lot in common with the Emberpelts. They love fire and like to stay warm. Sometimes they just like to watch things burn.\nThey don't like getting their fur wet.\nTheir motto: <i>Ash and Coal.</i>"
enUS = "The Charcoal Beavers have a lot in common with the Emberpelts. They love fire and like to stay warm. Sometimes they just like to watch things burn.  \nThey don't like getting their fur wet.  \nTheir motto: <i>Ash and Coal.</i>"
zhCN = "木炭海狸与火焰皮毛一族有很多共同点。它们喜欢火焰，喜欢保持温暖。有时它们只是喜欢看东西燃烧。  \n它们不喜欢弄湿自己的毛皮。  \n它们的座右铭：<i>灰烬与煤炭。</i>"
zhTW = "木炭海狸與炭皮海狸有很多共同之處。他們熱愛火焰並喜歡保持溫暖。有時，他們只是想靜靜地觀看東西燃燒。\n他們不喜歡讓毛皮變得潮濕。\n他們的座右銘是：<i>火灰與煤炭。</i>"
ruRU = "У угольных бобров много общего с искрящимися. Они любят огонь и предпочитают держаться в тепле. Иногда им просто нравится смотреть, как что-то горит. \nИм не нравится, когда их мех становится влажным. \nИх девиз: <i>Зола и Уголь.</i>"
jaJP = "チャコールビーバーはエンバーペルトと多くの共通点があります。彼らは火を愛し、温かく過ごすのが好きです。時には物が燃えるのを見て楽しむこともあります。\n彼らは毛が濡れるのを嫌います。\n彼らのモットー：<i>灰と石炭。</i>"
frFR = "« Les castors charbonniers ont beaucoup en commun avec les pelages de braise. Ils aiment le feu et aiment rester au chaud. Parfois, ils aiment juste regarder les choses brûler.  \nIls n'aiment pas mouiller leur fourrure.  \nLeur devise : <i>Cendres et Charbon.</i> »"
deDE = "„Die Kohlenbeaver haben viel gemeinsam mit den Feuerpelzern. Sie lieben das Feuer und bleiben gerne warm. Manchmal beobachten sie einfach gerne, wie Dinge brennen.  \nSie mögen es nicht, ihr Fell nass zu bekommen.  \nIhr Motto: <i>Asche und Kohle.</i>“"
plPL = "Bobry Węglowe mają wiele wspólnego z Lśniącymi Futrami. Uwielbiają ogień i lubią pozostać w cieple. Czasami po prostu lubią patrzeć, jak coś się pali.  \nNie lubią, gdy ich futro jest mokre.  \nIch motto: <i>Popiół i Węgiel.</i>"
ptBR = "Os Castores de Carvão têm muito em comum com os Pelagens de Fogo. Eles amam o fogo e gostam de se manter aquecidos. Às vezes, eles apenas gostam de assistir as coisas queimarem.  \nEles não gostam de molhar sua pelagem.  \nSeu lema: <i>Cinzas e Carvão.</i>"
koKR = "숯 너구리는 엠버펠트와 많은 공통점을 가지고 있습니다. 그들은 불을 사랑하고 따뜻하게 지내는 것을 좋아합니다. 가끔 그들은 단순히 불타는 것을 지켜보는 것을 좋아합니다. 그들은 털이 젖는 것을 싫어합니다. 그들의 모토: <i>재와 석탄.</i>"
csCZ = "Charcoal bobři mají hodně společného s Emberpelty. Milují oheň a rádi zůstávají v teple. Někdy se jen rádi dívají, jak věci hoří. \nNemají rádi, když se jim srst namočí. \nJejich motto: <i>Popel a uhlí.</i>"
viVN = "Những con Hải Ly than có nhiều điểm chung với những con Emberpelts. Chúng thích lửa và thích giữ ấm. Đ đôi khi chúng chỉ thích ngắm nhìn mọi thứ bùng cháy.\nChúng không thích để lông ướt.\nChâm ngôn của chúng: <i>Tro và Than.</i>"
trTR = "Çamur Kayaları'nın kömürlükleri, Emberpelts ile birçok ortak noktası vardır. Ateşi severler ve sıcak kalmayı tercih ederler. Bazen sadece bir şeylerin yanmasını izlemeyi tercih ederler. Tüylerinin ıslanmasını sevmezler. Mottoları: <i>Kömür ve Kül.</i>"
