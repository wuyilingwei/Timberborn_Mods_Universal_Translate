["Calloatti.WindTweaks.Config.EnableGusts.Tooltip"]
raw = "If enabled, wind direction turns gradually and strength has smooth gusts instead of random jumps."
status = "normal"
enUS = "If enabled, wind direction changes gradually and strength has smooth gusts instead of sudden jumps."
zhCN = "“如果启用，风向将逐渐变化，风力将有平滑的阵风，而不是随机的跳动。”"
zhTW = "如果啟用，風向會逐漸轉變，風力則會有平滑的陣風，而不是隨機的跳變。"
