deDE = "Wenn aktiviert, ändert sich die Windrichtung allmählich und die Stärke hat sanfte Bögen statt zufälliger Sprünge."
plPL = "Jeśli włączone, kierunek wiatru zmienia się stopniowo, a jego siła ma płynne podmuchy zamiast losowych skoków."
ptBR = "Se ativado, a direção do vento muda gradualmente e a força apresenta rajadas suaves em vez de saltos aleatórios."
koKR = "활성화할 경우, 바람 방향이 점차적으로 바뀌고 강도가 무작위 점프 대신 부드러운 돌풍을 가집니다."
csCZ = "Pokud je povoleno, směr větru se pomalu mění a síla má hladké poryvy místo náhodných skoků."
viVN = "Nếu được bật, hướng gió sẽ thay đổi dần dần và sức mạnh có những cơn gió nhè nhẹ thay vì những cú nhảy ngẫu nhiên."
trTR = "Etkinleştirildiğinde, rüzgarın yönü yavaşça döner ve kuvvet, rastgele sıçramalar yerine yumuşak patlamalara sahiptir."

