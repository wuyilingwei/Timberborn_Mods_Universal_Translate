["LV.MBR.PlantsSpeedFlavor"]
raw = "A simple wooden calendar hung inside the building. Idle beavers glance at it and suddenly know exactly what the plants need next."
status = "normal"
enUS = "A simple wooden calendar hung inside the building. Idle beavers glance at it and suddenly know exactly what the plants need next."
zhCN = "“一个简单的木质日历挂在建筑内部。闲置的海狸瞥一眼，便立刻知道植物接下来需要什么。”"
zhTW = "一個簡單的木質日曆掛在建築內部。閒置的海狸瞥了一眼，突然就知道植物接下來需要什麼。"
ruRU = "Простой деревянный календарь висит внутри здания. Бездельничающие бобры бросают на него взгляд и внезапно точно знают, что нужно растениям дальше."
jaJP = "建物の内部に掛けられたシンプルな木製のカレンダー。何もしていないビーバーたちはそれを一瞥し、植物が次に必要とするものを瞬時に理解する。"
frFR = "Un simple calendrier en bois suspendu à l'intérieur du bâtiment. Des castors inactifs y jettent un coup d'œil et savent soudainement exactement ce dont les plantes ont besoin ensuite."
deDE = "Ein einfacher holzener Kalender hängt im Inneren des Gebäudes. Däumende Biber schauen darauf und wissen plötzlich genau, was die Pflanzen als Nächstes brauchen."
plPL = "W prostym drewnianym kalendarzu zawieszonym wewnątrz budynku. Zajęte bobry rzucają na niego okiem i nagle dokładnie wiedzą, czego potrzebują rośliny."
ptBR = "Um simples calendário de madeira pendurado dentro do edifício. Castores ociosos o olham e de repente sabem exatamente o que as plantas precisam a seguir."
koKR = "건물 안에 걸린 간단한 나무 달력. 유휴 비버들이 그것을 바라보며 식물들이 다음에 필요한 것이 무엇인지 즉시 알게 됩니다."
csCZ = "Jednoduchý dřevěný kalendář visel uvnitř budovy. Nečinné bobři se na něj podívají a najednou vědí přesně, co rostliny potřebují dál."
viVN = "Một chiếc lịch bằng gỗ đơn giản treo bên trong tòa nhà. Những con nhím nhàn rỗi nhìn vào nó và đột nhiên biết chính xác những gì cây cối cần tiếp theo."
trTR = "Binanın içinde asılı basit bir ahşap takvim. Tembel kunduzlar ona bakar ve aniden bitkilerin bir sonraki neye ihtiyacı olduğunu tam olarak bilirler."

