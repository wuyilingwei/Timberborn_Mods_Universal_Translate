["LV.MBR.BuilderHaulerSpeedBoostFlavor"]
raw = "'Give me a lever long enough and a fulcrum on which to place it, and I shall move the forest.' —xa0Archibeaves"
status = "normal"
enUS = "'Give me a lever long enough and a fulcrum on which to place it, and I shall move the forest.' —xa0Archibeaves"
zhCN = "“给我一个足够长的杠杆和一个支点，我就能撬动森林。” —xa0阿尔基比德"
zhTW = "「'給我一根足夠長的槓桿和一個支點，我就能移動整片森林。' —xa0阿基比夫斯」"
ruRU = "'Дайте мне длинный рычаг и точку опоры, на которую я могу его положить, и я сдвину лес.' —xa0Archibeaves"
jaJP = "「長いレバーとそれを置くための支点があれば、私は森を動かすことができる。」 —xa0アーキビーブス"
frFR = "'Donnez-moi un levier assez long et un point d'appui sur lequel le placer, et je ferai bouger la forêt.' —xa0Archibeaves"
deDE = "'Gib mir einen Hebel, lang genug, und einen Drehpunkt, auf den ich ihn legen kann, und ich werde den Wald bewegen.' —xa0Archibeaves"
plPL = "„Daj mi dźwignię wystarczająco długą i punkt podparcia, na którym ją postawię, a poruszę lasem.” —xa0Archibeaves"
ptBR = "'Me dê uma alavanca longa o suficiente e um ponto de apoio onde colocá-la, e moverei a floresta.' —xa0Archibeaves"
koKR = "'길고 강한 지레와 그를 지탱할 받침대만 있다면, 나는 숲을 움직일 수 있을 것이다.' —xa0Archibeaves"
csCZ = "'Dejte mi páku dostatečně dlouhou a opěrný bod, na který ji umístím, a já posunu les.' —xa0Archibeaves"
viVN = "'Hãy cho tôi một cái đòn bẩy đủ dài và một điểm tựa để đặt nó, và tôi sẽ di chuyển rừng xanh.' —xa0Archibeaves"
trTR = "'Bana yeterince uzun bir kol ve üzerine koyabileceğim bir destek ver, ormanı hareket ettireceğim.' —xa0Archibeaves"
