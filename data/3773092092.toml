["LV.MBR.PlantingSpeed1Flavor"]
raw = "A simple wooden tool that makes every hole feel just right. It won't last forever, but while it does, the soil yields gladly."
status = "normal"
enUS = "A simple wooden tool that makes every hole feel just right. It won't last forever, but while it does, the soil yields gladly."
zhCN = "一种简单的木制工具，让每个洞感觉恰到好处。它不会永远持久，但在它的使用期间，土壤会愉快地产出。"
zhTW = "一個簡單的木製工具，讓每個挖的洞都感覺恰到好處。它不會持久，但在它的使用期間，土壤會愉快地產出。"
ruRU = "Простой деревянный инструмент, который делает каждое отверстие идеальным. Он не прослужит вечно, но пока он работает, почва охотно приносит плоды."
jaJP = "「すべての穴をちょうど良い感じにしてくれるシンプルな木製ツール。永遠には持たないが、その間は土も喜んで実を結ぶ。」"
frFR = "Un simple outil en bois qui rend chaque trou parfaitement ajusté. Il ne durera pas éternellement, mais tant qu'il le fait, le sol produit avec joie."
deDE = "Ein einfaches Holzwerkzeug, das jedes Loch genau richtig macht. Es wird nicht ewig halten, aber solange es das tut, gibt der Boden bereitwillig nach."
plPL = "Proste drewniane narzędzie, które sprawia, że każde wykopane miejsce wydaje się idealne. Nie przetrwa wiecznie, ale dopóki trwa, gleba chętnie owocuje."
ptBR = "Uma ferramenta de madeira simples que faz cada buraco parecer perfeito. Ela não durará para sempre, mas enquanto durar, o solo produz alegremente."
koKR = "모든 구멍이 딱 맞는 기분을 주는 간단한 나무 도구입니다. 영원히 지속되지는 않지만, 그 동안 토양은 기꺼이 수확을 제공합니다."
csCZ = "Jednoduchý dřevěný nástroj, který dělá každý otvor přiměřeným. Nevydrží navždy, ale dokud to trvá, půda s radostí rodí."
viVN = "Một công cụ bằng gỗ đơn giản giúp mỗi lỗ trồng cảm thấy thật tuyệt. Nó sẽ không tồn tại mãi mãi, nhưng khi còn sử dụng được, đất sẽ cho ra sản phẩm với niềm vui."
trTR = "Her deliği tam hissettiren basit bir ahşap alet. Sonsuza kadar dayanmayacak, ama dayandığı sürece, toprak sevinçle ürün verir."

