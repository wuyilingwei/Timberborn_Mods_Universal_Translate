["LV.MBR.PlantsSpeedDescCommon"]
raw = "While a worker is idle in this building, plants within the building's range grow {0:+0%} faster. Multiple Growth Calendar bonuses do not stack.\nOnly for: Farmhouse variants, Foresters, Lumberjack Flags, Gatherer Flags, and Tapper Shacks."
status = "normal"
enUS = "While a worker is idle in this building, plants within the building's range grow {0:+0%} faster. Multiple Growth Calendar bonuses do not stack. Only for: Farmhouse variants, Foresters, Lumberjack Flags, Gatherer Flags, and Tapper Shacks."
zhCN = "当工人在该建筑内闲置时，建筑范围内的植物生长速度提高 {0:+0%}。多个生长日历奖励不叠加。  \n仅适用于：农舍变体、伐木工、伐木工旗帜、采集者旗帜和取水小屋。"
zhTW = "當工作人員在這棟建築內閒置時，建築範圍內的植物生長速度提高 {0:+0%}。多個生長日曆的獎勵不會重疊。  \n僅適用於：農舍變體、樹木管理者、伐木旗、採集旗和釀酒小屋。"
ruRU = "Пока работник бездействует в этом здании, растения в радиусе действия здания растут на {0:+0%} быстрее. Множество бонусов Календаря роста не складываются. \nТолько для: варианты Фермерского дома, Лесозаготовителей, Флагов Лесорубов, Флагов Собирателей и Хижинам Сборщиков."
jaJP = "「この建物で作業者が待機している間、この建物の範囲内の植物は{0:+0%}速く成長します。複数の成長カレンダーのボーナスは重複しません。\n対象: 農家バリエーション、森林作業員、伐採旗、収集旗、タッパー小屋。」"
frFR = "Lorsqu'un travailleur est inactif dans ce bâtiment, les plantes dans la portée du bâtiment poussent {0:+0%} plus rapidement. Les bonus du Calendrier de Croissance multiples ne s'empilent pas.\nUniquement pour : variantes de Maison de Ferme, Forestiers, Drapeaux de Bûcherons, Drapeaux de Collecteurs et Cabanes à Sève."
deDE = "Wenn sich ein Arbeiter in diesem Gebäude im Leerlauf befindet, wachsen Pflanzen im Bereich des Gebäudes {0:+0%} schneller. Mehrere Wachstums-Kalender-Boni stapeln sich nicht. Nur für: Bauernhaus-Varianten, Förster, Holzfäller-Flags, Sammler-Flags und Tapper-Hütten."
plPL = "Podczas gdy pracownik jest bezczynny w tym budynku, rośliny w zasięgu budynku rosną o {0:+0%} szybciej. Wielokrotne bonusy z Kalendarza Wzrostu się nie sumują. Tylko dla: wariantów Domu Rolniczego, Leśników, Flag Zbieraczy Drewna, Flag Zbieraczy i Chat Tapperskich."
ptBR = "Enquanto um trabalhador está ocioso neste edifício, as plantas dentro do alcance do edifício crescem {0:+0%} mais rápido. Vários bônus do Calendário de Crescimento não se acumulam. \nApenas para: variantes de Casa da Agricultura, Silvicultores, Bandeiras de Lenhador, Bandeiras de Coletor e Barracos de Extração."
koKR = "이 건물에서 작업자가 대기 중일 때, 건물 범위 내의 식물들이 {0:+0%} 더 빠르게 자랍니다. 여러 성장 달력 보너스는 중복되지 않습니다.\n적용 대상: 농가 변형, 임업인, 벌목기 플래그, 수확기 플래그 및 타퍼 오두막."
csCZ = "Zatímco je pracovník nečinný v této budově, rostliny v dosahu budovy rostou o {0:+0%} rychleji. Více bonusů z Růstového kalendáře se nesčítá. Pouze pro: varianty farmářských domků, lesníky, vlajky pro dřevorubce, vlajky pro sběrače a včelařské chaty."
viVN = "Khi một công nhân không làm việc trong tòa nhà này, cây cối trong vùng ảnh hưởng của tòa nhà phát triển nhanh hơn {0:+0%}. Nhiều phần thưởng Lịch Trồng không cộng dồn.\nChỉ áp dụng cho: các biến thể Nhà Nông, Người trồng cây, Cờ Người đốn gỗ, Cờ Người thu hái và Nhà thu hoạch."
trTR = "Bu binada bir işçi boşta kaldığında, binanın etkisindeki bitkiler {0:+0%} daha hızlı büyür. Birden fazla Büyüme Takvimi bonusu birikmez. Sadece: Çiftlik evleri, Ormancılık, Ağaç Kesiciler, Toplayıcı Bayrakları ve Sıvı Toplayıcı Kulübeleri için."

