["LV.MBR.PlantingSpeed2Flavor"]
raw = "Heavier in the paw, lighter on the work. The Ironseed Dibbler eventually grows on you"
status = "normal"
enUS = "Heavier in the paw, lighter on the work. The Ironseed Dibbler eventually grows on you."
zhCN = "“在爪子里更重，但在工作上更轻。铁种子种植器最终会让你喜欢上它。”"
zhTW = "爪子更重，但工作更輕鬆。鐵種插秧器最終會讓你愛上它"
ruRU = "Тяжелее в лапе, легче в работе. Железосеменной плантажер в конечном итоге привыкает к вам"
jaJP = "爪が重く、作業は楽に。アイアンシードディブラーは徐々にあなたに馴染んでいく"
frFR = "Plus lourd dans la patte, plus léger dans le travail. Le Dibbler Ironseed finit par vous séduire."
deDE = "Schwerer in der Pfote, leichter bei der Arbeit. Die Eisenkeim-Dünger wird dir schließlich ans Herz wachsen."
plPL = "Cięższy w łapie, lżejszy w pracy. Żelazny Siewnik ostatecznie staje się częścią ciebie."
ptBR = "Mais pesado na pata, mais leve no trabalho. O Dibbler de Semente de Ferro acaba crescendo em você"
koKR = "무거운 발, 가벼운 작업. 아이언시드 딥블러는 결국 당신에게 익숙해질 것입니다."
csCZ = "Těžší v tlapě, lehčí na práci. Železné semeno se nakonec na vás přilepí."
viVN = "Nặng tay hơn, nhẹ nhàng hơn trong công việc. Cây Dibbler Ironseed cuối cùng sẽ trở thành lựa chọn của bạn."
trTR = "Pençede daha ağır, işte daha hafif. Demir tohum dibler sonunda size alışır."

