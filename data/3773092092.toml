["LV.MBR.NumbercruncherSubmergeFlavor"]
raw = "Cool water is the Numbercruncher's favorite lubricant. Fully submerged, it thinks faster than the current."
status = "normal"
enUS = "Cool water is the Numbercruncher's favorite lubricant. Fully submerged, it thinks faster than the current."
zhCN = "“凉爽的水是数字计算器最喜欢的润滑剂。完全浸没后，它的思维速度超过当前。”"
zhTW = "「涼爽的水是數字計算者最喜歡的潤滑劑。完全浸入水中，它的思考速度比電流還快。」"
ruRU = "Холодная вода - любимая смазка Номеросчётчика. Полностью погружённый, он думает быстрее, чем ток."
jaJP = "冷たい水はナンバークランチャーのお気に入りの潤滑剤です。完全に沈んでいるとき、現在の速度よりも速く考えます。"
frFR = "L'eau fraîche est le lubrifiant préféré du Numbercruncher. Complètement submergé, il réfléchit plus rapidement que le courant."
deDE = "Cooles Wasser ist das Lieblingsschmiermittel des Zahlenverarbeiters. Vollständig eingetaucht denkt es schneller als der Strom."
plPL = "Zimna woda to ulubiony środek smarujący Licznikarza. Całkowicie zanurzony, myśli szybciej niż prąd."
ptBR = "Água fresca é o lubrificante favorito do Numbercruncher. Totalmente submerso, ele pensa mais rápido que a corrente."
koKR = "차가운 물은 숫자 계산기의 가장 좋아하는 윤활유입니다. 완전히 잠겨 있을 때, 현재보다 더 빠르게 생각합니다."
csCZ = "Studená voda je oblíbené mazivo Čísložrouta. Plně ponořen, myslí rychleji než proud."
viVN = "Nước mát là chất bôi trơn ưa thích của Numbercruncher. Hoàn toàn ngập nước, nó suy nghĩ nhanh hơn dòng chảy."
