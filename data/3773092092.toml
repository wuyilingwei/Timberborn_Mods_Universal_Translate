["LV.MBR.HarvestSpeed2Flavor"]
raw = "When the Ironleaf Scythe is hung up for the night, even the remaining stalks seem to stand a little taller in respect."
status = "normal"
enUS = "When the Ironleaf Scythe is hung up for the night, even the remaining stalks seem to stand a little taller in respect."
zhCN = "当铁叶镰刀在夜间挂起时，剩下的茎秆似乎也在尊敬中稍微挺立一些。"
zhTW = "當鐵葉鐮刀在夜間掛起時，即便是剩餘的莖也似乎因為尊敬而稍稍挺直了一些。"
ruRU = "Когда железный серп убирается на ночь, даже оставшиеся стебли, кажется, становятся немного выше в уважение."
jaJP = "「アイアンリーフの大鎌が夜のために吊るされると、残った茎も敬意を表するかのように少し背筋を伸ばしているように見える。」"
frFR = "Lorsque la Faux de Feuille de Fer est accrochée pour la nuit, même les tiges restantes semblent se tenir un peu plus droites par respect."
deDE = "Wenn die Eisenblatt-Sense für die Nacht aufgehängt wird, scheinen selbst die verbleibenden Stängel ein wenig aufrechter im Respekt zu stehen."
plPL = "Cuando la Hoja de Hierro se cuelga por la noche, incluso los tallos restantes parecen erguirse un poco más en señal de respeto."
ptBR = "Quando a Foice de Folha de Ferro é pendurada para a noite, até os talos restantes parecem ficar um pouco mais altos em respeito."
koKR = "철잎 낫이 밤새 걸려 있을 때, 남은 줄기도 존경심을 담아 조금 더 높이 서 있는 듯 보인다."
csCZ = "Když je Železolistá kosá na večer pověšena, i zbývající stonky se zdají stát o něco výš na znamení úcty."
viVN = "Khi cái Lưỡi Gặt Ironleaf được treo lên vào ban đêm, ngay cả những thân cây còn lại cũng dường như đứng thẳng hơn một chút để thể hiện sự tôn trọng."
trTR = "Ironleaf Biçak gece için asıldığında, geriye kalan saplar bile saygıdan bir parça daha uzun gibi duruyor."

