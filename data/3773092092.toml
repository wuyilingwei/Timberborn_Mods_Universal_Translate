["LV.MBR.InventorExtraScienceFlavor"]
raw = "A carefully measured draft of pure insight, mixed with the clearest spring water. One dose sharpens every thought for a limited time."
status = "normal"
enUS = "A carefully measured draft of pure insight, mixed with the clearest spring water. One dose sharpens every thought for a limited time."
zhCN = "一剂经过仔细测量的纯粹洞察力提取物，与最清澈的泉水混合。一次服用能在短时间内 sharpen 你的每一个想法。"
zhTW = "「細心計量的純粹洞察力之液，混合了最清澈的泉水。一劑能在有限的時間內鋭化每一個思緒。」"
ruRU = "Тщательно отмеренный глоток чистого озарения, смешанный с кристально чистой источниковой водой. Одной дозы хватает, чтобы на какое-то время обострить каждую мысль."
jaJP = "「純粋な洞察の慎重に計測された一服と、最も澄んだ春の水を混ぜ合わせたもの。1回分の投与で、限られた時間内にすべての思考を鋭くする。」"
frFR = "Un mélange soigneusement mesuré d'aperception pure, combiné à l'eau de source la plus claire. Une dose aiguise chaque pensée pendant un temps limité."
deDE = "Ein sorgfältig abgemessener Trank aus reinem Verständnis, gemischt mit dem klarsten Quellwasser. Eine Dosis schärft jeden Gedanken für kurze Zeit."
plPL = "Starannie odmierzony wywar czystej wnikliwości, wymieszany z najczystszą wodą źródlaną. Jedna dawka wyostrza każde myśli na krótki czas."
ptBR = "Um gole cuidadosamente medido de pura percepção, misturado com a mais clara água da fonte. Uma dose aguça cada pensamento por um tempo limitado."
koKR = "엄선된 순수 통찰의 비율과 가장 맑은 샘물의 혼합물. 일회 복용 시 모든 생각을 일정 시간 동안 날카롭게 해줍니다."
csCZ = "Pečlivě namíchaný nápoj čistého poznání, smíchaný s nejčistší pramenitou vodou. Jedna dávka ostří každou myšlenku na omezenou dobu."
viVN = "Một liều lượng chính xác của sự hiểu biết tinh khiết, hòa quyện với nước suối trong lành nhất. Một liều thuốc làm sắc bén mọi suy nghĩ trong một khoảng thời gian nhất định."
trTR = "Özenle ölçülmüş saf içgörü karışımı, en berrak kaynak suyu ile karıştırılmıştır. Bir doz, her düşünceyi sınırlı bir süre için keskinleştirir."

