["LV.MBR.HarvestSpeed1Flavor"]
raw = "It won't last forever, but while the shafts hold, the beavers swing it with joy."
status = "normal"
enUS = "It won't last forever, but while the shafts hold, the beavers swing it with joy."
zhCN = "“它不会永远持续，但在轴承保持的期间，海狸们愉快地摇摆着。”"
zhTW = "「雖然不會永遠持續，但在軸承能夠支撐的時候，海狸們會高高興興地搖擺它。」"
ruRU = "Это не продлится вечно, но пока валы крепки, бобры с радостью работают."
jaJP = "「永遠には続かないが、シャフトが持つ限り、ビーバーたちは喜びとともにそれを振る。」"
frFR = "Ça ne durera pas éternellement, mais tant que les arbres tiennent, les castors le manient avec joie."
deDE = "Es wird nicht ewig halten, aber solange die Wellen bestehen, schwingen die Biber es mit Freude."
plPL = "To nie potrwa wiecznie, ale póki wały wytrzymują, bobry machają tym z radością."
ptBR = "Não vai durar para sempre, mas enquanto as hastes aguentarem, os castores o balançam com alegria."
koKR = "영원히 지속되진 않겠지만, 축이 견딜 동안 비버들은 기쁨으로 그것을 휘두른다."
csCZ = "Nebude to trvat navždy, ale dokud budou hřídele držet, bobři s ním houpou s radostí."
viVN = "Nó sẽ không kéo dài mãi mãi, nhưng khi các thanh trụ còn vững, những chú chó sóc sẽ làm điều đó với niềm vui."
trTR = "Sonlu ama, şaftlar dayanırken, kunduzlar bunu sevinçle sallayacak."

