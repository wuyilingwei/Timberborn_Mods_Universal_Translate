["BeaverFamilyTree.CauseOfDeath.Hunger.F.2"]
new = "She stripped the last bark off a log, but wood is no substitute for supper — her stomach stayed just as empty."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.Hunger.F.3"]
new = "Her stomach cramped so badly that even sleep couldn't hide her from the hunger — and there was no one left to save her."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.Hunger.F.4"]
