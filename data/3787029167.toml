["BeaverFamilyTree.CauseOfDeath.Thirst.34"]
raw = "The heat was so fierce that even the shade by the dam gave no relief — the water in his body ran out faster than the day did."
status = "normal"
enUS = "The heat was so fierce that even the shade by the dam offered no relief — the water in his body ran out faster than the day did."
zhCN = "“炎热如此猛烈，即使在大坝旁的阴凉处也没有任何缓解——他体内的水分消耗得比白天还快。”"
zhTW = "炎熱如此猖獗，即使是大壩旁的陰影也無法帶來緩解——他體內的水分耗損得比一天還快。"
ruRU = "Жара была такой невыносимой, что даже тень у плотины не приносила облегчения — вода в его теле испарилась быстрее, чем проходил день."
jaJP = "「暑さは非常に厳しく、ダムの陰でも救われることはなく、彼の体の水分は日が暮れるよりも早く失われていった。」"
frFR = "La chaleur était si intense que même l'ombre près du barrage n'offrait aucun répit — l'eau dans son corps s'évadait plus rapidement que le jour ne se terminait."
deDE = "Die Hitze war so heftig, dass selbst der Schatten am Damm keine Erleichterung bot – das Wasser in seinem Körper ging schneller aus, als der Tag verging."
plPL = "Upał był tak ostry, że nawet cień przy tamie nie przynosił ulgi — woda w jego ciele kończyła się szybciej niż mijał dzień."
ptBR = "o calor era tão intenso que até a sombra perto da represa não ofereceu alívio — a água em seu corpo se esgotou mais rápido do que o dia."
koKR = "더위가 너무 맹렬해서 댐의 그늘에서도 위안이 없었고 — 그의 몸속의 물은 하루가 지나가는 것보다 더 빨리 소진되었다."
csCZ = "Horko bylo tak silné, že ani stín u hráze neposkytoval úlevu — voda v jeho těle vycházela rychleji, než den ubíhal."
viVN = "Độ nóng thật khắc nghiệt đến mức ngay cả bóng râm bên đập cũng không mang lại sự dễ chịu - nước trong cơ thể anh ta chảy ra nhanh hơn cả ngày trôi qua."
trTR = "Isı o kadar şiddetliydi ki barajın gölgesi bile rahatlatmadı — vücudundaki su, gün geçtikçe daha hızlı tükendi."

["BeaverFamilyTree.CauseOfDeath.Thirst.35"]
raw = "He believed the rains started on the same day every cycle — but this year they were late."
status = "normal"
enUS = "He believed the rains started on the same day every cycle — but this year they were late."
zhCN = "“他相信每个周期的雨水都是在同一天开始的——但今年它们来得晚了。”"
zhTW = "他相信每個循環的同一天會開始下雨——但今年他們來得晚了。"
ruRU = "Он полагал, что дожди начинаются в один и тот же день каждого цикла — но в этом году они задержались."
jaJP = "彼は、雨が毎サイクルの同じ日に始まると信じていたが、今年は遅れていた。"
frFR = "Il croyait que les pluies commençaient le même jour à chaque cycle — mais cette année, elles étaient en retard."
deDE = "Er glaubte, dass der Regen am selben Tag jedes Zyklus begann — aber in diesem Jahr waren sie spät."
plPL = "Wierzył, że deszcze zaczynają się tego samego dnia w każdym cyklu — ale w tym roku spóźniły się."
ptBR = "Ele acreditava que as chuvas começavam no mesmo dia a cada ciclo — mas este ano elas estavam atrasadas."
koKR = "그는 비가 매 사이클마다 같은 날에 시작된다고 믿었다 — 하지만 올해는 늦었다."
csCZ = "Věřil, že deště začínají ve stejný den každého cyklu — ale letos přišly pozdě."
viVN = "Ông tin rằng những cơn mưa bắt đầu vào cùng một ngày của mỗi chu kỳ — nhưng năm nay chúng đến muộn."
trTR = "Her döngüde yağmurların aynı gün başladığına inanıyordu — ama bu yıl geç kaldılar."

["BeaverFamilyTree.CauseOfDeath.Thirst.36"]
raw = "His last strength went into dragging himself to the dry canal, just to lie down at its bottom."
status = "normal"
enUS = "His last strength went into dragging himself to the dry canal, just to lie down at its bottom."
zhCN = "他最后的力气都用来拖着自己来到干涸的水渠，只为躺在底部。"
zhTW = "他的最後一絲力氣用來拖著自己到乾涸的水道，只為在底部躺下。"
ruRU = "Все свои последние силы он потратил на то, чтобы дотянуться до сухого канала, просто чтобы лечь на его дно."
jaJP = "「彼は最後の力を振り絞って乾いた水路まで引きずり、底に横たわるためだけに辿り着いた。」"
frFR = "Sa dernière force a été dépensée à se traîner jusqu'au canal sec, juste pour s'allonger au fond."
deDE = "Seine letzte Kraft ging dafür drauf, sich zum trockenen Kanal zu schleppen, nur um am Grund darin zu liegen."
plPL = "Ostatnie siły poszły na przeciągnięcie się do suchego kanału, tylko po to, aby położyć się na jego dnie."
ptBR = "Sua última força foi usada para arrastar-se até o canal seco, apenas para se deitar em seu fundo."
koKR = "그의 마지막 힘은 그가 마른 수로로 기어가 누우려고 드는 데 들어갔다."
csCZ = "Jeho poslední síly vyčerpávaly vtažení se k suchému kanálu, jen aby si lehl na jeho dno."
viVN = "Sức mạnh cuối cùng của anh ấy đã được dùng để kéo mình tới con kênh khô, chỉ để nằm xuống ở đáy nó."
trTR = "Son gücü, sadece dibine yatmak için kuru kanala sürünmekte harcandı."

["BeaverFamilyTree.CauseOfDeath.Thirst.37"]
raw = "He'd long since stopped sweating — his body was rationing even what it no longer had."
status = "normal"
enUS = "He'd long since stopped sweating — his body was rationing even what it no longer had."
zhCN = "“他早已不再出汗——他的身体甚至在节省已不存在的东西。”"
zhTW = "他早已不再流汗——他的身體甚至在節約那些它已經沒有的東西。"
ruRU = "Он давно перестал потеть — его тело экономило даже то, чего у него больше не было."
jaJP = "「彼はとっくの昔に汗をかくのをやめていた――彼の体はもはや持っていないものさえも計画的に使っていた。」"
frFR = "Il avait depuis longtemps cessé de transpirer - son corps rationnait même ce qu'il n'avait plus."
deDE = "Er hatte längst aufgehört zu schwitzen – sein Körper rationierte sogar, was er nicht mehr hatte."
plPL = "Dawno przestał się pocić — jego ciało oszczędzało nawet to, czego już nie miało."
ptBR = "Ele há muito parara de suar — seu corpo estava racionando até o que já não tinha mais."
koKR = "그는 오랫동안 땀을 흘리지 않았다 — 그의 몸은 더 이상 없던 것조차도 아끼고 있었다."
csCZ = "Dávno přestal sepotit — jeho tělo šetřilo i to, co už nemělo."
viVN = "Anh ấy đã ngừng đổ mồ hôi từ lâu - cơ thể của anh ấy đang tiết kiệm ngay cả những gì nó không còn có."
trTR = "Neredeyse terlemeyi bırakmıştı - vücudu artık sahip olduğu şeyleri bile kısıtlıyordu."

["BeaverFamilyTree.CauseOfDeath.Thirst.38"]
raw = "The ditch around the sawmill had shrunk to cracked mud, and the real river was many times farther still."
status = "normal"
enUS = "The ditch around the sawmill had shrunk to cracked mud, and the real river was many times farther still."
zhCN = "锯木厂周围的沟渠缩小成了 cracked mud，真正的河流还远得多。"
zhTW = "锯木厂周围的沟渠缩小成龟裂的泥土，而真正的河流离这里还远得多。"
ruRU = "Канава вокруг лесопилки уменьшилась до трескавшейся грязи, а настоящая река была еще на много километров дальше."
jaJP = "製材所の周りの溝はひび割れた泥に縮小し、本物の川はさらに数倍離れていた。"
frFR = "Le fossé autour de la scierie s'était rétréci en une boue craquelée, et la véritable rivière était encore bien plus éloignée."
deDE = "„Der Graben um die Sägewerk hatte sich zu rissigem Schlamm zurückgezogen, und der richtige Fluss war noch viele Male weiter entfernt.“"
plPL = "Wykop wokół tartaku skurczył się do popękanej błotnej powierzchni, a prawdziwa rzeka była jeszcze wiele razy dalej."
ptBR = "A vala ao redor da serraria havia encolhido a ponto de se tornar lama rachada, e o rio de verdade estava muitas vezes mais distante."
koKR = "제재소 주위의 도랑은 갈라진 진흙으로 줄어들었고, 실제 강은 그보다 훨씬 더 멀었다."
csCZ = "Příkop kolem pily se zmenšil na prasklou hlínu a pravá řeka byla ještě mnohem dál."
viVN = "Cái rãnh quanh xưởng cưa đã co lại thành bùn nứt nẻ, và con sông thật sự thì còn xa gấp nhiều lần nữa."
trTR = "Testere fabrikasının etrafındaki hendek çatlamış balçık haline gelmişti ve gerçek nehir hala çok daha uzaktaydı."

["BeaverFamilyTree.CauseOfDeath.Thirst.39"]
raw = "He looked at the dam one last time — the very one that was supposed to carry water to him, not past him."
status = "normal"
enUS = "He looked at the dam one last time — the very one that was supposed to carry water to him, not past him."
zhCN = "“他最后看了堤坝一眼——正是那座本应给他提供水源，而不是让水流过他的堤坝。”"
zhTW = "他最後一次看著大壩——本應該把水引給他的，而不是流過他。"
ruRU = "Он посмотрел на плотину в последний раз — ту самую, которая должна была нести воду к нему, а не мимо него."
jaJP = "彼は最後にダムを一度見返した — 自分に水を運ぶはずだった、彼を通り過ぎるのではなく。"
frFR = "Il regarda le barrage une dernière fois — celui-là même qui était censé lui apporter de l'eau, et non la laisser passer."
deDE = "Er sah den Damm ein letztes Mal an — genau den, der Wasser zu ihm bringen sollte, nicht an ihm vorbei."
plPL = "Popatrzył na tamę po raz ostatni — na tę, która miała dostarczać mu wodę, a nie ją omijać."
ptBR = "Ele olhou para a represa uma última vez — aquela que deveria levar água até ele, e não passar por ele."
koKR = "그는 댐을 마지막으로 바라보았다 — 그 댐은 그에게 물을 공급하기 위해 존재하는 것이지 그를 지나치게 하려는 것이 아니었다."
csCZ = "Podíval se na hráz naposledy — tu, která mu měla přinášet vodu, ne jí procházet."
viVN = "Anh ấy nhìn vào con đập lần cuối — chính cái mà lẽ ra phải mang nước đến cho anh, chứ không phải chảy qua anh."
trTR = "Son bir kez barajın her tarafına baktı - ona su taşıması gereken, geçmezden değil."

["BeaverFamilyTree.CauseOfDeath.Hunger.20"]
raw = "He split his grain ration with a sick neighbor and kept too little back to last himself."
status = "normal"
enUS = "He split his grain ration with a sick neighbor and kept too little back to last for himself."
zhCN = "“他将自己的粮食配给分给了一位生病的邻居，留给自己的实在太少。”"
zhTW = "「他把自己的穀物配給分給了一位生病的鄰居，而自己留得太少，以至於不足以支撐自己。」"
ruRU = "Он разделил свою порцию зерна с больным соседом и оставил себе слишком мало, чтобы продержаться."
jaJP = "彼は病気の隣人と穀物の配給を分け合い、自分が持ちこたえるには十分な量を残さなかった。"
frFR = "Il a partagé sa ration de grains avec un voisin malade et a gardé trop peu pour lui."
deDE = "Er teilte seine Getreideration mit einem kranken Nachbarn und behielt zu wenig für sich selbst zurück."
plPL = "Podzielił swoją rację zboża z chorym sąsiadem i zostawił za mało dla siebie."
ptBR = "Ele dividiu sua ração de grãos com um vizinho doente e guardou muito pouco para si."
koKR = "그는 아픈 이웃과 곡물 배급을 나누었고, 자신이 버티기에는 너무 적게 남겼다."
csCZ = "Rozdělil se o svůj příděl zrnin se nemocným sousedem a nechal si příliš málo na to, aby vydržel sám."
viVN = "Anh ta đã chia phần lương thực của mình với một người hàng xóm ốm yếu và giữ lại quá ít để sống qua ngày."
trTR = "Hasta bir komşusuyla tahıl rasyonunu paylaştı ve kendisi için yetecek kadar az bir miktar sakladı."

["BeaverFamilyTree.CauseOfDeath.Hunger.21"]
raw = "The storehouse was built too late — the harvest rotted in the rain before anyone could bring it in."
status = "normal"
enUS = "The storehouse was built too late — the harvest rotted in the rain before anyone could bring it in."
zhCN = "“仓库建得太晚——收成在雨中腐烂，没人来收。”"
zhTW = "倉庫建得太晚 — 收成在雨中腐爛，沒有人能及時收回來。"
ruRU = "Склад был построен слишком поздно — урожай сгнил под дождем, прежде чем кто-либо смог его собрать."
jaJP = "倉庫が遅すぎて建設されてしまった — 誰も収穫を持ち帰る前に、雨で腐ってしまった。"
frFR = "Le magasin a été construit trop tard — la récolte a pourri sous la pluie avant que quiconque puisse la ramasser."
deDE = "Das Lagerhaus wurde zu spät gebaut - die Ernte fault im Regen, bevor sie jemand einbringen konnte."
plPL = "„Spichlerz został zbudowany za późno — plony zgniły w deszczu, zanim ktokolwiek mógł je zebrać.”"
ptBR = "O armazém foi construído tarde demais — a colheita apodreceu na chuva antes que alguém pudesse recolhê-la."
koKR = "창고가 너무 늦게 지어져서 수확물이 누군가가 수확하기 전에 비에 썩어버렸다."
csCZ = "Sklad byl postaven příliš pozdě — úroda se zkazila na dešti, než ji kdokoli stačil sklidit."
viVN = "Kho đã được xây dựng quá muộn — mùa gặt đã hư hỏng trong mưa trước khi ai đó có thể thu hoạch."
trTR = "Depo çok geç inşa edildi — hasat, kimse içeri getirmeden önce yağmurda çürüdü."

["BeaverFamilyTree.CauseOfDeath.Hunger.22"]
raw = "He tried chewing on an old leather strap, just to feel like there was something, anything, in his mouth."
status = "normal"
enUS = "He tried chewing on an old leather strap, just to feel like there was something, anything, in his mouth."
zhCN = "他试着咬了一条旧皮带，只是想感觉到嘴里有些什么，任何东西。"
zhTW = "他試著咬一根舊皮帶，只是想感覺嘴裡有些什麼，無論是什麼。"
ruRU = "Он попробовал погрызть старый кожаный ремень, просто чтобы почувствовать, что в его рту есть что-то, что угодно."
jaJP = "彼は古い革のストラップを噛もうとした。口の中に何か、何でもいいからあるように感じたかったのだ。"
frFR = "Il a essayé de ronger une vieille sangle en cuir, juste pour avoir l'impression qu'il y avait quelque chose, n'importe quoi, dans sa bouche."
deDE = "Er versuchte, auf einem alten Lederband zu kauen, nur um das Gefühl zu haben, dass es etwas, irgendetwas, in seinem Mund gab."
plPL = "Próbował gryźć stary skórzany pasek, tylko po to, aby poczuć, że jest cokolwiek, cokolwiek w jego ustach."
ptBR = "Ele tentou morder uma velha tira de couro, apenas para sentir que havia algo, qualquer coisa, em sua boca."
koKR = "그는 입안에 무언가, 어떤 것이든 느끼고 싶어서 오래된 가죽 끈을 씹어보았다."
csCZ = "Zkoušel kouřit na starém koženém popruhu, jen aby měl pocit, že v ústech je něco, cokoliv."
viVN = "Anh ấy đã cố gắng nhai một dây da cũ, chỉ để cảm thấy như có gì đó, bất cứ thứ gì, trong miệng mình."
trTR = "Eski bir deri kayışını çiğnemeye çalıştı, ağzında bir şey, herhangi bir şey varmış gibi hissetmek için."

["BeaverFamilyTree.CauseOfDeath.Hunger.23"]
raw = "The line at the kitchen stretched all day, and there was only enough food for those at the front of it."
status = "normal"
enUS = "The line at the kitchen stretched all day, and there was only enough food for those at the front of it."
zhCN = "“厨房的队伍整天都在延续，而只有最前面的人有足够的食物。”"
zhTW = "「廚房的隊伍一整天都在延伸，而食物只有前面的人能夠分到。」"
ruRU = "Очередь на кухне тянулась весь день, и еды хватало только для тех, кто был в её начале."
jaJP = "キッチンの列は一日中延びていて、前の方にいる人だけの分の食べ物しかなかった。"
frFR = "La file d'attente à la cuisine s'est étendue toute la journée, et il n'y avait assez de nourriture que pour ceux qui étaient à l'avant."
deDE = "Die Schlange in der Küche zog sich den ganzen Tag hin, und es gab nur genug Essen für diejenigen an der Front."
plPL = "Kolejka do kuchni ciągnęła się przez cały dzień, a jedzenia wystarczyło tylko dla tych na jej początku."
ptBR = "A fila na cozinha se estendeu o dia inteiro, e havia comida suficiente apenas para aqueles na frente dela."
koKR = "부엌의 줄이 하루종일 이어졌지만, 앞쪽에 있는 사람들만큼의 음식만 있었다."
csCZ = "„Fronta v kuchyni se táhla celý den a bylo dost jídla jen pro ty, kteří byli vpředu.“"
viVN = "Dòng người ở bếp kéo dài suốt cả ngày, và chỉ đủ thức ăn cho những người ở phía trước."
trTR = "Mutfaktaki kuyruk bütün gün uzadı ve sadece önündekiler için yeterli yiyecek vardı."

["BeaverFamilyTree.CauseOfDeath.Hunger.24"]
raw = "He traded his last ration for a warm blanket — and only afterward realized a blanket doesn't fill a stomach."
status = "normal"
enUS = "He traded his last ration for a warm blanket — and only afterward realized a blanket doesn't fill a stomach."
zhCN = "他把最后一份口粮换成了一条温暖的毯子——而在那之后才意识到，毯子填不满肚子。"
zhTW = "他用最後的配給品換來了一條溫暖的毯子——而在此之後才意識到，毯子並不能填飽肚子。"
ruRU = "«Он обменял свою последнюю порцию на теплое одеяло — и лишь потом понял, что одеяло не наполняет желудок.»"
jaJP = "彼は最後の配給を温かい毛布と交換したが、毛布では腹は満たされないことに気づいたのはその後だった。"
frFR = "Il a échangé sa dernière ration contre une couverture chaude — et ce n'est qu'après qu'il a réalisé qu'une couverture ne remplit pas un estomac."
deDE = "Er tauschte seine letzte Ration gegen eine warme Decke — und erkannte erst danach, dass eine Decke keinen Magen füllt."
plPL = "Zamienił swoją ostatnią rację na ciepły koc — a dopiero później zdał sobie sprawę, że koc nie napełnia żołądka."
ptBR = "Ele trocou sua última ração por um cobertor quente — e só depois percebeu que um cobertor não enche um estômago."
koKR = "그는 마지막 배급으로 따뜻한 담요를 교환했지만, 그 이후에야 담요가 배를 채우지 않는다는 것을 깨달았다."
csCZ = "Vyměnil svou poslední dávku za teplou deku — a až poté si uvědomil, že deka nenaplní žaludek."
viVN = "Anh ta đã đổi phần ăn cuối cùng của mình để lấy một chiếc chăn ấm — và chỉ sau đó mới nhận ra một chiếc chăn thì không thể lấp đầy cái bụng."
trTR = "Son rasyonunu sıcak bir battaniye ile takas etti — ve sadece sonra bir battaniyenin karnı doyurmadığını fark etti."

["BeaverFamilyTree.CauseOfDeath.Hunger.25"]
raw = "Field mice stripped the barn's stores faster than the beavers could restock them."
status = "normal"
enUS = "Field mice stripped the barn's stores faster than the beavers could restock them."
zhCN = "田鼠把谷仓的存货掠夺得比海狸补充得还快。"
zhTW = "田鼠比海狸補充存貨的速度更快地掠奪了谷倉的儲備。"
ruRU = "Полевые мыши опустошили запасы в амбаре быстрее, чем бобры успели их пополнить."
jaJP = "「野ネズミは、ビーバーが物資を補充するよりも早く、納屋の貯蔵品を奪ってしまった。」"
frFR = "Les campagnols ont vidé les réserves de la grange plus vite que les castors n'ont pu les réapprovisionner."
deDE = "Feldmäuse haben die Vorräte der Scheune schneller geplündert, als die Biber sie wieder auffüllen konnten."
plPL = "Polne myszy opróżniły zapasy stodoły szybciej, niż bobry mogły je uzupełnić."
ptBR = "Os camundongos do campo esvaziavam os suprimentos do celeiro mais rápido do que os castores conseguiam reabastecê-los."
koKR = "들쥐가 비버들이 창고를 보충하기도 전에 헛간의 저장물을 더 빨리 빼앗아갔다."
csCZ = "Polní myši vyčistily zásoby stodoly rychleji, než je bobři stačili doplnit."
viVN = "Chuột đồng đã làm sạch nguồn dự trữ trong kho trước khi những con béo kịp tiếp tế."
trTR = "Tarlak farları, bobriklerin depolarını yeniden doldurmasından daha hızlı bir şekilde ahırın stoklarını temizledi."

["BeaverFamilyTree.CauseOfDeath.Hunger.26"]
raw = "He kept watching them build a new sawmill instead of the storehouse that was needed far more."
status = "normal"
enUS = "He kept watching them build a new sawmill instead of the storehouse that was needed far more."
zhCN = "“他不停地看着他们建造一座新的锯木厂，而不是更需要的仓库。”"
zhTW = "他一直看著他們建造一個新的鋸木廠，而不是更需要的倉庫。"
ruRU = "Он продолжал наблюдать, как они строят новую лесопилку вместо склада, который был гораздо нужнее."
jaJP = "「彼は、必要な貯蔵庫の代わりに新しい製材所を建設するのを見続けていた。」"
frFR = "Il continuait à les observer construire une nouvelle scierie au lieu de l'entrepôt dont ils avaient pourtant bien plus besoin."
deDE = "Er beobachtete weiterhin, wie sie eine neue Sägewerk bauten, anstatt das dringend benötigte Lagerhaus."
plPL = "Wciąż obserwował, jak budują nową tartak zamiast magazynu, który był znacznie bardziej potrzebny."
ptBR = "Ele continuou observando-os construir uma nova serraria em vez do armazém que era muito mais necessário."
koKR = "그는 필요로 하는 저장소 대신 새로운 제재소를 짓는 그들을 지켜보았다."
csCZ = "Pořád je sledoval, jak staví nový mlýn místo skladu, který byl mnohem potřebnější."
viVN = "Ông ấy vẫn tiếp tục quan sát họ xây dựng một nhà máy cưa mới thay vì kho hàng mà cần thiết hơn nhiều."
trTR = "Onların ihtiyaç duyulan depodan ziyade yeni bir değirmene inşa etmeye devam ettiğini izlemeye devam etti."

["BeaverFamilyTree.CauseOfDeath.Hunger.27"]
raw = "Hunger dulled every sense until he stopped noticing even the pain in his paws, worn raw."
status = "normal"
enUS = "Hunger dulled every sense until he stopped noticing even the pain in his paws, worn raw."
zhCN = "饥饿麻痹了每一种感官，直到他连自己脚爪上的疼痛也不再注意，磨得生了茧。"
zhTW = "飢餓麻痺了每一種感官，直到他甚至不再注意到爪子上的疼痛，因為已經磨損得很嚴重。"
ruRU = "Голод притупил все чувства, пока он перестал замечать даже боль в лапах, истертых до кровь."
jaJP = "「飢えはすべての感覚を鈍らせ、彼は足の痛みさえも気付かなくなるまでになった。」"
frFR = "La faim a engourdi chaque sens jusqu'à ce qu'il cesse même de ressentir la douleur dans ses pattes, usées jusqu'à l'os."
deDE = "Hunger dämpfte jeden Sinn, bis er nicht einmal den Schmerz in seinen klobigen, abgeriebenen Pfoten bemerkte."
plPL = "Głód stłumił każde zmysły, aż przestał nawet zauważać ból w swoich łapach, poobijanych do czerwoności."
ptBR = "A fome entorpeceu todos os sentidos até que ele parasse de notar até mesmo a dor em suas patas, desgastadas."
koKR = "배고픔은 모든 감각을 무디게 하여 발이 닳을 때까지 고통조차 느끼지 못하게 했다."
csCZ = "Hlad otupěl každé smysly, dokud si přestal všímat i bolesti ve svých tlapkách, obroušených až na dřeň."
viVN = "Đói đã làm mất đi mọi giác quan cho đến khi anh ta không còn để ý đến cả nỗi đau ở chân, đã bị mài mòn."
trTR = "Açlık, her duyuyu köreltti ta ki patilerine kadar olan acıyı bile hissetmeyi bıraktı."

["BeaverFamilyTree.CauseOfDeath.Hunger.28"]
raw = "The last thing he ate was a handful of sawdust off the sawmill floor — and even that didn't save him from the hunger."
status = "normal"
enUS = "The last thing he ate was a handful of sawdust off the sawmill floor — and even that didn't save him from the hunger."
zhCN = "“他吃的最后一顿是从锯木厂地板上捡起的一把锯末——就连这都没能让他逃脱饥饿的命运。”"
zhTW = "他最後吃的東西是一把鋸木廠地板上的鋸屑——即便如此也無法拯救他免於飢餓。"
ruRU = "Последнее, что он съел, был горсть опилок с пола лесопилки — и даже это не спасло его от голода."
jaJP = "彼が最後に食べたのは製材所の床からの一握りの木くずだった ― それすらも彼を飢えから救うことはできなかった。"
frFR = "La dernière chose qu'il a mangée était une poignée de sciure de bois du sol de la scierie — et même cela ne l'a pas sauvé de la faim."
deDE = "Das Letzte, was er aß, war eine Handvoll Sägemehl vom Boden der Sägewerk – und selbst das rettete ihn nicht vor dem Hunger."
plPL = "Ostatnią rzeczą, jaką zjadł, była garść trocin z podłogi tartaku — a nawet to go nie uratowało przed głodem."
ptBR = "A última coisa que ele comeu foi um punhado de serragem do chão da serraria — e mesmo isso não o salvou da fome."
koKR = "그가 마지막으로 먹은 것은 제재소 바닥에 있는 톱밥 한 줌이었다 — 그조차도 그의 배고픔을 구해주지 못했다."
csCZ = "Poslední věc, kterou snědl, byla hrst pilin ze skladu pily — a ani to ho nechránilo před hladem."
viVN = "Cái cuối cùng mà anh ta ăn là một nắm mùn cưa trên sàn nhà máy xẻ — và ngay cả điều đó cũng không cứu được anh khỏi cơn đói."
trTR = "Yediği son şey, değirmenin zemininden bir avuç talaş oldu — ve bu bile onu açlıktan kurtaramadı."

["BeaverFamilyTree.CauseOfDeath.Hunger.29"]
raw = "He saved his strength for tomorrow's shift at the dam, not counting on the fact that he wouldn't live to see it."
status = "normal"
enUS = "He saved his strength for tomorrow's shift at the dam, not counting on the fact that he wouldn't live to see it."
zhCN = "他把力气留到明天在大坝的班上，没想到自己活不着看到那一天。"
zhTW = "「他將力量留給明天在水壩的工作，沒有想到自己活不久了。」"
ruRU = "Он сэкономил свои силы для завтрашней смены на плотине, не рассчитывая на то, что не доживет до нее."
jaJP = "彼はダムでの明日のシフトのために力を温存していて、それを見ずに死ぬことになるとは思っていなかった。"
frFR = "Il a économisé sa force pour le tournage de demain au barrage, sans compter sur le fait qu'il ne vivrait pas pour le voir."
deDE = "Er sparte seine Kräfte für die Schicht am Damm morgen, ohne zu ahnen, dass er nicht leben würde, um sie zu sehen."
plPL = "Oszczędzał siły na jutrzejszą zmianę przy tamie, nie licząc na to, że nie doczeka się jej."
ptBR = "Ele guardou suas forças para o turno de amanhã na represa, sem contar que não viveria para vê-lo."
koKR = "그는 내일 댐에서의 근무를 위해 힘을 아꼈고, 그것을 보지 못할 것이라는 사실은 고려하지 않았다."
csCZ = "Šetřil si síly na zítřejší směnu na hrázi, aniž by počítal s tím, že se jí nedožije."
viVN = "Anh đã tiết kiệm sức lực cho ca làm việc ngày mai tại đập, không ngờ rằng mình sẽ không sống để thấy điều đó."
trTR = "Önümüzdeki gün barajdaki vardiyası için gücünü saklıyordu, bunu görebileceğini düşünmeden."

["BeaverFamilyTree.CauseOfDeath.Hunger.30"]
raw = "The badtide washed out half the crops that year, and he was one of the ones the leftovers didn't stretch to."
status = "normal"
enUS = "The bad tide washed out half the crops that year, and he was one of the ones the leftovers didn't stretch to."
zhCN = "“那年的坏潮冲走了一半的农作物，他是那些剩余的食物无法支撑的人之一。”"
zhTW = "那一年，惡潮沖走了一半的作物，而他就是那些剩餘的食物無法供應到的人之一。"
ruRU = "Непогода смыла половину урожая в том году, и он оказался одним из тех, кому не досталось остатка."
jaJP = "その年、悪潮が作物の半分を押し流し、彼は残った食料が足りなかった一人だった。"
frFR = "La marée noire a emporté la moitié des récoltes cette année-là, et il était l'un de ceux pour qui il ne restait pas assez."
deDE = "Die Flut hat in diesem Jahr die Hälfte der Ernte weggespült, und er gehörte zu denjenigen, für die die Reste nicht ausreichten."
plPL = "Zła fala zmyła połowę plonów tego roku, a on był jednym z tych, którym resztki nie wystarczyły."
ptBR = "A maré alta arrastou metade das colheitas naquele ano, e ele foi um dos que os restos não foram suficientes."
koKR = "그 해에 악조류가 작물의 절반을 쓸어갔고, 그는 남은 음식이 부족했던 이들 중 한 명이었다."
csCZ = "Přicházející příliv spláchl polovinu plodin v tom roce a on byl jedním z těch, na které zbytky nestačily."
viVN = "Nước lũ đã cuốn trôi một nửa vụ mùa năm đó, và anh ấy là một trong số những người mà phần còn lại không đủ."
trTR = "O yıl kötü gelgit yarısı mahsulleri sildi ve o, artanların yetmediği kişilerden biriydi."

["BeaverFamilyTree.CauseOfDeath.Hunger.31"]
raw = "He pretended he'd already eaten so no one would give up their own ration to him — and kept up the act to the end."
status = "normal"
enUS = "He pretended he'd already eaten so no one would give up their own ration to him — and kept up the act to the end."
zhCN = "“他假装自己已经吃过东西，这样就不会有人把自己的口粮给他——并且一直保持这种假装直到最后。”"
zhTW = "他假裝自己已經吃過了，這樣沒有人會把自己的配給給他——並且一直保持這個表現，直到最後。"
ruRU = "Он делал вид, что уже поел, чтобы никто не отдал ему свою порцию, — и держал этот обман до самого конца."
jaJP = "「彼は誰も自分の配給を彼に譲らないように、すでに食べたふりをした — そして最後までその演技を続けた。」"
frFR = "Il a fait semblant d'avoir déjà mangé pour que personne ne lui donne sa propre ration - et a maintenu son numéro jusqu'à la fin."
deDE = "Er tat so, als hätte er bereits gegessen, damit ihm niemand seine eigene Ration gab – und hielt die Maskerade bis zum Ende aufrecht."
plPL = "Udawał, że już zjadł, żeby nikt nie oddał mu swojej racji — i podtrzymywał tę sztukę do końca."
ptBR = "Ele fingiu que já tinha comido para que ninguém lhe entregasse sua própria ração — e manteve a farsa até o fim."
koKR = "그는 아무도 자신의 배급량을 그에게 주지 않도록 이미 먹었다고 가장하며 끝까지 그 연기를 유지했다."
csCZ = "Tvářil se, že už jedl, aby mu nikdo neobětoval svou porci — a tuto hru udržoval až do konce."
viVN = "Anh ta giả vờ như đã ăn no để không ai phải nhường phần của mình cho anh ta — và giữ nguyên vai diễn đó cho đến cuối cùng."
trTR = "Hiç yemek yememiş gibi yaptı, böylece kimse ona kendi rasyonunu vermedi — ve sonuna kadar bu oyunu sürdürdü."

["BeaverFamilyTree.CauseOfDeath.Hunger.32"]
raw = "The fresh load of logs arrived right on schedule — the barge with the food was a day later than he could hold out for."
status = "normal"
enUS = "The fresh load of logs arrived right on schedule — the barge with the food was a day later than he could withstand."
zhCN = "新一批原木按时到达——运载食物的驳船比他能撑的时间晚了一天。"
zhTW = "新到的一批木材準時抵達 — 運輸食物的驳船比他能堅持的時間晚了一天。"
ruRU = "Свежая партия бревен arrived точно по расписанию — баржа с едой опоздала на день дольше, чем он мог продержаться."
jaJP = "新しい丸太の荷がちょうど予定通りに到着した — 食料を載せたのは、耐えられるよりも1日遅れた沈没船だった。"
frFR = "“Le chargement frais de rondins est arrivé juste à temps — la barges avec la nourriture avait un jour de retard par rapport à ce qu'il pouvait attendre.”"
deDE = "Die frische Ladung Holz kam genau pünktlich an – das Barge mit dem Essen war einen Tag später als er es aushalten konnte."
plPL = "Nowa dostawa drewna dotarła dokładnie na czas — barką z jedzeniem spóźniła się o dzień, który mógłby wytrzymać."
ptBR = "A carga fresca de troncos chegou bem na hora — a barca com a comida chegou um dia depois do que ele podia aguentar."
koKR = "신선한 통나무가 예정대로 도착했습니다 — 음식이 실린 바지는 그가 견딜 수 있는 날보다 하루 늦게 도착했습니다."
csCZ = "Čerstvá nálož klád dorazila přesně podle plánu - bárka s jídlem byla o den později, než dokázal vydržet."
viVN = "Chuyến hàng gỗ mới đã đến đúng hẹn — tàu chở thực phẩm đến muộn một ngày so với khả năng chịu đựng của anh."
trTR = "Yeni kütük yükü tam zamanında geldi - yiyecek yüzeri, dayanabileceğinden bir gün gecikti."

["BeaverFamilyTree.CauseOfDeath.Hunger.33"]
raw = "He steered clear of the neighboring district's full granaries, too proud to ask for help."
status = "normal"
enUS = "He steered clear of the neighboring district's full granaries, too proud to ask for help."
zhCN = "他避开了邻近地区满是粮仓的地方，太骄傲而不愿寻求帮助。"
zhTW = "他避開了鄰近區域滿溢的穀倉，太驕傲而不願尋求幫助。"
ruRU = "Он избегал полных амбаров соседнего района, слишком гордый, чтобы попросить о помощи."
jaJP = "彼は隣接する地区の満杯の穀物庫を避け、助けを求めることを誇り高く思っていた。"
frFR = "Il évita les greniers pleins du quartier voisin, trop fier pour demander de l'aide."
deDE = "Er hielt sich von den vollen Scheunen des benachbarten Bezirks fern, zu stolz, um um Hilfe zu bitten."
plPL = "Unikał pełnych spichlerzy w sąsiednim okręgu, zbyt dumny, by prosić o pomoc."
ptBR = "Ele evitou os celeiros cheios do distrito vizinho, demasiado orgulhoso para pedir ajuda."
koKR = "그는 도움을 요청하기엔 너무 자존심이 강해 이웃 구역의 가득 찬 곡물 창고를 피했다."
csCZ = "Vyhýbal se plným sýpkám sousedního okresu, příliš hrdý na to, aby požádal o pomoc."
viVN = "Anh ấy đã tránh xa những kho thóc đầy ắp của khu vực lân cận, quá tự hào để nhờ sự giúp đỡ."
trTR = "Yardım istemek için fazla gururlu olduğundan, komşu bölgedeki tam ambarlardan uzak durdu."

["BeaverFamilyTree.CauseOfDeath.Hunger.34"]
raw = "His last strength went into hauling his own cart of logs to the storehouse, not into finding a meal."
status = "normal"
enUS = "His last strength went into hauling his own cart of logs to the storehouse, not into finding a meal."
zhCN = "“他最后的力量用在了拉运自己的木头车到仓库上，而不是寻找食物。”"
zhTW = "他最後的力量都用於將自己的木材推到倉庫，而不是尋找食物。"
ruRU = "Его последние силы ушли на то, чтобы тащить свою собственную тележку с дровами в склад, а не на поиски еды."
jaJP = "「彼の最後の力は、自分の木材のカートを倉庫に運ぶことに使われ、食事を見つけることには使われなかった。」"
frFR = "Sa dernière force a été consacrée à tirer sa propre charrette de rondins jusqu'à l'entrepôt, et non à chercher un repas."
deDE = "Seine letzte Kraft steckte er in das Ziehen seines eigenen Wagens voller Logs zum Lagerhaus, nicht in die Suche nach einer Mahlzeit."
plPL = "Jego ostatnie siły poszły na ciągnięcie własnego wózka z drewnem do magazynu, a nie na szukanie posiłku."
ptBR = "Sua última força foi para levar seu próprio carrinho de toras ao armazém, não para encontrar uma refeição."
koKR = "그의 마지막 힘은 식사를 찾는 것이 아니라 자신의 통나무 수레를 창고로 끌고 가는 데 써졌다."
csCZ = "Jeho poslední síla šla do tahání vlastního povozu s kládami do skladu, ne do hledání jídla."
viVN = "Sức lực cuối cùng của anh ta đã dùng để kéo xe gỗ của chính mình tới kho, chứ không phải để tìm kiếm bữa ăn."
trTR = "Son gücü, bir yemek bulmak yerine kendi odun arabasını depoya taşımaya gitti."

["BeaverFamilyTree.CauseOfDeath.Hunger.35"]
raw = "He was counting on the spring shoots to save him — but spring was late that cycle."
status = "normal"
enUS = "He was counting on the spring shoots to save him — but spring was late that cycle."
zhCN = "“他指望春天的嫩芽能救他——但那一季春天来得很晚。”"
zhTW = "「他指望著春天的嫩芽能救他——但這個循環的春天來得太晚。」"
ruRU = "«Он рассчитывал на весенние побеги, чтобы спастись — но весна в этот раз наступила поздно.»"
jaJP = "「彼は春の新芽が彼を救ってくれると期待していたが、そのサイクルでは春が遅れた。」"
frFR = "Il comptait sur les jeunes pousses du printemps pour le sauver — mais le printemps était en retard ce cycle."
deDE = "Er hatte auf die Frühlingstriebe gezählt, die ihn retten würden – aber der Frühling kam in diesem Zyklus spät."
plPL = "Liczono na wiosenne pędy, które go uratowały — ale wiosna w tym cyklu była spóźniona."
ptBR = "Ele contava com os brotos da primavera para salvá-lo — mas a primavera estava atrasada naquele ciclo."
koKR = "그는 그를 구해줄 봄의 새싹을 기대하고 있었지만 — 그 주기는 봄이 늦었다."
csCZ = "Spoléhal se na jarní výhony, které ho zachrání — ale jaro v tomto cyklu přišlo pozdě."
viVN = "Anh ấy đã hy vọng vào những mầm non mùa xuân để cứu mình - nhưng mùa xuân đến muộn trong chu kỳ này."
trTR = "Bahar filizlerinin onu kurtaracağını umuyordu - ama bu döngüde bahar geç geldi."

["BeaverFamilyTree.CauseOfDeath.Hunger.36"]
raw = "Hunger crept up on him unnoticed through the long shifts, right up until the day his legs simply refused to rise."
status = "normal"
enUS = "Hunger crept up on him unnoticed through the long shifts, right up until the day his legs simply refused to rise."
zhCN = "“饥饿在漫长的工作班中悄然袭来，直到有一天，他的双腿根本不愿意再站起来。”"
zhTW = "飢餓在漫長的輪班中悄悄地侵襲了他，直到有一天他的雙腿再也無法站起來。"
ruRU = "Голод незаметно подкрадывался к нему на протяжении долгих смен, вплоть до того дня, когда его ноги просто отказались подняться."
jaJP = "飢餓は長いシフトを通じて彼に気づかれずに忍び寄り、ついには彼の足がただ立ち上がることを拒むまで至った。"
frFR = "La faim s'est glissée sur lui sans qu'il s'en rende compte à travers les longues quarts de travail, jusqu'au jour où ses jambes ont simplement refusé de se lever."
deDE = "Hunger schlich sich unbemerkt durch die langen Schichten an ihn heran, bis zu dem Tag, an dem seine Beine einfach nicht mehr aufstehen wollten."
plPL = "Głód zbliżał się do niego niezauważenie podczas długich zmian, aż do dnia, w którym jego nogi po prostu odmówiły posłuszeństwa."
ptBR = "A fome se aproximou dele sem ser percebida durante os longos turnos, até o dia em que suas pernas simplesmente se recusaram a se levantar."
koKR = "배고픔은 긴 근무 시간 동안 그를 눈치채지 못하게 다가왔고, 결국 그의 다리가 더 이상 일어날 수 없는 날까지 계속되었다."
csCZ = "Hlad se k němu nepozorovaně přikradl během dlouhých směn, až do dne, kdy se mu nohy prostě odmítly zvednout."
viVN = "Cơn đói len lén tiến đến với anh ấy trong những ca làm việc dài, cho đến ngày đôi chân anh ấy đơn giản không chịu đứng dậy."
trTR = "Açlık, uzun vardiyalar boyunca fark edilmeksizin yanına yaklaştı, ta ki bacakları basitçe kalkmayı reddedene kadar."

["BeaverFamilyTree.CauseOfDeath.Hunger.37"]
raw = "He kept telling himself there'd be time to eat after the next shift — but the next shift never ended for him."
status = "normal"
enUS = "He kept telling himself there'd be time to eat after the next shift — but the next shift never ended for him."
zhCN = "“他不断告诉自己，下一班结束后就会有时间吃饭——但对他来说，下一班从未结束。”"
zhTW = "他不斷告訴自己下一個班次結束後就有時間吃飯——但對他來說，下一個班次從未結束。"
ruRU = "Он продолжал говорить себе, что у него будет время поесть после следующей смены — но следующая смена для него никогда не заканчивалась."
jaJP = "「彼は次のシフトの後に食べる時間があると自分に言い聞かせ続けたが、彼にとって次のシフトは決して終わらなかった。」"
frFR = "Il ne cessait de se dire qu'il aurait le temps de manger après le prochain quart — mais le prochain quart ne s'est jamais terminé pour lui."
deDE = "Er sagte sich immer wieder, dass es nach der nächsten Schicht Zeit zum Essen geben würde – aber die nächste Schicht endete für ihn nie."
plPL = "Nieustannie powtarzał sobie, że po następnej zmianie będzie czas na jedzenie — ale następna zmiana nigdy dla niego się nie skończyła."
ptBR = "Ele continuava dizendo a si mesmo que haveria tempo para comer depois do próximo turno — mas o próximo turno nunca terminou para ele."
koKR = "그는 다음 근무가 끝난 후에 먹을 시간이 있을 거라고 스스로에게 계속 말했지만, 다음 근무는 그에게는 결코 끝나지 않았다."
csCZ = "Stále si opakoval, že na jídlo bude čas po další směně — ale jeho další směna nikdy neskončila."
viVN = "Anh ta cứ tự nhủ rằng sẽ có thời gian để ăn sau ca trực tiếp theo — nhưng ca trực tiếp theo thì không bao giờ kết thúc với anh ta."
trTR = "Kendine sürekli bir sonraki görevden sonra yemek yiyecek zamanı olacağını söylüyordu — ama onun için bir sonraki görev asla bitmedi."

["BeaverFamilyTree.CauseOfDeath.Hunger.38"]
raw = "He gave up his place in the kitchen line three times running — the fourth time, the line never opened for him at all."
status = "normal"
enUS = "He gave up his place in the kitchen line three times in a row — the fourth time, the line never opened for him at all."
zhCN = "他连续三次放弃了在厨房排队的机会——第四次，他根本没有机会再排队。"
zhTW = "他連續三次放棄了在廚房排隊的位置——第四次，他根本沒有機會排隊。"
ruRU = "Он трижды сдал своё место в очереди на кухне — в четвертый раз очередь вообще не открылась для него."
jaJP = "彼はキッチンの列で3回連続して順番を譲った — 4回目は、彼のために列が全く開かなかった。"
frFR = "Il a abandonné sa place dans la file de la cuisine trois fois de suite — la quatrième fois, la file ne s'est jamais ouverte pour lui."
deDE = "„Er gab seinen Platz in der Küchenreihe dreimal in Folge auf – beim vierten Mal öffnete sich die Reihe für ihn überhaupt nicht.“"
plPL = "Trzykrotnie zrezygnował ze swojego miejsca w kolejce do kuchni — za czwartym razem kolejka w ogóle się dla niego nie otworzyła."
ptBR = "Ele desistiu de sua vez na fila da cozinha três vezes seguidas — na quarta vez, a fila nunca se abriu para ele."
koKR = "그는 주방 줄에서 세 번 연속 자리를 포기했다 — 네 번째는 그를 위해 줄이 아예 열리지 않았다."
csCZ = "Vzdálil se svého místa ve frontě na jídlo třikrát po sobě — při čtvrtém pokusu se fronta pro něj vůbec neotevřela."
viVN = "Anh đã từ bỏ chỗ đứng của mình trong hàng bếp ba lần liên tiếp - lần thứ tư, hàng không bao giờ mở ra cho anh."
trTR = "Mutfakta sırada üç kez yerini bıraktı - dördüncü kez, onun için sıra hiç açılmadı."

["BeaverFamilyTree.CauseOfDeath.Hunger.39"]
raw = "His empty stomach drowned out even the hammers at the sawmill — but he could never drown out the hunger itself."
status = "normal"
enUS = "His empty stomach drowned out even the hammers at the sawmill — but he could never drown out the hunger itself."
zhCN = "他空荡荡的肚子甚至淹没了锯木厂的锤声——但他永远无法淹没饥饿本身。"
zhTW = "他的空腹甚至淹沒了鋸木廠的鐵錘聲——但他永遠無法淹沒飢餓本身。"
ruRU = "Его пустой желудок заглушал даже стуки молотов на лесопилке — но он никогда не мог заглушить сам голод."
jaJP = "「彼の空っぽの腹は製材所のハンマーの音さえもかき消したが、空腹そのものをかき消すことは決してできなかった。」"
frFR = "Son estomac vide résonnait même plus que les marteaux du moulin à scie — mais il ne pouvait jamais étouffer la faim elle-même."
deDE = "Sein leerer Magen übertönte sogar die Hämmer in der Sägeanlage – aber die Hunger selbst konnte er nie übertönen."
plPL = "Jego pusty żołądek zagłuszał nawet młoty w tartaku — ale nigdy nie mógł zagłuszyć samego głodu."
ptBR = "Seu estômago vazio abafou até mesmo os martelos na serraria — mas ele nunca poderia abafar a fome em si."
koKR = "그의 빈 배는 제재소의 망치 소리마저 잠재우고 말았다 — 하지만 그는 결코 그 배고픔 자체를 잠재울 수 없었다."
csCZ = "Jeho prázdný žaludek přehlušil i kladiva v pilařství — ale nikdy nemohl přehlušit samotný hlad."
viVN = "Vì cái bụng rỗng của hắn mà tiếng búa ở xưởng cưa cũng bị lấn át — nhưng hắn không bao giờ có thể lấn át chính cái đói."
trTR = "Aç karnı, marangozhanedeki çekiçlerin sesini bile bastırdı — ama açlığı asla bastıramadı."

["BeaverFamilyTree.CauseOfDeath.OldAge.20"]
raw = "He made one last round of the dam, nodding to every familiar log as if saying goodbye."
status = "normal"
enUS = "He made one last round of the dam, nodding to every familiar log as if saying goodbye."
zhCN = "“他最后一次巡视堤坝，向每一根熟悉的木头点头，仿佛在说再见。”"
zhTW = "他最後圍繞大壩走了一圈，向每一根熟悉的木頭點頭，彷彿在道別。"
ruRU = "Он сделал последнюю обходку плотины, кивая каждому знакомому бревну, как будто прощаясь."
jaJP = "「彼は最後にダムを一周し、別れを告げるかのように、すべての馴染みのある丸太にうなずいた。」"
frFR = "Il a fait un dernier tour du barrage, hochant la tête à chaque rondin familier comme s'il faisait ses adieux."
deDE = "Er machte einen letzten Rundgang des Damms und nickte jedem vertrauten Baumstamm zu, als würde er Abschied nehmen."
plPL = "Zrobił ostatnią rundę po tamie, kiwając głową do każdego znajomego kłody, jakby się żegnał."
ptBR = "Ele fez uma última volta pela represa, acenando para cada tronco familiar como se estivesse se despedindo."
koKR = "그는 마지막으로 댐을 한 바퀴 돌며 작별 인사라도 하듯이 아는 나무들에 고개를 끄덕였다."
csCZ = "Udělal poslední obchůzku hráze a kývnul na každý známý kládu, jako by se loučil."
viVN = "Ông đã đi một vòng cuối cùng quanh đập, gật đầu chào từng khúc gỗ quen thuộc như thể đang nói lời tạm biệt."
trTR = "Barajın etrafında son bir tur attı, veda ediyormuş gibi tanıdık ağaç kütüklerine başıyla selam durdu."

["BeaverFamilyTree.CauseOfDeath.OldAge.21"]
raw = "His voice grew quieter, his legs slower, but his smile at the sight of his grandkits never changed, right to the end."
status = "normal"
enUS = "His voice grew quieter, his legs slower, but his smile at the sight of his grandkids never changed, right to the end."
zhCN = "“他的声音渐渐低沉，腿脚也变得缓慢，但他看到孙辈时的微笑始终未变，一直到最后。”"
zhTW = "他的聲音漸漸變得微弱，腿腳也變得 sluggish，但看到孫子們的微笑始終不變，直到最後一刻。"
ruRU = "Его голос становился тише, ноги медленнее, но его улыбка при виде внуков никогда не менялась, до самого конца."
jaJP = "「彼の声は次第に小さくなり、脚は遅くなったが、孫たちの姿を見るときの笑顔は最後まで変わらなかった。」"
frFR = "Sa voix devenait plus douce, ses jambes plus lentes, mais son sourire à la vue de ses petits-enfants n'a jamais changé, jusqu'à la fin."
deDE = "Seine Stimme wurde leiser, seine Beine langsamer, aber sein Lächeln bei dem Anblick seiner Enkelkinder änderte sich bis zum Ende niemals."
plPL = "Jego głos stawał się cichszy, nogi wolniejsze, ale uśmiech na widok wnuków nigdy się nie zmieniał, aż do samego końca."
ptBR = "A voz dele ficou mais baixa, suas pernas mais lentas, mas seu sorriso ao ver seus netinhos nunca mudou, até o fim."
koKR = "그의 목소리는 점점 작아지고, 다리는 느려졌지만, 손자손녀를 보는 그의 미소는 끝까지 변하지 않았다."
csCZ = "Jeho hlas zeslábl, nohy zpomalily, ale jeho úsměv při pohledu na jeho vnoučata se nikdy nezměnil, až do konce."
viVN = "Giọng nói của ông ấy trở nên nhỏ dần, đôi chân đi chậm lại, nhưng nụ cười của ông khi thấy các cháu của mình thì không bao giờ thay đổi, cho đến tận cuối cùng."
trTR = "Ses tonu azaldı, bacakları yavaşladı ama torunlarını görünceki gülümsemesi son ana kadar hiç değişmedi."

["BeaverFamilyTree.CauseOfDeath.OldAge.22"]
raw = "He left the youngsters his favorite bench by the water — and quietly took his place in the family's memory instead."
status = "normal"
enUS = "He left the youngsters his favorite bench by the water — and quietly took his place in the family's memory instead."
zhCN = "他把自己最喜欢的水边长椅留给了年轻一代 — 然后安静地在家族的记忆中留下了自己的位置。"
zhTW = "他把自己最喜歡的水邊長椅留給了年輕一代，然後靜靜地在家庭的記憶中佔據了一席之地。"
ruRU = "Он оставил молодняку свою любимую скамейку у воды — и тихо занял свое место в памяти семьи."
jaJP = "彼は若者たちに水辺の好きなベンチを残し、静かに家族の記憶の中に自分の場所を取った。"
frFR = "Il a laissé aux jeunes sa banque préférée près de l'eau — et a silencieusement pris sa place dans la mémoire de la famille à la place."
deDE = "Er hinterließ den Jungen seine Lieblingsbank am Wasser – und nahm leise seinen Platz in der Erinnerung der Familie ein."
plPL = "Zostawił młodzieży swoją ulubioną ławkę nad wodą — a sam cicho zajął swoje miejsce w pamięci rodziny."
ptBR = "Ele deixou aos jovens seu banco favorito à beira da água — e silenciosamente tomou seu lugar na memória da família."
koKR = "그는 젊은이들에게 물가의 자신이 가장 좋아하는 벤치를 남겨주고, 조용히 가족의 기억 속에 자신의 자리를 차지했다."
csCZ = "Zanechal mláďatům svou oblíbenou lavici u vody – a tiše zanechal své místo v paměti rodiny."
viVN = "Ông để lại cho những đứa trẻ chiếc ghế yêu thích của mình bên bờ nước - và lặng lẽ lấy vị trí của mình trong ký ức của gia đình."
trTR = "Gençlere su kenarındaki en sevdiği bankı bıraktı — ve sessizce ailenin anılarında yerini aldı."

["BeaverFamilyTree.CauseOfDeath.OldAge.23"]
raw = "Age never asked permission — it simply came for him one day, as peacefully as it had come for so many before him."
status = "normal"
enUS = "Age never asked permission — it simply came for him one day, as peacefully as it had come for so many before him."
zhCN = "“年龄从未征求许可——有一天，它就像以前许多其他人一样，平静地来到了他的身边。”"
zhTW = "年齡從不徵求許可—它只是某一天來到了他身邊，就像之前無數人一樣平靜地來臨。"
ruRU = "Возраст никогда не спрашивал разрешения — он просто пришёл за ним однажды, так же мирно, как и за многими прежде."
jaJP = "年齢は許可を求めることはなかった — それはある日、彼のもとに静かに訪れた、これまでに多くの者のもとに訪れたように。"
frFR = "L'âge n'a jamais demandé la permission — il est simplement venu pour lui un jour, aussi paisiblement qu'il était venu pour tant d'autres avant lui."
deDE = "Das Alter hat niemals um Erlaubnis gebeten - es kam einfach eines Tages zu ihm, so friedlich, wie es für so viele zuvor gekommen war."
plPL = "Wiek nigdy nie prosił o pozwolenie — po prostu przyszedł po niego pewnego dnia, tak pokojowo, jak przyszedł po tylu przed nim."
ptBR = "A idade nunca pediu permissão — simplesmente veio para ele um dia, tão pacificamente quanto havia chegado para tantos antes dele."
koKR = "나이는 결코 허락을 묻지 않는다 — 그것은 그를 위해 어느 날 평화롭게 찾아왔다. 그것은 그 이전의 많은 이들에게도 그러했듯이."
csCZ = "Věk nikdy nezkoumal povolení — jednoduše přišel jednoho dne, tak pokojně, jak přišel k mnoha před ním."
viVN = "Tuổi tác chưa bao giờ xin phép - nó đơn giản đã đến với ông một ngày, êm đềm như đã đến với nhiều người trước ông."
trTR = "Yaş asla izin sormadı - bir gün aniden geldi, daha önce birçoğu için geldiği kadar huzurlu bir şekilde."

["BeaverFamilyTree.CauseOfDeath.OldAge.24"]
raw = "He'd long since taken to living on memories of the great builds of his youth — and one day he simply didn't wake up among them."
status = "normal"
enUS = "He had long since taken to living on memories of the great builds of his youth — and one day he simply didn't wake up among them."
zhCN = "“他早已习惯于依靠年轻时伟大建筑的回忆生活——有一天，他就是这样在其中没有醒来。”"
zhTW = "「他早已開始依靠年輕時那些偉大建築的回憶生活——有一天，他就這樣在其中不再醒來。」"
ruRU = "Он давно уже жил воспоминаниями о великих постройках своей молодости — и однажды он просто не проснулся среди них."
jaJP = "「彼は若い頃の大きな建築物の思い出で生活することに長いこと慣れていた — そしてある日、彼はただ彼らの中で目覚めることがなかった。」"
frFR = "Il avait depuis longtemps pris l'habitude de vivre de ses souvenirs des grandes constructions de sa jeunesse — et un jour, il ne s'est tout simplement pas réveillé parmi eux."
deDE = "Er hatte sich längst darauf verlegt, von den Erinnerungen an die großartigen Bauten seiner Jugend zu leben — und eines Tages wachte er einfach nicht mehr unter ihnen auf."
plPL = "Od dawna żył wspomnieniami o wielkich budowach swojej młodości — a pewnego dnia po prostu nie obudził się wśród nich."
ptBR = "Há muito tempo ele havia se acostumado a viver das memórias das grandes construções de sua juventude — e um dia ele simplesmente não acordou entre elas."
koKR = "그는 젊은 시절의 멋진 건축물들에 대한 기억을 간직하며 살아왔고, 어느 날 그 기억들 속에서 단순히 잠에서 깨어나지 않았다."
csCZ = "Už dlouho žil vzpomínkami na velké stavby své mladosti — a jednoho dne se zkrátka neprobudil mezi nimi."
viVN = "Ông đã sống bằng những kỷ niệm về những công trình vĩ đại của tuổi trẻ mình từ lâu — và một ngày kia, ông đơn giản là không thức dậy giữa chúng."
trTR = "Gençliğindeki büyük yapıları hatırlayarak yaşamaya çoktan başlamıştı — bir gün onları arasında uyanmamıştı."

["BeaverFamilyTree.CauseOfDeath.OldAge.25"]
raw = "The last thing he saw was the morning mist over the river — the very same mist as the day he'd first arrived."
status = "normal"
enUS = "The last thing he saw was the morning mist over the river — the very same mist as the day he'd first arrived."
zhCN = "“他最后看到的是河上晨雾——和他第一次到达时的那片雾气完全相同。”"
zhTW = "「他最後看到的，是河面上的早晨霧氣——正是他第一次抵達那天的霧氣。」"
ruRU = "Последнее, что он увидел, это утренний туман над рекой — тот самый туман, что был в день его первого прибытия."
jaJP = "彼が最後に見たのは、川の上に立ち込める朝霧だった—彼が初めて到着した日の霧と全く同じ霧だ。"
frFR = "La dernière chose qu'il a vue fut la brume matinale au-dessus de la rivière — la même brume que le jour de son arrivée."
deDE = "Das letzte, was er sah, war der Morgennebel über dem Fluss – derselbe Nebel wie an dem Tag, an dem er zum ersten Mal angekommen war."
plPL = "Ostatnią rzeczą, którą zobaczył, była poranna mgła nad rzeką — ta sama mgła, która towarzyszyła mu w dniu, w którym przybył po raz pierwszy."
ptBR = "A última coisa que ele viu foi a névoa da manhã sobre o rio — a mesma névoa do dia em que ele havia chegado pela primeira vez."
koKR = "그가 마지막으로 본 것은 강 위로 피어오르는 아침 안개였다 — 그가 처음 도착했을 때의 동일한 안개였다."
csCZ = "Poslední věc, kterou viděl, byla ranní mlha nad řekou — ta samá mlha, jako v den, kdy poprvé dorazil."
viVN = "“Điều cuối cùng ông thấy là sương mù buổi sáng trên dòng sông — chính là lớp sương mù mà ông nhìn thấy vào ngày đầu tiên ông đến.”"
trTR = "Gördüğü son şey, nehir üzerindeki sabah sisiydi — tam da ilk geldiği günkü sise benzer bir sis."

["BeaverFamilyTree.CauseOfDeath.OldAge.26"]
raw = "He refused to move to a new lodge, saying he'd die where he'd lived his whole life. And so he did."
status = "normal"
enUS = "He refused to move to a new lodge, saying he'd die where he'd lived his whole life. And so he did."
zhCN = "“他拒绝搬到新居，说他要在自己一生中居住的地方去世。于是他就这样做了。”"
zhTW = "「他拒絕搬到新的住所，說他會在自己一生中生活的地方死去。結果，他就是這麼做的。」"
ruRU = "Он отказался переехать в новый логов, сказав, что умрёт там, где прожил всю свою жизнь. И так и произошло."
jaJP = "彼は新しいロッジに移ることを拒否し、彼が生涯を過ごした場所で死ぬと言いました。そして、彼はその通りにしました。"
frFR = "Il a refusé de déménager dans un nouveau pavillon, disant qu'il mourrait là où il avait vécu toute sa vie. Et c'est ce qu'il a fait."
deDE = "Er weigerte sich, in eine neue Unterkunft zu ziehen, und sagte, er würde dort sterben, wo er sein ganzes Leben lang gelebt hatte. Und genau das tat er."
plPL = "Odmówił przeprowadzki do nowej chaty, mówiąc, że umrze tam, gdzie spędził całe swoje życie. I tak też zrobił."
ptBR = "Ele se recusou a se mudar para uma nova cabana, dizendo que morreria onde viveu toda a sua vida. E assim ele fez."
koKR = "그는 평생 살던 곳에서 죽겠다고 하며 새로운 오두막으로 옮기기를 거부했다. 그리고 그렇게 그는 죽었다."
csCZ = "Odmítl se přestěhovat do nového doupěte a řekl, že zemře tam, kde prožil celý svůj život. A tak se také stalo."
viVN = "Ông từ chối chuyển đến một căn lều mới, nói rằng ông sẽ chết nơi ông đã sống cả đời. Và đúng là ông đã như vậy."
trTR = "Yeni bir kulübeye taşınmayı reddetti, yaşamının tamamını geçirdiği yerde öleceğini söyledi. Ve öyle de oldu."

["BeaverFamilyTree.CauseOfDeath.OldAge.27"]
raw = "His body gave out before his spirit did — he kept trying to help at the dam right to the last day, long after he could no longer lift a log."
status = "normal"
enUS = "His body gave out before his spirit did — he kept trying to help at the dam right to the last day, long after he could no longer lift a log."
zhCN = "“他的身体在灵魂之前就衰竭了——直到最后一天，他仍在努力帮助大坝，尽管他早已无法举起一根木头。”"
zhTW = "他的身體在靈魂之前崩潰——他一直試著幫忙修建水壩，直到最後一天，早已無法再抬起一根樹幹。"
ruRU = "Его тело сломалось, прежде чем ушел дух — он продолжал пытаться помочь на плотине до последнего дня, долго после того, как не мог больше поднять брус."
jaJP = "「彼の身体は彼の精神が尽きる前に衰えてしまった — 彼はもはや丸太を持ち上げることができなくなっても、最後の日までダムで助けようとし続けた。」"
frFR = "Son corps a lâché avant son esprit — il a continué à essayer d'aider au barrage jusqu'au dernier jour, longtemps après qu'il ne pouvait plus soulever une bûche."
deDE = "Sein Körper gab auf, bevor sein Geist es tat – er versuchte bis zum letzten Tag, am Damm zu helfen, lange nachdem er keinen Baumstamm mehr heben konnte."
plPL = "Jego ciało zawiodło, zanim jego duch to zrobił — wciąż próbował pomagać przy tamie aż do ostatniego dnia, długo po tym, jak nie mógł już podnieść kłody."
ptBR = "Seu corpo falhou antes que seu espírito o fizesse — ele continuou tentando ajudar na represa até o último dia, muito tempo depois de não conseguir mais levantar uma tora."
koKR = "그의 몸은 영혼보다 먼저 지쳐버렸다 — 그는 log를 더 이상 들 수 없던 마지막 날까지 댐에서 도움을 주려 애썼다."
csCZ = "Jeho tělo se vzdalo dříve, než se vzdal jeho duch - stále se snažil pomáhat na hrázi až do posledního dne, dlouho poté, co už nemohl zvednout kládu."
viVN = "Cơ thể anh đã kiệt sức trước tâm hồn anh — anh vẫn cố gắng giúp đỡ tại đập nước cho đến ngày cuối cùng, lâu sau khi anh không còn nâng được một khúc gỗ."
trTR = "Bedeni ruhundan önce pes etti - artık bir odun kaldıracak gücü kalmadığı halde, son güne kadar barajda yardımcı olmaya çalıştı."

["BeaverFamilyTree.CauseOfDeath.OldAge.28"]
raw = "He slipped away quietly in his sleep to the creak of old trees — the very sound that had lulled him his whole life."
status = "normal"
enUS = "He slipped away quietly in his sleep to the creak of old trees — the very sound that had lulled him his whole life."
zhCN = "他在梦中安静地离去，伴随着老树的吱吱声——那声音是他一生中最安宁的摇篮曲。"
zhTW = "“他在夢中安靜地離開，伴隨著古老樹木的吱吱聲——這是他一生中一直讓他沉醉的聲音。”"
ruRU = "Он тихо ушел в своем сне под скрип старых деревьев — именно этот звук усыплял его на протяжении всей жизни."
jaJP = "「彼は静かに眠りにつき、古い木々のきしむ音に包まれて息を引き取りました — それは彼の生涯を通じて彼を心地よくさせていた音です。」"
frFR = "Il s'est éteint paisiblement dans son sommeil au doux craquement des vieux arbres — le même son qui l'avait bercé toute sa vie."
deDE = "Er entschlief still in seinem Bett, während das Knarren der alten Bäume zu hören war — genau das Geräusch, das ihn sein ganzes Leben lang in den Schlaf wiegte."
plPL = "Odszedł cicho w swoim śnie, przy skrzypieniu starych drzew — dźwięku, który kołysał go przez całe życie."
ptBR = "Ele partiu silenciosamente em seu sono ao som dos estalos de árvores velhas — o mesmo som que o havia acalmado durante toda a sua vida."
koKR = "그는 생애 내내 그를 달래주었던 오래된 나무의 삐걱거림 속에서 조용히 잠든 채로 떠났다."
csCZ = "„Tiše odešel ve spánku ke skřehotání starých stromů — k tomu zvuku, který ho ukolébával po celý jeho život.“"
viVN = "Ông đã ra đi nhẹ nhàng trong giấc ngủ trước tiếng kêu của những cây cổ thụ - chính âm thanh đã ru ông suốt cả cuộc đời."
trTR = "Eski ağaçların gıcırtısı eşliğinde huzur içinde uykusunda kayboldu - bu ses, hayatı boyunca onu sakinleştiren sesti."

["BeaverFamilyTree.CauseOfDeath.OldAge.29"]
raw = "His children were long grown, and his grandkits too, and still he watched the river with the same wonder as on his very first day."
status = "normal"
enUS = "His children were long grown, and his grandkits too, and still he watched the river with the same wonder as on his very first day."
zhCN = "“他的孩子早已长大，孙子们也如此，他依旧以和第一天一样的惊奇眼光看着河流。”"
zhTW = "他的孩子早已長大，他的孫輩們也都長大了，但他仍然以和第一天一樣的驚奇看著河流。"
ruRU = "Его дети давно выросли, и его внуки тоже, а он по-прежнему наблюдал за рекой с таким же удивлением, как и в свой самый первый день."
jaJP = "彼の子供たちはすでに成長し、孫たちもいたが、彼は初日と同じ驚きを持って川を見続けた。"
frFR = "Ses enfants étaient longtemps grands, ainsi que ses petits-enfants, et pourtant il observait la rivière avec la même émerveillement que lors de son tout premier jour."
deDE = "Seine Kinder waren längst erwachsen, und auch seine Enkelkinder, und dennoch beobachtete er den Fluss mit dem gleichen Staunen wie an seinem allerersten Tag."
plPL = "Jego dzieci były już dawno dorosłe, a wnuki również, a on nadal obserwował rzekę z tym samym zdumieniem, co w swoim pierwszym dniu."
ptBR = "Seus filhos já eram adultos há muito tempo, e seus netos também, e ainda assim ele observava o rio com a mesma admiração do seu primeiro dia."
koKR = "그의 자녀들은 이미 자라났고, 손자손녀들 또한 마찬가지였지만, 그는 여전히 첫날과 같은 경이로움으로 강을 바라보았다."
csCZ = "Jeho děti byly dávno odrostlé, a jeho vnukové také, a přesto stále sledoval řeku se stejným úžasem jako v den, kdy přišel poprvé."
viVN = "Những đứa con của ông đã lớn, và cả những đứa cháu của ông nữa, nhưng ông vẫn ngồi nhìn dòng sông với cùng một sự ngạc nhiên như vào ngày đầu tiên."
trTR = "Çocukları çoktan büyümüş ve torunları da öyle, yine de nehirin kenarında ilk günündeki gibi bir hayranlıkla seyretti."

["BeaverFamilyTree.CauseOfDeath.OldAge.30"]
raw = "That last winter turned out mild, as if nature itself had decided to let him go gently."
status = "normal"
enUS = "That last winter turned out mild, as if nature itself had decided to let him go gently."
zhCN = "“去年冬天出乎意料地温和，仿佛大自然本身决定让他安静地离去。”"
zhTW = "那個最後的冬天變得非常溫和，就好像大自然本身決定讓他安然離去。"
ruRU = "Та последняя зима оказалась мягкой, как будто сама природа решила отпустить его тихо."
jaJP = "「最後の冬は穏やかで、まるで自然が彼を優しく解放することに決めたかのようだった。」"
frFR = "Cet hiver dernier s'est avéré clément, comme si la nature elle-même avait décidé de le laisser partir doucement."
deDE = "Der letzte Winter erwies sich als mild, als hätte die Natur selbst beschlossen, ihn sanft gehen zu lassen."
plPL = "Ta ostatnia zima okazała się łagodna, jakby sama natura postanowiła pozwolić mu odejść w spokoju."
ptBR = "Aquela última primavera acabou sendo amena, como se a própria natureza tivesse decidido deixá-lo partir suavemente."
koKR = "지난 겨울은 따뜻하게 지나갔고, 마치 자연이 그를 부드럽게 보내주기로 결정한 듯했다."
csCZ = "Minulá zima se ukázala jako mírná, jako by se sama příroda rozhodla nechat ho odejít tiše."
viVN = "Mùa đông cuối cùng đó hóa ra thật ôn hòa, như thể chính thiên nhiên đã quyết định để ông ra đi một cách nhẹ nhàng."
trTR = "Son kış ılıman çıktı, sanki doğa kendisi onu nazikçe bırakmaya karar vermiş gibi."

["BeaverFamilyTree.CauseOfDeath.OldAge.31"]
raw = "He'd just finished passing on the secret of his sturdiest dam when he went to his rest with a light heart."
status = "normal"
enUS = "He'd just finished passing on the secret of his sturdiest dam when he went to his rest with a light heart."
zhCN = "“他刚刚传授完自己最坚固的水坝的秘密，便心满意足地安息了。”"
zhTW = "「他剛剛傳授完他最堅固的水壩的秘密，便懷著輕鬆的心情安然入睡。」"
ruRU = "Он только что закончил передавать секрет своей самой надежной плотины, когда ушел на покой с легким сердцем."
jaJP = "「彼は最も頑丈なダムの秘密を伝え終えたばかりで、心軽やかに安らかに眠りにつきました。」"
frFR = "Il venait juste de transmettre le secret de son barrage le plus robuste quand il s'est reposé avec un cœur léger."
deDE = "Er hatte gerade das Geheimnis seines stabilsten Damms weitergegeben, als er mit leichtem Herzen zu seinem Ruhestatt ging."
plPL = "Właśnie skończył przekazywać sekret swojej najsolidniejszej tamy, kiedy odszedł na wieczny spoczynek z lekkim sercem."
ptBR = "Ele acabara de passar o segredo de sua barragem mais resistente quando foi descansar com o coração leve."
koKR = "그는 가장 견고한 댐의 비밀을 전해주고 난 뒤, 가벼운 마음으로 생을 마감했다."
csCZ = "Právě dokončil předávání tajemství svého nejpevnějšího hráze, když odešel na odpočinek s lehkým srdcem."
viVN = "Ông vừa mới truyền lại bí mật của con đập vững chắc nhất của mình thì đã ra đi với một trái tim nhẹ nhàng."
trTR = "En dayanıklı barajının sırrını aktarmayı yeni bitirmişti ki, hafif bir kalple huzur içinde uykuya daldı."

["BeaverFamilyTree.CauseOfDeath.OldAge.32"]
raw = "His frail paws could no longer hold a log, but they held his grandkits' paws tight right to the end."
status = "normal"
enUS = "His frail paws could no longer hold a log, but they held his grandkits' paws tight right to the end."
zhCN = "“他虚弱的爪子再也无法握住一根树木，但在最后一刻，他紧紧握住了孙子们的爪子。”"
zhTW = "他的脆弱爪子再也無法握住木頭，但他一直緊緊握住孫輩的爪子，直到最後。"
ruRU = "Его хрупкие лапы больше не могли удерживать бревно, но крепко держали лапки внуков до самого конца."
jaJP = "彼のか弱い前足はもう丸太を持つことができなかったが、最後まで彼の孫たちの手をしっかりと握っていた。"
frFR = "Ses pattes fragiles ne pouvaient plus tenir un tronc, mais elles tenaient fermement les pattes de ses petits-enfants jusqu'à la fin."
deDE = "Seine schwachen Pfoten konnten keinen Baumstamm mehr halten, aber sie hielten die Pfoten seiner Enkelkinder bis zum Ende fest."
plPL = "Jego słabe łapki nie mogły już trzymać kłody, ale mocno trzymały łapki jego wnuków aż do końca."
ptBR = "Suas patas frágeis não conseguiam mais segurar uma tora, mas seguravam as patas de seus netinhos firmemente até o fim."
koKR = "그의 약한 발은 더 이상 통나무를 잡을 수 없었지만, 끝까지 손자손녀의 발을 꼭 잡고 있었다."
csCZ = "Jeho křehké tlapky už nedokázaly udržet kládu, ale pevně svíraly tlapky jeho vnoučat až do konce."
viVN = "Những bàn chân yếu ớt của ông không còn đủ sức để nắm một khúc gỗ, nhưng chúng đã nắm chặt bàn chân của các cháu cho đến giây phút cuối cùng."
trTR = "Zayıf patileri artık bir kütüğü tutamıyordu, ama son ana kadar torunlarının patilerini sıkıca tuttu."

["BeaverFamilyTree.CauseOfDeath.OldAge.33"]
raw = "He faded away quietly between two strikes of the sawmill bell, never hearing the second one."
status = "normal"
enUS = "He faded away quietly between two strikes of the sawmill bell, never hearing the second one."
zhCN = "“他在锯木厂钟声的两次敲击之间悄然离去，未曾听见第二声。”"
zhTW = "他在鋸木廠鐘聲的兩次敲擊之間安靜地離去，從未聽到第二次敲擊。"
ruRU = "Он тихо ушёл между двумя ударами колокола лесопилки, так и не услышав второго."
jaJP = "彼は製材所の鐘が2回鳴る間に静かに消えていき、2回目の鐘の音を聞くことはなかった。"
frFR = "Il s'est éteint paisiblement entre deux coups de cloche du moulin à scie, n'entendant jamais le second."
deDE = "Er entschlief friedlich zwischen zwei Schlägen der Sägewerksglocke und hörte niemals den zweiten."
plPL = "Zgasł cicho między dwoma uderzeniami dzwonu tartaku, nigdy nie słysząc drugiego."
ptBR = "Ele se apagou tranquilamente entre duas badaladas do sino do moinho, nunca ouvindo a segunda."
koKR = "그는 제재소 종소리의 두 번 소리 사이에 조용히 사라졌고, 두 번째 소리는 듣지 못했다."
csCZ = "Tiše odešel mezi dvěma údery zvonu pily, nikdy neslyšíc ten druhý."
viVN = "Ông ấy tắt lịm một cách yên lặng giữa hai tiếng chuông của nhà máy cưa, không bao giờ nghe thấy tiếng chuông thứ hai."
trTR = "Testere fabrikasının çanının iki çınlaması arasında sessizce kayboldu, ikinci sesi asla duymadan."

["BeaverFamilyTree.CauseOfDeath.OldAge.34"]
raw = "The wrinkles on his face were a map of the years he'd lived — and one day that map simply closed."
status = "normal"
enUS = "The wrinkles on his face were a map of the years he'd lived — and one day that map simply closed."
zhCN = "“他脸上的皱纹是他所经历过岁月的地图——有一天，那张地图就这么关闭了。”"
zhTW = "他臉上的皺紋是他生活過的歲月的地圖——有一天，那幅地圖就這樣合上了。"
ruRU = "Морщины на его лице были картой прожитых лет — и однажды эта карта просто закрылась."
jaJP = "「彼の顔のしわは、彼が生きてきた年々の地図であり、ある日、その地図はただ閉じてしまった。」"
frFR = "Les rides sur son visage étaient une carte des années qu'il avait vécues — et un jour, cette carte s'est tout simplement refermée."
deDE = "Die Falten in seinem Gesicht waren eine Landkarte der Jahre, die er gelebt hatte – und eines Tages schloss sich diese Landkarte einfach."
plPL = "Zmarszczki na jego twarzy były mapą lat, które przeżył — a pewnego dnia ta mapa po prostu się zamknęła."
ptBR = "As rugas em seu rosto eram um mapa dos anos que ele vivera — e um dia aquele mapa simplesmente se fechou."
koKR = "그의 얼굴에 있는 주름은 그가 살아온 세월의 지도였다 — 그리고 어느 날 그 지도가 단순히 닫혔다."
csCZ = "Vrásky na jeho tváři byly mapou let, která prožil — a jednoho dne se ta mapa jednoduše zavřela."
viVN = "Nếp nhăn trên khuôn mặt của ông là một bản đồ của những năm tháng ông đã sống - và một ngày nào đó, bản đồ đó chỉ đơn giản là khép lại."
trTR = "Yüzündeki kırışıklıklar, yaşadığı yılların bir haritasıydı - ve bir gün o harita sadece kapandı."

["BeaverFamilyTree.CauseOfDeath.OldAge.35"]
raw = "He dozed off by the fire every evening — and one of those evenings turned out to be his last, though no one noticed the difference right away."
status = "normal"
enUS = "He dozed off by the fire every evening — and one of those evenings turned out to be his last, though no one noticed the difference right away."
zhCN = "他每晚都在火边打盹——而那些晚上中的一个成为了他的最后一晚，尽管没有人立刻察觉到有什么不同。"
zhTW = "他每晚都在火邊打盹——而那晚恰好是他的最後一晚，雖然沒有人立刻察覺到什麼不同。"
ruRU = "Каждую вечер он задремывал у огня — и одна из тех вечеров оказалась последней, хотя никто сразу этого не заметил."
jaJP = "彼は毎晩火のそばでうたた寝をしていて、ある晩が彼の最後の晩になりましたが、誰もすぐには違いに気づきませんでした。"
frFR = "Il s'endormait près du feu chaque soir — et l'un de ces soirs s'est avéré être son dernier, bien que personne n'ait remarqué la différence tout de suite."
deDE = "Er döste jeden Abend am Feuer ein — und einer dieser Abende stellte sich als sein letzter heraus, obwohl es niemand sofort bemerkte."
plPL = "Co wieczór zasypiał przy ognisku — i jeden z tych wieczorów okazał się jego ostatnim, chociaż nikt od razu nie zauważył różnicy."
ptBR = "Ele cochilava perto do fogo toda noite — e uma daquelas noites acabou sendo a sua última, embora ninguém percebesse a diferença imediatamente."
koKR = "그는 매일 저녁 불 옆에서 졸았고 — 그 저녁 중 하나가 그의 마지막 저녁이 되었지만, 아무도 즉시 그 차이를 알아차리지 못했다."
csCZ = "Každý večer usnul u ohně – a jedno z těchto večerů se ukázalo jako jeho poslední, ačkoli si toho nikdo hned nevšiml."
viVN = "Ông đã ngủ gật bên bếp lửa mỗi tối - và một trong những buổi tối đó hóa ra là buổi tối cuối cùng của ông, mặc dù không ai nhận ra sự khác biệt ngay lập tức."
trTR = "Her akşam ateşin yanında uykuya daldı — ve o akşamlardan biri, son akşamı olduğu anlaşıldı, ama kimse hemen bir fark fark etmedi."

["BeaverFamilyTree.CauseOfDeath.OldAge.36"]
raw = "He brought in the last harvest of his life himself, flatly refusing any help from the young ones."
status = "normal"
enUS = "He brought in the last harvest of his life himself, flatly refusing any help from the young ones."
zhCN = "他亲自进行了生命中最后一次收获，坚决拒绝了年轻人的任何帮助。"
zhTW = "他親自收穫了他一生中的最後一個豐收，堅決拒絕了年輕人的任何幫助。"
ruRU = "Он сам собрал последний урожай своей жизни, решительно отказавшись от помощи молодежи."
jaJP = "「彼は自らの最後の収穫を持ち帰り、若者たちの助けを完全に拒否した。」"
frFR = "Il a lui-même rapporté la dernière récolte de sa vie, refusant catégoriquement toute aide des jeunes."
deDE = "„Er brachte die letzte Ernte seines Lebens selbst ein und weigerte sich hartnäckig, Hilfe von den Jüngeren anzunehmen.“"
plPL = "Sam przywiózł ostatnie zbiory swojego życia, stanowczo odmawiając wszelkiej pomocy od młodszych."
ptBR = "Ele trouxe a última colheita de sua vida por conta própria, recusando-se veementemente a qualquer ajuda dos mais jovens."
koKR = "그는 젊은이들의 도움을 단호히 거부하며 자신의 삶의 마지막 수확을 스스로 가져왔다."
csCZ = "Sám přinesl poslední úrodu svého života, kategoricky odmítal jakoukoli pomoc od mladších."
viVN = "Ông tự tay thu hoạch mùa vụ cuối cùng của cuộc đời mình, cương quyết từ chối bất kỳ sự giúp đỡ nào từ những người trẻ."
trTR = "Hayatının son hasadını kendisi topladı, gençlerden gelen herhangi bir yardımı tamamen reddetti."

["BeaverFamilyTree.CauseOfDeath.OldAge.37"]
raw = "He left as quietly as he'd once arrived in this district — without any fuss, leaving a sturdy dam behind him."
status = "normal"
enUS = "He left as quietly as he'd once arrived in this district — without any fuss, leaving a sturdy dam behind him."
zhCN = "“他像当初来到这个地区时一样悄无声息地离开了——没有任何喧闹，身后留下了一座坚固的水坝。”"
zhTW = "「他離開時悄無聲息，就像他當初來到這個區域一樣——毫無聲張，留下了一座堅固的壩。」"
ruRU = "Он ушел так же quietly, как когда-то пришел в этот район — без лишней суеты, оставив после себя крепкую плотину."
jaJP = "彼はこの地域に到着した時と同じように静かに去っていった — 騒ぎもなく、頑丈なダムを残して。"
frFR = "Il est parti aussi discrètement qu'il était arrivé dans ce quartier — sans bruit, laissant derrière lui un barrage solide."
deDE = "Er ging so leise, wie er einst in diesen Bezirk gekommen war – ohne Aufhebens, mit einem soliden Damm, den er hinterließ."
plPL = "Odeszedł tak cicho, jak kiedyś przybył do tej okolicy — bez zbędnych ceremonii, pozostawiając po sobie solidną tamę."
ptBR = "Ele partiu tão silenciosamente quanto havia chegado a este distrito — sem alarde, deixando uma barragem robusta para trás."
koKR = "그는 이 지역에 처음 도착했을 때처럼 조용히 떠났다 — 아무 소란 없이, 튼튼한 댐을 남기고."
csCZ = "Odešel tak tiše, jak se do této oblasti kdysi dostal — bez jakéhokoliv rozruchu, za sebou zanechal pevnou hráz."
viVN = "Ông ra đi êm đềm như khi ông đến khu vực này — không có bất kỳ rối ren nào, để lại một đập chắn vững chắc phía sau."
trTR = "Bu bölgeye geldiği gibi sessizce ayrıldı - hiç bir gürültü olmadan, arkasında sağlam bir baraj bırakarak."

["BeaverFamilyTree.CauseOfDeath.OldAge.38"]
raw = "Age took his strength, but never his memory — to the end, he remembered the name of everyone he'd ever taught."
status = "normal"
enUS = "Age took his strength, but never his memory — to the end, he remembered the name of everyone he'd ever taught."
zhCN = "“岁月夺走了他的力量，却从未夺去他的记忆——直到最后，他仍然记得他教过的每一个人的名字。”"
zhTW = "歲月奪去了他的力量，但從未奪走他的記憶——直到最後，他仍然記得自己教過的每一個名字。"
ruRU = "Возраст забрал его силу, но никогда не забирал память — до конца он помнил имена всех, кого когда-либо учил."
jaJP = "年齢が彼の力を奪ったが、記憶までは奪わなかった — 最後の瞬間まで、彼は教えた全ての人の名前を覚えていた。"
frFR = "L'âge a emporté sa force, mais jamais sa mémoire — jusqu'à la fin, il se souvenait du nom de tous ceux qu'il avait jamais enseignés."
deDE = "Das Alter nahm ihm die Kraft, aber nie seine Erinnerung - bis zum Ende erinnerte er sich an den Namen aller, die er je unterrichtet hatte."
plPL = "Wiek odebrał mu siły, ale nigdy nie odebrał pamięci — do końca pamiętał imiona wszystkich, których kiedykolwiek uczył."
ptBR = "A idade levou sua força, mas nunca sua memória — até o fim, ele se lembrava do nome de todos que já ensinou."
koKR = "나이는 그의 힘을 앗아갔지만 결코 그의 기억을 앗아가지 않았다. 그는 마지막 순간까지 자신이 가르친 모든 사람의 이름을 기억했다."
csCZ = "Věk mu vzal sílu, ale nikdy ne jeho paměť — až do konce si pamatoval jméno každého, koho kdy učil."
viVN = "Tuổi tác đã lấy đi sức mạnh của ông, nhưng không bao giờ lấy đi kí ức của ông — đến cuối đời, ông vẫn nhớ tên của tất cả những người mà ông đã dạy."
trTR = "Yaş, gücünü almıştı ama hafızasını asla almadı - sona kadar, öğrettiği herkesin adını hatırladı."

["BeaverFamilyTree.CauseOfDeath.OldAge.39"]
raw = "He lay down to rest after a long day, just as he had his whole life — only this time the rest turned out to be forever."
status = "normal"
enUS = "He lay down to rest after a long day, just as he had his whole life — only this time the rest turned out to be forever."
zhCN = "“在漫长的一天之后，他像往常一样躺下休息——只不过这次的休息变成了永恒。”"
zhTW = "在漫長的一天之後，他躺下來休息，就像他整個生命中所做的那樣——只是這一次的休息卻變成了永恆。"
ruRU = "Он лег отдохнуть после долгого дня, как делал это всю свою жизнь — только в этот раз отдых оказался навсегда."
jaJP = "「彼は長い一日の後に休むために横になった。彼の人生の中でずっとそうしていたように — ただ、今回はその休息が永遠になった。」"
frFR = "Il s'est allongé pour se reposer après une longue journée, comme il l'avait fait toute sa vie — seulement cette fois, le repos s'est avéré être pour toujours."
deDE = "Er legte sich nach einem langen Tag zur Ruhe, genau wie er es sein ganzes Leben lang getan hatte – nur war diese Ruhe diesmal für immer."
plPL = "Położył się, aby odpocząć po długim dniu, tak jak robił to przez całe swoje życie — tylko tym razem odpoczynek okazał się na zawsze."
ptBR = "Ele se deitou para descansar após um longo dia, exatamente como fez a vida toda — apenas que desta vez o descanso se revelou ser para sempre."
koKR = "그는 평생 동안 그랬던 것처럼 긴 하루를 마친 후 누워 쉬었다. 하지만 이번에는 그 휴식이 영원한 것으로 판명되었다."
csCZ = "Ležel si na odpočinek po dlouhém dni, tak jako to dělal celý svůj život — tentokrát se však odpočinek ukázal jako navždy."
viVN = "Anh nằm xuống nghỉ ngơi sau một ngày dài, cũng như anh đã làm suốt cuộc đời mình - chỉ có điều lần này giấc nghỉ lại trở thành mãi mãi."
trTR = "Uzun bir günün ardından dinlenmek için uzandı, tıpkı bütün hayatı boyunca yaptığı gibi — sadece bu sefer dinlenmek sonsuza dek sürdü."

["BeaverFamilyTree.CauseOfDeath.Thirst.F.20"]
raw = "She chased a cloud that promised rain, but it drifted on past the hills without ever spilling a drop."
status = "normal"
enUS = "She chased a cloud that promised rain, but it drifted on past the hills without ever spilling a drop."
zhCN = "她追逐着一朵承诺会带来雨的云，但它在山丘上飘过，竟未落下半滴雨。"
zhTW = "「她追逐著一朵承諾會帶來雨的雲，而那朵雲卻漂過山丘，始終沒有洩漏出一滴雨。」"
ruRU = "Она гнала облако, которое обещало дождь, но оно проплыло мимо холмов, так и не проронив ни капли."
jaJP = "「彼女は雨を約束する雲を追いかけたが、雲は丘を越えて一滴もこぼさずに流れていった。」"
frFR = "Elle poursuivait un nuage qui promettait de la pluie, mais il dériva au-delà des collines sans jamais laisser tomber une goutte."
deDE = "Sie verfolgte eine Wolke, die Regen versprach, aber sie schwebte an den Hügeln vorbei, ohne je einen Tropfen fallen zu lassen."
plPL = "Ścigała chmurę, która obiecywała deszcz, ale ta przepłynęła nad wzgórzami, nie spadając ani kropli."
ptBR = "Ela perseguiu uma nuvem que prometia chuva, mas ela passou pelas colinas sem derramar uma gota."
koKR = "비가 내릴 것이라고 약속한 구름을 쫓았지만, 구름은 언덕 너머로 아무 물방울도 떨어뜨리지 않고 지나갔다."
csCZ = "Pronásledovala mrak, který sliboval déšť, ale ten se bez jediné kapky zatoulal dál za kopce."
viVN = "Cô ấy đuổi theo một đám mây hứa hẹn mưa, nhưng nó trôi qua những ngọn đồi mà không bao giờ rơi một giọt nào."
trTR = "Yağmur vaat eden bir bulutu kovalamaya çalıştı, ama bulut tepelerin üzerinden geçip gitti ve hiçbir damla dökmedi."

["BeaverFamilyTree.CauseOfDeath.Thirst.F.21"]
raw = "At night she dreamed of a river running full — and by morning there was only cracked clay under her paws again."
status = "normal"
enUS = "At night she dreamed of a river running full — and by morning there was only cracked clay under her paws again."
zhCN = "夜里，她梦见一条水流湍急的河 — 但早晨，只有又干又裂的泥土在她的爪子下。"
zhTW = "「在夜晚，她夢見一條奔流的河流——而到了早晨，她的爪子下又只有龜裂的泥土。」"
ruRU = "Ночью она мечтала о полноводной реке — а к утру под ее лапами снова была только треснувшая глина."
jaJP = "夜、彼女は満ちた川の夢を見た—そして朝になると、再び彼女の足の下にはひび割れた泥しかなかった。"
frFR = "La nuit, elle rêvait d'une rivière pleine — et au matin, il n'y avait de nouveau que de l'argile fissurée sous ses pattes."
deDE = "Nachts träumte sie von einem reißenden Fluss – und am Morgen gab es nur wieder rissiger Ton unter ihren Pfoten."
plPL = "W nocy śniła o rzece pełnej wody — a rano znów była tylko pęknięta glina pod jej łapami."
ptBR = "À noite, ela sonhou com um rio cheio — e pela manhã havia apenas barro rachado sob suas patas novamente."
koKR = "밤에는 물이 가득한 강을 꿈꾸었지만, 아침이 되자 다시 그녀의 발 아래에는 갈라진 진흙뿐이었다."
csCZ = "V noci snila o řece, která tekla naplno — a ráno pod jejími tlapkami opět zůstala jen prasklá hlína."
viVN = "Vào ban đêm, cô mơ thấy một con sông tràn đầy - và đến sáng, chỉ còn lại đất sét nứt nẻ dưới chân cô."
trTR = "Gece, dolup taşan bir nehir hakkında rüyalar gördü - sabah olduğunda yine ayaklarının altında sadece çatlamış toprak vardı."

["BeaverFamilyTree.CauseOfDeath.Thirst.F.22"]
raw = "She lapped dew off fern leaves all night long, but by dawn it still wasn't enough."
status = "normal"
enUS = "She lapped dew off fern leaves all night long, but by dawn it still wasn't enough."
zhCN = "“她整晚都在蕨叶上舔露水，但到黎明时分仍然不够。”"
zhTW = "她整夜舔食蕨類植物葉上的露水，但到黎明時仍然不夠。"
ruRU = "Она вылизывала росу с папоротников всю ночь, но к рассвету этого все равно было недостаточно."
jaJP = "「彼女は夜通しシダの葉から露を舐めていたが、夜明けになってもまだ足りなかった。」"
frFR = "Elle a léché la rosée des feuilles de fougère toute la nuit, mais au lever du jour, ce n'était toujours pas suffisant."
deDE = "Sie leckte die Tau von den Farnblättern die ganze Nacht, aber bis zum Morgen war es immer noch nicht genug."
plPL = "Pijała rosę z liści paproci przez całą noc, ale o świcie wciąż było to za mało."
ptBR = "Ela lambeu o orvalho das folhas de samambaia a noite toda, mas ao amanhecer ainda não era o suficiente."
koKR = "그녀는 밤새 양치식물 잎에서 이슬을 핥았지만 새벽이 되어도 여전히 부족했다."
csCZ = "Pila rosu z listů kapradin celou noc, ale k ránu to stále nebylo dost."
viVN = "Cô đã liếm sương trên lá dương xỉ suốt đêm, nhưng đến sáng vẫn không đủ."
trTR = "Gece boyunca eğreltiotlarının yapraklarından çiy içti ama sabah olunca yine de yeterli olmamıştı."

["BeaverFamilyTree.CauseOfDeath.Thirst.F.23"]
raw = "The pipe that used to feed the reservoir had long since dried up, and there was no one left to fix it."
status = "normal"
enUS = "The pipe that used to feed the reservoir had long since dried up, and there was no one left to fix it."
zhCN = "“用来给水库供水的管道早已干涸，再也没有人来修理它。”"
zhTW = "曾經供應水庫的水管早已乾涸，剩下的人也無法修理它。"
ruRU = "Труба, которая раньше подавала воду в резервуар, давно пересохла, и некому было её починить."
jaJP = "貯水池に水を供給していたパイプはとっくに干上がってしまい、修理できる者はもう誰もいなかった。"
frFR = "Le tuyau qui alimentait le réservoir était depuis longtemps asséché, et il ne restait plus personne pour le réparer."
deDE = "Die Leitung, die das Reservoir speiste, war längst ausgetrocknet, und es war niemand mehr da, um sie zu reparieren."
plPL = "Rura, która niegdyś zasilała zbiornik, dawno już wyschła, a nikt nie pozostał, aby ją naprawić."
ptBR = "O tubo que costumava abastecer o reservatório secou há muito tempo, e não havia mais ninguém para consertá-lo."
koKR = "저수지를 공급하던 파이프는 오래전에 말라버렸고, 수리할 사람도 남아 있지 않았다."
csCZ = "Trubka, která kdysi zásobovala nádrž, dávno uschla a nikdo ji již neopravoval."
viVN = "Cái ống từng cấp nước cho hồ chứa đã lâu không còn, và không còn ai để sửa nó."
trTR = "Rezervuara su veren boru çoktan kurumuştu ve bunu tamir edecek kimse kalmamıştı."

["BeaverFamilyTree.CauseOfDeath.Thirst.F.24"]
raw = "She wandered to the district border hoping for a neighboring canal, but the neighbors' sluice was shut to outsiders."
status = "normal"
enUS = "She wandered to the district border hoping for a neighboring canal, but the neighbors' sluice was shut to outsiders."
zhCN = "“她漫步到地区边界，希望能找到一个邻近的运河，但邻居的闸门对外人关闭。”"
zhTW = "「她漫遊到區域邊界，希望能找到鄰近的水道，但鄰居的閘門對外人關閉。」"
ruRU = "Она бродила к границе района, надеясь найти соседний канал, но шлюз соседей был закрыт для чужаков."
jaJP = "彼女は隣接する運河を期待して地区の境界までさまよい出たが、隣人の水門は外部者に対して閉ざされていた。"
frFR = "Elle s'est aventurée jusqu'à la frontière du district en espérant trouver un canal voisin, mais le clapet des voisins était fermé aux étrangers."
deDE = "Sie wanderte zur Bezirkgrenze in der Hoffnung auf einen benachbarten Kanal, aber der Schleusen der Nachbarn war für Außenstehende geschlossen."
plPL = "Wędrowała w stronę granicy dzielnicy, mając nadzieję na sąsiedni kanał, ale śluza sąsiadów była zamknięta dla obcych."
ptBR = "Ela vagou até a fronteira do distrito na esperança de um canal vizinho, mas a comporta dos vizinhos estava fechada para forasteiros."
koKR = "그녀는 이웃 운하를 바라며 지구 경계로 떠돌았지만, 이웃의 수문은 외부인에게 닫혀 있었다."
csCZ = "Toulala se k hranici okresu v naději na sousední kanál, ale sousedův sluš byl pro cizince zavřený."
viVN = "Cô ấy đã lang thang đến biên giới khu vực với hy vọng tìm thấy một kênh bên cạnh, nhưng cống của những người hàng xóm đã đóng kín với người lạ."
trTR = "Komşu bir kanala umarak bölge sınırına doğru dolaştı, ancak komşuların kapakları dışarıdan gelenlere kapalıydı."

["BeaverFamilyTree.CauseOfDeath.Thirst.F.25"]
raw = "The shimmer over the dry riverbed looked so much like a lake that she crawled toward it with her last strength — and never made it."
status = "normal"
enUS = "The shimmer over the dry riverbed looked so much like a lake that she crawled toward it with her last strength — and never made it."
zhCN = "干涸河床上的闪光看起来如此像湖泊，以至于她用尽最后的力气向它爬去——却再也无法到达。"
zhTW = "在乾枯的河床上閃爍的光芒看起來如此像是一個湖泊，她用最後的力量向它爬去——卻再也無法達到。"
ruRU = "Блеск над пересохшим руслом реки так напоминал озеро, что она ползла к нему из последних сил — и так и не достигла."
jaJP = "干上がった川床の上の輝きは湖のように見えたため、彼女は最後の力を振り絞ってそれに向かって這い寄ったが、結局たどり着くことはなかった。"
frFR = "La lueur sur le lit de rivière asséché ressemblait tellement à un lac qu'elle s'est traînée vers lui avec ses dernières forces — et n'y est jamais parvenue."
deDE = "Der Schimmer über dem trockenen Flussbett sah so sehr wie ein See aus, dass sie mit ihrer letzten Kraft darauf zu krabbeln versuchte — und es nie schaffte."
plPL = "Poświata nad suchym korytem rzeki wyglądała tak bardzo jak jezioro, że czołgała się w jego stronę ostatkiem sił — i nigdy nie dotarła."
ptBR = "O brilho sobre o leito seco do rio parecia tanto um lago que ela rastejou em direção a ele com sua última força — e nunca chegou lá."
koKR = "마른 강바닥 위의 반짝임은 마치 호수처럼 보여 그녀는 마지막 힘을 다해 그것을 향해 기어갔지만, 결코 도달하지 못했다."
csCZ = "Lesk nad suchým korytem řeky vypadal tolik jako jezero, že se k němu plazila se svými posledními silami — a nikdy se tam nedostala."
viVN = "Cái lấp lánh trên lòng sông khô cằn trông giống như một cái hồ đến nỗi cô ấy đã bò về phía nó bằng sức lực cuối cùng — và không bao giờ đến được."
trTR = "Kuru nehir yatağındaki parıltı o kadar göle benziyordu ki, son gücüyle ona doğru süründü — ama oraya hiç ulaşamadı."

["BeaverFamilyTree.CauseOfDeath.Thirst.F.26"]
raw = "She heard water dripping somewhere inside the lodge wall and crawled toward the sound until the sound stopped."
status = "normal"
enUS = "She heard water dripping somewhere inside the lodge wall and crawled toward the sound until it stopped."
zhCN = "“她听到壁炉墙内某处传来水滴的声音，向声音爬去，直到声音停止。”"
zhTW = "她聽見小屋牆壁裡傳來水滴的聲音，爬向聲音的來源，直到聲音消失。"
ruRU = "Она слышала, как вода капает где-то внутри стены хижины, и ползла к звуку, пока он не замолкал."
jaJP = "「彼女はロッジの壁の内側で水が滴る音を聞き、それに向かって音が止まるまで這っていった。」"
frFR = "Elle entendait l'eau goutter quelque part à l'intérieur du mur du pavillon et a rampé vers le son jusqu'à ce que le bruit s'arrête."
deDE = "Sie hörte irgendwo in der Lodgewand Wasser tropfen und kroch auf das Geräusch zu, bis es aufhörte."
plPL = "Słyszała, jak gdzieś w ścianie szałasu kapie woda i czołgała się w stronę dźwięku, aż dźwięk ustał."
ptBR = "Ela ouviu a água pingando em algum lugar dentro da parede da cabana e se arrastou em direção ao som até que o som parou."
koKR = "그녀는 오두막 벽 안쪽 어딘가에서 물이 떨어지는 소리를 들었고, 소리가 멈출 때까지 그 소리 쪽으로 기어갔다."
csCZ = "Slyšela, jak kdesi uvnitř zdi lodge kapá voda, a plazila se směrem k tomu zvuku, dokud zvuk nezmizel."
viVN = "Cô ấy nghe thấy tiếng nước nhỏ giọt từ đâu đó bên trong tường nhà gỗ và bò về phía âm thanh cho đến khi âm thanh ngừng lại."
trTR = "Yalnızca kulübenin duvarının içinde bir yerlerden su damladığını duydu ve sesin kaynağına doğru süründü, ta ki ses kesilene kadar."

["BeaverFamilyTree.CauseOfDeath.Thirst.F.27"]
raw = "The dam held a full reservoir — just not for her: the line at the watering hole was too long."
status = "normal"
enUS = "The dam held a full reservoir — just not for her: the line at the watering hole was too long."
zhCN = "水坝蓄满了水库——只是对她来说没有：饮水池的排队太长了。"
zhTW = "水壩儲存了滿滿的水庫——只是對她來說並不如此：飲水處的隊伍太長。"
ruRU = "Плотина держала полный резервуар — просто не для нее: очередь к поилке была слишком длинной."
jaJP = "「ダムは満杯の貯水池を持っていた — しかし彼女のためではなかった：水飲み場の列はあまりにも長すぎた。」"
frFR = "Le barrage retenait un réservoir plein — juste pas pour elle : la file d'attente au point d'eau était trop longue."
deDE = "Der Damm hatte einen vollen Wasserspeicher — nur nicht für sie: Die Schlange am Wasserloch war zu lang."
plPL = "Tama miała pełny zbiornik — tylko nie dla niej: kolejka przy studni była zbyt długa."
ptBR = "A barragem tinha um reservatório cheio — apenas não para ela: a fila no bebedouro estava muito longa."
koKR = "댐은 가득 찬 저수지를 유지하고 있었지만, 그녀를 위한 것은 아니었다: 물웅덩이의 줄은 너무 길었다."
csCZ = " hráz měla plnou nádrž - jen ne pro ni: fronta u napajedla byla příliš dlouhá."
viVN = "Đập chứa đầy nước — chỉ là không dành cho cô ấy: hàng người ở chỗ nước quá dài."
trTR = "Baraj tam doluydu - sadece onun için değil: sulama noktasındaki kuyruk çok uzundu."

["BeaverFamilyTree.CauseOfDeath.Thirst.F.28"]
raw = "She tried to dig a well with her bare paws, but the ground had turned harder than stone after the long drought."
status = "normal"
enUS = "She tried to dig a well with her bare paws, but the ground had turned harder than stone after the long drought."
zhCN = "她试图用赤裸的爪子挖一个井，但经过漫长的干旱后，土地变得比石头还要坚硬。"
zhTW = "「她試著用光禿禿的爪子挖井，但在漫長的乾旱之後，地面變得比石頭還要堅硬。」"
ruRU = "Она пыталась выкопать колодец голыми лапами, но земля после долгой засухи затвердела, как камень."
jaJP = "「彼女は素手で井戸を掘ろうとしましたが、長い干ばつの後、地面は石よりも硬くなっていました。」"
frFR = "Elle a essayé de creuser un puits avec ses pattes nues, mais le sol était devenu plus dur que la pierre après la longue sécheresse."
deDE = "Sie versuchte, mit ihren bloßen Pfoten einen Brunnen zu graben, aber der Boden war nach der langen Dürre härter als Stein geworden."
plPL = "Próbowała wykopać studnię swoimi nagimi łapami, ale ziemia stała się twardsza niż kamień po długiej suszy."
ptBR = "Ela tentou cavar um poço com as patas nuas, mas o solo havia se tornado mais duro que pedra após a longa seca."
koKR = "그녀는 맨손으로 우물을 파려고 했지만, 긴 가뭄이 지난 후 땅은 돌보다 더 단단해졌다."
csCZ = "Pokoušela se vykopat studnu svými holými tlapkami, ale země se po dlouhém suchu stala tvrdší než kámen."
viVN = "Cô cố gắng đào một cái giếng bằng đôi paw trần của mình, nhưng mặt đất đã cứng hơn đá sau thời gian hạn hán dài."
trTR = "Uzun kuraklık sonrası yer taş gibi sertleştiği için çıplak pençeleriyle bir kuyu kazmaya çalıştı."

["BeaverFamilyTree.CauseOfDeath.Thirst.F.29"]
raw = "Fog settled over the district for exactly one night — and that one night wasn't enough for her to lick up more than a few drops."
status = "normal"
enUS = "Fog settled over the district for exactly one night — and that one night wasn't enough for her to lick up more than a few drops."
zhCN = "“浓雾笼罩了这个区域整整一个夜晚——而那个夜晚对她来说还不够，她只能舔到几滴水。”"
zhTW = "霧氣籠罩了整個區域整整一夜——而那一夜對她來說並不足以讓她舔到超過幾滴的水。"
ruRU = "Туман окутал округу ровно на одну ночь — и этой одной ночи ей не хватило, чтобы собрать больше нескольких капель."
jaJP = "霧が地区にちょうど一晩だけ立ち込めた — その一晩では彼女が数滴以上を舐めるには十分ではなかった。"
frFR = "Le brouillard s'est installé sur le quartier pendant exactement une nuit — et cette seule nuit n'a pas suffi pour qu'elle puisse lécher plus que quelques gouttes."
deDE = "Der Nebel legte sich genau für eine Nacht über den Stadtteil – und diese eine Nacht war nicht genug für sie, um mehr als ein paar Tropfen aufzulecken."
plPL = "Mgła osiadła nad dzielnicą na dokładnie jedną noc — a ta jedna noc nie wystarczyła jej, aby zebrać więcej niż kilka kropli."
ptBR = "A neblina cobriu o distrito por exatamente uma noite — e aquela única noite não foi suficiente para ela lamber mais do que algumas gotas."
koKR = "안개가 지역 위에 정확히 하룻밤 동안 내려앉았다 — 그리고 그 하룻밤은 그녀가 몇 방울 이상의 물을 핥아낼 수 있는 충분한 시간이 아니었다."
csCZ = "Mlha se usadila nad obvodem přesně na jednu noc — a ta jedna noc nestačila na to, aby sebrala víc než pár kapek."
viVN = "Sương mù bao phủ khu vực trong đúng một đêm — và đêm đó không đủ để cô ta có thể liếm nhiều hơn vài giọt."
trTR = "Bölgenin üzerine tam bir gece boyunca sis çökmüştü — ve o bir gece, onun birkaç damladan fazlasını yalaması için yeterli değildi."

["BeaverFamilyTree.CauseOfDeath.Thirst.F.30"]
raw = "The rain finally came — three days too late."
status = "normal"
enUS = "The rain finally came — three days too late."
zhCN = "“雨终于来了——却晚了三天。”"
zhTW = "雨終於來了——晚了三天。"
ruRU = "Дождь наконец пришел — на три дня слишком поздно."
jaJP = "雨がついに降った — 3日遅れだった。"
frFR = "La pluie est enfin arrivée — trois jours trop tard."
deDE = "Der Regen kam endlich — drei Tage zu spät."
plPL = "W końcu przyszły deszcze — trzy dni za późno."
ptBR = "A chuva finalmente chegou — três dias atrasada."
koKR = "비가 드디어 왔다 — 3일 늦게."
csCZ = "Déšť konečně přišel — o tři dny později."
viVN = "Cơn mưa cuối cùng cũng đến — trễ ba ngày."
trTR = "Yağmur sonunda geldi — üç gün geç kaldı."

["BeaverFamilyTree.CauseOfDeath.Thirst.F.31"]
raw = "She watched a fish thrashing in a drying puddle and understood she'd soon be in its place."
status = "normal"
enUS = "She watched a fish thrashing in a drying puddle and understood she'd soon be in its place."
zhCN = "“她看着一条鱼在干涸的水坑中挣扎，明白自己很快也会变成它的样子。”"
zhTW = "她看著一條魚在乾澀的水窪中掙扎，明白自己很快也會處於它的位置。"
ruRU = "Она наблюдала за рыбой, бьющейся в высыхающем лужице, и поняла, что вскоре окажется на её месте."
jaJP = "彼女は干からびた水たまりで魚がもがくのを見て、自分もすぐにその魚のようになることを理解した。"
frFR = "Elle regardait un poisson se débattre dans une flaque d'eau qui s'assèche et comprit qu'elle serait bientôt à sa place."
deDE = "Sie sah einem Fisch zu, der in einer austrocknenden Pfütze zappelte, und verstand, dass sie bald an seiner Stelle sein würde."
plPL = "Obserwowała rybę walczącą w wysychającej kałuży i zrozumiała, że wkrótce sama zajmie jej miejsce."
ptBR = "Ela observou um peixe se debatendo em uma poça de água que secava e entendeu que em breve estaria em seu lugar."
koKR = "그녀는 말라가는 웅덩이에서 허우적거리는 물고기를 바라보며 곧 자신도 그 자리에 있을 것임을 이해했다."
csCZ = "Sledovala rybu, která se zmítala v vysychající kaluži, a pochopila, že brzy bude na jejím místě."
viVN = "Cô ấy nhìn một con cá vùng vẫy trong một vũng nước khô cạn và hiểu rằng cô sắp ở trong vị trí của nó."
trTR = "Bir balığın kuruyan bir su birikentinde çırpınışlarını izledi ve yakında onun yerinde olacağını anladı."

["BeaverFamilyTree.CauseOfDeath.Thirst.F.32"]
raw = "The reserve water tank sat locked in the storehouse, and the key belonged to a beaver who hadn't shown up for work that day."
status = "normal"
enUS = "The reserve water tank sat locked in the storehouse, and the key belonged to a beaver who hadn't shown up for work that day."
zhCN = "“储水箱锁在仓库里，钥匙属于那天没有来上班的一个海狸。”"
zhTW = "儲水槽鎖在倉庫裡，鎖匙屬於一隻當天沒有來工作的河狸。"
ruRU = "Резервный водяной бак хранился в закромах, а ключ принадлежал бобру, который не пришел на работу в тот день."
jaJP = "貯水タンクは倉庫に鍵がかけられて置かれ、その鍵はその日仕事に来なかったビーバーのものであった。"
frFR = "Le réservoir d'eau était enfermé dans l'entrepôt, et la clé appartenait à un castor qui ne s'était pas présenté au travail ce jour-là."
deDE = "Der Wasserspeicher stand abgeschlossen im Lagerhaus, und der Schlüssel gehörte einem Biber, der an diesem Tag nicht zur Arbeit erschienen war."
plPL = "Zapasowy zbiornik na wodę stał zamknięty w magazynie, a klucz należał do bobra, który nie pojawił się w pracy tego dnia."
ptBR = "O tanque de água reserva estava trancado no armazém, e a chave pertencia a um castor que não apareceu para trabalhar naquele dia."
koKR = "저수조는 창고에 잠겨 있었고, 그 열쇠는 그날 출근하지 않은 비버에게 속해 있었다."
csCZ = "Rezervní vodní nádrž byla uzamčena ve skladišti a klíč patřil bobrovi, který se ten den nedostavil do práce."
viVN = "Thùng chứa nước dự trữ nằm khóa trong kho, và chìa khóa thuộc về một con lâu lâu chưa xuất hiện để làm việc hôm đó."
trTR = "Rezerv su tankı depoda kilitliydi ve anahtar, o gün işe gelmeyen bir bobrağa aitti."

["BeaverFamilyTree.CauseOfDeath.Thirst.F.33"]
raw = "She rationed every sip, saving some for tomorrow — and tomorrow never came for her."
status = "normal"
enUS = "She rationed every sip, saving some for tomorrow — and tomorrow never came for her."
zhCN = "“她控制着每一口水，留了一些到明天——而明天对她来说再也不会来了。”"
zhTW = "她控制每一口水，留下一些到明天——而明天對她來說從未到來。"
ruRU = "Она экономила каждую каплю, оставляя немного на завтра — а завтрашний день для нее так и не наступил."
jaJP = "「彼女は一口一口を配分し、明日のために少し残しておいた — しかし、彼女のために明日は決して来なかった。」"
frFR = "Elle rationnait chaque gorgée, en gardant un peu pour demain — et demain n'est jamais arrivé pour elle."
deDE = "Sie rationierte jeden Schluck, sparte etwas für morgen – und morgen kam für sie nie."
plPL = "Ona racjonowała każdy łyk, oszczędzając trochę na jutro — a jutra dla niej nigdy nie nadeszło."
ptBR = "Ela racionou cada gole, guardando um pouco para amanhã — e o amanhã nunca chegou para ela."
koKR = "그녀는 매 순간의 물을 절약하며 내일을 위해 약간 남겨두었지만 — 그녀에게 내일은 결코 오지 않았다."
csCZ = "Každý doušek pečlivě odměřovala, něco si šetřila na zítřejek — a zítřek pro ni nikdy nepřišel."
viVN = "Cô ấy đã phân phối từng ngụm một cách tiết kiệm, dành một ít cho ngày mai — và ngày mai đã không đến với cô ấy."
trTR = "Her zaman için birazını saklayarak her yudumu paylaştı - ama onun için yarın hiç gelmedi."

["BeaverFamilyTree.CauseOfDeath.Thirst.F.34"]
raw = "The heat was so fierce that even the shade by the dam gave no relief — the water in her body ran out faster than the day did."
status = "normal"
enUS = "The heat was so fierce that even the shade by the dam gave no relief — the water in her body ran out faster than the day did."
zhCN = "炎热如此猛烈，以至于大坝旁的阴凉也无法提供任何缓解——她体内的水分流失得比白天还快。"
zhTW = "「炎熱如此猛烈，以至於連大壩旁的陰影也無法帶來緩解——她體內的水分比白天消逝得更快。」"
ruRU = "Жара была такой жестокой, что даже тень у плотины не спасала — вода в её теле иссякла быстрее, чем длился день."
jaJP = "「暑さが非常に厳しく、ダムの影さえも安らぎを与えなかった — 彼女の体の水分は、日が沈むより速く失われていった。」"
frFR = "La chaleur était si intense que même l'ombre près du barrage ne fournissait aucun répit — l'eau dans son corps s'épuisait plus vite que le jour ne s'écoulait."
deDE = "Die Hitze war so heftig, dass selbst der Schatten am Damm keine Erleichterung verschaffte — das Wasser in ihrem Körper ging schneller aus als der Tag verging."
plPL = "Upał był tak okropny, że nawet cień przy tamie nie przynosił ulgi — woda w jej ciele kończyła się szybciej niż mijał dzień."
ptBR = "O calor era tão intenso que até a sombra perto da barragem não trouxe alívio — a água em seu corpo se esgotou mais rápido do que o dia."
koKR = "더위가 너무 강렬해서 댐 옆 그늘조차도 위안이 되지 않았다 — 그녀의 몸속 물은 하루가 지나기보다 더 빨리 고갈되었다."
csCZ = "HORKO BYLO TAK INTENZIVNÍ, ŽE I STÍN U DLOUHEM NEPOSKYTOVAL ÚLEVU — VODA V JEJÍM TĚLE MIZELA RYCHLEJI NEŽ DEN."
viVN = "Nóng nực đến nỗi ngay cả bóng râm bên đập cũng không mang lại sự thanh thản — nước trong cơ thể cô ấy cạn nhanh hơn cả ngày trôi qua."
trTR = "Sıcaklık o kadar şiddetliydi ki, barajın gölgesi bile ferahlama sağlamıyordu — vücudundaki su, günün geçişinden daha hızlı bir şekilde tükendi."

["BeaverFamilyTree.CauseOfDeath.Thirst.F.35"]
raw = "She believed the rains started on the same day every cycle — but this year they were late."
status = "normal"
enUS = "She believed the rains started on the same day every cycle — but this year they were late."
zhCN = "“她相信每个周期的同一天都会下雨——但今年雨却晚来了。”"
zhTW = "「她相信每個循環的同一天雨水開始降下——但今年它們來得遲了。」"
ruRU = "Она считала, что дожди начинаются в один и тот же день каждого цикла — но в этом году они опоздали."
jaJP = "「彼女は雨が毎サイクルの同じ日に始まると信じていたが、今年は遅れた。」"
frFR = "Elle croyait que les pluies commençaient le même jour à chaque cycle — mais cette année, elles étaient en retard."
deDE = "Sie glaubte, dass der Regen am selben Tag jedes Zyklus begann – aber in diesem Jahr kam er spät."
plPL = "Uważała, że deszcze zaczynają się w ten sam dzień każdego cyklu — ale w tym roku się spóźniły."
ptBR = "Ela acreditava que as chuvas começavam no mesmo dia a cada ciclo — mas este ano estavam atrasadas."
koKR = "그녀는 비가 매 사이클의 같은 날 시작된다고 믿었다 - 하지만 올해는 늦었다."
csCZ = "Věřila, že deště začínají každý cyklus ve stejný den — ale letos přišly pozdě."
viVN = "Cô ấy tin rằng mưa sẽ bắt đầu vào cùng một ngày trong mỗi chu kỳ — nhưng năm nay nó đến muộn."
trTR = "Yağmurların her döngüde aynı gün başladığına inanıyordu — ama bu yıl geç kaldılar."

["BeaverFamilyTree.CauseOfDeath.Thirst.F.36"]
raw = "Her last strength went into dragging herself to the dry canal, just to lie down at its bottom."
status = "normal"
enUS = "Her last strength went into dragging herself to the dry canal, just to lie down at its bottom."
zhCN = "她最后的力气全都用来拖着自己到干涸的渠道，只为躺在底部。"
zhTW = "她最後的力氣用來爬到乾涸的水道，只為躺在底部。"
ruRU = "Её последние силы ушли на то, чтобы дотянуться до сухого канала, лишь чтобы лечь на его дно."
jaJP = "「彼女は最後の力を振り絞って干枯れた運河に這っていき、その底に横たわるだけだった。」"
frFR = "Sa dernière force a été dépensée à se traîner jusqu'au canal sec, juste pour s'allonger au fond."
deDE = "Ihre letzte Kraft ging darauf, sich zum trockenen Kanal zu schleppen, nur um sich am Grund niederzulegen."
plPL = "Jej ostatnie siły poszły na to, by dotrzeć do suchego kanału, tylko po to, by położyć się na jego dnie."
ptBR = "Sua última força foi para arrastar-se até o canal seco, apenas para deitar-se em seu fundo."
