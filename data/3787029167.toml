frFR = "Il s'est dirigé vers la frontière du district en espérant trouver un canal voisin, mais la vanne des voisins était fermée aux étrangers."
deDE = "Er wanderte zur Stadtgrenze in der Hoffnung auf einen benachbarten Kanal, aber das Schleusentor der Nachbarn war für Außenstehende geschlossen."
plPL = "Zbłądził do granicy dzielnicy, mając nadzieję na sąsiedni kanał, ale śluza sąsiadów była zamknięta dla obcych."
ptBR = "Ele vagou até a fronteira do distrito, esperando por um canal vizinho, mas a comporta dos vizinhos estava fechada para forasteiros."
koKR = "그는 이웃 운하를 기대하며 구역 경계로 wandered했지만, 이웃의 수로는 외부인에게 닫혀 있었다."
