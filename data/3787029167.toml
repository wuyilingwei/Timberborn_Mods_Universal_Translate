plPL = "Głód otępiał każdy zmysł, aż przestała zauważać nawet ból w swoich łapach, zdarty do czerwoności."
ptBR = "A fome apagou todos os sentidos até ela parar de notar até mesmo a dor em suas patas, desgastadas."
koKR = "배고픔은 모든 감각을 무디게 하여 그녀는 심지어 발에서 느껴지는 아픔조차 잊어버릴 때까지 이르렀다."
csCZ = "Hlad otupil každého smyslu, až přestala vnímat dokonce i bolest v tlapkách, odřeninou."
viVN = "Cơn đói làm tê liệt mọi giác quan đến mức cô không còn nhận ra cả nỗi đau ở chân của mình, đã bị mài mòn."
trTR = "Açlık, her duyuyu körleştirene kadar, hatta ayaklarındaki acıyı bile hissetmeyi bıraktı, harap olmuştu."

["BeaverFamilyTree.CauseOfDeath.Hunger.F.28"]
raw = "The last thing she ate was a handful of sawdust off the sawmill floor — and even that didn't save her from the hunger."
status = "normal"
enUS = "The last thing she ate was a handful of sawdust off the sawmill floor — and even that didn't save her from the hunger."
zhCN = "“她最后吃的是从锯木厂地板上捡起的一把锯末——即便如此也没能拯救她于饥饿。”"
zhTW = "她最後吃的東西是一把鋸木廠地板上的鋸屑——即便如此也無法讓她擺脫飢餓。"
ruRU = "Последнее, что она съела, это была горсть опилок с пола лесопилки — и даже это не спасло её от голода."
jaJP = "彼女が最後に食べたのは製材所の床からの一握りの木くずでした — それでも彼女を飢えから救うことはできませんでした。"
frFR = "La dernière chose qu'elle a mangée était une poignée de sciure de bois du sol de la scierie — et même cela ne l'a pas sauvée de la faim."
deDE = "Das Letzte, was sie aß, war eine Handvoll Sägemehl vom Boden der Sägewerk — und selbst das rettete sie nicht vor dem Hunger."
plPL = "Ostatnią rzeczą, którą zjadła, była garść trocin z podłogi tartaku — i nawet to nie uratowało jej przed głodem."
ptBR = "A última coisa que ela comeu foi um punhado de serragem do chão do serralheiro — e mesmo isso não a salvou da fome."
koKR = "그녀가 마지막으로 먹은 것은 제재소 바닥의 톱밥 한 줌이었고 — 그조차도 그녀를 굶주림으로부터 구해주지 못했다."
csCZ = "Poslední věc, kterou snědla, byla hrst pilin ze země v pilařství — a ani to ji nezachránilo před hladem."
viVN = "Cái cuối cùng cô ăn là một nắm bụi gỗ từ sàn nhà máy cưa — và ngay cả điều đó cũng không cứu cô khỏi cơn đói."
trTR = "Yediği son şey, merdane zemininden bir avuç talaş oldu - bu bile onu açlıktan kurtaramadı."

["BeaverFamilyTree.CauseOfDeath.Hunger.F.29"]
raw = "She saved her strength for tomorrow's shift at the dam, not counting on the fact that she wouldn't live to see it."
status = "normal"
enUS = "She saved her strength for tomorrow's shift at the dam, not counting on the fact that she wouldn't live to see it."
zhCN = "“她为明天在大坝的轮班节省了力气，却没想到她活不到那一天。”"
zhTW = "「她為明天在水壩的值班保存力量，卻沒想到自己無法活著看到那一天。」"
ruRU = "Она сохранила свои силы для завтрашней смены на плотине, не рассчитывая на то, что не доживет до этого."
jaJP = "彼女はダムの明日のシフトのために力を温存していたが、それを見ることなく命を終えるとは思っていなかった。"
frFR = "Elle a économisé sa force pour le quart de travail de demain au barrage, sans se douter qu'elle ne serait pas là pour le voir."
deDE = "Sie sparte ihre Kräfte für den morgigen Einsatz am Damm, ohne zu rechnen, dass sie es nicht bis dahin schaffen würde."
plPL = "Oszczędzała siły na jutrzejszą zmianę w tamie, nie przypuszczając, że nie doczeka się jej."
ptBR = "Ela economizou suas forças para o turno de amanhã na represa, sem contar que não viveria para vê-lo."
koKR = "그녀는 내일 댐에서의 작업을 위해 힘을 아끼고 있었으며, 그것을 볼 수 없을 것이라는 사실을 고려하지 않았다."
csCZ = "Šetřila síly na zítřejší směnu na hrázi, aniž by počítala s tím, že se jí nedožije."
viVN = "Cô ấy đã tiết kiệm sức lực cho ca làm việc vào ngày mai tại đập, không tính đến việc cô ấy sẽ không sống để nhìn thấy điều đó."
trTR = "Barajdaki yarına yapılacak mesai için gücünü sakladı, ama bunu görecek kadar yaşamayacağını hiç düşünmedi."

["BeaverFamilyTree.CauseOfDeath.Hunger.F.30"]
raw = "The badtide washed out half the crops that year, and she was one of the ones the leftovers didn't stretch to."
status = "normal"
enUS = "The bad tide washed out half the crops that year, and she was one of the ones the leftovers didn't stretch to."
zhCN = "“那年恶潮冲走了一半的作物，而她是剩下的食物不够的其中之一。”"
zhTW = "那年的惡潮沖走了一半的作物，剩下的供應不足以讓她存活下來。"
ruRU = "Плохая приливная волна смыла половину урожая в тот год, и она оказалась одной из тех, для кого остатков не хватило."
jaJP = "その年、悪潮によって作物の半分が流され、彼女は残り物が足りなかった者の一人だった。"
frFR = "La marée mauvaise a emporté la moitié des récoltes cette année-là, et elle était l'une de celles pour qui les restes n'ont pas suffi."
deDE = "Die schlechte Tide spülte in diesem Jahr die Hälfte der Ernte weg, und sie war eine derjenigen, für die die Reste nicht ausreichten."
plPL = "W tamtym roku zły przypływ zniszczył połowę plonów, a ona była jedną z tych, którym resztki nie wystarczyły."
ptBR = "A maré ruim destruiu metade das colheitas naquele ano, e ela foi uma das que os restos não foram suficientes."
koKR = "그 해에 나쁜 조류가 농작물의 절반을 쓸어가 버렸고, 그녀는 남은 양이 부족했던 사람 중 하나였다."
csCZ = "Špatná přílivová vlna v té době smetla polovinu plodin, a ona byla jednou z těch, na které zbytky nestačily."
viVN = "Dòng thủy triều xấu đã cuốn trôi một nửa mùa vụ trong năm đó, và cô ấy là một trong những người mà lượng thực phẩm thừa không đủ."
trTR = "O yıl kötü dalga mahsullerin yarısını götürdü ve artanlar ona yetmedi."

["BeaverFamilyTree.CauseOfDeath.Hunger.F.31"]
raw = "She pretended she'd already eaten so no one would give up their own ration to her — and kept up the act to the end."
status = "normal"
enUS = "She pretended she'd already eaten so no one would give up their own ration to her — and kept up the act to the end."
zhCN = "她假装自己已经吃过，以便让别人不给她自己的口粮——并坚持到最后。"
zhTW = "她假裝自己已經吃過了，這樣沒有人會把自己的口糧給她—並一直保持這種狀態直到最後。"
ruRU = "Она притворялась, что уже поела, чтобы никто не отдал ей свою порцию — и продолжала этот спектакль до самого конца."
jaJP = "「彼女は誰も自分の配給を彼女に渡さないように、すでに食べたふりをして — 最後までその演技を続けた。」"
frFR = "Elle a fait semblant d'avoir déjà mangé pour que personne ne lui donne sa propre ration — et a maintenu l'illusion jusqu'à la fin."
deDE = "Sie tat so, als hätte sie schon gegessen, damit niemand seine eigene Ration für sie aufgab – und hielt die Schau bis zum Ende aufrecht."
plPL = "Udawała, że już zjadła, aby nikt nie oddał jej swojej racji — i utrzymywała tę sztukę do końca."
ptBR = "Ela fingiu que já tinha comido para que ninguém desse a sua própria ração a ela — e manteve a encenação até o fim."
koKR = "그녀는 아무도 자신의 배급을 그녀에게 주지 않도록 이미 먹었다고 가장했고, 끝까지 그 연기를 유지했다."
csCZ = "Předstírala, že už se najedla, aby jí nikdo nedal svou porci — a tu hru si udržovala až do konce."
viVN = "Cô giả vờ rằng mình đã ăn rồi để không ai phải nhường phần ăn của họ cho cô — và tiếp tục diễn xuất đến cùng."
trTR = "Zaten yemiş gibi davrandı böylece kimse kendi rasyonunu ona vermedi — ve bu oyunu sona kadar sürdürdü."

["BeaverFamilyTree.CauseOfDeath.Hunger.F.32"]
raw = "The fresh load of logs arrived right on schedule — the barge with the food was a day later than she could hold out for."
status = "normal"
enUS = "The fresh load of logs arrived right on schedule — the barge with the food was a day later than she could hold out for."
zhCN = "“一车新鲜的木材准时到达——运送食物的驳船比她能坚持的时间晚了一天。”"
zhTW = "新一批原木準時抵達——載著食物的駁船比她能忍受的晚了一天。"
ruRU = "Свежая партия бревен прибыла точно по расписанию — баржа с едой опоздала на день больше, чем могла бы продержаться."
jaJP = "新しい丸太が予定通りに到着しました — 食料を運ぶバージが彼女が耐えられる限界よりも1日遅れて到着しました。"
frFR = "La nouvelle cargaison de rondins est arrivée juste à temps — la barge avec la nourriture était un jour en retard par rapport à ce qu'elle pouvait supporter."
deDE = "Die frische Ladung Holz kam pünktlich an – die Barke mit dem Essen kam einen Tag später, als sie aushalten konnte."
plPL = "Świeża dostawa belek dotarła dokładnie na czas — barge z jedzeniem spóźniła się o dzień, więcej niż mogła wytrzymać."
ptBR = "A nova carga de toras chegou bem na hora certa — a barca com a comida chegou um dia após o que ela podia aguentar."
koKR = "신선한 통나무가 정확히 예정대로 도착했습니다 — 식량을 실은 바지는 그녀가 참을 수 있는 것보다 하루 늦게 도착했습니다."
csCZ = "Čerstvý náklad klád dorazil přesně podle plánu – bárka s jídlem přišla o den později, než byla schopna vydržet."
viVN = "Chuyến hàng gỗ tươi đã đến kịp thời — chiếc xà lan chở thức ăn đến muộn một ngày so với thời gian mà cô có thể chịu đựng."
trTR = "Fidan yığını tam zamanında geldi - yiyecek taşıyan kayık, dayanabileceği süreden bir gün sonra geldi."

["BeaverFamilyTree.CauseOfDeath.Hunger.F.33"]
raw = "She steered clear of the neighboring district's full granaries, too proud to ask for help."
status = "normal"
enUS = "She steered clear of the neighboring district's full granaries, too proud to ask for help."
zhCN = "“她避开了邻近地区满满的粮仓，太过自尊而不愿求助。”"
zhTW = "她避開了鄰近區域滿滿的糧倉，心中有著驕傲，不願意尋求幫助。"
ruRU = "Она держалась подальше от полных амбаров соседнего района, слишком гордая, чтобы просить о помощи."
jaJP = "「彼女は隣接する地区の満杯の穀倉を避け、助けを求めることを誇りに思っていました。」"
frFR = "Elle évitait les greniers pleins du district voisin, trop fière pour demander de l'aide."
deDE = "Sie hielt sich von den vollen Scheunen des benachbarten Distrikts fern, zu stolz, um um Hilfe zu bitten."
plPL = "Unikała pełnych spichlerzy w sąsiednim okręgu, zbyt dumna, by prosić o pomoc."
ptBR = "Ela evitou os granários cheios do distrito vizinho, muito orgulhosa para pedir ajuda."
koKR = "그녀는 도움을 요청하기에는 너무 자존심이 강해 이웃 구역의 가득 찬 곡식 창고를 피했다."
csCZ = "Vyhýbala se plným sýpkám sousedního okresu, příliš pyšná na to, aby požádala o pomoc."
viVN = "Cô tránh xa những kho thóc đầy ắp của khu vực lân cận, quá tự hào để xin trợ giúp."
trTR = "Yardım istemeye fazla gururlu olduğu için komşu bölgedeki dolu ambarlardan kaçındı."

["BeaverFamilyTree.CauseOfDeath.Hunger.F.34"]
raw = "Her last strength went into hauling her own cart of logs to the storehouse, not into finding a meal."
status = "normal"
enUS = "Her last strength went into hauling her own cart of logs to the storehouse, not into finding a meal."
zhCN = "她最后的力量用在了将自己的木材车拉到仓库，而不是寻找食物。"
zhTW = "“她最後的力量用來拖運自己的一車木材到倉庫，而不是去找一頓飯。”"
ruRU = "Её последние силы ушли на перевозку своей телеги с дровами в склад, а не на поиск еды."
jaJP = "彼女の最後の力は食事を見つけるのではなく、自分の丸太のカートを倉庫に運ぶことに注がれた。"
frFR = "Sa dernière force a été consacrée à tirer sa propre charrette de rondins jusqu'à l'entrepôt, et non à chercher un repas."
deDE = "Ihre letzte Kraft ging darauf, ihren eigenen Wagen mit Holz ins Lager zu ziehen, nicht darauf, eine Mahlzeit zu finden."
plPL = "Ostatnie siły poszły na zaciąganie własnego wozu z drewnem do magazynu, a nie na znalezienie posiłku."
ptBR = "Sua última força foi para puxar seu próprio carrinho de toras para o armazém, não para encontrar uma refeição."
koKR = "그녀의 마지막 힘은 식사를 찾는 것이 아니라 자신의 통나무 수송차를 저장소로 끌고 가는 데 사용되었다."
csCZ = "Její poslední síla šla do tahání jejího vlastního vozu s kládami do skladu, ne do shánění jídla."
viVN = "Sức mạnh cuối cùng của cô ấy đã được dùng để kéo chiếc xe gỗ của chính mình đến kho, không phải để tìm kiếm một bữa ăn."
trTR = "Son gücü, bir yemek bulmak yerine, kendi odun arabasını ambarına taşımaya gitti."

["BeaverFamilyTree.CauseOfDeath.Hunger.F.35"]
raw = "She was counting on the spring shoots to save her — but spring was late that cycle."
status = "normal"
enUS = "She was counting on the spring shoots to save her — but spring was late that cycle."
zhCN = "她指望着春天的嫩芽能救她——但那个周期春天来得很晚。"
zhTW = "「她指望著春天的嫩芽來拯救自己——但這個週期的春天來得太晚了。」"
ruRU = "Она надеялась на весенние побеги, которые спасут её — но весна запоздала в этом цикле."
jaJP = "「彼女は春の若芽が自分を救ってくれることを期待していたが、そのサイクルでは春が遅れていた。」"
frFR = "Elle comptait sur les pousses printanières pour la sauver — mais le printemps était en retard ce cycle."
deDE = "Sie hatte auf die Frühjahrsneuaustriebe gehofft, um gerettet zu werden – aber der Frühling war in diesem Zyklus spät."
plPL = "Liczyła na wiosenne pędy, które ją uratują — ale wiosna w tym cyklu była spóźniona."
ptBR = "Ela contava com os brotos da primavera para salvá-la — mas a primavera atrasou-se nesse ciclo."
koKR = "그녀는 봄의 새싹이 자신을 구해주기를 기대했지만 — 그 주기는 봄이 늦었다."
csCZ = "Spoléhala na jarní výhonky, které ji zachrání - ale jaro v tomto cyklu přišlo pozdě."
viVN = "Cô ấy đã hy vọng vào những chồi non mùa xuân để cứu mình — nhưng mùa xuân đến muộn trong chu kỳ này."
trTR = "Bahar filizlerine güveniyordu — ama bu döngüde bahar gecikti."

["BeaverFamilyTree.CauseOfDeath.Hunger.F.36"]
raw = "Hunger crept up on her unnoticed through the long shifts, right up until the day her legs simply refused to rise."
status = "normal"
enUS = "Hunger crept up on her unnoticed through the long shifts, right up until the day her legs simply refused to rise."
zhCN = "“饥饿在长时间的工作中悄悄逼近她，直到有一天她的双腿根本不愿意再站起来。”"
zhTW = "飢餓在漫長的工作輪班中悄然降臨，直到那天她的雙腿根本不再聽使喚。"
ruRU = "Голод незаметно подкрался к ней во время долгих смен, вплоть до того дня, когда её ноги просто отказались подниматься."
jaJP = "「飢えは長いシフトの間に彼女に気づかれず忍び寄り、ついには彼女の足がただ立ち上がることを拒む日まで続いた。」"
frFR = "La faim s'est glissée sur elle sans qu'elle ne s'en aperçoive au fil des longues journées de travail, jusqu'au jour où ses jambes ont simplement refusé de se lever."
deDE = "Hunger schlich sich unbemerkt durch die langen Schichten an sie heran, bis zu dem Tag, an dem ihre Beine einfach weigerten, sich zu erheben."
plPL = "Głód zbliżał się do niej niezauważony przez długie zmiany, aż do dnia, w którym jej nogi po prostu odmówiły posłuszeństwa."
ptBR = "A fome a surpreendeu sem que percebesse durante os longos turnos, até o dia em que suas pernas simplesmente se recusaram a se levantar."
koKR = "굶주림은 그녀의 눈치채지 못한 채 긴 근무 시간 동안 다가왔고, 결국 그녀의 다리가 더 이상 일어설 수 없는 날까지 이어졌다."
csCZ = "Hladu se na ni nenápadně vkradl během dlouhých směn, až do dne, kdy se jí nohy jednoduše odmítly zvednout."
viVN = "Nhu cầu ăn uống lén lút ập đến với cô ấy trong suốt những ca làm việc dài, cho đến ngày mà đôi chân của cô ấy đơn giản từ chối đứng dậy."
trTR = "Açlık, uzun vardiyalar boyunca fark edilmeden üzerine sinmişti, ta ki bacaklarının artık kalkmayı reddettiği güne kadar."

["BeaverFamilyTree.CauseOfDeath.Hunger.F.37"]
raw = "She kept telling herself there'd be time to eat after the next shift — but the next shift never ended for her."
status = "normal"
enUS = "She kept telling herself there'd be time to eat after the next shift — but the next shift never ended for her."
zhCN = "“她不断告诉自己下一个轮班结束后就有时间吃饭——但对她来说，下一个轮班从未结束。”"
zhTW = "「她不斷告訴自己，下一班工作結束後會有時間吃飯——但對她來說，下一班從未結束。」"
ruRU = "Она всё время говорила себе, что после следующей смены будет время поесть — но для неё следующая смена никогда не заканчивалась."
jaJP = "「彼女は次のシフトが終わったら食べる時間があると自分に言い聞かせていたが、次のシフトは彼女にとって終わることがなかった。」"
frFR = "Elle ne cessait de se dire qu'il y aurait du temps pour manger après le prochain service — mais le prochain service n'a jamais pris fin pour elle."
deDE = "Sie redete sich immer wieder ein, dass es nach der nächsten Schicht Zeit zum Essen geben würde – aber die nächste Schicht endete für sie nie."
plPL = "Cały czas powtarzała sobie, że będzie miała czas na jedzenie po następnej zmianie — ale następna zmiana nigdy się dla niej nie skończyła."
ptBR = "Ela continuava se dizendo que haveria tempo para comer depois do próximo turno — mas o próximo turno nunca terminava para ela."
koKR = "그녀는 다음 교대 후에 먹을 시간이 있을 것이라고 계속 속삭였지만, 그녀에게 다음 교대는 결코 끝나지 않았다."
csCZ = "Stále si opakovala, že po další směně bude čas na jídlo — ale další směna pro ni nikdy neskončila."
viVN = "Cô ấy cứ tự nhủ rằng sẽ có thời gian để ăn sau ca làm việc tiếp theo — nhưng ca làm việc tiếp theo chưa bao giờ kết thúc đối với cô."
trTR = "Bir sonraki vardiyadan sonra yemek yemeye zaman olacağını sürekli kendisine söyleyip durdu — ama onun için bir sonraki vardiya asla sona ermedi."

["BeaverFamilyTree.CauseOfDeath.Hunger.F.38"]
raw = "She gave up her place in the kitchen line three times running — the fourth time, the line never opened for her at all."
status = "normal"
enUS = "She gave up her place in the kitchen line three times in a row — the fourth time, the line never opened for her at all."
zhCN = "她连续三次放弃在厨房排队的机会——第四次，她根本没有机会排队。"
zhTW = "她連續三次放棄在廚房排隊的位置——第四次，她根本沒能再排上隊。"
ruRU = "Она трижды отказалась от своей очереди на кухне — в четвертый раз очередь вообще не открылась для нее."
jaJP = "彼女はキッチンの列で三度も自分の番を譲ったが、四度目にはその列が彼女のために全く開かなかった。"
frFR = "Elle a abandonné sa place dans la file de la cuisine trois fois de suite - la quatrième fois, la file ne s'est jamais ouverte pour elle."
deDE = "Sie gab ihren Platz in der Küchen Schlange dreimal hintereinander auf – beim vierten Mal öffnete sich die Schlange für sie überhaupt nicht."
plPL = "Ona zrezygnowała ze swojego miejsca w kolejce do kuchni trzy razy z rzędu — za czwartym razem kolejka w ogóle się dla niej nie otworzyła."
ptBR = "Ela abriu mão de seu lugar na fila da cozinha três vezes seguidas — na quarta vez, a fila nunca se abriu para ela."
koKR = "그녀는 주방 줄에서 세 번 연속으로 자리를 포기했고 — 네 번째 시간에는 줄이 전혀 그녀를 위해 열리지 않았다."
csCZ = "Svou pozici ve frontě na jídlo opustila třikrát za sebou — potřetí už se pro ni fronta vůbec neotevřela."
viVN = "Cô ấy đã từ bỏ vị trí của mình trong hàng bếp ba lần liên tiếp - lần thứ tư, hàng không bao giờ mở ra cho cô ấy."
trTR = "Üç kez arka arkaya mutfak sırasını bıraktı — dördüncü kez, sıra onun için hiç açılmadı."

["BeaverFamilyTree.CauseOfDeath.Hunger.F.39"]
raw = "Her empty stomach drowned out even the hammers at the sawmill — but she could never drown out the hunger itself."
status = "normal"
enUS = "Her empty stomach drowned out even the hammers at the sawmill — but she could never drown out the hunger itself."
zhCN = "“她空荡荡的肚子甚至淹没了锯木厂的锤声——但她永远无法淹没那种饥饿本身。”"
zhTW = "她空蕩蕩的胃連鋸木廠的錘聲都淹沒了——但她卻永遠無法淹沒那種饑餓感。"
ruRU = "Её пустой желудок заглушал даже молотки на пилораме — но она никогда не могла заглушить саму голод."
jaJP = "彼女の空っぽの腹は製材所のハンマーの音さえもかき消した — しかし、彼女はその飢えを消すことは決してできなかった。"
frFR = "Son ventre vide étouffait même le bruit des marteaux à la scierie — mais elle ne pouvait jamais étouffer la faim elle-même."
deDE = "„Ihr leerer Magen übertönte sogar die Hämmer in der Sägewerk — aber sie konnte den Hunger selbst niemals übertönen.“"
plPL = "Jej pusty żołądek zagłuszał nawet młoty w tartaku — ale nigdy nie mogła zagłuszyć samego głodu."
ptBR = "Seu estômago vazio abafou até mesmo os martelos na serraria — mas ela nunca conseguiu abafar a fome em si."
koKR = "그녀의 빈 배는 제재소의 망치 소리까지 묻어버렸지만, 그녀는 배고픔 자체를 결코 씻어낼 수 없었다."
csCZ = "Její prázdný žaludek převyšoval i klapání kladiv v pilách — ale nikdy nedokázala potlačit samotný hlad."
viVN = "Ợ bụng đói của cô ấy lấn át cả tiếng búa ở xưởng cưa — nhưng cô ấy không bao giờ có thể dập tắt được cơn đói chính nó."
trTR = "Boş karnı, testerehane bıçaklarının sesini bile bastırdı — ama asla açlığı bastıramadı."

["BeaverFamilyTree.CauseOfDeath.OldAge.F.20"]
raw = "She made one last round of the dam, nodding to every familiar log as if saying goodbye."
status = "normal"
enUS = "She made one last round of the dam, nodding to every familiar log as if saying goodbye."
zhCN = "“她最后一圈巡视了大坝，向每一根熟悉的原木点头，仿佛在说再见。”"
zhTW = "「她最後繞了一圈大壩，對每一根熟悉的木頭點頭，彷彿在說再見。」"
ruRU = "Она в последний раз обошла плотину, кидая в знак прощания головой каждому знакомому бревну."
jaJP = "「彼女は最後のダムの巡回をし、別れを告げるかのように、知っている丸太にすべてうなずいた。」"
frFR = "Elle a fait un dernier tour du barrage, hochant la tête à chaque tronc familier comme si elle disait adieu."
deDE = "Sie machte eine letzte Runde um den Damm und nickte jedem vertrauten Baumstamm zu, als wolle sie sich verabschieden."
plPL = "Zrobiła ostatnią rundę wokół tamy, kiwając głową do każdego znajomego kłody, jakby mówiła żegnaj."
ptBR = "Ela fez uma última volta pela represa, acenando para cada tronco familiar como se estivesse se despedindo."
koKR = "그녀는 마지막으로 댐을 한 바퀴 돌며, 작별 인사를 하듯이 익숙한 통나무에 고개를 끄덕였다."
csCZ = "Poslední obchůzku hráze si ještě jednou prošla a kývla na každý známý kmen jako by se loučila."
viVN = "Cô ấy đi một vòng cuối cùng quanh đập, gật đầu với mọi khúc gỗ quen thuộc như thể đang nói lời tạm biệt."
trTR = "Barajın etrafında son bir tur attı, veda ediyormuşcasına tanıdık her tomruğa başını salladı."

["BeaverFamilyTree.CauseOfDeath.OldAge.F.21"]
raw = "Her voice grew quieter, her legs slower, but her smile at the sight of her grandkits never changed, right to the end."
status = "normal"
enUS = "Her voice grew quieter, her legs slower, but her smile at the sight of her grandkits never changed, right to the end."
zhCN = "“她的声音渐渐变得柔和，腿脚也愈发缓慢，但看到孙崽时的微笑始终未变，直到最后。”"
zhTW = "她的聲音變得越來越小，腿也變得越來越慢，但看到孫仔的笑容始終沒有改變，直到最後一刻。"
ruRU = "Её голос становился тише, ноги двигались медленнее, но её улыбка при виде внуков никогда не менялась, до самого конца."
jaJP = "「彼女の声は次第に小さくなり、足は遅くなったが、孫たちを見た時の彼女の笑顔は最後まで変わることはなかった。」"
frFR = "Sa voix devenait plus douce, ses jambes plus lentes, mais son sourire à la vue de ses petits-enfants ne changeait jamais, jusqu'à la fin."
deDE = "Ihre Stimme wurde leiser, ihre Beine langsamer, aber ihr Lächeln beim Anblick ihrer Enkeltiere änderte sich bis zum Ende nie."
plPL = "Jej głos stawał się coraz cichszy, jej nogi coraz wolniejsze, ale jej uśmiech na widok wnuków nigdy się nie zmieniał, aż do samego końca."
ptBR = "Sua voz ficou mais baixa, suas pernas mais lentas, mas seu sorriso ao ver seus netos nunca mudou, até o final."
koKR = "그녀의 목소리는 점점 조용해지고, 다리는 느려졌지만, 손주들을 보는 그녀의 미소는 끝까지 변하지 않았다."
csCZ = "Její hlas se ztišil, její nohy zvolnily, ale její úsměv při pohledu na její vnoučata se nikdy nezměnil, až do konce."
viVN = "Giọng nói của bà ngày càng nhỏ dần, đôi chân trở nên chậm chạp hơn, nhưng nụ cười của bà khi nhìn thấy những đứa cháu của mình thì không bao giờ thay đổi, cho đến giây phút cuối cùng."
trTR = "Ses tonu giderek azaldı, bacakları yavaşladı, ama torunlarını görünceki gülümsemesi son ana kadar hiç değişmedi."

["BeaverFamilyTree.CauseOfDeath.OldAge.F.22"]
raw = "She left the youngsters her favorite bench by the water — and quietly took her place in the family's memory instead."
status = "normal"
enUS = "She left the youngsters her favorite bench by the water — and quietly took her place in the family's memory instead."
zhCN = "她把自己最喜欢的水边长椅留给了年轻一代——然后安静地在家族的记忆中留下了自己的位置。"
zhTW = "她將自己最喜愛的水邊長椅留給了年輕的狸藻，然後靜靜地在家庭的記憶中佔據了一個位置。"
ruRU = "Она оставила молодняку свою любимую скамейку у воды — и тихо заняла своё место в памяти семьи."
jaJP = "「彼女は若者たちに水辺の好きなベンチを残し、静かに家族の思い出の中に自分の場所を確保した。」"
frFR = "Elle a laissé aux jeunes son banc préféré au bord de l'eau — et a silencieusement pris sa place dans la mémoire de la famille."
deDE = "Sie hinterließ den jungen Bibern ihre Lieblingsbank am Wasser – und trat still ihren Platz in der Erinnerung der Familie an."
plPL = "Odszukała młode jej ulubioną ławkę przy wodzie — a cicho zajęła swoje miejsce w pamięci rodziny."
ptBR = "Ela deixou aos jovens seu banco favorito à beira da água — e silenciosamente tomou seu lugar na memória da família."
koKR = "그녀는 어린 비버들에게 물가에 있는 그녀의 소중한 벤치를 남기고 — 조용히 가족의 기억 속으로 들어갔다."
csCZ = "Odstoupila mladým svoji oblíbenou lavičku u vody — a tiše zaujala své místo v paměti rodiny."
viVN = "Cô để lại cho các con trẻ chiếc ghế yêu thích của mình bên bờ nước — và lặng lẽ chiếm lấy vị trí của mình trong ký ức của gia đình."
trTR = "Gençlere su kenarındaki en sevdiği bankı bıraktı — ve ailesinin anılarında sessizce yerini aldı."

["BeaverFamilyTree.CauseOfDeath.OldAge.F.23"]
raw = "Age never asked permission — it simply came for her one day, as peacefully as it had come for so many before her."
status = "normal"
enUS = "Age never asked for permission — it simply arrived for her one day, as peacefully as it had for so many before her."
zhCN = "“岁月从不征求许可——它只是在某一天安静地降临到她身上，就像它之前降临给过许多其他人一样。”"
zhTW = "年齡從不徵求允許——某天，它就這樣來到了她身邊，和以前來到過許多人的方式一樣平靜。"
ruRU = "Возраст никогда не спрашивал разрешения — он просто пришел за ней однажды, так же мирно, как пришел за многими до нее."
jaJP = "年齢は許可を求めることはない — それはある日、彼女のもとにひっそりと訪れた。他の多くの者たちのもとに訪れたように。"
frFR = "L'âge n'a jamais demandé la permission — il est simplement venu pour elle un jour, aussi paisiblement qu'il était venu pour tant d'autres avant elle."
deDE = "Das Alter hat niemals um Erlaubnis gefragt — es kam eines Tages einfach zu ihr, so friedlich, wie es zuvor schon vielen gekommen war."
plPL = "Wiek nigdy nie pytał o zgodę — po prostu przyszło po nią pewnego dnia, tak spokojnie, jak przyszło po tak wiele osób przed nią."
ptBR = "A idade nunca pediu permissão — simplesmente veio para ela um dia, tão pacificamente quanto veio para tantos antes dela."
koKR = "나이는 결코 허락을 묻지 않았다 — 그것은 단지 어느 날 그녀를 찾아왔고, 그 전에 수많은 이들에게 왔던 것처럼 평화롭게 왔다."
csCZ = "Věk se nikdy neptal na povolení — zkrátka přišel pro ni jednoho dne, tak klidně, jak přišel pro tolik dalších před ní."
viVN = "Tuổi tác chưa bao giờ xin phép — nó đơn giản đến với cô ấy một ngày, bình yên như nó đã đến với nhiều người trước cô."
trTR = "Yaş asla izin istemedi - bir gün, daha öncekilerin çoğu gibi, onun için de huzur içinde geldi."

["BeaverFamilyTree.CauseOfDeath.OldAge.F.24"]
raw = "She'd long since taken to living on memories of the great builds of her youth — and one day she simply didn't wake up among them."
status = "normal"
enUS = "She had long since taken to living on memories of the great builds of her youth — and one day she simply didn't wake up among them."
zhCN = "她早已习惯于靠年轻时那些伟大建筑的回忆生活——有一天，她在其中就这样没有醒来。"
zhTW = "「她早已習慣於依靠年輕時那些偉大建設的回憶生活——有一天，她的確是在那些回憶中未能再醒來。」"
ruRU = "Она давно уже жила воспоминаниями о великих постройках своей юности — и однажды просто не проснулась среди них."
jaJP = "「彼女は若い頃の偉大な建築物の思い出に生きることに慣れてしまっていた — そしてある日、彼女はただその中で目を覚まさなかった。」"
frFR = "Elle avait longtemps pris l'habitude de vivre des souvenirs des grandes constructions de sa jeunesse — et un jour, elle ne s'est tout simplement pas réveillée parmi elles."
deDE = "Sie hatte längst begonnen, von den Erinnerungen an die großen Bauwerke ihrer Jugend zu leben – und eines Tages wachte sie einfach nicht mehr unter ihnen auf."
plPL = "Od dawna żyła wspomnieniami wielkich budowli z młodości — pewnego dnia po prostu nie obudziła się wśród nich."
ptBR = "Ela há muito havia se acostumado a viver de memórias das grandes construções de sua juventude — e um dia ela simplesmente não acordou entre elas."
koKR = "그녀는 오랫동안 젊은 시절의 위대한 건축물들을 기억하며 살아왔다 — 그리고 어느 날, 그녀는 그들 중에서 깨어나지 않았다."
csCZ = "Dlouho žila na vzpomínkách na velké stavby svého mládí — a jednoho dne se prostě neprobudila mezi nimi."
viVN = "Cô đã lâu lắm sống bằng những kỷ niệm về những công trình vĩ đại của tuổi trẻ — và một ngày nào đó, cô đơn giản không tỉnh dậy giữa chúng."
trTR = "Gençliğinin büyük yapılarının anılarıyla yaşamaya çoktan başlamıştı - bir gün onlardan birinin arasında basitçe uyanamadı."

["BeaverFamilyTree.CauseOfDeath.OldAge.F.25"]
raw = "The last thing she saw was the morning mist over the river — the very same mist as the day she'd first arrived."
status = "normal"
enUS = "The last thing she saw was the morning mist over the river — the very same mist as the day she'd first arrived."
zhCN = "“她最后看到的景象是河面上的晨雾——正是她第一次到达时看到的那种雾。”"
zhTW = "她最後看到的是河上清晨的薄霧——正是她第一次抵達的那天的薄霧。"
ruRU = "Последнее, что она увидела, это утренний туман над рекой — тот же самый туман, что и в день её прибытия."
jaJP = "彼女が最後に見たものは、川の上にかかる朝霧でした — 彼女が初めて到着した日の霧と全く同じ霧です。"
frFR = "La dernière chose qu'elle a vue fut la brume matinale au-dessus de la rivière — la même brume que le jour de son arrivée."
deDE = "Das letzte, was sie sah, war der Morgennebel über dem Fluss — genau derselbe Nebel wie an dem Tag, an dem sie zum ersten Mal angekommen war."
plPL = "Ostatnią rzeczą, którą zobaczyła, była poranna mgła nad rzeką — ta sama mgła, która była w dniu, w którym po raz pierwszy przybyła."
ptBR = "A última coisa que ela viu foi a névoa da manhã sobre o rio — a mesma névoa do dia em que ela chegou pela primeira vez."
koKR = "그녀가 마지막으로 본 것은 강 위로 드리워진 아침 안개였다 — 처음 도착했을 때와 같은 그 안개였다."
csCZ = "Poslední věc, kterou viděla, byla ranní mlha nad řekou — ta stejná mlha, jakou viděla v den, kdy poprvé dorazila."
viVN = "Cái cuối cùng cô ấy nhìn thấy là sương mù buổi sáng trên dòng sông - chính là lớp sương mù mà cô đã thấy vào ngày cô mới đến."
trTR = "Son gördüğü şey, nehrin üzerindeki sabah sisiydi — tam da ilk geldiği günkü sis."

["BeaverFamilyTree.CauseOfDeath.OldAge.F.26"]
raw = "She refused to move to a new lodge, saying she'd die where she'd lived her whole life. And so she did."
status = "normal"
enUS = "She refused to move to a new lodge, saying she'd die where she'd lived her whole life. And so she did."
zhCN = "“她拒绝搬到新的栖息地，说她要在自己一生中生活过的地方死去。于是她就这样做了。”"
zhTW = "「她拒絕搬到新巢穴，說她會在自己一生所居住的地方死去。於是她就這麼做了。」"
ruRU = "Она отказалась переехать в новый дом, сказав, что умрёт на том месте, где прожила всю свою жизнь. И так и случилось."
jaJP = "「彼女は新しいロッジに移ることを拒否し、一生を過ごした場所で死ぬと言った。そして、実際にそうなった。」"
frFR = "Elle a refusé de déménager dans un nouveau pavillon, disant qu'elle préférerait mourir là où elle avait vécu toute sa vie. Et c'est ce qu'elle a fait."
deDE = "Sie weigerte sich, in eine neue Lodge zu ziehen, und sagte, sie würde dort sterben, wo sie ihr ganzes Leben gelebt hatte. Und so tat sie es."
plPL = "Odmówiła przeniesienia się do nowego szałasu, mówiąc, że umrze tam, gdzie żyła przez całe swoje życie. I rzeczywiście tak zrobiła."
ptBR = "Ela se recusou a se mudar para um novo alojamento, dizendo que morreria onde viveu a vida toda. E assim o fez."
koKR = "그녀는 평생 살아온 곳에서 죽겠다고 하며 새 오두막으로 이사하는 것을 거부했다. 그래서 그녀는 그렇게 했다."
csCZ = "Odmítla se přestěhovat do nového doupěte, říkala, že umře tam, kde prožila celý svůj život. A tak to také udělala."
viVN = "Cô từ chối chuyển đến một tửu quán mới, nói rằng cô sẽ chết ở nơi cô đã sống cả cuộc đời. Và đúng như vậy."
trTR = "Yeni bir yuva taşınmayı reddetti, çünkü tüm hayatını geçirdiği yerde öleceğini söyledi. Ve gerçekten de öyle oldu."

["BeaverFamilyTree.CauseOfDeath.OldAge.F.27"]
raw = "Her body gave out before her spirit did — she kept trying to help at the dam right to the last day, long after she could no longer lift a log."
status = "normal"
enUS = "Her body gave out before her spirit did — she kept trying to help at the dam right to the last day, long after she could no longer lift a log."
zhCN = "“她的身体在灵魂之前衰竭——她一直在努力帮忙修建坝体，直到最后一天，尽管她再也无法抬起一根树干。”"
zhTW = "她的身體在靈魂之前就衰竭了——在最後一天之前，她一直試著在大壩上幫忙，儘管早已無法再提起一根木頭。"
ruRU = "Её тело сдалось раньше, чем дух — она продолжала пытаться помочь на плотине до последнего дня, долго после того, как уже не могла поднять бревно."
jaJP = "「彼女の体は彼女の精神が先に消耗する前に力尽きた — 彼女は最後の日まで、丸太を持ち上げることができなくなった後もダムで助けようとし続けた。」"
frFR = "Son corps a lâché avant son esprit — elle a continué à essayer d'aider au barrage jusqu'au dernier jour, bien après qu'elle ait pu soulever une bûche."
deDE = "Ihr Körper gab auf, bevor ihr Geist es tat – sie versuchte bis zum letzten Tag, am Damm zu helfen, lange nachdem sie keinen Baumstamm mehr heben konnte."
plPL = "Jej ciało zawiodło przed jej duchem — próbowała pomagać przy tamie aż do ostatniego dnia, długo po tym, jak nie mogła już podnieść kłody."
ptBR = "Seu corpo cedeu antes de seu espírito — ela continuou tentando ajudar na represa até o último dia, muito depois de não conseguir mais levantar uma tora."
koKR = "그녀의 몸은 영혼보다 먼저 고장이 났습니다 — 마지막 날까지 댐에서 도우려 애썼고, 그녀가 더 이상 통나무를 들어올릴 수 없어진 이후에도 그랬습니다."
csCZ = "Její tělo selhalo dříve, než její duch — stále se snažila pomáhat u hráze až do posledního dne, dlouho poté, co už nebyla schopná zvednout kládu."
viVN = "Cơ thể cô ấy suy yếu trước khi tinh thần cô ấy gặp vấn đề — cô ấy vẫn cố gắng giúp đỡ tại đập cho đến ngày cuối cùng, lâu sau khi cô ấy không thể nâng được gỗ nữa."
trTR = "Bedeni ruhundan önce pes etti - son güne kadar barajda yardım etmeye çalıştı, bir kütüğü kaldırabilecek durumda olmayı çoktan geçmesine rağmen."

["BeaverFamilyTree.CauseOfDeath.OldAge.F.28"]
raw = "She slipped away quietly in her sleep to the creak of old trees — the very sound that had lulled her whole life."
status = "normal"
enUS = "She slipped away quietly in her sleep to the creak of old trees — the very sound that had lulled her whole life."
zhCN = "“她在梦中静静地离去，伴随着老树的吱嘎声——那正是伴随她一生的声音。”"
zhTW = "她在睡夢中靜靜地離開，伴隨著老樹的吱吱聲——那是她一生都在催眠的聲音。"
ruRU = "Она тихо ушла в сон под скрип старых деревьев — именно тот звук, который убаюкивал её всю жизнь."
jaJP = "彼女は古い木々のきしみの中、静かに眠りの中で息を引き取りました — その音こそが彼女の人生を通じて彼女を慰めてくれた音でした。"
frFR = "Elle s'est éteinte paisiblement dans son sommeil au son des vieux arbres — le même bruit qui l'avait bercée toute sa vie."
deDE = "Sie entschlief leise in ihrem Schlaf zum Knarren der alten Bäume – genau dem Geräusch, das sie ihr ganzes Leben lang in den Schlaf gewiegt hatte."
plPL = "Odeszła cicho we śnie przy skrzypieniu starych drzew — dźwięku, który uspokajał ją przez całe życie."
ptBR = "Ela se foi tranquilamente enquanto dormia ao som dos velhos árvores — o mesmo som que a embalou a vida toda."
koKR = "그녀는 오래된 나무의 삐걱거림 속에서 조용히 잠들며 떠났다 — 그녀의 전 생애를 진정시켜온 바로 그 소리."
csCZ = "„Potichu odešla ve spánku při šelestu starých stromů — právě ten zvuk, který ji provázel celým životem.“"
viVN = "Cô ấy từ từ ra đi trong giấc ngủ với tiếng kêu của những cây cổ thụ - chính âm thanh đã ru cô suốt cuộc đời."
trTR = "Yavaşça uykusunda, hayatı boyunca onu sakinleştiren eski ağaçların gıcırdaması eşliğinde kayboldu."

["BeaverFamilyTree.CauseOfDeath.OldAge.F.29"]
raw = "Her children were long grown, and her grandkits too, and still she watched the river with the same wonder as on her very first day."
status = "normal"
enUS = "Her children were long grown, and her grandkits too, and still she watched the river with the same wonder as on her very first day."
zhCN = "“她的孩子们早已长大，孙子们也一样，但她仍然以和第一天一样的惊奇看着河流。”"
zhTW = "她的孩子早已長大，她的孫子們也是，而她仍然以與第一天相同的驚奇凝視著河流。"
ruRU = "Её дети давно повзрослели, а внуки тоже, и она всё так же с удивлением смотрела на реку, как в свой первый день."
jaJP = "「彼女の子供たちはすでに大人になり、彼女の孫たちもそうだったが、彼女は初めての日と同じように、驚きの目で川を見続けた。」"
frFR = "Ses enfants étaient depuis longtemps grands, ainsi que ses petits-enfants, et pourtant elle regardait la rivière avec la même admiration que le jour de son tout premier jour."
deDE = "Ihre Kinder waren längst erwachsen, und ihre Enkelkinder ebenfalls, und trotzdem beobachtete sie den Fluss mit demselben Staunen wie an ihrem allerersten Tag."
plPL = "Jej dzieci były już dawno dorosłe, a wnuki również, a ona wciąż obserwowała rzekę z tym samym zdziwieniem, co w swoim pierwszym dniu."
ptBR = "Seus filhos já estavam crescidos há muito tempo, e seus netinhos também, e ainda assim ela observava o rio com a mesma admiração do seu primeiro dia."
koKR = "그녀의 자식들은 오래전 자랐고, 손자들도 마찬가지였지만, 그녀는 여전히 처음 그 날처럼 같은 경이로움으로 강을 지켜보았다."
csCZ = "Její děti už dávno vyrostly, a její vnoučata také, a přesto stále sledovala řeku se stejným úžasem jako první den."
viVN = "Các con của bà đã lớn lâu rồi, và cả những chú cháu cũng vậy, nhưng bà vẫn ngắm dòng sông với cùng sự ngạc nhiên như ngày đầu tiên."
trTR = "Çocukları uzun süredir büyümüştü, torunları da öyle, ama yine de nehrin kenarını ilk günkü hayranlıkla izledi."

["BeaverFamilyTree.CauseOfDeath.OldAge.F.30"]
raw = "That last winter turned out mild, as if nature itself had decided to let her go gently."
status = "normal"
enUS = "That last winter turned out mild, as if nature itself had decided to let her go gently."
zhCN = "那最后一个冬天出人意料地温和，就好像大自然自己决定让她安然离去。"
zhTW = "那個最後的冬天變得温和，彷彿大自然本身決定讓她安詳地離去。"
ruRU = "Та последняя зима оказалась мягкой, словно сама природа решила отпустить её спокойно."
jaJP = "「最後の冬は穏やかで、まるで自然が彼女を優しく送り出すことに決めたかのようでした。」"
frFR = "Cet hiver dernier s'est avéré doux, comme si la nature elle-même avait décidé de la laisser partir doucement."
deDE = "Der letzte Winter war mild, als hätte die Natur selbst beschlossen, sie sanft gehen zu lassen."
plPL = "Miniona zima okazała się łagodna, jakby sama natura postanowiła pozwolić jej odejść spokojnie."
ptBR = "Aquele último inverno acabou sendo ameno, como se a própria natureza tivesse decidido deixá-la partir suavemente."
koKR = "그 마지막 겨울은 온화하게 지나갔습니다. 마치 자연이 그녀를 부드럽게 보내주기로 결정한 것처럼 말이죠."
csCZ = "Minulá zima se ukázala jako mírná, jako by se sama příroda rozhodla ji nechat odejít jemně."
viVN = "Mùa đông năm ngoái hóa ra lại dịu dàng, như thể thiên nhiên đã quyết định để bà ra đi một cách nhẹ nhàng."
trTR = "Son kış ılıman geçti, sanki doğa kendisi nazikçe veda etmesine karar vermiş gibiydi."

["BeaverFamilyTree.CauseOfDeath.OldAge.F.31"]
raw = "She'd just finished passing on the secret of her sturdiest dam when she went to her rest with a light heart."
status = "normal"
enUS = "She'd just finished passing on the secret of her sturdiest dam when she went to her rest with a light heart."
zhCN = "“她刚刚传授完她最坚固的水坝的秘密，就带着轻松的心情安息了。”"
zhTW = "「她剛剛傳授完自己最堅固的水壩的秘密，便輕鬆地安然入眠。」"
ruRU = "Она только что завершила передачу секрета своей самой прочной плотины, когда ушла на покой с легким сердцем."
jaJP = "「彼女は一番頑丈なダムの秘密を伝え終えたばかりで、心軽く安らぎに向かった。」"
frFR = "Elle venait de transmettre le secret de son barrage le plus solide lorsqu'elle s'est reposée le cœur léger."
deDE = "Sie hatte gerade das Geheimnis ihres stabilsten Damms weitergegeben, als sie mit leichtem Herzen zur Ruhe ging."
plPL = "Skonczyła właśnie przekazywać tajemnicę swojej najwytrzymalszej tamy, gdy udała się na spoczynek z lekkim sercem."
ptBR = "Ela acabara de transmitir o segredo de sua barragem mais robusta quando partiu para o descanso com o coração leve."
koKR = "그녀는 가장 튼튼한 댐의 비밀을 전해주고 나서 가벼운 마음으로 편히 잠들었다."
csCZ = "Právě dokončila předávání tajemství své nejodolnější hráze, když odešla na věčný odpočinek s lehkým srdcem."
viVN = "Cô ấy vừa hoàn thành việc truyền lại bí mật của con đập vững chắc nhất khi cô ấy đi nghỉ với trái tim nhẹ nhàng."
trTR = "En dayanıklı barajının sırrını paylaşmayı yeni bitirmişti ki, hafif bir kalple huzur içinde göçtü."

["BeaverFamilyTree.CauseOfDeath.OldAge.F.32"]
raw = "Her frail paws could no longer hold a log, but they held her grandkits' paws tight right to the end."
status = "normal"
enUS = "Her frail paws could no longer hold a log, but they held her grandkits' paws tight right to the end."
zhCN = "“她虚弱的爪子再也无法握住一根树干，但她紧紧地握住孙辈们的爪子，一直到最后。”"
zhTW = "她虛弱的爪子再也無法握住樹幹，但她緊緊握住孫子們的爪子，直到最後一刻。"
ruRU = "Её слабые лапки больше не могли удерживать бревно, но они крепко держали лапки её внуков до самого конца."
jaJP = "彼女のもろい前足はもはや丸太を握ることはできなかったが、最後まで孫たちの前足をしっかりと握りしめていた。"
frFR = "Ses pattes frêles ne pouvaient plus tenir une bûche, mais elles tenaient fermement les pattes de ses petits-enfants jusqu'à la fin."
deDE = "„Ihre schwachen Pfoten konnten keinen Stamm mehr halten, aber sie hielten die Pfoten ihrer Enkel bis zum Ende fest.“"
plPL = "Jej słabe łapki nie mogły już trzymać kłody, ale mocno trzymały łapki jej wnuków aż do samego końca."
ptBR = "Suas patas frágeis já não conseguiam segurar um tronco, mas seguravam as patas de seus netinhos firme até o final."
koKR = "그녀의 약한 발은 나무를 더 이상 잡을 수 없었지만, 끝까지 그녀의 손주들의 발을 꽉 잡고 있었다."
csCZ = "Její slabé tlapky už nedokázaly udržet kládu, ale pevně svíraly tlapky jejích vnuků až do samého konce."
viVN = "Đôi chân yếu ớt của bà không thể nắm giữ một khúc gỗ nào nữa, nhưng chúng vẫn nắm chặt đôi chân của những đứa cháu ngay đến cuối cùng."
trTR = "Zayıf pençeleri bir log tutamaz hale gelmişti, ama hayatının sonuna kadar torunlarının pençelerini sıkıca tutmaya devam etti."

["BeaverFamilyTree.CauseOfDeath.OldAge.F.33"]
raw = "She faded away quietly between two strikes of the sawmill bell, never hearing the second one."
status = "normal"
enUS = "She faded away quietly between two strikes of the sawmill bell, never hearing the second one."
zhCN = "她在锯木厂铃声的两次鸣响之间悄然离去，连第二声都未曾听见。"
zhTW = "「她在鋸木廠鐘聲的兩次敲擊之間悄然離去，從未聽見第二聲。」"
ruRU = "Она тихо угасла между двумя ударами колокола лесопилки, так и не услышав второго."
jaJP = "彼女は製材所の鐘が二度鳴る間に静かに息を引き取り、二度目の鐘の音を聞くことはありませんでした。"
frFR = "Elle s'est éteinte paisiblement entre deux coups de cloche de la scierie, n'entendant jamais le second."
deDE = "Sie entschlief sanft zwischen zwei Schlägen der Sägewerksglocke und hörte niemals den zweiten."
plPL = "Cichutko zgasła między dwoma uderzeniami dzwonu tartaku, nigdy nie słysząc drugiego."
ptBR = "Ela se apagou tranquilamente entre duas badaladas do sino do moinho, nunca ouvindo a segunda."
koKR = "그녀는 제재소 종이 두 번 울리는 사이 조용히 사라졌고, 두 번째 종소리는 듣지 못했다."
csCZ = "Tiše odešla mezi dvěma údery zvonu mlýna, nikdy neslyšíc ten druhý."
viVN = " cô ấy đã lặng lẽ ra đi giữa hai tiếng chuông của nhà máy cưa, không bao giờ nghe được tiếng chuông thứ hai."
trTR = "Testere fabrikasının çanının iki vuruşu arasında sessizce yok oldu, ikinciyi asla duymadı."

["BeaverFamilyTree.CauseOfDeath.OldAge.F.34"]
raw = "The wrinkles on her face were a map of the years she'd lived — and one day that map simply closed."
status = "normal"
enUS = "The wrinkles on her face were a map of the years she'd lived — and one day that map simply closed."
zhCN = "“她脸上的皱纹是她所活过岁月的地图——而有一天，那张地图就这样结束了。”"
zhTW = "她臉上的皺紋是她所活過的歲月的地圖——而一天，那張地圖便悄然閉合。"
ruRU = "Морщины на её лице были картой тех лет, что она прожила — и однажды эта карта просто закрылась."
jaJP = "彼女の顔のしわは、彼女が生きてきた年月の地図だった — そしてある日その地図はただ閉じられた。"
frFR = "Les rides sur son visage étaient une carte des années qu'elle avait vécues — et un jour, cette carte s'est simplement refermée."
deDE = "Die Falten in ihrem Gesicht waren eine Landkarte der Jahre, die sie gelebt hatte — und eines Tages klappte diese Karte einfach zu."
plPL = "Zmarszczki na jej twarzy były mapą lat, które przeżyła – a pewnego dnia ta mapa po prostu się zamknęła."
ptBR = "As rugas em seu rosto eram um mapa dos anos que havia vivido — e um dia esse mapa simplesmente se fechou."
koKR = "그녀의 얼굴에 있는 주름은 그녀가 살아온 세월의 지도였다 — 그리고 어느 날 그 지도는 그냥 닫혀버렸다."
csCZ = "Vrásky na jejím obličeji byly mapou let, která prožila — a jednoho dne se ta mapa prostě zavřela."
viVN = "Nếp nhăn trên khuôn mặt cô là một bản đồ của những năm tháng cô đã sống — và một ngày nào đó, bản đồ đó đơn giản đã khép lại."
trTR = "Yüzündeki kırışıklıklar, yaşadığı yılların bir haritasıydı - ve bir gün o harita sadece kapandı."

["BeaverFamilyTree.CauseOfDeath.OldAge.F.35"]
raw = "She dozed off by the fire every evening — and one of those evenings turned out to be her last, though no one noticed the difference right away."
status = "normal"
enUS = "She dozed off by the fire every evening — and one of those evenings turned out to be her last, though no one noticed the difference right away."
zhCN = "她每晚在火边打盹——而那些晚上中的一个恰好是她的最后一晚，尽管没有人立刻注意到有什么不同。"
zhTW = "她每晚都在火堆旁打盹——而那些晚上中的某一晚成為了她的最後一晚，雖然沒有人立刻發現有什麼不同。"
ruRU = "Каждый вечер она задремала у огня — и один из тех вечеров оказался последним, хотя никто сразу не заметил разницы."
jaJP = "彼女は毎晩火のそばでうたた寝をしていて、その晩の一つが彼女の最後の晩になったが、誰もすぐには違いに気づかなかった。"
frFR = "Elle s'est assoupie près du feu chaque soir — et l'un de ces soirs s'est avéré être son dernier, bien que personne n'ait remarqué la différence immédiatement."
deDE = "Jeden Abend döste sie am Feuer ein — und einer dieser Abende stellte sich als ihr letzter heraus, obwohl es zunächst niemand bemerkte."
plPL = "Zasypiała przy ogniu każdego wieczoru - a jeden z tych wieczorów okazał się jej ostatnim, choć nikt od razu nie zauważył różnicy."
ptBR = "Ela cochilava ao lado da fogueira todas as noites — e uma dessas noites acabou sendo a última dela, embora ninguém tenha percebido a diferença imediatamente."
koKR = "그녀는 매일 저녁 불 옆에서 졸다가 — 그 중 어느 저녁이 그녀의 마지막 저녁이 되었지만, 그 누구도 즉시 차이를 알아차리지는 못했다."
csCZ = "Každý večer usnula u ohně - a jeden z těch večerů se ukázal jako její poslední, i když si toho nikdo hned nevšiml."
viVN = "Cô ấy thường gục vào giấc ngủ bên lửa mỗi buổi tối — và một trong những buổi tối đó đã trở thành buổi tối cuối cùng của cô, mặc dù không ai nhận ra sự khác biệt ngay lập tức."
trTR = "Her akşam ateşin yanında uyukladı - ve o akşamlardan biri onun son akşamı oldu, ama kimse hemen bir fark hissetmedi."

["BeaverFamilyTree.CauseOfDeath.OldAge.F.36"]
raw = "She brought in the last harvest of her life herself, flatly refusing any help from the young ones."
status = "normal"
enUS = "She brought in the last harvest of her life herself, flatly refusing any help from the young ones."
zhCN = "“她亲自收获了她生命中的最后一次丰收，坚决拒绝了年轻人的任何帮助。”"
zhTW = "“她自己收穫了生命中最後的收成，堅決拒絕了年輕人的任何幫助。”"
ruRU = "Она сама собрала последний урожай своей жизни, категорически отказавшись от какой-либо помощи от молодых."
jaJP = "「彼女は自分の人生最後の収穫を自ら持ち込んだ。若者たちの助けを平然と拒否して。」"
frFR = "Elle a réalisé elle-même la dernière récolte de sa vie, refusant catégoriquement toute aide des jeunes."
deDE = "„Sie brachte die letzte Ernte ihres Lebens selbst ein und lehnte jede Hilfe von den Jungen entschieden ab.“"
plPL = "Przyniosła ostatnie zbiory swojego życia sama, kategorycznie odmawiając jakiejkolwiek pomocy od młodych."
ptBR = "Ela trouxe a última colheita de sua vida sozinha, recusando-se categoricamente a qualquer ajuda dos mais jovens."
koKR = "그녀는 젊은 이들의 도움을 완강히 거부하며 자신의 생의 마지막 수확을 스스로 가져왔다."
csCZ = "Poslední úrodu svého života si přinesla sama, kategoricky odmítajíc jakoukoli pomoc od mladých."
viVN = "Cô đã tự tay thu hoạch vụ mùa cuối cùng của cuộc đời mình, cương quyết từ chối mọi sự giúp đỡ từ những người trẻ."
trTR = "Hayatının son hasadını kendisi getirdi, gençlerden gelen her türlü yardımı kesin bir dille reddetti."

["BeaverFamilyTree.CauseOfDeath.OldAge.F.37"]
raw = "She left as quietly as she'd once arrived in this district — without any fuss, leaving a sturdy dam behind her."
status = "normal"
enUS = "She left as quietly as she'd once arrived in this district — without any fuss, leaving a sturdy dam behind her."
zhCN = "她像当初来到这个地区一样悄然离去——没有任何喧嚣，留下了一座坚固的坝。"
zhTW = "她離開時如同當初來到這個地區那樣安靜——沒有任何喧鬧，只留下了一座堅固的壩。"
ruRU = "Она ушла так же тихо, как и пришла в этот район — без лишней суеты, оставив после себя прочную плотину."
jaJP = "彼女はこの地区に到着したときのように静かに去っていった — 騒ぎもなく、しっかりとしたダムを残して。"
frFR = "Elle est partie aussi discrètement qu'elle était arrivée dans ce district — sans faire de vagues, laissant derrière elle un solide barrage."
deDE = "Sie ging so leise, wie sie einst in diesen Bezirk gekommen war — ohne Aufhebens, und ließ einen robuster Damm hinter sich."
plPL = "Odeszła tak cicho, jak cicho przybyła do tej okolicy — bez żadnego zamieszania, zostawiając za sobą solidną tamę."
ptBR = "Ela partiu tão silenciosamente quanto havia chegado a este distrito — sem alvoroço, deixando uma barragem robusta para trás."
koKR = "그녀는 이 지역에 처음 도착했을 때처럼 조용히 떠났다 — 아무런 소란도 없이, 튼튼한 댐을 남기고."
csCZ = "Odešla tak tiše, jak do tohoto území kdysi přišla — bez jakýchkoli humbuku, za sebou zanechala robustní hráz."
viVN = "Cô ra đi một cách yên lặng như cách cô đã đến với khu vực này — không ầm ĩ, để lại một đập vững chắc phía sau."
trTR = "Bu bölgeye bir zamanlar geldiği gibi sessizce ayrıldı — gürültü patırtı olmadan, arkasında sağlam bir baraj bırakarak."

["BeaverFamilyTree.CauseOfDeath.OldAge.F.38"]
raw = "Age took her strength, but never her memory — to the end, she remembered the name of everyone she'd ever taught."
status = "normal"
enUS = "Age took her strength, but never her memory — to the end, she remembered the name of everyone she'd ever taught."
zhCN = "岁月夺走了她的力量，却从未夺走她的记忆——直到最后，她仍然记得自己教过的每一个人的名字。"
zhTW = "年齡奪去了她的力量，但從未奪走她的記憶——直到最後，她仍記得每一個她曾教過的人的名字。"
ruRU = "Возраст забрал её силы, но никогда не уводил её память — до самого конца она помнила имена всех, кого когда-либо обучала."
jaJP = "年齢が彼女の力を奪ったが、記憶は奪わなかった — 彼女は最後まで、自分が教えたすべての人の名前を覚えていた。"
frFR = "L'âge lui a pris sa force, mais jamais sa mémoire - jusqu'à la fin, elle se souvenait du nom de tous ceux qu'elle avait jamais enseignés."
deDE = "Das Alter raubte ihr die Kraft, aber nie ihr Gedächtnis – bis zum Ende erinnerte sie sich an die Namen aller, die sie je unterrichtet hatte."
plPL = "Wiek zabrał jej siłę, ale nigdy nie odebrał pamięci — do końca pamiętała imię każdego, kogo kiedykolwiek nauczała."
ptBR = "A idade tirou sua força, mas nunca sua memória — até o fim, ela lembrou o nome de todos que havia ensinado."
koKR = "나이가 그녀의 힘을 앗아갔지만, 기억은 결코 빼앗지 않았다 — 마지막 순간까지 그녀는 자신이 가르쳤던 모든 사람의 이름을 기억하고 있었다."
csCZ = "Věk ji připravil o sílu, ale nikdy ne o paměť – až do konce si pamatovala jména všech, které kdy učila."
viVN = "Thời gian đã lấy đi sức mạnh của cô, nhưng không bao giờ lấy đi ký ức của cô - cho đến cuối đời, cô vẫn nhớ tên của tất cả những người mà cô từng dạy."
trTR = "Yaş, gücünü aldı ama asla hafızasını almadı - sonuna kadar, öğrettiği herkesin adını hatırladı."

["BeaverFamilyTree.CauseOfDeath.OldAge.F.39"]
raw = "She lay down to rest after a long day, just as she had her whole life — only this time the rest turned out to be forever."
status = "normal"
enUS = "She lay down to rest after a long day, just as she had her whole life — only this time the rest turned out to be forever."
zhCN = "“在漫长的一天后，她躺下休息，就像她一生中所做的那样——只不过这一次，休息变成了永远。”"
zhTW = "她在漫長的一天後躺下休息，就像她一生中所做的那樣——只是這次的休息卻永遠無法醒來。"
ruRU = "Она легла отдохнуть после долгого дня, как делала это на протяжении всей своей жизни — только на этот раз отдых оказался навсегда."
jaJP = "「長い一日の後、彼女は休むために横になった。彼女は生涯ずっとそうしてきたが、今回はその休息が永遠になってしまった。」"
frFR = "Elle s'est allongée pour se reposer après une longue journée, tout comme elle l'a fait toute sa vie — seulement cette fois, le repos s'est révélé être pour toujours."
deDE = "Sie legte sich nach einem langen Tag zum Ausruhen nieder, genau wie sie es ihr ganzes Leben lang getan hatte – nur war dieser Rest diesmal für immer."
plPL = "Położyła się, aby odpocząć po długim dniu, tak jak przez całe życie — tylko tym razem odpoczynek okazał się wieczny."
ptBR = "Ela se deitou para descansar após um longo dia, assim como fez a vida toda — apenas que desta vez o descanso se revelou ser para sempre."
koKR = "그녀는 긴 하루를 마치고 쉬기 위해 누웠습니다. 그녀의 평생 동안 그렇게 해왔듯이 — 하지만 이번에는 그 휴식이 영원하게 되었습니다."
csCZ = "Položila se k odpočinku po dlouhém dni, tak jako to dělala celý život — jenže tentokrát se odpočinek ukázal jako věčný."
viVN = "Cô nằm xuống để nghỉ ngơi sau một ngày dài, giống như cô đã làm suốt cuộc đời — chỉ có điều lần này giấc ngủ trở thành vĩnh viễn."
trTR = "Uzun bir günün ardından dinlenmek için uzandı, tıpkı hayatı boyunca olduğu gibi - yalnızca bu sefer dinlenme sonsuza dek oldu."
