["BeaverFamilyTree.CauseOfDeath.Hunger.F.9"]
new = "Work at the sawmill never let up for a moment — food, somehow, never showed up at all."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.Hunger.F.10"]
new = "She split her last scrap with the kits, keeping less and less for herself until there was nothing left."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.Hunger.F.11"]
new = "Hunger screamed loudest at night — and at night the storehouse was simply too far to walk."
