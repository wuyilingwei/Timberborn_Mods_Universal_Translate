zhTW = "她越挖越深，希望能找到地下泉源，卻只挖到了乾沙。"
ruRU = "Она копала свою нору все глубже и глубже, надеясь наткнуться на подземный источник, и наткнулась только на сухой песок."
jaJP = "彼女は巣穴を深く深く掘り進め、地下の湧き水を見つけることを期待したが、乾いた砂しか見つけられなかった。"
frFR = "Elle a creusé son terrier de plus en plus profond, espérant trouver une source souterraine, mais n'a trouvé que du sable sec."
deDE = "Sie grub ihren Bau immer tiefer, in der Hoffnung, auf eine unterirdische Quelle zu stoßen, doch fand sie nur trockenen Sand."
plPL = "Zagłębiła swoją norę coraz głębiej, mając nadzieję na znalezienie podziemnego źródła, a natrafiła tylko na suchy piasek."
ptBR = "Ela cavou sua toca mais e mais fundo, na esperança de encontrar uma fonte subterrânea, e encontrou apenas areia seca."
koKR = "그녀는 지하 샘에 닿기를 바라며 굴을 점점 더 깊게 파고 들었지만, 마른 모래만 발견했다."
csCZ = "Vyhrabala svůj noru hlouběji a hlouběji, doufajíc, že narazí na podzemní pramen, ale narazila pouze na suchý písek."
viVN = "Cô ấy đã đào hang của mình ngày càng sâu hơn, hy vọng sẽ tìm thấy một nguồn nước ngầm, nhưng chỉ gặp phải cát khô."
trTR = "Yuva deliklerini daha derin kazdı, yer altı kaynağına ulaşmayı umarak, ama sadece kuru kum çıkardı."

["BeaverFamilyTree.CauseOfDeath.Thirst.F.8"]
raw = "Even dew on the leaves looked like salvation — but the morning came cloudless, and no dew fell."
status = "normal"
enUS = "Even the dew on the leaves seemed like salvation — but the morning came clear, and no dew fell."
zhCN = "“连叶子上的露水看起来都像是救赎——但早晨来临时却晴空万里，没有露水落下。”"
zhTW = "即使樹葉上的露水看起來像是救贖——但早晨來臨時卻是晴空萬里，沒有露水降落。"
ruRU = "Даже роса на листьях выглядела как спасение — но утро пришло безоблачным, и роса не выпала."
jaJP = "葉の上の露ですら救いのように見えたが、朝は雲一つない晴天となり、露は降らなかった。"
frFR = "Même la rosée sur les feuilles semblait être une salutation — mais le matin est arrivé sans nuages, et aucune rosée n'est tombée."
deDE = "Selbst der Tau auf den Blättern schien wie Rettung — aber der Morgen kam wolkenlos, und kein Tau fiel."
plPL = "Nawet rosa na liściach wyglądała jak zbawienie — ale poranek nadszedł bezchmurny, a żadna rosa nie spadła."
ptBR = "Até o orvalho nas folhas parecia uma salvação — mas a manhã chegou sem nuvens, e nenhum orvalho caiu."
koKR = "잎 위의 이슬조차 구원의 모습처럼 보였지만 — 아침이 맑게 시작되었고, 이슬은 내리지 않았다."
csCZ = "Dokonce i rosa na listech vypadala jako spása — ale ráno přišlo bez mráčku a žádná rosa nespadla."
viVN = "Ngay cả sương trên lá cũng nhìn như sự cứu rỗi - nhưng buổi sáng đến với bầu trời trong xanh, và không có sương rơi xuống."
trTR = "Yapraklardaki çiğ bile kurtuluş gibi görünüyordu — ama sabah bulutsuz geldi ve hiç çiğ düşmedi."

["BeaverFamilyTree.CauseOfDeath.Thirst.F.9"]
raw = "She watched the water flow through the sluice just a few steps away, but couldn't clear that last ledge."
status = "normal"
