plPL = "Słyszał, jak woda kapała gdzieś wewnątrz ściany szałasu i czołgał się w kierunku dźwięku, aż dźwięk ustał."
ptBR = "Ele ouviu água pingando em algum lugar dentro da parede do barraco e rastejou em direção ao som até que o som parou."
koKR = "그는 오두막 벽 안에서 물이 떨어지는 소리를 듣고, 소리가 멈출 때까지 소리를 따라 기어갔다."
csCZ = "Slyšel kapající vodu někde uvnitř zdi srubu a plazil se směrem k zvuku, dokud zvuk nepřestal."
viVN = "Anh nghe tiếng nước nhỏ giọt ở đâu đó trong tường của túp lều và bò về phía âm thanh cho đến khi âm thanh ngừng lại."
trTR = "Yalnızca bir yerde, lojmanın duvarında suyun damladığını duydu ve sesin kesildiği yere kadar emekledi."

