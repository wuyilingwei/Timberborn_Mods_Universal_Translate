jaJP = "「彼女はすでに孫たちにダムについて知っているすべてのことを話しており、清らかな良心で安らかに眠りにつきました。」"
frFR = "Elle avait déjà raconté à ses petits-enfants tout ce qu'elle savait sur les barrages - et elle est partie en paix avec une conscience tranquille."
deDE = "Sie hatte ihren Enkelbiberchen bereits alles erzählt, was sie über Dämme wusste – und ging mit reinem Gewissen zur Ruhe."
plPL = "Już opowiedziała swoim wnuczkom wszystko, co wiedziała o tamach — i odeszła w spokoju z czystym sumieniem."
ptBR = "Ela já havia contado a seus netinhos tudo o que sabia sobre barragens — e partiu para seu descanso com a consciência tranquila."
koKR = "그녀는 이미 손자들에게 댐에 대해 알고 있는 모든 것을 얘기해주었고 — 맑은 양심으로 평화롭게 쉬러 갔다."
csCZ = "Už řekla svým vnukům všechno, co věděla o hrázích — a odešla do svého odpočinku s čistým svědomím."
viVN = "Cô ấy đã kể cho các cháu của mình tất cả những gì cô biết về những cái đập — và ra đi trong tâm hồn thanh thản."
trTR = "Barajlar hakkında bildiği her şeyi torunlarına anlatmıştı - ve içi rahat bir şekilde huzura gitmişti."

["BeaverFamilyTree.CauseOfDeath.OldAge.F.3"]
raw = "Age quietly took its due, painlessly, right in her own lodge, amid the smell of freshly cut wood."
status = "normal"
enUS = "Age quietly took its due, painlessly, right in her own lodge, amid the smell of freshly cut wood."
zhCN = "年龄悄然来临，毫无痛苦，正是在她自己的窝里，伴随着新切木材的气味。"
zhTW = "年紀靜靜地到了它應該收取的時刻，毫無痛苦地，在她自己的小屋裡，伴隨著新鮮切割木材的氣息。"
ruRU = "Возраст тихо забрал своё, безболезненно, прямо в её собственном домике, среди запаха свежесрезанной древесины."
jaJP = "年老いて静かにその時が訪れ、苦しむことなく、彼女自身の巣で、切り立ての木々の香りの中で。"
frFR = "L'âge a pris son dû paisiblement, sans douleur, dans sa propre hutte, au milieu de l'odeur du bois fraîchement coupé."
deDE = "Das Alter nahm seinen Lauf, schmerzlos, direkt in ihrer eigenen Lodge, umgeben vom Geruch frisch geschnittenen Holzes."
plPL = "Wiek spokojnie wziął swoje, bezbolesnie, w jej własnej bieberze, wśród zapachu świeżo ściętego drewna."
ptBR = "A idade levou seu tributo silenciosamente, sem dor, bem em sua própria toca, entre o cheiro de madeira recém-cortada."
koKR = "나이가 그녀의 오두막에서, 갓 베인 나무의 냄새 속에서, 조용히, 아프지 않게 그녀의 몫을 가져갔다."
csCZ = "Věk si tiše vybral svou daň, bezbolestně, přímo v její vlastní chatě, uprostřed vůně čerstvě nařezaného dřeva."
viVN = "Tuổi tác đã đến một cách lặng lẽ, không đau đớn, ngay trong chính tổ ấm của cô, giữa mùi gỗ mới cắt."
trTR = "Yaş, kimseden bir şey istemeden, acısızca, kendi kulübesinde, taze kesilmiş odun kokusu arasında vadesini aldı."

["BeaverFamilyTree.CauseOfDeath.OldAge.F.4"]
raw = "Just yesterday she'd been grumbling at the youngsters over badly stacked logs — today she simply didn't open her eyes."
status = "normal"
enUS = "Just yesterday she'd been grumbling at the youngsters over badly stacked logs — today she simply didn't open her eyes."
zhCN = "就在昨天，她还在因木材堆得不好而对年轻人发牢骚——今天她却根本没有睁开眼睛。"
zhTW = "「就在昨天，她還因為木頭堆得不好而對年輕人抱怨——今天她卻根本沒有睜開眼。」"
ruRU = "Совсем недавно она ворчала на молодых из-за плохо сложенных бревен — сегодня она просто не открыла глаза."
jaJP = "昨日、彼女は不適切に積まれた丸太について若者たちに愚痴をこぼしていた—今日はただ目を開けることがなかった。"
frFR = "« Juste hier, elle se plaignait aux jeunes à propos de bûches mal empilées - aujourd'hui, elle n'ouvrait tout simplement pas les yeux. »"
deDE = "„Gestern hatte sie noch über die schlecht gestapelten Äste gemurrt – heute hat sie einfach ihre Augen nicht geöffnet.“"
plPL = "Jeszcze wczoraj narzekała na młodych z powodu źle ułożonych kłód — dziś po prostu nie otworzyła oczu."
ptBR = "Somente ontem ela estava reclamando dos jovens por causa de toras mal empilhadas — hoje ela simplesmente não abriu os olhos."
koKR = "어제 그녀는 잘 쌓이지 않은 통나무들 때문에 아이들에게 불평을 하곤 했지만, 오늘 그녀는 그냥 눈을 뜨지 않았다."
csCZ = "„Ještě včera naštvaně brblala na mladé kvůli špatně naskládaným kládám – dneska prostě neotevřela oči.“"
viVN = "Chỉ hôm qua, cô ấy đã càu nhàu với những đứa trẻ con về những khúc gỗ xếp không đẹp — hôm nay cô ấy đơn giản là không mở mắt."
trTR = "Daha dün gençlere kötü yığılmış kütükler üzerine homurdanıyordu — bugün sadece gözlerini açmadı."

["BeaverFamilyTree.CauseOfDeath.OldAge.F.5"]
raw = "She'd long since stopped counting the cycles she'd lived — what did it matter, when every day had been good in its own way."
status = "normal"
enUS = "She'd long since stopped counting the cycles she'd lived — what did it matter, when every day had been good in its own way."
zhCN = "“她早已不再计算自己活过多少个周期——这有什么关系呢，反正每天都有它各自的美好。”"
zhTW = "「她早已不再計算自己活過多少個週期——這有什麼關係，反正每一天都以自己的方式過得很好。」"
ruRU = "«Она давно перестала считать циклы, которые прожила — какая разница, если каждый день был хорош по-своему.»"
jaJP = "「彼女はすでに自分が生きてきたサイクルのカウントをやめていた — 毎日がそれぞれの方法で良かったのだから、何の意味があったのだろう。」"
frFR = "Elle avait depuis longtemps cessé de compter les cycles qu'elle avait vécus — qu'importe, quand chaque jour avait été bon à sa manière."
deDE = "Sie hatte längst aufgehört, die Zyklen zu zählen, die sie gelebt hatte - was spielte das für eine Rolle, wenn jeder Tag auf seine eigene Art schön gewesen war."
plPL = "Od dawna przestała liczyć cykle, które przeżyła — co to miało znaczenie, skoro każdy dzień był dobry na swój sposób."
ptBR = "Ela já havia parado de contar os ciclos que viveu — o que importava, se cada dia tinha sido bom à sua maneira."
koKR = "그녀는 자신이 살아온 주기를 세는 일을 오래 전에 멈췄다 — 매일이 저마다의 방식으로 좋았던 때에 무슨 의미가 있었겠는가."
csCZ = "Už dávno přestala počítat cykly, které prožila — co na tom záleželo, když byl každý den dobrý po svém."
viVN = "Cô ấy đã từ lâu không còn đếm số vòng đời mà mình đã sống — có ý nghĩa gì đâu, khi mà mỗi ngày đều tốt đẹp theo cách riêng của nó."
trTR = "Yaşadığı döngüleri saymayı çoktan bırakmıştı - her gün kendi yolunda iyi geçtiği için bunun ne önemi vardı ki."

["BeaverFamilyTree.CauseOfDeath.OldAge.F.6"]
raw = "The youngsters heard her advice about stacking logs one last time — and she quietly went to her rest."
status = "normal"
enUS = "The youngsters heard her advice about stacking logs one last time — and she quietly went to her rest."
zhCN = "小年轻们最后一次听到了她关于堆放木头的建议——然后她静静地去休息了。"
zhTW = "年輕人最後一次聽到了她關於堆疊木頭的建議 — 然後她安靜地去休息了。"
ruRU = "Молодежь в последний раз услышала ее совет о том, как укладывать бревна — и она тихо отправилась на покой."
jaJP = "若者たちは彼女のアドバイスを最後にもう一度聞いた — そして彼女は静かに安らぎに向かった。"
frFR = "Les jeunes ont entendu son conseil sur l'empilage des bûches une dernière fois - et elle est partie se reposer en toute tranquillité."
deDE = "Die Jungen hörten ihren Rat, die Stämme zum letzten Mal zu stapeln — und sie ging still zur Ruhe."
plPL = "Młode bobry usłyszały jej radę o układaniu bali ostatni raz — a ona cicho odeszła na spoczynek."
ptBR = "As crias ouviram seu conselho sobre empilhar toras uma última vez — e ela foi descansar em paz."
koKR = "젊은 비버들은 나무를 쌓는 그녀의 조언을 마지막으로 들었고 — 그리고 그녀는 조용히 평화를 찾았다."
csCZ = "Mladíci slyšeli její radu o skládání klád naposledy — a ona tiše odešla na svůj odpočinek."
viVN = "Những người trẻ đã nghe lời khuyên của bà về việc chất đống gỗ lần cuối — và bà lặng lẽ ra đi nghỉ ngơi."
trTR = "Gençler, odunları üst üste yığma konusunda onun tavsiyesini son kez duydular ve o, sessizce istirahate çekildi."

["BeaverFamilyTree.CauseOfDeath.OldAge.F.7"]
raw = "She still went out to warm herself in the sun every morning, until one morning came without her."
status = "normal"
enUS = "She still went out to warm herself in the sun every morning, until one morning came without her."
zhCN = "她每天早上依然会出去晒太阳，直到有一天早上没有她的身影。"
zhTW = "「她每天早上仍然出門在陽光下取暖，直到有一天早上她再也沒有出門。」"
ruRU = "Она по-прежнему выходила погреться на солнце каждое утро, пока одно утро не наступило без нее."
jaJP = "彼女は毎朝太陽の下で温まるために外出していましたが、ある朝、彼女は外に出てこなかったのです。"
frFR = "Elle sortait encore chaque matin pour se réchauffer au soleil, jusqu'à ce qu'un matin arrive sans elle."
deDE = "Jeden Morgen ging sie immer noch hinaus, um sich in der Sonne zu wärmen, bis eines Morgens ein Tag ohne sie kam."
plPL = "Codziennie rano wychodziła, aby ogrzać się w słońcu, aż pewnego ranka przyszło bez niej."
ptBR = "Ela ainda saía para se aquecer ao sol todas as manhãs, até que uma manhã veio sem ela."
koKR = "그녀는 여전히 매일 아침 태양 아래에서 몸을 따뜻하게 하러 나갔지만, 어느 아침 그녀 없이 오는 날이 있었다."
csCZ = "Každé ráno stále chodila na slunce, aby se ohřála, dokud jednoho rána nepřišla bez ní."
viVN = "Cô vẫn ra ngoài tắm nắng mỗi sáng, cho đến một buổi sáng không có cô."
trTR = "Her sabah güneşte ısınmak için dışarı çıkmaya devam etti, ta ki bir sabah onun olmadığı bir sabah gelene kadar."

["BeaverFamilyTree.CauseOfDeath.OldAge.F.8"]
raw = "Her fur had long since gone gray, but her eyes still shone to the very last day, looking at the dam she'd helped build."
status = "normal"
enUS = "Her fur had long since gone gray, but her eyes still shone to the very last day, looking at the dam she'd helped build."
zhCN = "她的毛发早已变灰，但她的眼睛在最后一天依然闪烁，望着她曾经帮助建造的坝。"
zhTW = "她的毛發早已變成灰色，但她的眼睛直到最後一天仍然閃耀，注視著她幫助建造的水壩。"
ruRU = "Ее мех давно поседел, но глаза все еще блестели до самого последнего дня, глядя на плотину, которую она помогла построить."
jaJP = "「彼女の毛はとっくに灰色になっていたが、彼女の目は最後の日まで輝いており、彼女が助けて築いた堰を見つめていた。」"
frFR = "Sa fourrure était devenue grise depuis longtemps, mais ses yeux brillaient encore jusqu'à son dernier jour, regardant le barrage qu'elle avait aidé à construire."
deDE = "Ihr Fell war längst grau geworden, aber ihre Augen leuchteten bis zum letzten Tag und schauten auf den Damm, den sie mitgebaut hatte."
plPL = "Jej futro od dawna stało się szare, ale jej oczy wciąż lśniły aż do ostatniego dnia, patrząc na tamę, której pomogła zbudować."
ptBR = "Seu pelo já havia ficado cinza há muito tempo, mas seus olhos ainda brilhavam até o último dia, olhando para a represa que ela ajudou a construir."
koKR = "그녀의 털은 오래전에 회색으로 변했지만, 그녀의 눈은 마지막 날까지 빛났고, 그녀가 세운 댐을 바라보았다."
csCZ = "Její srst dávno zešedla, ale její oči ještě na poslední den zářily a dívaly se na hráz, kterou pomohla postavit."
viVN = "Lông của cô đã lâu rồi chuyển sang màu xám, nhưng đôi mắt cô vẫn tỏa sáng cho đến ngày cuối cùng, nhìn về con đập mà cô đã giúp xây dựng."
trTR = "Tüyleri çoktan griye dönmüştü, ama gözleri son güne kadar parladı, inşa etmeye yardım ettiği barajı seyrederken."

["BeaverFamilyTree.CauseOfDeath.OldAge.F.9"]
raw = "She died the way she lived — sitting by her favorite dam, the very one she'd helped build cycles ago."
status = "normal"
enUS = "She died the way she lived — sitting by her favorite dam, the very one she'd helped build cycles ago."
zhCN = "“她的去世方式和她的生活一样——坐在她最喜欢的水坝旁，那是她几轮前帮助建造的。”"
zhTW = "「她死得如同她生活的一樣——坐在她最喜愛的水壩旁，那座她幾個循環前幫助建造的水壩。」"
ruRU = "Она ушла из жизни так, как и жила — сидя у своей любимой плотины, той самой, которую она помогла построить много циклов назад."
jaJP = "彼女は生きていた時と同じように亡くなった — 好きなダムのそばに座って、何サイクルも前に自分が助けて作ったそのダムの。"
frFR = "Elle est morte comme elle a vécu — assise près de son barrage préféré, celui-là même qu'elle avait aidé à construire il y a des cycles."
deDE = "Sie starb so, wie sie gelebt hatte – sitzend an ihrem Lieblingsdamm, dem genau an dem sie vor vielen Zyklen geholfen hatte, ihn zu bauen."
plPL = "Zmarła tak, jak żyła — siedząc przy swoim ulubionym tamie, tym samym, przy budowie którego pomagała wiele cykli temu."
ptBR = "Ela morreu do jeito que viveu — sentada perto de sua represa favorita, a mesma que ajudou a construir há ciclos atrás."
koKR = "그녀는 자신이 가장 좋아하는 댐 옆에 앉아 인생을 마감했다. 그 댐은 그녀가 여러 사이클 전에 함께 건설한 바로 그곳이었다."
csCZ = "Zemřela tak, jak žila — seděla u své oblíbené hráze, té, kterou pomohla postavit před cykly."
viVN = "Cô ấy đã ra đi như cách sống của mình - ngồi bên đập yêu thích, chính cái đập mà cô đã giúp xây dựng từ nhiều chu kỳ trước."
trTR = "En sevdiği barajın yanında oturarak, yıllar önce inşa etmesine yardım ettiği o barajın yanında hayatını kaybetti."

["BeaverFamilyTree.CauseOfDeath.OldAge.F.10"]
raw = "Her grandkits only noticed grandmother was sleeping too long once the sun was already high in the sky."
status = "normal"
enUS = "Her grandkits only noticed that grandmother was sleeping too long once the sun was already high in the sky."
zhCN = "她的孙辈们只在太阳已经高挂时才注意到奶奶睡得太久了。"
zhTW = "她的孫子孫女們只有在太陽高掛天際時，才注意到祖母睡得太久了。"
ruRU = "Её внуки заметили, что бабушка слишком долго спит, только когда солнце уже было высоко в небе."
jaJP = "「孫たちは、太陽が空の高い位置にあるときに、祖母が長い間寝ていることに気づいただけだった。」"
frFR = "Ses petits-enfants n'ont remarqué que grand-mère dormait trop longtemps que lorsque le soleil était déjà haut dans le ciel."
deDE = "„Ihre Enkelchen bemerkten erst, dass die Großmutter zu lange schlief, als die Sonne bereits hoch am Himmel stand.“"
plPL = "Jej wnuki zauważyły, że babcia śpi zbyt długo, dopiero gdy słońce było już wysoko na niebie."
ptBR = "Seus netos só perceberam que a avó estava dormindo por muito tempo quando o sol já estava alto no céu."
koKR = "손주들은 할머니가 하늘에 해가 높이 떠 있을 때까지 그녀가 너무 오래 자고 있다는 것을 알아차리지 못했다."
csCZ = "Její vnoučata si všimla, že babička spí příliš dlouho, až když už bylo slunce vysoko na obloze."
viVN = "Các cháu của bà chỉ nhận ra bà đã ngủ lâu quá khi mặt trời đã lên cao trên bầu trời."
trTR = "Torunları, güneş gökyüzünde yüksek olduğunda büyükannelerinin çok uzun süre uyuduğunu ancak o zaman fark ettiler."

["BeaverFamilyTree.CauseOfDeath.OldAge.F.11"]
raw = "She quietly stopped breathing somewhere between one heartbeat and the next, never waking from her midday nap."
status = "normal"
enUS = "She quietly stopped breathing somewhere between one heartbeat and the next, never waking from her midday nap."
zhCN = "她在一次心跳与下一个心跳之间静静停止了呼吸，再也没有从午睡中醒来。"
zhTW = "她靜靜地在一次心跳與下一次心跳之間停止了呼吸，從未從午睡中醒來。"
ruRU = "Она тихо перестала дышать где-то между одним ударом сердца и следующим, так и не проснувшись от своего дневного сна."
jaJP = "「彼女は静かに呼吸を止め、心拍と心拍の間のどこかで、昼寝から目覚めることはありませんでした。」"
frFR = "Elle a cessé de respirer en douceur quelque part entre un battement de cœur et le suivant, ne se réveillant jamais de sa sieste de midi."
deDE = "Sie hörte leise auf zu atmen, irgendwo zwischen einem Herzschlag und dem nächsten, und wachte nie wieder von ihrem Mittagsschlaf auf."
plPL = "Cicho przestała oddychać gdzieś pomiędzy jednym uderzeniem serca a kolejnym, nigdy nie budząc się z popołudniowej drzemki."
ptBR = "Ela parou de respirar tranquilamente entre um batimento cardíaco e o próximo, nunca acordando de sua soneca à tarde."
koKR = "그녀는 한 번의 심장 박동과 다음 심장 박동 사이 어딘가에서 조용히 숨을 멈추었고, 낮잠에서 결코 깨지 않았다."
csCZ = "Tichounce přestala dýchat někde mezi jedním tepem a dalším, nikdy se neprobudila ze své polední siesty."
viVN = "Cô ấy lặng lẽ ngừng thở ở đâu đó giữa một nhịp tim và nhịp tim tiếp theo, không bao giờ tỉnh dậy từ giấc ngủ trưa của mình."
trTR = "Bir kalp atışı ile diğerinin arasında sessizce nefes almayı bıraktı, asla öğle uykusundan uyanmadı."

["BeaverFamilyTree.CauseOfDeath.OldAge.F.12"]
raw = "Her last words were about how the new generation of beavers had completely forgotten how to stack logs properly."
status = "normal"
enUS = "Her last words were about how the new generation of beavers had completely forgotten how to stack logs properly."
zhCN = "她最后的话是关于新一代的河狸完全忘记了如何正确堆木头。"
zhTW = "「她的最後遺言是關於新一代的海狸們完全忘記了如何正確堆疊原木。」"
ruRU = "Её последние слова были о том, как новое поколение бобров совершенно забыло, как правильно укладывать бревна."
jaJP = "彼女の最期の言葉は、新しい世代のビーバーが丸太を適切に積む方法を完全に忘れてしまったことについてでした。"
frFR = "Ses derniers mots portaient sur la façon dont la nouvelle génération de castors avait complètement oublié comment empiler les bûches correctement."
deDE = "„Ihre letzten Worte handelten davon, wie die neue Generation von Bibern völlig vergessen hatte, wie man Holzstämme richtig stapelt.“"
plPL = "Jej ostatnie słowa dotyczyły tego, jak nowa generacja bobrów całkowicie zapomniała, jak prawidłowo układać kłody."
ptBR = "As últimas palavras dela foram sobre como a nova geração de castores havia esquecido completamente como empilhar troncos corretamente."
koKR = "그녀의 마지막 말은 새로운 세대의 비버들이 나무를 제대로 쌓는 것을 완전히 잊어버렸다는 것이었다."
csCZ = "Její poslední slova byla o tom, jak nová generace bobrů úplně zapomněla, jak správně skládat klády."
viVN = "Câu nói cuối cùng của cô ấy là về việc thế hệ bơm mới đã hoàn toàn quên cách xếp gỗ đúng cách."
trTR = "Son sözleri, yeni nesil bobrinlerin kütükleri düzgün bir şekilde nasıl istifleyeceklerini tamamen unuttuklarıyla ilgiliydi."

["BeaverFamilyTree.CauseOfDeath.OldAge.F.13"]
raw = "She'd outlived many others, seen more than one flood and more than one drought — and passed peacefully, in her own lodge."
status = "normal"
enUS = "She'd outlived many others, seen more than one flood and more than one drought — and passed peacefully, in her own lodge."
zhCN = "“她活过了许多其他的生命，经历了不止一次的洪水和干旱——最终在自己的窝中安详地离世。”"
zhTW = "「她活過了許多其他生物，見證了不止一次的洪水和不止一次的乾旱——並在自己的巢穴中安詳地去世。」"
ruRU = "Она пережила многих, видела не одну наводнение и не одну засуху — и ушла спокойно, в своем собственном логове."
jaJP = "彼女は多くの他者よりも長生きし、何度も洪水や干ばつを経験し — 自分のロッジで静かに息を引き取った。"
frFR = "Elle avait survécu à beaucoup d'autres, avait vu plus d'une inondation et plus d'une sécheresse — et est partie paisiblement, dans son propre terrier."
deDE = "Sie hatte viele andere überlebt, mehr als eine Flut und mehr als eine Dürre gesehen – und ist friedlich in ihrem eigenen Bau gestorben."
plPL = "Przeżyła wielu innych, widziała więcej niż jedną powódź i więcej niż jedną suszę — i odeszła spokojnie, w swojej własnej norki."
ptBR = "Ela sobreviveu a muitos outros, viu mais de uma enchente e mais de uma seca — e faleceu pacificamente, em sua própria cabana."
koKR = "그녀는 많은 이들을 초월했고, 여러 차례의 홍수와 가뭄을 겪었으며 — 그리고 자신의 오두막에서 평화롭게 세상을 떠났다."
csCZ = "Žila déle než mnozí jiní, zažila více než jednu povodeň a více než jedno sucho — a odešla v pokoji, ve své vlastní norce."
viVN = "Cô đã sống lâu hơn nhiều con khác, chứng kiến hơn một trận lũ lụt và hơn một trận hạn hán — và ra đi trong sự bình yên, tại chòi của mình."
trTR = "Birçok diğerini geride bırakmış, birden fazla sel ve birden fazla kuraklık görmüştü - ve kendi kulübesinde huzur içinde vefat etti."

["BeaverFamilyTree.CauseOfDeath.OldAge.F.14"]
raw = "Her body grew tired of carrying the weight of the years, and her heart grew tired of beating against its will."
status = "normal"
enUS = "Her body grew tired of carrying the weight of the years, and her heart grew tired of beating against its will."
zhCN = "她的身体厌倦了承载岁月的重负，她的心也厌倦了违心地跳动。"
zhTW = "「她的身體對承載歲月的重擔感到疲憊，而她的心臟對抗著自己的意志而跳動感到厭倦。」"
ruRU = "Её тело устало нести тяжесть лет, а сердце устало биться против своей воли."
jaJP = "「彼女の体は歳月の重さを背負うことに疲れ、彼女の心はその意志に逆らって打つことに疲れた。」"
frFR = "Son corps s'est fatigué de porter le poids des années, et son cœur s'est fatigué de battre contre sa volonté."
deDE = "Ihr Körper wurde müde, das Gewicht der Jahre zu tragen, und ihr Herz wurde müde, gegen seinen Willen zu schlagen."
plPL = "Jej ciało zmęczyło się noszeniem ciężaru lat, a jej serce zmęczyło się biciem wbrew swojej woli."
ptBR = "Seu corpo se cansou de carregar o peso dos anos, e seu coração se cansou de bater contra sua vontade."
koKR = "그녀의 몸은 세월의 무게를 지고 있는 것이 지치고, 그녀의 심장은 그 의지에 맞서 뛰는 것이 지쳤다."
csCZ = "Jejímu tělu došlo síly nést váhu let a její srdce se unavilo proti své vůli bít."
viVN = "Cơ thể của cô ấy đã quá mệt mỏi khi phải gánh chịu trọng lượng của những năm tháng, và trái tim của cô ấy cũng đã mệt mỏi khi phải đập chống lại ý chí của mình."
trTR = "Vücudu yılların yükünü taşımaktan yoruldu ve kalbi, iradesine karşı atmaktan yoruldu."

["BeaverFamilyTree.CauseOfDeath.OldAge.F.15"]
raw = "She lived to see her great-grandkits pick up their first logs to build a dam of their own."
status = "normal"
enUS = "She lived to see her great-grandkids pick up their first logs to build a dam of their own."
zhCN = "“她活到了看到她的曾孙们捡起第一根木头来建造自己的水坝。”"
zhTW = "「她活著看著她的曾孫輩們第一次撿起木頭來建立自己的水壩。」"
ruRU = "Она дожила до того, как ее правнуки начали подбирать свои первые бревна, чтобы построить собственную плотину."
jaJP = "「彼女は曾孫たちが初めて丸太を拾って自分たちのダムを作るのを見ることができた。」"
frFR = "Elle a vécu pour voir ses arrière-petits-enfants ramasser leurs premières bûches pour construire un barrage à eux."
deDE = "Sie erlebte, wie ihre Urenkel ihre ersten Stämme aufnahmen, um einen eigenen Damm zu bauen."
plPL = "Doczekała się, że jej prawnuki zbierały swoje pierwsze kłody, aby zbudować własną tamę."
ptBR = "Ela viveu para ver seus bisnetos pegarem seus primeiros troncos para construir uma represa própria."
koKR = "그녀는 증손자들이 자신의 댐을 짓기 위해 처음으로 단풍나무를 집는 모습을 보며 살았다."
csCZ = "Dožila se chvíle, kdy její pravnuci vzali první klády, aby si postavili vlastní hráz."
viVN = "Cô đã sống để chứng kiến các chắt của mình nhặt những khúc gỗ đầu tiên để xây dựng một con đập của riêng chúng."
trTR = "Torunlarının kendi barajlarını inşa etmek için ilk ağaç kütüklerini topladığını görmek için uzun yaşadı."

["BeaverFamilyTree.CauseOfDeath.OldAge.F.16"]
raw = "Age took its toll bit by bit: first the legs, then the teeth, and at the end, simply the will to get up in the morning."
status = "normal"
enUS = "Age took its toll bit by bit: first the legs, then the teeth, and in the end, simply the will to get up in the morning."
zhCN = "“年龄一点点地侵蚀着：先是双腿，接着是牙齿，最后只是早上起床的意志。”"
zhTW = "歲月逐漸侵蝕：首先是腿，然後是牙齒，最後，只剩下早上起床的意志。"
ruRU = "Возраст потихоньку брал свое: сначала ноги, потом зубы, а в конце просто желание вставать утром."
jaJP = "歳月が少しずつその人を蝕んでいきました。最初は脚、次に歯、そして最後には朝起きる意志さえ失ってしまいました。"
frFR = "L'âge a eu raison de lui peu à peu : d'abord les jambes, puis les dents, et à la fin, simplement la volonté de se lever le matin."
deDE = "Das Alter forderte seinen Tribut Stück für Stück: zuerst die Beine, dann die Zähne, und schließlich einfach den Willen, morgens aufzustehen."
plPL = "Wiek z dnia na dzień odbierał swoje: najpierw nogi, potem zęby, a na końcu po prostu wolę wstania rano."
ptBR = "A idade cobrou seu preço pouco a pouco: primeiro as pernas, depois os dentes, e no final, simplesmente a vontade de se levantar pela manhã."
koKR = "나이가 조금씩 영향을 미쳤습니다: 처음에는 다리, 그 다음에는 이, 마지막에는 아침에 일어날 의지조차 사라졌습니다."
csCZ = "Věk si vybral daň kousek po kousku: nejprve nohy, pak zuby a nakonec jednoduše chuť vstát ráno."
viVN = "Tuổi tác đã lấy đi từng chút một: trước là đôi chân, rồi đến những chiếc răng, và cuối cùng, chỉ đơn giản là ý chí để dậy vào buổi sáng."
trTR = "Yaş, yavaş yavaş tolladı: önce bacaklar, sonra dişler ve en sonunda, sadece sabah kalkma isteği."

["BeaverFamilyTree.CauseOfDeath.OldAge.F.17"]
raw = "Her lodgemates found her sleeping so soundly that no noise could wake her anymore."
status = "normal"
enUS = "Her lodgemates found her sleeping so soundly that no noise could wake her anymore."
zhCN = "她的同伴们发现她睡得如此沉静，以至于任何声音都无法将她唤醒。"
zhTW = "她的巢友發現她睡得如此沉沉，以至於任何噪音都無法再把她吵醒。"
ruRU = "Её сожители по логовищу нашли её спящей так крепко, что никакой шум не мог её разбудить."
jaJP = "彼女のロッジ仲間は、彼女があまりにも深く眠っていて、どんな音でも彼女を起こすことができないことに気づきました。"
frFR = "Ses compagnons de lodge l'ont trouvée si profondément endormie qu'aucun bruit ne pouvait plus la réveiller."
deDE = "Ihre Lodgenkameraden fanden sie so fest schlafend, dass kein Geräusch sie mehr wecken konnte."
plPL = "Jej towarzyszki z legowiska znalazły ją śpiącą tak spokojnie, że żaden hałas nie mógł jej już obudzić."
ptBR = "Suas companheiras de alojamento a encontraram dormindo tão profundamente que nenhum barulho podia acordá-la."
koKR = "그녀의 동료들은 그녀가 너무 깊이 잠들어 있어서 어떤 소리도 그녀를 깨울 수 없다는 것을 발견했다."
csCZ = "Její spolubydlící ji našli spící tak hluboce, že žádný hluk ji už nemohl probudit."
viVN = "Các bạn cùng ở bến của cô ấy đã tìm thấy cô ấy ngủ sâu đến nỗi không tiếng động nào có thể đánh thức được cô nữa."
trTR = "Diğer kulübe arkadaşları, onu öyle derin uyku içinde buldular ki hiçbir gürültü onu uyandıramıyordu."

["BeaverFamilyTree.CauseOfDeath.OldAge.F.18"]
raw = "She faded quietly, surrounded by the family she herself had founded on the banks of this very river."
status = "normal"
enUS = "She faded quietly, surrounded by the family she herself had founded on the banks of this very river."
zhCN = "她悄然离世， surrounded by the family she herself had founded on the banks of this very river."
zhTW = "「她靜靜地逝去，周圍是她自己在這條河岸上創建的家族。」"
ruRU = "Она тихо ушла, окруженная семьей, которую сама основала на берегах этой самой реки."
jaJP = "彼女は静かに息を引き取り、この川のほとりで自ら築いた家族に囲まれていた。"
frFR = "Elle s'est éteinte paisiblement, entourée de la famille qu'elle avait elle-même fondée sur les rives de cette même rivière."
deDE = "Sie schloss leise die Augen, umgeben von der Familie, die sie selbst am Ufer dieses Flusses gegründet hatte."
plPL = "Odeszła cicho, otoczona rodziną, którą sama założyła nad brzegiem tej rzeki."
ptBR = "Ela se apagou tranquilamente, cercada pela família que ela mesma havia fundado nas margens deste mesmo rio."
koKR = "그녀는 조용히 사라졌고, 바로 이 강가에서 자신이 세운 가족에 둘러싸여 있었습니다."
csCZ = "Tiše odešla, obklopena rodinou, kterou sama založila na březích této řeky."
viVN = "Cô ấy đã lặng lẽ ra đi, bao quanh bởi gia đình mà chính cô đã tạo dựng bên bờ con sông này."
trTR = "Bu nehrin kıyısında kurduğu aile tarafından sarılmış bir şekilde sessizce soldu."

["BeaverFamilyTree.CauseOfDeath.OldAge.F.19"]
raw = "The last thing she did in life was nudge a slightly crooked log back into place by the lodge entrance."
status = "normal"
enUS = "The last thing she did in life was nudge a slightly crooked log back into place by the lodge entrance."
zhCN = "她在生活中最后做的事情是将一个稍微歪斜的原木推回水獺栖息地入口处。"
zhTW = "她人生中最後做的事情就是把一根稍微歪斜的原木推回旅館入口的正確位置。"
ruRU = "Последнее, что она сделала в жизни, это подправила слегка кривой бревно у входа в укрытие."
jaJP = "彼女が人生で最後にしたことは、ロッジの入り口の近くでわずかに曲がった丸太を元の位置に戻すために押したことだった。"
frFR = "La dernière chose qu'elle a faite dans sa vie a été de remettre en place une bûche légèrement tordue près de l'entrée de la hutte."
deDE = "Das letzte, was sie im Leben tat, war, einen leicht schiefen Baumstamm zurück an seinen Platz am Eingang der Behausung zu schieben."
plPL = "Ostatnią rzeczą, jaką zrobiła w życiu, było przesunięcie lekko krzywej kłody z powrotem na swoje miejsce przy wejściu do chatki."
ptBR = "A última coisa que ela fez na vida foi empurrar uma tora ligeiramente torta de volta para o lugar na entrada do alojamento."
koKR = "그녀가 생애에서 마지막으로 한 일은 오두막 입구에 있는 약간 비스듬한 통나무를 제자리로 밀어 넣는 것이었다."
csCZ = "Poslední věc, kterou udělala v životě, byla, že kousek sjetého klácy posunula zpět na místo u vchodu do doupěte."
viVN = "Cái mà cô ấy làm cuối cùng trong cuộc đời là đẩy một khúc gỗ hơi cong về đúng vị trí bên lối vào của túp lều."
trTR = "Hayatındaki son şeyi, kulübe girişindeki hafif yamuk bir kütüğü yerine itmekti."

["BeaverFamilyTree.CauseOfDeath.Thirst.20"]
raw = "He chased a cloud that promised rain, but it drifted on past the hills without ever spilling a drop."
status = "normal"
enUS = "He chased a cloud that promised rain, but it drifted on past the hills without ever spilling a drop."
zhCN = "他追逐一朵承诺带来雨水的云，但它在山丘上空飘过，却没有滴落一滴。"
zhTW = "他追逐著一朵承諾帶來雨水的雲朵，但它在山丘上漂流而過，卻沒有落下一滴雨。"
ruRU = "Он гнался за облаком, которое обещало дождь, но оно проплыло мимо холмов, так и не пролив ни капли."
jaJP = "「彼は雨を約束する雲を追いかけたが、それは丘を越えて流れ去り、一滴の水もこぼすことはなかった。」"
frFR = "Il a poursuivi un nuage qui promettait de la pluie, mais il a dérivé au-delà des collines sans jamais lâcher une goutte."
deDE = "Er verfolgte eine Wolke, die Regen versprach, doch sie schwebte an den Hügeln vorbei, ohne je einen Tropfen zu verschütten."
plPL = "Ścigał chmurę, która obiecywała deszcz, ale ta przepłynęła nad wzgórzami, nie spuszczając ani kropli."
ptBR = "Ele perseguiu uma nuvem que prometia chuva, mas ela passou pelos morros sem derramar uma gota."
koKR = "비를 약속한 구름을 쫓았지만, 그것은 언덕 너머로 흘러가며 한 방울도 떨어뜨리지 않았다."
csCZ = "Pronásledoval oblak, který sliboval déšť, ale ten se jen tak potácela nad kopci, aniž byspláchl kapku."
viVN = "Anh đã đuổi theo một đám mây hứa hẹn cơn mưa, nhưng nó đã trôi qua những ngọn đồi mà không hề rơi một giọt nào."
trTR = "Yağmur vaat eden bir bulutu kovalamaya başladı, ama o, tepelerin üzerinden geçip bir damla bile dökmeden uzaklaştı."

["BeaverFamilyTree.CauseOfDeath.Thirst.21"]
raw = "At night he dreamed of a river running full — and by morning there was only cracked clay under his paws again."
status = "normal"
enUS = "At night he dreamed of a river running full — and by morning there was only cracked clay under his paws again."
zhCN = "“夜里他梦见一条奔流不息的河 — 早晨醒来时，爪子下只剩下干裂的泥土。”"
zhTW = "他在夜裡夢到一條奔流不息的河，早晨卻又只在爪子下發現龜裂的泥土。"
ruRU = "Ночью он мечтал о полном потоке реки — а к утру под его лапами снова была только трескавшаяся глина."
jaJP = "夜、彼は満ちている川の夢を見た — そして朝には再び彼の足の下にはひび割れた粘土しかなかった。"
frFR = "La nuit, il rêvait d'une rivière pleine — et au matin, il n'y avait de nouveau que de l'argile craquelée sous ses pattes."
deDE = "In der Nacht träumte er von einem vollen Fluss – und am Morgen gab es nur wieder rissigen Ton unter seinen Pfoten."
plPL = "Na noc marzył o rzece wypełnionej wodą — a rano znów pod jego łapami była tylko pęknięta glina."
ptBR = "À noite, ele sonhava com um rio correndo cheio — e pela manhã, havia apenas argila rachada sob suas patas novamente."
koKR = "그는 밤에 가득 찬 강을 꿈꾸었지만 아침이 오자 그의 발 아래에는 다시 갈라진 진흙만이 있었다."
csCZ = "Večer snil o řece plné vody – a ráno pod jeho tlapkami zůstala jen prasklá hlína."
viVN = "Đêm qua, anh ta mơ thấy một dòng sông đầy nước — và sáng hôm sau chỉ còn lại đất sét nứt nẻ dưới bàn chân của mình."
trTR = "Gece, dolup taşan bir nehir gördü rüyasında — sabah olduğunda, yine sadece çatlamış toprakların altında patileriyle karşılaştı."

["BeaverFamilyTree.CauseOfDeath.Thirst.22"]
raw = "He lapped dew off fern leaves all night long, but by dawn it still wasn't enough."
status = "normal"
enUS = "He lapped dew off fern leaves all night long, but by dawn it still wasn't enough."
zhCN = "“他整夜舔着蕨类植物的露水，但到黎明时分仍然不够。”"
zhTW = "他整晚都在蕨類植物的葉子上舔著露水，但到黎明時分仍然不夠。"
ruRU = "Он всю ночь лизал росу с листьев папоротника, но к рассвету этого все равно было недостаточно."
jaJP = "「彼は一晩中シダの葉から露を舐めていたが、夜明けにはまだ足りなかった。」"
frFR = "Il a léché la rosée sur les feuilles de fougère toute la nuit, mais à l'aube, ce n'était toujours pas suffisant."
deDE = "Er leckte die Tau von Farnblätter die ganze Nacht, aber bis zum Morgengrauen war es immer noch nicht genug."
plPL = "Liże rosę z liści paproci przez całą noc, ale o poranku wciąż było to za mało."
ptBR = "Ele lambeu o orvalho das folhas de samambaia a noite toda, mas ao amanhecer ainda não foi o suficiente."
koKR = "그는 밤새 고사리 잎에서 이슬을 핥았지만, 새벽이 되자 여전히 부족했다."
csCZ = "Celou noc pil rosu z listů kapradin, ale k rozbřesku to stále nestačilo."
viVN = "Anh ấy đã liếm sương đêm trên lá dương xỉ suốt đêm, nhưng đến sáng vẫn chưa đủ."
trTR = "Sabaha kadar eğrelti otlarının yapraklarından çiy içti, ama yine de yeterli olmadı."

["BeaverFamilyTree.CauseOfDeath.Thirst.23"]
