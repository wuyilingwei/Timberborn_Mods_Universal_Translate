["BeaverFamilyTree.CauseOfDeath.Thirst.25"]
raw = "The shimmer over the dry riverbed looked so much like a lake that he crawled toward it with his last strength — and never made it."
status = "normal"
enUS = "The shimmer over the dry riverbed looked so much like a lake that he crawled toward it with his last strength — and never made it."
zhCN = "“干涸河床上的光芒看起来如此像一个湖，他用最后的力量向它爬去——却再也没有到达。”"
zhTW = "乾涸河床上閃爍的光輝看起來就像一片湖泊，他帶著最後的力量朝它爬去——但終究未能抵達。"
ruRU = "Мерцание над сухим руслом реки выглядело так похоже на озеро, что он полз к нему из последних сил — и так и не добрался."
jaJP = "干上がった河床の上のきらめきは湖のように見えたので、彼は最後の力を振り絞ってそれに向かって這っていった──しかし、彼はそこにたどり着くことなく息絶えた。"
frFR = "L'éclat au-dessus du lit de la rivière asséchée ressemblait tellement à un lac qu'il se traîna vers elle avec ses derniers instants de force — et n'y parvint jamais."
deDE = "Der Schimmer über dem trockenen Flussbett sah so sehr nach einem See aus, dass er mit seiner letzten Kraft daraufzukrabbeln versuchte – und es nie schaffte."
plPL = "Blask nad suchym korytem rzeki wyglądał tak bardzo jak jezioro, że czołgał się w jego stronę z ostatnimi siłami — i nigdy nie dotarł."
ptBR = "O brilho sobre o leito do rio seco parecia tanto com um lago que ele rastejou em direção a ele com suas últimas forças — e nunca chegou lá."
koKR = "마른 강바닥 위의 반짝임은 호수처럼 보였기 때문에 그는 마지막 힘을 다해 그곳으로 기어갔지만 결코 도착하지 못했다."
csCZ = "Lesk nad suchým korytem řeky vypadal tak podobně jako jezero, že se k němu plazil posledními silami — a nikdy se tam nedostal."
viVN = "Ánh sáng lấp lánh trên lòng sông khô trông giống như một hồ nước đến nỗi anh đã bò về phía đó với sức lực cuối cùng — và không bao giờ đến được."
trTR = "Kuru nehir yatağının üzerindeki parıltı o kadar göle benziyordu ki, son gücüyle ona doğru sürünmeye başladı - ancak oraya asla ulaşamadı."

["BeaverFamilyTree.CauseOfDeath.Thirst.26"]
raw = "He heard water dripping somewhere inside the lodge wall and crawled toward the sound until the sound stopped."
status = "normal"
enUS = "He heard water dripping somewhere inside the lodge wall and crawled toward the sound until it stopped."
zhCN = "“他听到在小屋墙壁内部有水滴声，便爬向声音传来的方向，直到声音停止。”"
zhTW = "他聽到小屋牆壁內某處傳來水滴聲，便朝著聲音的方向爬去，直到聲音停止。"
ruRU = "Он слышал, как где-то внутри стенки хижины капает вода, и полз к звуку, пока он не исчез."
jaJP = "彼はロッジの壁のどこかで水が滴る音を聞き、その音の方へ這い寄っていったが、音が止まるまでだった。"
