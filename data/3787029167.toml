frFR = "Elle regarda le barrage une dernière fois — celui qui était censé lui apporter de l'eau, et non la contourner."
deDE = "Sie sah zum letzten Mal auf den Damm — denjenigen, der Wasser zu ihr bringen sollte, nicht an ihr vorbeifließen."
plPL = "Popatrzyła na tamę po raz ostatni — na tę, która miała dostarczać jej wodę, a nie omijać ją."
