frFR = "Elle regardait l'eau s'écouler à travers le sluice à quelques pas, mais ne pouvait pas franchir ce dernier rebord."
deDE = "Sie sah zu, wie das Wasser nur wenige Schritte entfernt durch den Schleusenauslauf floss, konnte aber die letzte Stufe nicht überwinden."
plPL = "Patrzyła, jak woda przepływa przez śluzę zaledwie kilka kroków dalej, ale nie mogła pokonać ostatniej krawędzi."
ptBR = "Ela observava a água passar pelo sluice a apenas alguns passos de distância, mas não conseguia ultrapassar aquela última borda."
koKR = "그녀는 몇 발자국 떨어진 수문을 통해 흐르는 물을 지켜보았지만 마지막 턱은 넘지 못했다."
csCZ = "Pozorovala, jak voda protéka přes výpust, která byla jen pár kroků daleko, ale nemohla překonat ten poslední práh."
viVN = "Cô ấy nhìn nước chảy qua cống chỉ cách đó vài bước, nhưng không thể vượt qua bậc thang cuối cùng."
trTR = "Birkaç adım ötedeki suyun sluisten akışını izledi ama o son çıkıntıyı geçemedi."

["BeaverFamilyTree.CauseOfDeath.Thirst.F.10"]
raw = "The hot wind drank the last of her strength before she could reach the watering hole."
status = "normal"
enUS = "The hot wind drank the last of her strength before she could reach the watering hole."
zhCN = "炎热的风在她到达饮水处之前，就耗尽了她最后的力气。"
zhTW = "「炎熱的風在她抵達水源之前，消耗了她最後的力量。」"
ruRU = "Жаркий ветер выпил последнее из её сил, прежде чем она смогла добраться до водопоя."
jaJP = "「暑い風が、彼女が水飲み場にたどり着く前に、彼女の最後の力を奪った。」"
frFR = "Le vent chaud a bu le reste de sa force avant qu'elle ne puisse atteindre le point d'eau."
deDE = "Der heiße Wind trank die letzte Kraft aus ihr, bevor sie die Wasserstelle erreichen konnte."
plPL = "Gorący wiatr wypił ostatnie z jej sił, zanim zdążyła dotrzeć do wodopoju."
ptBR = "O vento quente consumiu o restante de sua força antes que ela pudesse chegar ao bebedouro."
koKR = "뜨거운 바람이 그녀가 물웅덩이에 도달하기도 전에 그녀의 마지막 힘을 빼앗았다."
csCZ = "Horký vítr vypil poslední zbytek její síly, než se mohla dostat k napajedlu."
viVN = "Gió nóng đã hút cạn sức lực cuối cùng của cô ấy trước khi cô đến được nơi có nước."
trTR = "Sıcak rüzgar, su kaynağına ulaşmadan önce onun son gücünü içti."

["BeaverFamilyTree.CauseOfDeath.Thirst.F.11"]
raw = "The reservoir had dropped so low that the water was out of reach even of an outstretched paw."
status = "normal"
enUS = "The reservoir had dropped so low that the water was out of reach even for an outstretched paw."
zhCN = "水库的水位下降得如此之低，以至于连伸出的爪子也够不到水。"
zhTW = "水庫水位已降至如此之低，甚至伸出爪子的時候也無法觸及水面。"
ruRU = "Уровень воды в резервуаре упал настолько низко, что вода была недоступна даже для вытянутой лапы."
jaJP = "貯水池の水位は非常に低下し、伸ばした前脚でも届かないほどになっていた。"
frFR = "Le réservoir était tombé si bas que l'eau était hors de portée même d'une patte étendue."
deDE = "Der Wasserspeicher war so weit gesunken, dass das Wasser selbst für eine ausgestreckte Pfote unerreichbar war."
plPL = "Zbiornik wodny opadł tak nisko, że woda była poza zasięgiem nawet wyciągniętej łapy."
ptBR = "O reservatório havia baixado tanto que a água estava fora do alcance, mesmo de uma pata estendida."
koKR = "저수지가 너무 낮아져서 물이 뻗은 발가락에도 닿지 않았다."
csCZ = "Nádrž klesla tak nízko, že voda byla mimo dosah i natáhnuté tlapy."
viVN = "Reservoir đã hạ thấp đến mức nước không còn trong tầm với của cả một bàn chân giang ra."
trTR = "Rezervuar o kadar düşmüştü ki su, uzatılmış bir patinin bile erişemeyeceği bir seviyeye inmişti."

["BeaverFamilyTree.CauseOfDeath.Thirst.F.12"]
raw = "She gulped at the air as if it could substitute for water — and fell silent halfway to the river."
status = "normal"
enUS = "She gulped at the air as if it could substitute for water — and fell silent halfway to the river."
zhCN = "“她像是在用空气代替水一样大口喘息着——然后在去河流的路上沉默了下来。”"
zhTW = "「她如同在空氣中喝水一樣大口喘息 — 然後在去河流的路上半途而廢。」"
ruRU = "Она глотала воздух, как будто он мог заменить воду — и замерла на полпути к реке."
jaJP = "「彼女は水の代わりになるかのように空気を飲み込み、川に向かう途中で黙り込んだ。」"
frFR = "Elle a dégluti l'air comme s'il pouvait remplacer l'eau — et est tombée silencieuse à mi-chemin de la rivière."
deDE = "Sie schnappte nach Luft, als könnte sie das Wasser ersetzen – und verstummte auf halbem Weg zum Fluss."
plPL = "Łapała powietrze, jakby mogło zastąpić wodę — i zamilkła w połowie drogi do rzeki."
ptBR = "Ela engoliu o ar como se pudesse substituir a água — e ficou em silêncio no meio do caminho para o rio."
koKR = "그녀는 마치 공기가 물을 대신할 수 있는 것처럼 공기를 허겁지겁 삼켰고 — 강으로 가는 도중에 침묵에 빠졌다."
csCZ = "Polkla vzduch, jako by mohl nahradit vodu — a uprostřed cesty k řece zmlkla."
viVN = "Cô ấy nuốt không khí như thể nó có thể thay thế cho nước — và im lặng giữa chừng trên đường đến con sông."
trTR = "Hava, suyun yerini tutabiliyormuş gibi hızla nefes aldı — ve nehre gitmenin ortasında sustu."

["BeaverFamilyTree.CauseOfDeath.Thirst.F.13"]
raw = "The dam held water beautifully — just not on the side where a beaver needed a drink."
status = "normal"
enUS = "The dam held water beautifully — just not on the side where a beaver needed a drink."
zhCN = "水坝完美地蓄水——只是在那只海狸需要喝水的那一侧。"
zhTW = "大壩完美地保持著水位——只是對於需要飲水的河狸來說，這一邊卻沒有水。"
ruRU = "Плотина прекрасно удерживала воду — только не с той стороны, где бобру нужна была выпивка."
jaJP = "ダムは美しく水を堪えていた — ただ、ビーバーが飲む必要のある側ではなかった。"
frFR = "La digue retenait l'eau magnifiquement — mais pas du côté où un castor avait besoin de boire."
deDE = "Der Damm hielt das Wasser wunderbar — nur nicht auf der Seite, wo ein Biber einen Schluck brauchte."
plPL = "Tamę trzymała wodę wspaniale — tylko nie po stronie, gdzie bóbr potrzebował napoju."
ptBR = "A represa segurava água lindamente — apenas não do lado onde um castor precisava de um gole."
koKR = "댐은 물을 아름답게 막고 있었지만 — 비버가 마실 수 있는 쪽은 아니었다."
csCZ = "Stavba hráze zadržovala vodu nádherně — jen ne na straně, kde bobr potřeboval napít."
viVN = "Đập nước giữ nước thật đẹp — chỉ là không ở bên mà một con bọ cạp cần uống."
trTR = "Baraj suyu mükemmel bir şekilde tuttu - sadece bir kunduzun su içmesi gereken tarafta değil."

["BeaverFamilyTree.CauseOfDeath.Thirst.F.14"]
raw = "Thirst drove her mad enough that she started gnawing at her own tail, hoping for moisture."
status = "normal"
enUS = "Thirst drove her mad enough that she started gnawing at her own tail, hoping for moisture."
zhCN = "“口渴让她疯狂到开始啃自己的尾巴，希望能获得水分。”"
zhTW = "口渴讓她瘋狂到開始啃自己的尾巴，希望獲得水分。"
ruRU = "Жажда свела её с ума настолько, что она начала грызть свой собственный хвост, надеясь на влагу."
jaJP = "「渇きは彼女を狂わせ、自分の尾をかじり始めるほどの状態に追い込まれました。水分を求めて。」"
frFR = "La soif l'a rendue folle au point qu'elle a commencé à ronger sa propre queue, espérant y trouver de l'humidité."
deDE = "Durst machte sie verrückt genug, dass sie anfing, an ihrem eigenen Schwanz zu nagen, in der Hoffnung auf Feuchtigkeit."
plPL = "Pragnienie doprowadziło ją do szaleństwa na tyle, że zaczęła gryźć własny ogon, mając nadzieję na wilgoć."
ptBR = "A sede a deixou tão louca que ela começou a roer a própria cauda, na esperança de encontrar umidade."
koKR = "갈증이 그녀를 미치게 해서 자신의 꼬리를 갉아대기 시작했으며, 수분을 바라며 그렇게 했습니다."
csCZ = "Žízeň ji přivedla k šílenství natolik, že začala okusovat vlastní ocas, v naději, že najde vlhkost."
viVN = "Cơn khát đã khiến cô ấy phát điên đến nỗi bắt đầu gặm đuôi của chính mình, hy vọng tìm được độ ẩm."
trTR = "Susuzluk onu o kadar deli etti ki, nem umuduyla kendi kuyruğunu kemirmeye başladı."

["BeaverFamilyTree.CauseOfDeath.Thirst.F.15"]
raw = "The last thing she saw was the sky reflected in water too far away to reach."
status = "normal"
enUS = "The last thing she saw was the sky reflected in water too far away to reach."
zhCN = "“她最后看到的景象是天空倒映在远得无法触及的水面上。”"
zhTW = "她最後看到的，是天空映照在遙遠得無法觸及的水面上。"
ruRU = "Последнее, что она увидела, это небо, отраженное в воде, слишком далеко, чтобы дотянуться."
jaJP = "彼女が最後に見たのは、届かないほど遠くにある水面に映った空だった。"
frFR = "La dernière chose qu'elle a vue était le ciel reflet dans l'eau, trop loin pour y accéder."
deDE = "Das Letzte, was sie sah, war der Himmel, der sich im Wasser widerspiegelte, das zu weit entfernt war, um es zu erreichen."
plPL = "Ostatnią rzeczą, którą zobaczyła, było niebo odbite w wodzie zbyt daleko, by je osiągnąć."
ptBR = "A última coisa que ela viu foi o céu refletido em água muito distante para alcançar."
koKR = "그녀가 마지막으로 본 것은 닿을 수 없는 멀리 있는 물에 반사된 하늘이었다."
csCZ = "Poslední věc, kterou viděla, byla obloha odrážející se ve vodě, která byla příliš daleko na to, aby se k ní dostala."
viVN = "Điều cuối cùng cô nhìn thấy là bầu trời phản chiếu trong nước quá xa để đến gần."
trTR = "Gördüğü son şey, ulaşamayacak kadar uzaktaki suda yansıyan gökyüzüydü."

["BeaverFamilyTree.CauseOfDeath.Thirst.F.16"]
raw = "She lay down in the dry riverbed, where water once splashed, and never got up again."
status = "normal"
enUS = "She lay down in the dry riverbed, where water once splashed, and never got up again."
zhCN = "“她躺在干枯的河床上，曾经水花四溅的地方，再也没能站起来。”"
zhTW = "她躺在曾經濺水的乾枯河床上，再也沒有起來。"
ruRU = "Она легла на сухом русле реки, где когда-то плескалась вода, и больше не встала."
jaJP = "彼女はかつて水が跳ね返っていた乾いた河床に横たわり、二度と立ち上がることはなかった。"
frFR = "Elle s'est allongée dans le lit de la rivière asséché, là où l'eau éclaboussait autrefois, et ne s'est jamais relevée."
deDE = "Sie legte sich im trockenen Flussbett nieder, wo einst Wasser spritzte, und stand nie wieder auf."
plPL = "Położyła się w suchym korycie rzeki, gdzie kiedyś chlupotała woda, i już się nie podniosła."
ptBR = "Ela se deitou no leito seco do rio, onde a água uma vez salpicou, e nunca mais se levantou."
koKR = "그녀는 한때 물이 튀던 마른 강바닥에 누워 다시는 일어나지 못했다."
csCZ = "Sedla si do suchého koryta řeky, kde dříve cákala voda, a už se nikdy nezvedla."
viVN = "Cô nằm xuống ở lòng sông khô cạn, nơi nước từng văng tung tóe, và không bao giờ đứng dậy nữa."
trTR = "Bir zamanlar suyun şırıldadığı kuru nehir yatağına uzandı ve bir daha asla kalkmadı."

["BeaverFamilyTree.CauseOfDeath.Thirst.F.17"]
raw = "No one noticed the water tank in the lodge had sprung a leak — the beaver noticed too late."
status = "normal"
enUS = "No one noticed the water tank in the lodge had sprung a leak — the beaver noticed too late."
zhCN = "“没有人注意到小屋里的水箱漏水了 — 河狸意识到时已经为时已晚。”"
zhTW = "沒有人注意到小屋的水箱漏水了——這隻海狸察覺得太晚了。"
ruRU = "Никто не заметил, что водяной бак в хижине протек — бобер заметил это слишком поздно."
jaJP = "誰も小屋の水タンクの漏れに気づかなかった — ビーバーは遅すぎて気づいた。"
frFR = "Personne n'a remarqué que le réservoir d'eau dans le75abri avait une fuite — le castor l'a remarqué trop tard."
deDE = "Niemand bemerkte, dass der Wassertank in der Lodge ein Leck hatte – der Biber bemerkte es zu spät."
plPL = "Nikt nie zauważył, że zbiornik na wodę w bazie miał przeciek — bóbr zauważył to za późno."
ptBR = "Ninguém percebeu que o tanque de água na cabana tinha um vazamento — o castor percebeu tarde demais."
koKR = "부엌의 물탱크에 새는 곳이 있다는 것을 아무도 눈치채지 못했다 — 비버는 너무 늦게 알아챘다."
csCZ = "Nikdo si nevšiml, že vodní nádrž v boudě má díru — bobr si toho všiml příliš pozdě."
viVN = "Không ai để ý rằng bể nước trong lều đã bị rò rỉ — con cáo nhận ra thì đã quá muộn."
trTR = "Kimse aile konutundaki su tankının sızdırdığını fark etmedi — kunduz bunu çok geç fark etti."

["BeaverFamilyTree.CauseOfDeath.Thirst.F.18"]
raw = "She dragged herself toward the canal with her last strength, leaving a dry trail of crumbling earth behind her."
status = "normal"
enUS = "She dragged herself toward the canal with her last strength, leaving a dry trail of crumbling earth behind her."
zhCN = "她用最后的力气拖着自己朝运河走去，身后留下一道干燥的土壤裂痕。"
zhTW = "她用最後的力量拖著自己朝著運河走去，身後留下一條乾裂的土壤痕跡。"
ruRU = "Она тащилась к каналу из последних сил, оставляя за собой сухой след из крошившейся земли."
jaJP = "彼女は最後の力を振り絞って運河へ向かって這って行き、崩れた土の乾いた跡を残した。"
frFR = "Elle s'est traînée vers le canal avec ses dernières forces, laissant derrière elle une traînée sèche de terre friable."
deDE = "Sie schleppte sich mit ihren letzten Kräften zum Kanal und hinterließ eine trockene Spur aus bröckelndem Erdreich."
plPL = "Przeciągnęła się w stronę kanału z ostatnimi siłami, zostawiając za sobą suchy szlak kruszącej się ziemi."
ptBR = "Ela se arrastou em direção ao canal com suas últimas forças, deixando para trás um rastro seco de terra se desintegrando."
koKR = "그녀는 마지막 힘을 다해 운하 쪽으로 기어갔고, 그 뒤에는 부서진 땅의 건조한 자국이 남겨졌다."
csCZ = "Ta se se svou poslední silou táhla směrem ke kanálu, za sebou zanechávajíc suchou stopu praskající půdy."
viVN = "Cô ấy đã kéo mình về phía kênh đào bằng sức lực cuối cùng, để lại một dấu vết khô cằn của đất tan nát phía sau."
trTR = "Son gücüyle kanala doğru sürüklendi, arkasında dökülen kurumuş toprak izini bıraktı."

["BeaverFamilyTree.CauseOfDeath.Thirst.F.19"]
raw = "Salt on cracked lips was all that remained of the long hours spent waiting for rain that never came."
status = "normal"
enUS = "Salt on cracked lips was all that remained of the long hours spent waiting for rain that never came."
zhCN = "干裂的嘴唇上只剩下盐分，那是漫长等待永不降临的雨的时光所留下的痕迹。"
zhTW = "「乾裂的嘴唇上只剩下鹽分，這是漫長等待卻永遠不會降臨的雨水的痕跡。」"
ruRU = "Соль на потрескавшихся губах была единственным напоминанием о долгих часах ожидания дождя, который так и не пришел."
jaJP = "「雨が決して降らなかった長い待機時間の末に、ひび割れた唇に残されたのは塩だけだった。」"
frFR = "Le sel sur des lèvres gercées n'était que le reste des longues heures passées à attendre la pluie qui ne venait jamais."
deDE = "Salz auf rissigen Lippen war alles, was von den langen Stunden blieb, die man auf den Regen wartete, der niemals kam."
plPL = "Sól na spękanych wargach to wszystko, co pozostało z długich godzin spędzonych na czekaniu na deszcz, który nigdy nie nadszedł."
ptBR = "Sal nos lábios rachados era tudo o que restava das longas horas passadas esperando pela chuva que nunca veio."
koKR = "비가 오지 않는 긴 시간을 기다린 대가로 남은 것은 갈라진 입술 위의 소금뿐이었다."
csCZ = "Sůl na popraskaných rtech bylo vše, co zbylo po dlouhých hodinách čekání na déšť, který nikdy nepřišel."
viVN = "Một chút muối trên đôi môi nứt nẻ là tất cả những gì còn lại sau những giờ dài chờ đợi cơn mưa không bao giờ đến."
trTR = "Gelmesi asla mümkün olmayan yağmuru beklerken geçen uzun saatlerin geriye bıraktığı tek şey, çatlamış dudaklarda biriken tuzdu."

["BeaverFamilyTree.CauseOfDeath.Hunger.F.0"]
raw = "She gnawed and swallowed splinters of wood, hoping to fill her stomach with something — anything — but her strength ran out before the hunger did."
status = "normal"
enUS = "She gnawed and swallowed splinters of wood, hoping to fill her stomach with something — anything — but her strength ran out before the hunger did."
zhCN = "“她啃咬并吞下木头的碎片，希望能用某些东西——任何东西——填饱肚子，但在饥饿之前，她的力气却耗尽了。”"
zhTW = "「她啃咬並吞下木屑，希望能讓她的肚子裡有些東西——任何東西——但她的體力在飢餓之前就耗盡了。」"
ruRU = "Она грызла и глотала щепки дерева, надеясь наполнить свой живот чем-то — чем угодно — но её сил не хватило, прежде чем прошёл голод."
jaJP = "彼女は木の破片をかじり、何か — 何でも — お腹を満たそうと飲み込んだが、空腹が続く前に力が尽きてしまった。"
frFR = "Elle a rongé et avalé des éclats de bois, espérant remplir son estomac de quelque chose — n'importe quoi — mais sa force l'a abandonnée avant que la faim ne disparaisse."
deDE = "Sie nagte und schluckte Holzsplitter, in der Hoffnung, ihren Magen mit etwas — irgendetwas — zu füllen, aber ihre Kraft endete, bevor der Hunger es tat."
plPL = "Obgryzała i połykała drzazgi, mając nadzieję, że napełni żołądek czymś — cokolwiek — ale jej siły skończyły się zanim wyczerpał się głód."
ptBR = "Ela roeu e engoliu lascas de madeira, esperando encher o estômago com algo — qualquer coisa — mas sua força se esgotou antes da fome."
koKR = "그녀는 나무 조각을 갉아먹고 삼켰으며, 배를 채울 무언가 — 어떤 것이든 — 을 바라며 힘이 다해버리기 전에 배고픔이 가시길 바랐다."
csCZ = "Žvýkala a polykala třísky dřeva, doufajíc, že jí něco — cokoliv — zaplní žaludek, ale síly jí došly dřív, než hlad."
viVN = "Cô ấy gặm và nuốt những mảnh gỗ, hy vọng có thể lấp đầy dạ dày của mình bằng cái gì đó - bất cứ thứ gì - nhưng sức mạnh của cô đã cạn kiệt trước khi cơn đói qua đi."
trTR = "Odun parçalarını kemirdi ve yuttu, karnını bir şeyle - her ne olursa olsun - doldurmayı umarak, ama gücü açlıktan önce tükendi."

["BeaverFamilyTree.CauseOfDeath.Hunger.F.1"]
raw = "The pantry had been empty for three days now — and with it went the strength to stay on her feet."
status = "normal"
enUS = "The pantry had been empty for three days now — and with it went the strength to stay on her feet."
zhCN = "“储藏室已经空了三天——随着它的空虚，她站立的力气也消失了。”"
zhTW = "儲物櫃已經空了三天——隨之而去的還有她站立的力量。"
ruRU = "Хранилище было пустым уже три дня — и с ним ушла сила стоять на ногах."
jaJP = "「パントリーはもう3日間空っぽだった——そのせいで、彼女は立っている力を失ってしまった。」"
frFR = "Le garde-manger était vide depuis trois jours maintenant — et avec cela, il lui manquait la force de rester sur ses pieds."
deDE = "Der Vorratsschrank war seit drei Tagen leer — und mit ihm ging die Kraft, auf den Beinen zu bleiben."
plPL = "Spiżarnia była pusta od trzech dni — a wraz z nią odeszła siła, by stać na nogach."
ptBR = "A despensa estava vazia há três dias — e com isso se foi a força para se manter em pé."
koKR = "식료품 저장실은 지금까지 삼일 동안 비어 있었고 — 그로 인해 그녀는 서 있을 힘을 잃었다."
csCZ = "Spíž byla prázdná už tři dny — a s ní odešla i síla zůstat na nohou."
viVN = "Kho dự trữ đã trống rỗng suốt ba ngày qua — và theo đó là sức mạnh để đứng vững."
trTR = "Artık üç gündür kiler boştu - ve bununla birlikte ayakta kalma gücü de gitti."

["BeaverFamilyTree.CauseOfDeath.Hunger.F.2"]
raw = "She stripped the last bark off a log, but wood is no substitute for supper — her stomach stayed just as empty."
status = "normal"
enUS = "She stripped the last bark off a log, but wood is no substitute for supper — her stomach stayed just as empty."
zhCN = "她剥掉了一根原木上最后的树皮，但木头无法代替晚餐——她的肚子依然空空如也。"
zhTW = "她剝去了最後一段樹皮，但木頭無法替代晚餐——她的肚子依然空空如也。"
ruRU = "Она содрала последнюю кору с бревна, но древесина не заменит ужин — её желудок остался таким же пустым."
jaJP = "「彼女は丸太から最後の樹皮を剥ぎ取ったが、木は夕食の代わりにはならなかった — 彼女の腹は空っぽのままだった。」"
frFR = "Elle a enlevé l'écorce d'une dernière bûche, mais le bois ne peut pas remplacer le dîner — son ventre est resté tout aussi vide."
deDE = "Sie riss die letzte Rinde von einem Stamm, aber Holz ist kein Ersatz für das Abendessen – ihr Magen blieb genauso leer."
plPL = "Zeszła ostatnią korę z kłody, ale drewno nie jest substytutem kolacji — jej żołądek pozostał pusty."
ptBR = "Ela removeu a última casca de um tronco, mas madeira não é substituto para o jantar — seu estômago continuou tão vazio."
koKR = "그녀는 통나무에서 마지막 껍질을 벗겼지만, 나무는 저녁식사를 대신할 수 없었다 — 그녀의 배는 여전히 비어 있었다."
csCZ = "Strhla poslední kůru z klády, ale dřevo není náhradou za večeři — její žaludek zůstal stejně prázdný."
viVN = "Cô ấy đã lột vỏ cây cuối cùng khỏi một khúc gỗ, nhưng gỗ không thể thay thế cho bữa tối — bụng cô ấy vẫn trống rỗng."
trTR = "Bir kütüğün son kabuğunu soydü, ama odun akşam yemeğinin yerine geçmez — midesi aynı şekilde boş kaldı."

["BeaverFamilyTree.CauseOfDeath.Hunger.F.3"]
raw = "Her stomach cramped so badly that even sleep couldn't hide her from the hunger — and there was no one left to save her."
status = "normal"
enUS = "Her stomach cramped so badly that even sleep couldn't hide her from the hunger — and there was no one left to save her."
zhCN = "“她的胃疼得如此厉害，以至于连睡觉也无法让她摆脱饥饿——而没有人能来拯救她。”"
zhTW = "她的肚子疼得如此厲害，以至於連睡覺也無法讓她逃脫飢餓的折磨——而她已經沒有任何人可以拯救了。"
ruRU = "Её живот свело так сильно, что даже сон не мог укрыть её от голода — и не осталось никого, кто мог бы её спасти."
jaJP = "彼女のお腹はひどく痙攣し、眠りさえ彼女を空腹から隠すことができなかった — 彼女を救う者は誰もいなかった。"
frFR = "Son estomac se contractait si fortement que même le sommeil ne pouvait la cacher de la faim — et il n'y avait plus personne pour la sauver."
deDE = "Der Bauch krampfte sich so sehr, dass selbst der Schlaf sie nicht vor dem Hunger schützen konnte — und es war niemand mehr da, der sie retten konnte."
plPL = "Jej żołądek skurczył się tak bardzo, że nawet sen nie mógł jej ochronić przed głodem — a nie było już nikogo, kto mógłby jej pomóc."
ptBR = "Seu estômago doía tanto que nem mesmo o sono podia escondê-la da fome — e não havia ninguém para salvá-la."
koKR = "그녀의 배가 너무 심하게 쥐가 나서 잠조차도 그녀를 굶주림으로부터 숨길 수 없었고, 그녀를 구할 사람은 아무도 남아 있지 않았다."
csCZ = "Její žaludek se tak křečovitě stáhl, že ji ani spánek nemohl skrýt před hladem — a nikdo jí už nemohl pomoci."
viVN = "Bao tử của cô ấy co thắt dữ dội đến nỗi ngay cả giấc ngủ cũng không thể che giấu cô khỏi cơn đói — và không còn ai để cứu cô."
trTR = "Karnı o kadar kramp girdi ki, uyku bile onu açlıktan saklayamadı - ve onu kurtaracak kimse kalmadı."

["BeaverFamilyTree.CauseOfDeath.Hunger.F.4"]
raw = "She kept hauling logs to the dam right to the end, though it had been a long time since she'd held anything edible in her paws."
status = "normal"
enUS = "She kept hauling logs to the dam right to the end, though it had been a long time since she'd held anything edible in her paws."
zhCN = "“她一直把木头拖到大坝上，直到最后，尽管她已经很久没有在爪子里抓到任何可吃的东西。”"
zhTW = "「她一直在搬運木頭到水壩，直到最後，儘管自從她的爪子裡握住任何可食用的東西已經很久了。」"
ruRU = "Она продолжала таскать бревна к плотине до самого конца, хотя с тех пор, как она держала что-то съедобное в своих лапах, прошло много времени."
jaJP = "彼女は最後までダムに丸太を運び続けたが、手に食べられるものを持ってからはずいぶんと時間が経っていた。"
frFR = "Elle a continué à transporter des bûches vers le barrage jusqu'à la fin, bien que cela faisait longtemps qu'elle n'avait rien de comestible entre les pattes."
deDE = "Sie schleppte bis zum Schluss weiterhin Stämme zum Damm, obwohl es schon lange her war, dass sie etwas Essbares in ihren Pfoten gehalten hatte."
plPL = "Całe jej życie przenosiła kłody do tamy aż do samego końca, mimo że minęło dużo czasu odkąd miała w łapach coś jadalnego."
ptBR = "Ela continuou carregando troncos para a represa até o fim, embora já fizesse muito tempo desde que segurou algo comestível em suas patas."
koKR = "그녀는 먹을 것을 손에 쥔 지 오래였지만, 끝까지 댐으로 나무를 운반하는 일을 멈추지 않았다."
csCZ = "Celou dobu nosila klády k hrázi, až do posledního okamžiku, i když už uběhla dlouhá doba, co měla něco jedlého ve svých tlapkách."
viVN = "Cô ấy đã tiếp tục kéo gỗ đến đập cho đến tận những phút cuối, mặc dù đã rất lâu rồi kể từ khi cô ấy cầm bất cứ thứ gì có thể ăn được trong tay."
trTR = "Sonunda dam için odun taşımaya devam etti, ancak ellerinde yenilebilir bir şey tutmasının üzerinden uzun zaman geçmişti."

["BeaverFamilyTree.CauseOfDeath.Hunger.F.5"]
raw = "She checked every pantry in the district — and found the same hollow echo of emptiness in each one."
status = "normal"
enUS = "She checked every pantry in the district — and found the same hollow echo of emptiness in each one."
zhCN = "“她检查了区域内的每个食品储藏室——在每个储藏室里都发现了同样空洞的回声。”"
zhTW = "她檢查了區內的每個儲藏室，卻在每個地方都聽到了同樣空洞的回聲。"
ruRU = "Она проверила каждую комнату хранения в округе — и в каждой нашла тот же пустой звук пустоты."
jaJP = "「彼女は地区内のすべての食料庫を調べたが、どれも同じ空虚な音の反響を見つけた。」"
frFR = "Elle a vérifié tous les garde-manger du district - et a trouvé le même écho creux de vide dans chacun d'eux."
deDE = "Sie überprüfte jede Speisekammer im Bezirk — und fand in jeder das gleiche hohle Echo der Leere."
plPL = "Sprawdziła każdą spiżarnię w okręgu — i w każdej znalazła ten sam pusty echo pustki."
ptBR = "Ela checou cada despensa do distrito - e encontrou o mesmo eco oco de vazio em cada uma delas."
koKR = "그녀는 지구의 모든 식료품 저장고를 조사했지만, 각 저장고에서 똑같은 공허한 메아리만을 발견했다."
csCZ = "Prozkoumala každý spíž v okrese — a v každé našla stejnou prázdnou ozvěnu prázdnoty."
viVN = "Cô kiểm tra mọi kho thực phẩm trong quận — và tìm thấy cùng một âm thanh trống rỗng ở mỗi nơi."
trTR = "İlçedeki her kilerde kontrol etti - ve her birinde aynı boşluk yankısını buldu."

["BeaverFamilyTree.CauseOfDeath.Hunger.F.6"]
raw = "The harvest had failed that cycle, and she held on to hope for longer than her body could manage."
status = "normal"
enUS = "The harvest had failed that cycle, and she held on to hope for longer than her body could manage."
zhCN = "“那一轮的收成失败了，她抱着希望撑过了比身体所能承受的更久。”"
zhTW = "「那個週期的收成失敗了，她的希望維持的時間比她的身體所能忍受的還要長。」"
ruRU = "Урожай в этом цикле не удался, и она держалась за надежду дольше, чем ее тело могло это вынести."
jaJP = "そのサイクルでは収穫が失敗し、彼女は自分の体が耐えられるよりも長く希望を抱いていた。"
frFR = "La récolte avait échoué cet cycle, et elle s'accrochait à l'espoir plus longtemps que son corps ne pouvait le supporter."
deDE = "Die Ernte war in diesem Zyklus gescheitert, und sie hielt länger an der Hoffnung fest, als ihr Körper es verkraften konnte."
plPL = "Zbiory w tej turze nie powiodły się, a ona trzymała się nadziei dłużej, niż jej ciało mogło wytrzymać."
ptBR = "A colheita havia falhado naquele ciclo, e ela se agarrou à esperança por mais tempo do que seu corpo poderia suportar."
koKR = "그 주기의 수확이 실패하였고, 그녀는 자신의 몸이 감당할 수 있는 것보다 더 오랫동안 희망을 붙잡고 있었다."
csCZ = "Štědrost v tom cyklu selhala a ona se držela naděje déle, než její tělo dokázalo zvládnout."
viVN = "Mùa thu hoạch đã thất bại trong chu kỳ đó, và cô ấy đã giữ vững hy vọng lâu hơn những gì cơ thể cô có thể chịu đựng."
trTR = "Hasat o döngüde başarısız olmuştu ve o, bedeni dayanabileceğinden daha uzun süre umudu korudu."

["BeaverFamilyTree.CauseOfDeath.Hunger.F.7"]
raw = "She watched the others carrying logs and realized she no longer had the strength to carry even one."
status = "normal"
enUS = "She watched the others carrying logs and realized she no longer had the strength to carry even one."
zhCN = "她看着其他人搬运原木，意识到自己再也没有力量搬运哪怕一根了。"
zhTW = "她看著其他人搬運原木，意識到自己已經沒有力量再搬運哪怕是一根。"
ruRU = "Она наблюдала за другими, несущими бревна, и поняла, что больше не имеет сил даже нести одно."
jaJP = "彼女は他の者たちが丸太を運んでいるのを見て、自分はもはや一本すら運ぶ力がないことに気づいた。"
frFR = "Elle regardait les autres porter des bûches et réalisait qu'elle n'avait plus la force de porter même une seule."
deDE = "Sie beobachtete die anderen, die Stämme trugen, und stellte fest, dass sie nicht einmal mehr die Kraft hatte, einen einzigen zu tragen."
plPL = "Patrzyła, jak inni noszą kłody i zdała sobie sprawę, że nie ma już siły, by unieść nawet jedną."
ptBR = "Ela observou os outros carregando troncos e percebeu que não tinha mais força para carregar nem mesmo um."
koKR = "그녀는 다른 이들이 통나무를 나르는 모습을 지켜보았고, 더 이상 하나를 나를 힘조차 없다는 것을 깨달았다."
csCZ = "Dívala se na ostatní, jak nosí klády, a uvědomila si, že už nemá sílu odnést ani jednu."
viVN = "Cô nhìn những người khác khiêng gỗ và nhận ra rằng cô không còn sức để khiêng ngay cả một khúc."
trTR = "Diğerlerinin kütükleri taşıdığını izledi ve artık tek bir kütük bile taşımak için gücünün kalmadığını fark etti."

["BeaverFamilyTree.CauseOfDeath.Hunger.F.8"]
raw = "The bark on the young saplings looked like salvation, but there was too little of it, and too late."
status = "normal"
enUS = "The bark on the young saplings looked like salvation, but there was too little of it, and too late."
zhCN = "幼树上的树皮看起来像是救赎，但它太少了，来得也太晚。"
zhTW = "年輕的小樹苗上的樹皮看起來像是救贖，但實在太少了，為時已晚。"
ruRU = "Кора на молодых саженцах казалась спасением, но её было слишком мало и слишком поздно."
jaJP = "若い苗木の樹皮は救いのように見えたが、それは少なすぎて、遅すぎた。"
frFR = "L'écorce des jeunes plants ressemblait à une descente, mais il y en avait trop peu et c'était trop tard."
deDE = "Die Rinde der jungen Setzlinge sah wie eine Rettung aus, aber es war zu wenig davon und zu spät."
plPL = "Kora na młodych sadzonkach wyglądała jak zbawienie, ale było jej zbyt mało i nadeszła zbyt późno."
ptBR = "Não havia casca suficiente nos jovens brotos, que pareciam a salvação, e já era tarde demais."
koKR = "어린 묘목의 껍질은 구원의 모습 같았지만, 그 양은 너무 적었고, 너무 늦었다."
csCZ = "Kůra na mladých sazenicích vypadala jako spása, ale bylo jí příliš málo a přišlo pozdě."
viVN = "Vỏ cây trên những cây non trông như cứu cánh, nhưng quá ít và đã quá muộn."
trTR = "Genç fidanların üzerindeki kabuk kurtuluş gibi görünüyordu, ama çok azdı ve çok geçti."

["BeaverFamilyTree.CauseOfDeath.Hunger.F.9"]
raw = "Work at the sawmill never let up for a moment — food, somehow, never showed up at all."
status = "normal"
enUS = "Work at the sawmill never let up for a moment — food, somehow, never showed up at all."
zhCN = "锯木厂的工作从未停歇——食物，似乎，从来没有出现过。"
zhTW = "“在鋸木廠的工作一刻也沒有停止過 — 食物不知為何根本沒有出現。”"
ruRU = "Работа на лесопилке никогда не утихала — еда, каким-то образом, совершенно не появлялась."
jaJP = "製材所での仕事は一瞬たりとも休むことがなく — 食べ物は、どういうわけか、まったく現れなかった。"
frFR = "Le travail à la scierie n'a jamais cessé un instant — la nourriture, d'une manière ou d'une autre, ne s'est jamais manifestée."
deDE = "Die Arbeit in der Sägewerk hörte keinen Moment auf – Nahrung tauchte irgendwie überhaupt nicht auf."
plPL = "Praca w tartaku nigdy nie ustawała na moment — jedzenie, w jakiś sposób, nigdy się nie pojawiało."
ptBR = "O trabalho na serraria nunca parou por um momento — a comida, de alguma forma, nunca apareceu."
koKR = "제재소에서의 일은 한순간도 쉴 틈이 없었고, 음식은 어떻게든 전혀 나타나지 않았다."
csCZ = "Práce na pilařství nikdy na chvíli nepolevila — jídlo se nějak vůbec neobjevilo."
viVN = "Công việc tại nhà máy cưa không bao giờ ngừng lại dù chỉ một khoảnh khắc — thực phẩm, bằng cách nào đó, hoàn toàn không xuất hiện."
trTR = "Ormancıdaki iş bir an bile durmadı — yiyecek, bir şekilde, asla gelmedi."

["BeaverFamilyTree.CauseOfDeath.Hunger.F.10"]
raw = "She split her last scrap with the kits, keeping less and less for herself until there was nothing left."
status = "normal"
enUS = "She shared her last scrap with the kits, keeping less and less for herself until there was nothing left."
zhCN = "“她将最后一点食物分给幼崽，自己越来越少，直到什么都没有了。”"
zhTW = "她將最後一點餘糧分給了小崽，自己留的越來越少，直到什麼也不剩。"
ruRU = "Она разделила последний кусочек с малютками, оставляя всё меньше и меньше себе, пока не осталось ничего."
jaJP = "「彼女は最後の一切れを子たちと分け合い、自分のためにはどんどん少なくなっていき、ついには何も残らなかった。」"
frFR = "Elle a partagé son dernier morceau avec les petits, gardant de moins en moins pour elle jusqu'à ce qu'il ne reste plus rien."
deDE = "Sie teilte ihren letzten Rest mit den Kleinen und behielt immer weniger für sich selbst, bis nichts mehr übrig war."
plPL = "Podzieliła się ostatnim kawałkiem z młodymi, zostawiając dla siebie coraz mniej, aż nic nie pozostało."
ptBR = "Ela dividiu seu último pedaço com os filhotes, ficando com cada vez menos para si até não sobrar nada."
koKR = "그녀는 마지막 남은 조각을 아기 비버들과 나누었고, 자신을 위한 것은 점점 줄어들다가 결국 아무것도 남지 않게 되었다."
csCZ = "Poslední zbytek rozdělila s mláďaty, až si nechávala čím dál méně, dokud nezbylo vůbec nic."
viVN = "Cô ấy chia sẻ miếng thức ăn cuối cùng với các con nhỏ, giữ lại ngày càng ít cho bản thân cho đến khi không còn gì."
trTR = "Son parçasını yavrularla paylaştı, kendine daha az ve daha az tutarak hiçbir şey kalmayana kadar."

["BeaverFamilyTree.CauseOfDeath.Hunger.F.11"]
raw = "Hunger screamed loudest at night — and at night the storehouse was simply too far to walk."
status = "normal"
enUS = "Hunger screamed loudest at night — and at night the storehouse was simply too far to walk."
zhCN = "“饥饿在夜晚尖叫得最响——而在夜晚，仓库实在太远，无法步行。”"
zhTW = "饑餓在夜晚最為尖銳——而在夜晚，倉庫實在太遠，無法走到。"
ruRU = "Голод кричал громче всего ночью — а ночью хранилище оказалось просто слишком далеко, чтобы дойти."
jaJP = "「空腹は夜に最も大きな声を上げた — そして夜には倉庫まで歩くにはあまりにも遠すぎた。」"
