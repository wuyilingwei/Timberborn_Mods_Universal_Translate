csCZ = "JJug u dveří stál prázdný už týden a řeka byla příliš daleko pro její oslabené nohy."
viVN = "Cái bình bên cửa đã trống rỗng suốt một tuần, và con sông thì quá xa với đôi chân suy yếu của cô."
trTR = "Kapının yanındaki sürahi bir haftadır boş duruyordu ve nehir zayıflamış bacakları için çok uzaktı."

["BeaverFamilyTree.CauseOfDeath.Thirst.F.7"]
raw = "She dug her burrow deeper and deeper, hoping to strike an underground spring, and struck only dry sand."
status = "normal"
enUS = "She dug her burrow deeper and deeper, hoping to strike an underground spring, and struck only dry sand."
