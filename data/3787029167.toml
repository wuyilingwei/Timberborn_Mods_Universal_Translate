trTR = "Kırık toprağa diliyle dokundu, hayat verici nemin en az bir damlasını umarak, ama bir daha asla kavurucu topraktan kalkamadı."

["BeaverFamilyTree.CauseOfDeath.Thirst.1"]
raw = "His tongue stuck to the roof of his mouth, and the nearest canal was too far — thirst outran his legs."
status = "normal"
enUS = "His tongue stuck to the roof of his mouth, and the nearest canal was too far — thirst outran his legs."
zhCN = "“他的舌头贴在上颚上，而最近的运河太远——口渴超越了他的腿。”"
zhTW = "他的舌頭黏在上顎，最近的運河太遠——口渴超越了他的雙腿。"
ruRU = "Язык прилип к нёбу, а ближайший канал был слишком далеко — жажда обогнала его ноги."
jaJP = "「彼の舌は口の中の屋根にくっつき、最寄りの運河は遠すぎた — 喉の渇きが彼の足を超えた。」"
frFR = "Sa langue collait au plafond de sa bouche, et le canal le plus proche était trop loin — la soif devança ses jambes."
deDE = "„Seine Zunge klebte am Gaumen, und der nächste Kanal war zu weit entfernt – der Durst überholte seine Beine.“"
plPL = "Język przykleił się do podniebienia, a najbliższy kanał był za daleko — pragnienie przewyższyło jego nogi."
ptBR = "Sua língua grudou no céu da boca, e o canal mais próximo estava longe demais — a sede superou suas pernas."
koKR = "그의 혀는 입천장에 붙어 있었고, 가장 가까운 수로는 너무 멀었다 — 목마름이 그의 다리를 앞질렀다."
csCZ = "„Jeho jazyk se přilepil k patru a nejbližší kanál byl příliš daleko — žízeň předběhla jeho nohy.“"
viVN = "Lưỡi của anh ta dính vào vòm miệng, và kênh gần nhất quá xa — cơn khát vượt qua đôi chân của anh."
trTR = "Dili damaklarına yapışmıştı ve en yakın kanal çok uzaktaydı - susuzluk, bacaklarını geçti."

["BeaverFamilyTree.CauseOfDeath.Thirst.2"]
raw = "He gnawed a little hollow into the parched clay, still believing there was water down there somewhere."
status = "normal"
enUS = "He gnawed a little hollow into the parched clay, still believing there was water down there somewhere."
zhCN = "“他在干燥的泥土上啃出一个小凹槽，仍然相信下面某个地方有水。”"
zhTW = "他在乾裂的黏土上啃出了一點凹槽，仍然相信下面有水的存在。"
ruRU = "Он прогонил небольшую ямку в пересохшей глине, всё ещё веря, что где-то там внизу есть вода."
jaJP = "「彼は干からびた粘土に小さなくぼみをかじり、まだどこかに水があると信じていた。」"
frFR = "Il rongea un petit creux dans l'argile desséchée, croyant toujours qu'il y avait de l'eau quelque part en dessous."
deDE = "Er nagte eine kleine Vertiefung in den ausgedörrten Ton, in der Hoffnung, dass irgendwo da unten Wasser war."
plPL = "Obgryzł trochę zagłębienia w spragnionej glinie, wciąż wierząc, że gdzieś tam na dole jest woda."
ptBR = "Ele roeu um pequeno buraco na argila ressecada, ainda acreditando que havia água lá embaixo em algum lugar."
koKR = "그는 갈증에 시달리는 점토에 작은 움푹 패인 자리를 파고, 그곳 어딘가에 물이 있을 거라고 여전히 믿었다."
csCZ = "Udělal si malý důlek do vyprahlé hlíny, stále věřil, že tam dole někde je voda."
viVN = "Anh ta đã cắn một cái hốc nhỏ vào đất sét khô, vẫn tin rằng ở dưới đó có nước."
trTR = "Kurumuş toprağa biraz çiğnedi, hala orada bir yerde su olduğuna inanıyordu."

["BeaverFamilyTree.CauseOfDeath.Thirst.3"]
raw = "His throat burned worse than any fire — the water was right there, past the sluice, but the sluice was shut."
status = "normal"
enUS = "His throat burned worse than any fire — the water was right there, past the sluice, but the sluice was shut."
zhCN = "“他的喉咙烧得比任何火焰都要难忍——水就在那儿，闸门那边，但闸门却关着。”"
zhTW = "“他的喉嚨燒得比任何火焰都厲害——水就在那裡，在水閘的另一邊，但水閘卻關著。”"
ruRU = "Его горло горело хуже любого огня — вода была прямо здесь, за затвором, но затвор был закрыт."
jaJP = "「彼ののどはどんな火よりもひどく焼けた — 水はすぐそこにあった、排水口の向こうに、しかし排水口は閉まっていた。」"
frFR = "Sa gorge brûlait plus que n'importe quel feu — l'eau était juste là, de l'autre côté du sas, mais le sas était fermé."
deDE = "Sein Hals brannte schlimmer als jedes Feuer — das Wasser war direkt dort, hinter dem Schacht, aber der Schacht war geschlossen."
plPL = "Jego gardło paliło się gorzej niż w ogniu — woda była tuż obok, za śluzą, ale śluza była zamknięta."
ptBR = "Sua garganta ardia mais do que qualquer fogo — a água estava bem ali, além da comporta, mas a comporta estava fechada."
koKR = "그의 목은 어떤 불보다 더 타들어갔다 - 물은 바로 그곳, 수문 너머에 있었지만, 수문은 닫혀 있었다."
csCZ = "Jeho hrdlo pálilo hůř než jakýkoli oheň — voda byla hned tam, za závorou, ale závoru zavřeli."
viVN = "Anh ấy cảm thấy cổ họng đau rát hơn bất kỳ ngọn lửa nào — nước nằm ngay đó, sau cái cống, nhưng cái cống đã bị đóng."
trTR = "Boğazı, herhangi bir ateşten daha fazla yanıyordu — su hemen oradaydı, kapakların ardında, ama kapak kapalıydı."

["BeaverFamilyTree.CauseOfDeath.Thirst.4"]
raw = "He watched the distant water through clouding eyes and never managed that last stretch toward it."
status = "normal"
enUS = "He watched the distant water through clouding eyes and never managed that last stretch toward it."
zhCN = "他通过模糊的眼睛看着远处的水，始终没能走出最后那段距离。"
zhTW = "他透過朦朧的雙眼注視著遠方的水源，但始終無法走到那最後一段路。"
ruRU = "Он смотрел на дальнюю воду сквозь затуманенные глаза и так и не смог преодолеть последние метры к ней."
jaJP = "彼は曇った目で遠くの水を見つめ、そこへ向かう最後の距離を決して達成できなかった。"
frFR = "Il regardait l'eau au loin à travers des yeux embués et n'a jamais réussi le dernier pas pour l'atteindre."
deDE = "Er beobachtete das ferne Wasser mit trüben Augen und schaffte es nie, den letzten Abschnitt dorthin zu überwinden."
plPL = "Patrzył na odległą wodę przez mgłę w oczach i nigdy nie zdołał pokonać ostatnich metrów w jej kierunku."
ptBR = "Ele observou a água distante através de olhos turvos e nunca conseguiu aquele último trecho até ela."
koKR = "그는 흐릿해진 눈으로 저 멀리 있는 물을 바라보았지만 마지막 그 거리까지 다가가지 못했다."
csCZ = "Díval se na vzdálenou vodu skrze mlhavé oči a nikdy se mu nepodařilo zdolat ten poslední úsek k ní."
viVN = "Anh nhìn nước xa xăm qua đôi mắt mờ đục và không bao giờ tới được đoạn đường cuối cùng đến đó."
trTR = "Uzaklardaki suya bulanık gözlerle bakarken, ona doğru o son mesafeyi asla aşamadı."

["BeaverFamilyTree.CauseOfDeath.Thirst.5"]
raw = "He circled the whole dam looking for even a crack seeping water, but found only dry stone."
status = "normal"
enUS = "He circled the whole dam looking for even a crack seeping water, but found only dry stone."
zhCN = "“他绕着整个水坝寻找任何渗水的裂缝，但只发现干燥的石头。”"
zhTW = "他繞著整個水壩尋找任何一處漏水的裂縫，但只發現了乾燥的石頭。"
ruRU = "Он обошел всю плотину в поисках хоть трещинки, из которой вытекала бы вода, но нашел только сухой камень."
jaJP = "彼は水がしみ出す隙間を探してダム全体を回ったが、乾いた石しか見つけられなかった。"
frFR = "Il a fait le tour du barrage à la recherche d'une fissure laissant couler de l'eau, mais n'a trouvé que de la pierre sèche."
deDE = "Er umrundete den gesamten Damm auf der Suche nach einem Riss, aus dem Wasser sickerte, fand aber nur trockenen Stein."
plPL = "Obszedł całą tamę w poszukiwaniu nawet szczeliny przepuszczającej wodę, ale znalazł tylko suchy kamień."
ptBR = "Ele percorreu toda a represa em busca de até mesmo uma fissura que estivesse vazando água, mas encontrou apenas pedra seca."
koKR = "그는 물이 새는 틈이라도 찾기 위해 댐 전체를 돌았지만, 마른 돌만 발견했다."
csCZ = "Kroužil kolem celé přehrady a hledal i prasklinu, ze které by kapala voda, ale našel pouze suchý kámen."
viVN = "Anh ấy đã đến vòng quanh con đập, tìm kiếm đến cả một vết nứt nào thấm nước, nhưng chỉ tìm thấy những tảng đá khô."
trTR = "Bütün barajı dolaşarak su sızdıran en küçük çatlağı aradı, ama sadece kuru taş buldu."

["BeaverFamilyTree.CauseOfDeath.Thirst.6"]
raw = "The jug by the doorway had stood empty for a week, and the river was too far for his weakened legs."
status = "normal"
enUS = "The jug by the doorway had stood empty for a week, and the river was too far for his weakened legs."
zhCN = "“门口的水罐已经空了一个星期，而河流对于他虚弱的腿来说太远了。”"
zhTW = "門口的水壺已經空了整整一週，而河流對他虛弱的雙腿來說實在太遠了。"
ruRU = "Кувшин у двери стоял пустой на протяжении недели, а река была слишком далеко для его ослабевших ног."
jaJP = "玄関の傍にある水差しは一週間空のままで、彼の弱った足には川までの距離が遠すぎた。"
frFR = "Le pichet près de la porte était resté vide pendant une semaine, et la rivière était trop loin pour ses jambes affaiblies."
deDE = "Der Krug am Eingang war seit einer Woche leer, und der Fluss war für seine geschwächten Beine zu weit entfernt."
plPL = "Dzbanek przy drzwiach stał pusty przez tydzień, a rzeka była za daleko dla jego osłabionych nóg."
ptBR = "O jarro na porta estava vazio há uma semana, e o rio estava longe demais para suas pernas enfraquecidas."
koKR = "문 옆에 있는 항아리는 일주일 동안 비어 있었고, 그의 약해진 다리로는 강까지 가기에는 너무 멀었다."
csCZ = "Jugo u dveří stálo prázdné už týden a řeka byla příliš daleko pro jeho oslabené nohy."
viVN = "Cái bình bên cửa đã trống rỗng suốt một tuần, và con sông thì quá xa đối với đôi chân yếu ớt của anh."
trTR = "Kapının yanındaki sürahi bir haftadır boştu ve nehir zayıflamış bacakları için çok uzaktı."

["BeaverFamilyTree.CauseOfDeath.Thirst.7"]
raw = "He dug his burrow deeper and deeper, hoping to strike an underground spring, and struck only dry sand."
status = "normal"
enUS = "He dug his burrow deeper and deeper, hoping to strike an underground spring, but found only dry sand."
zhCN = "他挖得越来越深，希望能找到地下泉水，却只挖到干沙。"
zhTW = "「他挖了越來越深的洞穴，希望能找到地下泉水，卻只挖到乾燥的沙子。」"
ruRU = "Он копал свою нору все глубокже и глубже, надеясь наткнуться на подземный источник, и наткнулся лишь на сухой песок."
jaJP = "彼は地下の泉に当たることを願って、巣穴をどんどん深く掘ったが、出てきたのは乾いた砂だけだった。"
frFR = "Il a creusé son terrier de plus en plus profond, espérant toucher une source souterraine, mais n'a trouvé que du sable sec."
deDE = "Er grub seinen Bau immer tiefer, in der Hoffnung, auf eine unterirdische Quelle zu stoßen, und stieß nur auf trockenen Sand."
plPL = "Wygrzebał swoją norę coraz głębiej, mając nadzieję na znalezienie podziemnego źródła, a natrafił tylko na suchy piasek."
ptBR = "Ele cavou seu buraco cada vez mais fundo, esperando encontrar uma fonte subterrânea, mas só encontrou areia seca."
koKR = "그는地下泉을 찾기를 바라는 마음으로 자신의굴을 더 깊이 파고들었지만, 마른 모래만을 만났습니다."
csCZ = "Ryl svůj noru hlouběji a hlouběji, v naději, že narazí na podzemní pramen, a narazil jen na suchý písek."
viVN = "Ông đã đào hố của mình sâu hơn nữa, hy vọng sẽ tìm thấy nguồn nước ngầm, nhưng chỉ gặp cát khô."
trTR = "Yuvasını daha derin kazdı, yer altı kaynağına ulaşmayı umarak, sadece kuru kumla karşılaştı."

["BeaverFamilyTree.CauseOfDeath.Thirst.8"]
raw = "Even dew on the leaves looked like salvation — but the morning came cloudless, and no dew fell."
status = "normal"
enUS = "Even dew on the leaves looked like salvation — but the morning came cloudless, and no dew fell."
zhCN = "“即使是叶子上的露水看起来也像救赎——但早晨来了，万里无云，没有露水落下。”"
zhTW = "即使葉子上的露水看起來像是救贖——但清晨無雲，露水卻沒有降臨。"
ruRU = "Даже роса на листьях выглядела как спасение — но утро настало ясное, и роса не выпала."
jaJP = "「葉の上の露さえ救いのように見えたが、朝は雲一つない晴天で、露は降りなかった。」"
frFR = "Même la rosée sur les feuilles semblait être une salvation — mais le matin est arrivé sans nuages, et aucune rosée n'est tombée."
deDE = "„Selbst der Tau auf den Blättern schien wie Rettung – aber der Morgen kam wolkenlos, und kein Tau fiel.“"
plPL = "Nawet rosa na liściach wyglądała jak zbawienie — ale ranek nastał bezchmurny i żadna rosa nie spadła."
ptBR = "Até o orvalho nas folhas parecia salvação — mas a manhã chegou clara, e nenhum orvalho caiu."
koKR = "잎사귀 위의 이슬조차 구원의 모습처럼 보였다 - 그러나 아침이 맑게 개였고 이슬은 떨어지지 않았다."
csCZ = "Dokonce i rosa na listech vypadala jako záchrana — ale ráno přišlo bez mráčku a žádná rosa nespadla."
viVN = "Ngay cả sương đọng trên lá cũng trông như sự cứu rỗi — nhưng buổi sáng đến với bầu trời không một gợn mây, và không có sương rơi xuống."
trTR = "Yapraklardaki çiy bile kurtuluş gibi görünüyordu — ama sabah bulutsuz geldi ve hiçbir çiy düşmedi."

["BeaverFamilyTree.CauseOfDeath.Thirst.9"]
raw = "He watched the water flow through the sluice just a few steps away, but couldn't clear that last ledge."
status = "normal"
enUS = "He watched the water flow through the sluice just a few steps away, but couldn't clear that last ledge."
zhCN = "“他看着水流过几步远的闸口，却无法清除最后那道檐口。”"
zhTW = "他看著水流過幾步之外的水閘，但無法跨過最後那個邊緣。"
ruRU = "Он наблюдал, как вода течет через шлюз всего в нескольких шагах, но не мог перепрыгнуть этот последний уступ."
jaJP = "彼は数歩先の水門を通る水を見ていましたが、最後の ledge を越えることができませんでした。"
frFR = "Il regardait l'eau couler à travers le déversoir à quelques pas, mais il ne pouvait pas franchir ce dernier rebord."
deDE = "Er sah zu, wie das Wasser nur wenige Schritte entfernt durch die Schleuse floss, konnte aber die letzte Kante nicht überwinden."
plPL = "Patrzył, jak woda przepływa przez zasuwę zaledwie kilka kroków dalej, ale nie mógł przeskoczyć tej ostatniej krawędzi."
ptBR = "Ele assistiu a água fluir pela comporta a apenas alguns passos de distância, mas não conseguia superar aquele último desnível."
koKR = "몇 걸음 앞에서 수로를 통해 흐르는 물을 지켜봤지만, 마지막 경사면을 넘지 못했다."
csCZ = "Sledoval, jak voda protéká přes stavidlo jen pár kroků daleko, ale nedokázal překonat ten poslední výškový rozdíl."
viVN = "Anh nhìn dòng nước chảy qua cống chỉ cách đó vài bước, nhưng không thể vượt qua bậc thềm cuối cùng."
trTR = "Birkaç adım ötedeki kapak aracılığıyla suyun akışını izliyordu ama son yükseltmeyi aşamadı."

["BeaverFamilyTree.CauseOfDeath.Thirst.10"]
raw = "The hot wind drank the last of his strength before he could reach the watering hole."
status = "normal"
enUS = "The hot wind drank the last of his strength before he could reach the watering hole."
zhCN = "炎热的风在他到达水源之前夺走了他最后的力量。"
zhTW = "炎熱的風在他抵達水源之前吞盡了他的最後一絲力量。"
ruRU = "Жаркий ветер исчерпал последние силы, прежде чем он смог добраться до водопоя."
jaJP = "「熱風が彼が水場に到達する前に、彼の最後の力を奪った。」"
frFR = "Le vent chaud a bu le reste de sa force avant qu'il ne puisse atteindre le point d'eau."
deDE = "Der heiße Wind trank das Letzte seiner Kraft, bevor er die Wasserstelle erreichen konnte."
plPL = "Gorący wiatr wypił ostatnie z jego sił, zanim zdążył dotrzeć do poidła."
ptBR = "Vento quente bebeu o último de suas forças antes que ele pudesse chegar ao lago de água."
koKR = "뜨거운 바람이 그가 물 웅덩이에 도달하기 전에 그의 마지막 힘을 앗아갔다."
csCZ = "Horký vítr vypil poslední z jeho sil, než se mu podařilo dosáhnout napajedla."
viVN = "Gió nóng đã rút cạn sức lực cuối cùng của anh ấy trước khi anh ấy có thể đến được hồ nước."
trTR = "Sıcak rüzgar, sulama noktasına ulaşmadan önce son gücünü içti."

["BeaverFamilyTree.CauseOfDeath.Thirst.11"]
raw = "The reservoir had dropped so low that the water was out of reach even of an outstretched paw."
status = "normal"
enUS = "The reservoir had dropped so low that the water was out of reach even for an outstretched paw."
zhCN = "水库的水位下降到如此低，以至于即使是伸出的爪子也无法触及。"
zhTW = "水庫的水位已經降低到，即使是伸長的爪子也無法觸及水面。"
ruRU = "Уровень воды в резервуаре упал так низко, что до нее не дотянуться даже вытянутой лапой."
jaJP = "「貯水槽の水位は非常に低下しており、伸ばした前足でも水に届かない状態だった。」"
frFR = "Le réservoir était descendu si bas que l'eau était hors de portée même d'une patte tendue."
deDE = "Der Wasserstand im Reservoir war so niedrig gefallen, dass das Wasser selbst für eine ausgestreckte Pfote unerreichbar war."
plPL = "Woda w zbiorniku opadła tak nisko, że była poza zasięgiem nawet wyciągniętej łapy."
ptBR = "O reservatório havia baixado tanto que a água estava fora de alcance, mesmo para uma pata esticada."
koKR = "저수지가 너무 낮아져서 물이 뻗은 발에도 닿지 않았다."
csCZ = "Nádrž klesla tak nízko, že voda byla mimo dosah i pro natáhnutou tlapu."
viVN = "Reservoir đã hạ xuống quá thấp đến nỗi nước không thể với tới ngay cả khi có một cái vươn móng."
trTR = "Rezervuar o kadar düşmüştü ki, su bir uzatılmış pati bile erişemeyecek kadar uzaktaydı."

["BeaverFamilyTree.CauseOfDeath.Thirst.12"]
raw = "He gulped at the air as if it could substitute for water — and fell silent halfway to the river."
status = "normal"
enUS = "He gulped at the air as if it could substitute for water — and fell silent halfway to the river."
zhCN = "“他大口喘息，好像空气能替代水分——然后在去河流的路上半途而废。”"
zhTW = "他像是在空中吞咽著，彷彿那可以替代水——然後在通往河流的途中就沉默了。"
ruRU = "Он глотал воздух, как будто тот мог заменить воду, — и замер на полпути к реке."
jaJP = "彼は水の代わりになるかのように空気を飲み込み、川に向かう途中で静かになった。"
frFR = "Il a dégluti l'air comme s'il pouvait remplacer l'eau - et est tombé silencieux à mi-chemin de la rivière."
deDE = "Er schnappte nach Luft, als könnte es Wasser ersetzen — und verstummte auf halbem Weg zum Fluss."
plPL = "Łapczywie łapał powietrze, jakby mogło zastąpić wodę — i zamilkł w połowie drogi do rzeki."
ptBR = "Ele tragou o ar como se pudesse substituir a água — e ficou em silêncio a meio caminho do rio."
koKR = "그는 물을 대신할 수 있는 듯 공기를 삼켰고 — 강으로 가는 도중에 침묵에 빠졌다."
csCZ = "Sekl do vzduchu, jako by mohl nahradit vodu — a v půlce cesty k řece zmlkl."
viVN = "Anh ta nuốt không khí như thể nó có thể thay thế nước — và im lặng giữa đường đến dòng sông."
trTR = "Hava, suyun yerini tutabilirmiş gibi boğazında yutkunarak suya doğru ilerledi — ve nehirin yarısına geldiğinde sustu."

["BeaverFamilyTree.CauseOfDeath.Thirst.13"]
raw = "The dam held water beautifully — just not on the side where a beaver needed a drink."
status = "normal"
enUS = "The dam held water beautifully — just not on the side where a beaver needed a drink."
zhCN = "“大坝水位漂亮地保持着——只是对于需要喝水的海狸来说，水在错误的一侧。”"
zhTW = "大壩儲存水源非常完美——只是對於一隻需要喝水的海狸來說，並不在那一側。"
ruRU = "Плотина прекрасно удерживала воду — просто не с той стороны, где бобру нужна была питье."
jaJP = "ダムは水を美しく保持していたが、ビーバーが飲み水を必要とする側ではなかった。"
frFR = "Le barrage retenait l'eau magnifiquement — juste pas du côté où un castor avait besoin de boire."
deDE = "„Der Damm hielt das Wasser wunderbar — nur nicht auf der Seite, wo ein Biber einen Schluck brauchte.“"
plPL = "Tama trzymała wodę pięknie — tylko nie po stronie, gdzie bóbr potrzebował picia."
ptBR = "A represa segurava a água de forma bonita — apenas não do lado onde um castor precisava beber."
koKR = "댐은 물을 아름답게 지탱하고 있었지만 — 비버가 마실 물이 필요한 쪽은 아니었다."
csCZ = "Přehrada držela vodu nádherně — jen ne na straně, kde bobr potřeboval napít."
viVN = "Con đập giữ nước đẹp mắt — chỉ là không ở phía mà một con bồ nông cần nước uống."
trTR = "Baraj suyu mükemmel bir şekilde tuttu — sadece bir bobraya içecek lazım olan tarafta değil."

["BeaverFamilyTree.CauseOfDeath.Thirst.14"]
raw = "Thirst drove him mad enough that he started gnawing at his own tail, hoping for moisture."
status = "normal"
enUS = "Thirst drove him mad enough that he started gnawing at his own tail, hoping for moisture."
zhCN = "口渴让他变得疯狂，甚至开始啃自己的尾巴，期望能得到些水分。"
zhTW = "口渴讓他變得瘋狂，以至於開始啃自己的尾巴，希望能獲得水分。"
ruRU = "Жажда свела его с ума настолько, что он начал грызть собственный хвост, надежда на влагу."
jaJP = "「渇きは彼を狂わせ、自らの尾をかじり始め、水分を求めた。」"
frFR = "La soif le rendit assez fou pour qu'il se mit à ronger sa propre queue, espérant trouver de l'humidité."
deDE = "Der Durst trieb ihn so sehr in den Wahnsinn, dass er anfing, an seinem eigenen Schwanz zu knabbern, in der Hoffnung auf Feuchtigkeit."
plPL = "Pragnienie doprowadziło go do szaleństwa na tyle, że zaczął gryźć własny ogon, licząc na wilgoć."
ptBR = "A sede o deixou tão louco que ele começou a roer sua própria cauda, esperando por umidade."
koKR = "갈증은 그를 미치게 만들어 자신의 꼬리를 갉기 시작했고, 수분을 바라게 되었다."
csCZ = "Žízeň ho přivedla k šílenství natolik, že začal kousat do svého vlastního ocasu, doufaje v vlhkost."
viVN = "Cơn khát đã khiến hắn điên cuồng đến mức bắt đầu gặm đuôi của chính mình, hy vọng có chút ẩm ướt."
trTR = "Susuzluk onu o kadar deli etti ki, nem umuduyla kendi kuyruğunu kemirmeye başladı."

["BeaverFamilyTree.CauseOfDeath.Thirst.15"]
raw = "The last thing he saw was the sky reflected in water too far away to reach."
status = "normal"
enUS = "The last thing he saw was the sky reflected in water too far away to reach."
zhCN = "“他最后看到的是天空映在远得无法触及的水面上。”"
zhTW = "他最後看到的是反射在水面上的天空，卻遙不可及。"
ruRU = "Последнее, что он увидел, было небо, отражающееся в воде, слишком далеко, чтобы достать."
jaJP = "「彼が見た最後のものは、手の届かない遠くの水に映る空だった。」"
frFR = "La dernière chose qu'il a vue était le ciel reflété dans une eau trop éloignée pour y accéder."
deDE = "Das Letzte, was er sah, war der Himmel, der sich im Wasser spiegelte, das zu weit entfernt war, um es zu erreichen."
plPL = "Najlepszą rzeczą, jaką zobaczył, było niebo odbite w wodzie zbyt daleko, aby do niego dotrzeć."
ptBR = "A última coisa que ele viu foi o céu refletido em uma água muito distante para alcançar."
koKR = "그가 마지막으로 본 것은 그가 닿을 수 없는 너무 멀리 있는 물속에 반사된 하늘이었다."
csCZ = "Poslední věc, kterou viděl, byla obloha odrážející se ve vodě příliš daleko na to, aby se k ní dostal."
viVN = "Điều cuối cùng anh thấy là bầu trời phản chiếu trong nước quá xa để với tới."
trTR = "Son gördüğü şey, ulaşamayacak kadar uzaktaki suya yansıyan gökyüzüydü."

["BeaverFamilyTree.CauseOfDeath.Thirst.16"]
raw = "He lay down in the dry riverbed, where water once splashed, and never got up again."
status = "normal"
enUS = "He lay down in the dry riverbed, where water once splashed, and never got up again."
zhCN = "他躺在干涸的河床上，曾经水花四溅的地方，再也没有站起来。"
zhTW = "他躺在曾經有水濺起的乾涸河床上，再也沒有起來。"
ruRU = "Он лег в сухом русле реки, где когда-то плескалась вода, и больше никогда не встал."
jaJP = "「彼はかつて水が跳ねていた干上がった河床に横たわり、二度と起き上がることはなかった。」"
frFR = "Il s'est couché dans le lit de la rivière asséché, où l'eau éclaboussait autrefois, et ne s'est jamais relevé."
deDE = "Er legte sich in das trockene Flussbett, wo einst Wasser plätscherte, und stand nie wieder auf."
plPL = "Położył się w wyschniętym korycie rzeki, tam gdzie kiedyś pluskała woda, i już się nie podniósł."
ptBR = "Ele se deitou no leito do rio seco, onde a água um dia respingou, e nunca mais se levantou."
koKR = "그는 한때 물이 튀었던 마른 강바닥에 누워 다시는 일어나지 않았다."
csCZ = "Ležel v suchém řečišti, kde se kdysi šplouchala voda, a už se nikdy nepostavil."
viVN = "Anh nằm xuống lòng sông khô cằn, nơi nước từng tung tóe, và không bao giờ đứng dậy nữa."
trTR = "Kuru nehir yatağına yattı, bir zamanlar suyun fışkırdığı yere, ve bir daha asla kalkmadı."

["BeaverFamilyTree.CauseOfDeath.Thirst.17"]
raw = "No one noticed the water tank in the lodge had sprung a leak — the beaver noticed too late."
status = "normal"
enUS = "No one noticed the water tank in the lodge had sprung a leak — the beaver noticed too late."
zhCN = "“没有人注意到小屋里的水箱漏水了——海狸注意到时已经太晚了。”"
zhTW = "「沒有人注意到小屋的水箱漏水了──河狸發現這一點時已經太晚了。」"
ruRU = "Никто не заметил, что водяной бак в хранилище протек — бобер заметил это слишком поздно."
jaJP = "ロッジの水タンクに漏れがあることに誰も気づかなかった — ビーバーは気づくのが遅すぎた。"
frFR = "Personne n'a remarqué que le réservoir d'eau dans le pavillon avait une fuite - le castor l'a remarqué trop tard."
deDE = "„Niemand bemerkte, dass der Wassertank in der Lodge ein Leck hatte – der Biber bemerkte es zu spät.“"
plPL = "Nikt nie zauważył, że zbiornik wodny w budynku miał przeciek — bobr zauważył to za późno."
ptBR = "Ninguém percebeu que o tanque de água na cabana tinha vazado — o castor notou tarde demais."
koKR = "사회가 물탱크에 물이 새는 것을 아무도 눈치채지 못했다 — 비버는 너무 늦게 깨달았다."
csCZ = "Nikdo si nevšiml, že vodní nádrž v norě měla díru — bobr si toho všiml moc pozdě."
viVN = "Không ai để ý rằng bể nước trong túp lều bị rò rỉ — con hải ly nhận ra quá muộn."
trTR = "Kulübede su tankının sızdırdığını kimse fark etmedi - kunduz çok geç fark etti."

["BeaverFamilyTree.CauseOfDeath.Thirst.18"]
raw = "He dragged himself toward the canal with his last strength, leaving a dry trail of crumbling earth behind him."
status = "normal"
enUS = "He dragged himself toward the canal with his last strength, leaving a dry trail of crumbling earth behind him."
zhCN = "他用最后的力气向 канал 拖去，身后留下了一道干燥的土壤痕迹。"
zhTW = "「他用最後的力氣拖著自己朝運河爬去，留下了一條乾燥的土壤碎片痕跡。」"
ruRU = "Он вполз к каналу последними силами, оставляя за собой сухой след из крошившейся земли."
jaJP = "彼は最後の力を振り絞り、干からびた土の崩れた跡を残しながら運河へと引きずっていった。"
frFR = "Il s'esttraîné vers le canal avec ses dernières forces, laissant derrière lui une traînée sèche de terre qui s'effrite."
deDE = "Er schleppte sich mit seiner letzten Kraft zum Kanal und hinterließ eine trockene Spur aus bröckelndem Erde."
plPL = "Przeciągnął się w kierunku kanału swoimi ostatnimi siłami, zostawiając za sobą suchy ślad kruszącej się ziemi."
ptBR = "Ele se arrastou em direção ao canal com suas últimas forças, deixando uma trilha seca de terra desmoronando atrás de si."
koKR = "그는 마지막 힘을 다해 수로를 향해 끌려갔고, 그 뒤에는 부서진 땅의 마른 자국이 남았다."
csCZ = "Tahal se k kanálu s posledními silami, za sebou zanechávaje suchou stopu sypající se půdy."
viVN = "Anh ấy đã kéo mình về phía kênh với sức lực cuối cùng, để lại một dấu vết khô cằn của đất bị vỡ nát phía sau."
trTR = "Son gücüyle kanala doğru sürüklendi, arkasında kırılan toprakla kuru bir iz bıraktı."

["BeaverFamilyTree.CauseOfDeath.Thirst.19"]
raw = "Salt on cracked lips was all that remained of the long hours spent waiting for rain that never came."
status = "normal"
enUS = "Salt on cracked lips was all that remained of the long hours spent waiting for rain that never came."
zhCN = "“干裂的嘴唇上只剩下盐，漫长的等待降雨却从未到来。”"
zhTW = "「乾裂的嘴唇上只剩下鹽，這是漫長等待著永不降臨的雨水的痕跡。」"
ruRU = "Соль на треснувших губах была всем, что осталось от долгих часов ожидания дождя, который так и не пришёл."
jaJP = "「乾かした唇に塩が残っているだけで、決して訪れなかった雨を待つ長い時間が過ぎ去った。」"
frFR = "Le sel sur des lèvres gercées n'était que le souvenir des longues heures passées à attendre la pluie qui ne vint jamais."
deDE = "Salz auf rissigen Lippen war alles, was von den langen Stunden blieb, die im Warten auf den Regen verbracht wurden, der niemals kam."
plPL = "Sól na popękanych wargach była wszystkim, co pozostało z długich godzin spędzonych na czekaniu na deszcz, który nigdy nie nadszedł."
ptBR = "O sal nos lábios rachados era tudo o que restava das longas horas passadas esperando pela chuva que nunca veio."
koKR = "비는 오지 않았고, 기다린 긴 시간의 흔적은 갈라진 입술 위의 소금뿐이었다."
csCZ = "Sůl na popraskaných rtech bylo vše, co zbylo po dlouhých hodinách čekání na déšť, který nikdy nepřišel."
viVN = "Muối trên đôi môi nứt nẻ là tất cả những gì còn lại sau những giờ dài chờ đợi cơn mưa không bao giờ đến."
trTR = "Gelmesi asla beklenmeyen yağmuru bekleyerek geçirilen uzun saatlerin geride bıraktığı tek şey çatlamış dudaklarda kalan tuzdu."

["BeaverFamilyTree.CauseOfDeath.Hunger.0"]
raw = "He gnawed and swallowed splinters of wood, hoping to fill his stomach with something — anything — but his strength ran out before the hunger did."
status = "normal"
enUS = "He gnawed and swallowed splinters of wood, hoping to fill his stomach with something — anything — but his strength ran out before the hunger did."
zhCN = "他啃咬并吞下木屑，希望能用某种东西——任何东西——填满他的肚子，但在饥饿之前，他的力量已经耗尽。"
zhTW = "「他啃食並吞下木屑，希望能用某樣東西──任何東西──填滿他的胃，但他的力氣在飢餓之前就消耗殆盡。」"
ruRU = "Он грыз и глотал щепки дерева, надеясь наполнить свой желудок чем-то — чем угодно — но его силы иссякли, прежде чем закончился голод."
jaJP = "彼は木の切れ端をかじり、飲み込みながら、何かでお腹を満たそうとしたが、空腹が続く前に力尽きてしまった。"
frFR = "Il rongeait et avalait des éclats de bois, espérant remplir son ventre avec quelque chose — n'importe quoi — mais sa force a fini par s'épuiser avant que la faim ne disparaisse."
deDE = "Er nagte und schluckte Holzsplitter, in der Hoffnung, seinen Magen mit etwas — irgendetwas — zu füllen, aber seine Kräfte ließen nach, bevor der Hunger nachließ."
plPL = "Obgryzł i połknął drzazgi drewna, mając nadzieję napełnić swój żołądek czymś — cokolwiek — ale jego siły wyczerpały się, zanim głód ustał."
ptBR = "Ele roeu e engoliu lascas de madeira, esperando preencher seu estômago com algo — qualquer coisa — mas sua força se esgotou antes da fome."
koKR = "그는 배고픔이 끝나기 전에 힘이 다할 때까지 무엇이든 뱃속에 채우길 바라며 나무 조각을 갉아먹고 삼켰다."
csCZ = "Kousal a polykal třísky dřeva, doufajíc, že si naplní břicho něčím — čímkoli — ale síly mu došly dříve, než hlad."
viVN = "Cậu ta gặm nham nhở và nuốt những mảnh gỗ, hy vọng sẽ lấp đầy bụng mình bằng một cái gì đó — bất cứ cái gì — nhưng sức lực của cậu đã cạn kiệt trước khi cơn đói biến mất."
trTR = "Ağaç parçalarını kemirip yuttu, karnını bir şey — her hangi bir şey — ile doldurmayı umarak, ama açlığı bitmeden gücü tükendi."

["BeaverFamilyTree.CauseOfDeath.Hunger.1"]
raw = "The pantry had been empty for three days now — and with it went the strength to stay on his feet."
status = "normal"
enUS = "The pantry had been empty for three days now — and with it went the strength to stay on his feet."
zhCN = "“储藏室已经空了三天——随之而去的还有保持站立的力量。”"
zhTW = "儲藏室已經空了三天——而隨之而去的是支撐他站立的力量。"
ruRU = "Кладовая была пуста уже три дня — и с ней пропала сила стоять на ногах."
jaJP = "「パントリーはもう三日間空っぽだった — そしてそれと共に立ち続ける力も失われた。」"
frFR = "La garde-manger était vide depuis trois jours maintenant — et avec cela s'en allait la force de rester sur ses pieds."
deDE = "Die Speisekammer war seit drei Tagen leer — und damit verschwand auch die Kraft, auf den Beinen zu bleiben."
plPL = "Piwnica była pusta od trzech dni — wraz z nią zniknęła siła, by stać na nogach."
ptBR = "A despensa estava vazia há três dias — e com isso, foi embora a força para permanecer de pé."
koKR = "식료품 저장소는 이제 3일째 비어 있었고 — 그로 인해 그는 서 있을 힘도 잃었다."
csCZ = "Špajz byl prázdný už tři dny — a s ním i síla, aby zůstal na nohou."
viVN = "Kho dự trữ đã trống rỗng suốt ba ngày nay - và cùng với nó, sức mạnh để đứng vững cũng đã biến mất."
trTR = "Depo üç gündür boştu — ve bununla birlikte ayakta kalma gücü de gitti."

["BeaverFamilyTree.CauseOfDeath.Hunger.2"]
raw = "He stripped the last bark off a log, but wood is no substitute for supper — his stomach stayed just as empty."
status = "normal"
enUS = "He stripped the last bark off a log, but wood is no substitute for supper — his stomach stayed just as empty."
zhCN = "“他剥掉了最后一根树干的树皮，但木头无法替代晚餐——他的肚子仍然空空如也。”"
zhTW = "「他剝下最後一片樹皮，但木頭無法取代晚餐——他的肚子仍然是空的。」"
ruRU = "Он снял последнюю кору с бревна, но древесина не заменит ужин — его живот остался таким же пустым."
jaJP = "彼は丸太から最後の樹皮を剥ぎ取ったが、木は夕食の代わりにはならなかった — 彼のお腹は依然として空のままだった。"
frFR = "Il a arraché l'écorce du dernier tronc, mais le bois ne peut remplacer le souper - son estomac est resté tout aussi vide."
deDE = "Er schälte die letzte Rinde von einem Stamm, aber Holz kann kein Abendessen ersetzen – sein Magen blieb genauso leer."
plPL = "Zerwał ostatnią korę z kłody, ale drewno nie jest substytutem kolacji — jego brzuch pozostał tak samo pusty."
ptBR = "Ele arrancou a última casca de um tronco, mas madeira não substitui o jantar — seu estômago continuou vazio."
koKR = "그는 통나무에서 마지막 껍질을 벗겼지만, 나무는 저녁식사를 대신할 수 없었다 — 그의 배는 여전히 비어 있었다."
csCZ = "Strhl poslední kůru z klády, ale dřevo není náhražkou za večeři — jeho žaludek zůstal stejně prázdný."
viVN = "Anh ấy đã bóc lớp vỏ cuối cùng từ một khúc gỗ, nhưng gỗ không thể thay thế cho bữa tối — cái bụng của anh vẫn trống rỗng."
trTR = "Bir kütüğün son kabuğunu soydum ama odun akşam yemeğinin yerini tutmaz — karnı yine de boş kaldı."

["BeaverFamilyTree.CauseOfDeath.Hunger.3"]
raw = "His stomach cramped so badly that even sleep couldn't hide him from the hunger — and there was no one left to save him."
status = "normal"
enUS = "His stomach cramped so badly that even sleep couldn't hide him from the hunger — and there was no one left to save him."
zhCN = "“他的胃痛得厉害，连睡觉也无法让他逃避饥饿——而且已经没有人可以拯救他。”"
zhTW = "他的肚子痙攣得如此厲害，即使在睡夢中也無法擺脫飢餓——而且再也沒有人能拯救他了。"
ruRU = "Его живот сводило так сильно, что даже сон не мог спасти его от голода — и спасать было некому."
jaJP = "「彼の腹はひどく痙攣し、眠りに落ちてもその飢えから逃れることができなかった — そして、彼を救える者はいなかった。」"
frFR = "Son estomac se contractait si violemment que même le sommeil ne pouvait le cacher de la faim — et il n'y avait plus personne pour le sauver."
deDE = "Sein Magen krampfte sich so sehr zusammen, dass ihn selbst der Schlaf nicht vor dem Hunger verbergen konnte – und es war niemand mehr da, um ihn zu retten."
plPL = "Jego żołądek skurczył się tak bardzo, że nawet sen nie mógł go ochronić przed głodem — a nikogo już nie było, żeby mu pomóc."
ptBR = "Seu estômago se contorcia tanto que nem o sono poderia protegê-lo da fome — e não havia mais ninguém para salvá-lo."
koKR = "그의 배는 너무 아파서 잠조차도 그를 배고픔으로부터 숨길 수 없었고, 그를 구해줄 사람은 아무도 남아 있지 않았다."
csCZ = "Jeho břicho se křečovitě stáhlo natolik, že ani spánek ho před hladem nemohl ochránit — a nikdo už ho nemohl zachránit."
viVN = "Bụng của anh ta co thắt mạnh đến nỗi ngay cả giấc ngủ cũng không thể giấu anh khỏi cơn đói - và không còn ai lại để cứu anh."
trTR = "Mideleri o kadar kramp girdi ki uyku bile onu açlıktan saklayamadı — ve onu kurtaracak kimse kalmamıştı."

["BeaverFamilyTree.CauseOfDeath.Hunger.4"]
raw = "He kept hauling logs to the dam right to the end, though it had been a long time since he'd held anything edible in his paws."
status = "normal"
enUS = "He kept hauling logs to the dam right to the end, though it had been a long time since he'd held anything edible in his paws."
zhCN = "他一直在往水坝运输木头，即使自从他手中握住任何可以吃的东西已经过去很久了。"
zhTW = "他一直在拖運樹木到水壩，直到最後一刻，儘管他已經很長一段時間沒有在爪子裡抓到任何可以吃的東西。"
ruRU = "Он продолжал таскать бревna к плотине до самого конца, хотя с тех пор, как он держал что-то съедобное в своих лапах, прошло много времени."
jaJP = "彼は最後までダムに丸太を運び続けましたが、 paws に何か食べられるものを持ってからは長い時間が経っていました。"
frFR = "Il continuait à transporter des buches vers le barrage jusqu'à la fin, bien que cela fût longtemps qu'il n'avait rien de comestible dans ses pattes."
deDE = "Er schleppte bis zum Schluss weiter Baumstämme zum Damm, obwohl es schon lange her war, dass er etwas Essbares in seinen Pfoten gehalten hatte."
plPL = "Cały czas przynosił drewno do tamy aż do samego końca, chociaż minęło dużo czasu, odkąd trzymał coś jadalnego w swoich łapkach."
ptBR = "Ele continuou transportando troncos para a represa até o fim, embora já tivesse passado muito tempo desde que segurou algo comestível em suas patas."
koKR = "그는 마지막까지 댐으로 통나무를 운반했지만, 그의 발가락에 먹을 것이 닿은 지는 오래되었다."
csCZ = "Celou dobu nosil klády k hrázi, i když uplynulo dlouho od té doby, co měl v tlapkách něco jedlého."
viVN = "Anh ấy đã tiếp tục kéo gỗ đến đập cho đến tận cuối, mặc dù đã lâu rồi kể từ khi anh ấy cầm trong tay bất cứ thứ gì có thể ăn được."
trTR = "Sonunda, elinde yiyecek bir şey tutmadığı uzun bir süre olmasına rağmen, sona kadar baraj için kütük taşımaya devam etti."

["BeaverFamilyTree.CauseOfDeath.Hunger.5"]
raw = "He checked every pantry in the district — and found the same hollow echo of emptiness in each one."
status = "normal"
enUS = "He checked every pantry in the district — and found the same hollow echo of emptiness in each one."
zhCN = "“他检查了区内的每一个食品储藏室——在每一个储藏室里都发现了同样的空洞回声。”"
zhTW = "他檢查了區域內的每一個儲藏室，發現每一個都發出空蕩蕩的回聲。"
ruRU = "«Он проверил каждую кладовую в округе — и в каждой нашел один и тот же пустой отголосок пустоты.»"
jaJP = "彼は地区内のすべてのパントリーを調べたが、どれも同じ空虚な反響の響きを見つけた。"
frFR = "Il a vérifié chaque garde-manger du district — et a trouvé le même écho creux de vide dans chacun d'eux."
deDE = "Er durchsuchte jede Speisekammer im Bezirk – und fand in jeder das gleiche hohle Echo der Leere."
plPL = "Sprawdził każdą spiżarnię w dzielnicy — i w każdej z nich znalazł ten sam pusty echo pustki."
ptBR = "Ele verificou cada despensa no distrito — e encontrou o mesmo eco oco de vazio em cada uma."
koKR = "그는 구역의 모든 찬장을 확인했지만, 각 찬장에서 같은 허전한 메아리만을 발견했다."
csCZ = "Prozkoumal každou spíž v okrsku — a v každé zjistil stejný dutý ohlas prázdnoty."
viVN = "Ông đã kiểm tra mọi nhà bếp trong khu vực — và phát hiện ra âm vang trống rỗng giống nhau ở mỗi nơi."
trTR = "Bölgedeki her kilerin içine baktı - ve her birinde aynı boşluk yankısını buldu."

["BeaverFamilyTree.CauseOfDeath.Hunger.6"]
raw = "The harvest had failed that cycle, and he held on to hope for longer than his body could manage."
status = "normal"
enUS = "The harvest had failed that cycle, and he held on to hope for longer than his body could manage."
zhCN = "“那一轮的收成失败了，他的希望维持得比他的身体能支撑的时间更久。”"
zhTW = "在那個週期裡，收成失敗了，他寄望於比他的身體能承受的時間更長。"
ruRU = "Урожай в этом цикле провалился, и он держался за надежду дольше, чем позволяло его тело."
jaJP = "そのサイクルでは収穫が失敗し、彼は体が持つよりも長く希望を抱いていた。"
frFR = "La récolte avait échoué ce cycle, et il a conservé l'espoir plus longtemps que son corps ne le pouvait."
deDE = "Die Ernte war in diesem Zyklus gescheitert, und er hielt länger an der Hoffnung fest, als es sein Körper konnte."
plPL = "Zbiory w tym cyklu nie powiodły się, a on trzymał się nadziei dłużej, niż jego ciało mogło wytrzymać."
ptBR = "A colheita tinha falhado naquele ciclo, e ele manteve a esperança por mais tempo do que seu corpo conseguia suportar."
koKR = "그 주기에는 수확이 실패했고, 그는 자신의 몸이 견딜 수 있는 것보다 더 오랫동안 희망을 붙잡고 있었다."
csCZ = "Úroda v tomto cyklu selhala a on se držel naděje déle, než by jeho tělo zvládlo."
viVN = "Cây vụ thu hoạch đã thất bại trong chu kỳ đó, và ông đã nắm giữ hy vọng lâu hơn so với khả năng của cơ thể mình."
trTR = "Hasat o döngüde başarısız oldu ve bedeni dayanamayacak kadar uzun süre umudunu tuttu."

["BeaverFamilyTree.CauseOfDeath.Hunger.7"]
raw = "He watched the others carrying logs and realized he no longer had the strength to carry even one."
status = "normal"
enUS = "He watched the others carrying logs and realized he no longer had the strength to carry even one."
zhCN = "“他看着其他人搬运木头，意识到自己再也没有力量搬运一根。”"
zhTW = "他看著其他人搬運木頭，意識到自己已經沒有力氣再搬運一根木頭了。"
ruRU = "Он наблюдал за другими, которые несут бревна, и осознал, что у него больше нет сил нести даже одно."
jaJP = "彼は他の者たちが丸太を運ぶのを見て、自分にはもはや一つも運ぶ力がないことに気づいた。"
frFR = "Il regardait les autres porter des bûches et réalisa qu'il n'avait plus la force d'en porter une seule."
deDE = "Er sah den anderen zu, wie sie Stämme trugen, und ihm wurde bewusst, dass er nicht einmal mehr die Kraft hatte, einen einzigen zu tragen."
plPL = "Widział, jak inni noszą bale i zdał sobie sprawę, że nie ma już siły, by unieść chociaż jeden."
ptBR = "Ele observou os outros carregando toras e percebeu que não tinha mais forças para carregar nem mesmo uma."
koKR = "그는 다른 이들이 통나무를 나르는 모습을 지켜보며, 이제는 하나조차 나를 힘이 없다는 것을 깨달았다."
csCZ = "Díval se na ostatní, jak nosí klády, a uvědomil si, že už nemá sílu nést ani jednu."
viVN = "Anh ấy nhìn những người khác vác những khúc gỗ và nhận ra rằng anh đã không còn sức mạnh để vác nổi một cái."
trTR = "Diğerlerinin ağaç gövdelerini taşıdığını izledi ve artık birini bile taşıyacak gücünün kalmadığını fark etti."

["BeaverFamilyTree.CauseOfDeath.Hunger.8"]
raw = "The bark on the young saplings looked like salvation, but there was too little of it, and too late."
status = "normal"
enUS = "The bark on the young saplings looked like salvation, but there was too little of it, and too late."
zhCN = "“年轻树苗上的树皮看起来像是救赎，但它太少了，来得也太晚。”"
zhTW = "年輕樹苗上的樹皮看起來像是一線生機，但卻太少了，為時已晚。"
ruRU = "Кора на молодых саженцах казалась спасением, но её было слишком мало и слишком поздно."
jaJP = "若い苗木の樹皮は救いのように見えたが、それはあまりにも少なく、手遅れだった。"
frFR = "L'écorce des jeunes jeunes pousses ressemblait à une planche de salut, mais il y en avait trop peu, et c'était trop tard."
deDE = "Die Rinde der jungen Setzlinge sah wie eine Rettung aus, aber es war zu wenig davon und zu spät."
plPL = "Kora na młodych sadzonkach wyglądała jak zbawienie, ale było jej za mało i przyszła za późno."
ptBR = "É a casca das jovens mudas que parecia a salvação, mas era muito pouca e chegou tarde demais."
koKR = "젊은 묘목의 나무 껍질은 구원의 모습 같았지만, 그 양은 너무 적었고, 너무 늦었다."
csCZ = "Kůra na mladých sazenicích vypadala jako spása, ale bylo jí příliš málo a přišla příliš pozdě."
viVN = "Vỏ cây trên những cây non trông như sự cứu rỗi, nhưng quá ít và đã quá muộn."
trTR = "Genç fidelerin üzerindeki kabuk kurtuluş gibi görünüyordu, ama çok azdı ve çok geçti."

["BeaverFamilyTree.CauseOfDeath.Hunger.9"]
raw = "Work at the sawmill never let up for a moment — food, somehow, never showed up at all."
status = "normal"
enUS = "Work at the sawmill never stopped for a moment — food, somehow, never arrived at all."
zhCN = "锯木厂的工作从未停歇——食物却怎么也没有出现。"
zhTW = "「在鋸木廠的工作一刻也沒有停歇 — 食物，無論如何，完全沒有出現。」"
ruRU = "Работа на лесопилке никогда не утихала ни на мгновение — еда, как ни странно, так и не появилась вовсе."
jaJP = "製材所での仕事は一瞬たりとも休むことはなく — 食べ物は、どういうわけか、全く現れなかった。"
frFR = "Le travail à la scierie ne cessait jamais un instant – la nourriture, d'une manière ou d'une autre, n'est jamais arrivée."
deDE = "Die Arbeit in der Sägewerk ließ keinen Moment nach – Essen tauchte irgendwie überhaupt nicht auf."
plPL = "Praca w tartaku nigdy nie ustępowała ani na chwilę — jedzenie, jakoś, nigdy się nie pojawiło."
ptBR = "Trabalhar na serraria nunca cessou por um momento — a comida, de alguma forma, nunca apareceu."
koKR = "목재소에서의 작업은 단 한 순간도 중단되지 않았고 — 음식은 어떻게든 전혀 나타나지 않았다."
csCZ = "Práce v pily nikdy na chvíli nepřestávala — jídlo se, jakýmkoli způsobem, vůbec nedostavilo."
viVN = "Công việc ở nhà máy xẻ gỗ không bao giờ ngừng lại một giây nào — thức ăn, bằng cách nào đó, không bao giờ xuất hiện."
trTR = "Kesimhanedeki işler bir an bile azalmadı — yiyecek bir şekilde asla gelmedi."

["BeaverFamilyTree.CauseOfDeath.Hunger.10"]
raw = "He split his last scrap with the kits, keeping less and less for himself until there was nothing left."
status = "normal"
enUS = "He split his last scrap with the kits, keeping less and less for himself until there was nothing left."
zhCN = "他把最后一点残羹与小崽们分享，留给自己的越来越少，直到一无所有。"
zhTW = "「他將最後一點殘餘與幼崽們分開，逐漸為自己留下越來越少的東西，直到什麼都沒有了。」"
ruRU = "Он разделил свой последний кусочек с детенышами, оставляя себе всё меньше и меньше, пока ничего не осталось."
jaJP = "彼は最後のわずかな食べ物を子供たちと分け合い、自分のために持っているものがどんどん少なくなり、ついには何も残らなくなった。"
frFR = "Il a partagé son dernier morceau avec les petits, gardant de moins en moins pour lui jusqu'à ce qu'il ne reste plus rien."
deDE = "Er teilte seinen letzten Rest mit den Kleinen und behielt immer weniger für sich, bis nichts mehr übrig war."
plPL = "Podzielił się ostatnim kawałkiem z młodymi, zostawiając dla siebie coraz mniej, aż nie zostało nic."
ptBR = "Ele dividiu seu último pedaço com os filhotes, mantendo cada vez menos para si até que não sobrasse nada."
koKR = "그는 자신을 위해 남겨둔 것이 점점 줄어들고 결국 아무것도 남지 않을 때까지 새끼들과 마지막 조각을 나누었다."
csCZ = "Rozdělil svůj poslední kousek s mláďaty, čím dál tím méně si nechával pro sebe, až nezbylo nic."
viVN = "Anh ấy đã chia sẻ miếng cuối cùng với những chú nhóc, giữ lại ngày càng ít cho bản thân cho đến khi không còn gì."
trTR = "En son parçasını yavrularla paylaştı, kendisi için giderek daha az şey tutarak en sonunda hiçbir şey kalmayana kadar."

["BeaverFamilyTree.CauseOfDeath.Hunger.11"]
raw = "Hunger screamed loudest at night — and at night the storehouse was simply too far to walk."
status = "normal"
enUS = "Hunger screamed loudest at night — and at night the storehouse was simply too far to walk."
zhCN = "“饥饿在夜里尖叫得最响 — 而在夜里，仓库实在太远，无法走到。”"
zhTW = "飢餓在夜晚尖叫得最響亮——而在夜晚，倉庫實在太遠了，無法走到。"
ruRU = "Голод кричал громче всего ночью — а ночью склад был просто слишком далеко, чтобы дойти."
jaJP = "「飢えは夜に最も大きな声で叫んだ——そして夜には倉庫まで歩くにはあまりにも遠すぎた。」"
frFR = "La faim criait le plus fort la nuit — et la nuit, le hangar était tout simplement trop éloigné pour y aller."
deDE = "Hunger schrie nachts am lautesten - und nachts war der Lagerraum einfach zu weit entfernt, um dorthin zu gehen."
plPL = "Z głodu krzyczało głośniej w nocy — a w nocy spichlerz był po prostu zbyt daleko, żeby tam dojść."
ptBR = "A fome gritava mais alto à noite — e à noite o armazém estava simplesmente longe demais para caminhar."
koKR = "배고픔은 밤에 가장 크게 울부짖었다 — 그리고 밤에는 저장고가 너무 멀어서 걸어갈 수 없었다."
csCZ = "Hlad křičel nejhlasitěji v noci — a v noci byla zásobárna prostě příliš daleko na to, aby se tam dalo dojít."
viVN = "Cơn đói hét lên to nhất vào ban đêm — và vào ban đêm, kho lương thực thì quá xa để đi bộ."
trTR = "Açlık gece en yüksek sesle haykırıyordu — ve gece, ambar yürümek için çok uzaktı."

["BeaverFamilyTree.CauseOfDeath.Hunger.12"]
raw = "He tried to snag even a splinter out of the water by the sawmill, but the current was faster than his paws."
status = "normal"
enUS = "He tried to snag even a splinter out of the water by the sawmill, but the current was faster than his paws."
zhCN = "“他试图从锯木厂旁边的水中抓住一根木屑，但水流比他的爪子快。”"
zhTW = "「他試圖從鋸木廠旁的水中撈起一根木刺，但水流比他的爪子還快。」"
ruRU = "Он пытался вытащить даже щепку из воды у лесопилки, но течение было быстрее его лап."
jaJP = "「彼は製材所のそばの水からさえも木の破片を掴もうとしたが、流れは彼の足よりも速かった。」"
frFR = "Il a essayé de récupérer même une écharde dans l'eau près du moulin, mais le courant était plus rapide que ses pattes."
deDE = "Er versuchte, sogar einen Splitter aus dem Wasser bei der Sägerei zu fangen, aber die Strömung war schneller als seine Pfoten."
plPL = "Próbował złapać nawet choćby drzazgę z wody obok tartaku, ale prąd był szybszy niż jego łapy."
ptBR = "Ele tentou pegar até um lasca da água perto da serraria, mas a correnteza era mais rápida do que suas patas."
koKR = "그는 제재소 근처의 물에서 조그마한 나무 조각이라도 잡아보려 했지만, 흐름이 그의 발보다 더 빨랐다."
csCZ = "Snažil se vychytrat i třísku z vody u pil nezávisle, ale proud byl rychlejší než jeho tlapky."
viVN = "Anh ấy cố gắng lấy thậm chí một mảnh gỗ ra khỏi nước bên cạnh nhà máy cưa, nhưng dòng chảy nhanh hơn cả chân anh."
trTR = "Testerenin yanındaki sudan hatta bir parça çalı çırpı kapmaya çalıştı ama akıntı, patilerinden daha hızlıydı."

["BeaverFamilyTree.CauseOfDeath.Hunger.13"]
raw = "The list of things he hadn't eaten in weeks was longer than the list of things he had."
status = "normal"
enUS = "The list of things he hadn't eaten in weeks was longer than the list of things he had."
zhCN = "“他几周没吃过的东西清单比他吃过的东西清单还要长。”"
zhTW = "他沒有吃的東西清單比他吃過的東西清單還要長。"
ruRU = "Список вещей, которые он не съел за недели, был длиннее списка вещей, которые он съел."
jaJP = "「彼が何週間も食べていなかったもののリストは、彼が食べたもののリストよりも長かった。」"
frFR = "La liste des choses qu'il n'avait pas mangées depuis des semaines était plus longue que celle des choses qu'il avait mangées."
deDE = "Die Liste der Dinge, die er seit Wochen nicht gegessen hatte, war länger als die Liste der Dinge, die er gegessen hatte."
plPL = "Lista rzeczy, których nie zjadł od tygodni, była dłuższa niż lista rzeczy, które zjadł."
ptBR = "A lista de coisas que ele não havia comido em semanas era maior do que a lista de coisas que ele tinha comido."
koKR = "그가 몇 주 동안 먹지 않은 것들의 목록이 그가 먹은 것들의 목록보다 길었다."
csCZ = "Seznam věcí, které za týdny nesnědl, byl delší než seznam věcí, které snědl."
viVN = "Danh sách những món anh ta chưa ăn trong nhiều tuần dài hơn danh sách những món anh ta đã ăn."
trTR = "Yenmediği şeylerin listesi haftalarca önce yediklerinin listesinden daha uzundu."

["BeaverFamilyTree.CauseOfDeath.Hunger.14"]
raw = "He collapsed right at the storehouse door — an empty storehouse that never got restocked in time."
status = "normal"
enUS = "He collapsed right at the storehouse door — an empty storehouse that never got restocked in time."
zhCN = "他就在仓库门前倒下了——一个从未及时补货的空仓库。"
zhTW = "他就在倉庫門口倒下了——那是一個從未及時補貨的空倉庫。"
ruRU = "Он рухнул прямо у двери склада — у пустого склада, который так и не был вовремя пополнен."
jaJP = "「彼は倉庫のドアの前で倒れた — いつもタイミングよく補充されることのない空の倉庫で。」"
frFR = "Il s'est effondré juste devant la porte du grenier — un grenier vide qui n'a jamais été réapprovisionné à temps."
deDE = "Er brach direkt an der Tür des Lagerhauses zusammen — ein leeres Lagerhaus, das nie rechtzeitig aufgefüllt wurde."
plPL = "Zasłabł tuż przy drzwiach magazynu – pustego magazynu, który nigdy nie został na czas uzupełniony."
ptBR = "Ele desabou bem na porta do armazém — um armazém vazio que nunca foi reabastecido a tempo."
koKR = "그는 창고 문 바로 앞에서 쓰러졌습니다 — 제때 보충되지 않은 빈 창고에서."
csCZ = "Spadl přímo u dveří do skladu — prázdný sklad, který nikdy nebyl včas doplněn."
viVN = "Anh ấy ngã quỵ ngay tại cửa kho - một kho trống rỗng mà chưa bao giờ được bổ sung kịp thời."
trTR = "Depo kapısının önünde yığılıp kaldı — zamanında yeniden doldurulmamış boş bir depo."

["BeaverFamilyTree.CauseOfDeath.Hunger.15"]
raw = "The young shoots he finally managed to reach turned out bitter and inedible."
status = "normal"
enUS = "The young shoots he finally managed to reach turned out bitter and inedible."
zhCN = "他终于够到的嫩芽却苦涩且不可食用。"
zhTW = "他終於設法觸及的嫩芽卻變得苦澀，無法食用。"
ruRU = "Молодые побеги, до которых он в конце концов добрался, оказались горькими и несъедобными."
jaJP = "彼がついに手に入れた若芽は苦くて食べられないことがわかった。"
frFR = "Les jeunes pousses qu'il a finalement réussi à atteindre se sont révélées amères et non comestibles."
deDE = "Die jungen Triebe, die er schließlich erreichte, erwiesen sich als bitter und ungenießbar."
plPL = "Młode pędy, które w końcu udało mu się osiągnąć, okazały się gorzkie i niejadalne."
ptBR = "Os brotos jovens que ele finalmente conseguiu alcançar eram amargos e intragáveis."
koKR = "그가 마침내 닿을 수 있었던 어린 싹은 씁쓸하고 먹을 수 없었다."
csCZ = "Nové výhonky, které se mu nakonec podařilo dosáhnout, se ukázaly být hořké a nepoživatelné."
viVN = "Các mầm non mà cuối cùng anh ta đã đến được lại có vị đắng và không ăn được."
trTR = "Sonunda ulaşmayı başardığı genç filizler acı ve yenilmez çıktı."

["BeaverFamilyTree.CauseOfDeath.Hunger.16"]
raw = "He rationed his strength all day to make it to food by evening — but evening came too late."
status = "normal"
enUS = "He rationed his strength all day to make it to the food by evening — but evening came too late."
zhCN = "“他整天都在节省力气，以便能在傍晚时分到达食物——但傍晚来得太晚。”"
zhTW = "「他整天節省體力，為了能在晚上找到食物——但晚上來得太晚了。」"
ruRU = "Он экономил свои силы весь день, чтобы добраться до пищи к вечеру — но вечер пришел слишком поздно."
jaJP = "彼は夕方まで食べ物に到達するために一日中自分の力を温存したが、夕方はあまりにも遅すぎた。"
frFR = "Il a rationné sa force toute la journée pour atteindre la nourriture avant le soir — mais le soir est arrivé trop tard."
deDE = "Er rationierte seine Kräfte den ganzen Tag, um bis zum Abend zu den Nahrungsmitteln zu gelangen – aber der Abend kam zu spät."
plPL = "Przez cały dzień oszczędzał siły, by dotrzeć do jedzenia przed wieczorem — ale wieczór przyszedł zbyt późno."
ptBR = "Ele racionou suas forças o dia todo para chegar à comida antes da noite — mas a noite chegou tarde demais."
koKR = "그는 저녁까지 음식을 찾기 위해 하루 종일 힘을 절약했다 — 하지만 저녁은 너무 늦게 찾아왔다."
csCZ = "Šetřil síly celý den, aby se dostal k jídlu do večera — ale večer přišel příliš pozdě."
viVN = "Cậu ấy đã tiết kiệm sức lực suốt cả ngày để có thể tới được nguồn thức ăn vào buổi tối — nhưng buổi tối đến quá muộn."
trTR = "Günün her saatinde gücünü paylaştırdı ve akşama yiyeceğe ulaşmayı umdu — ama akşam çok geç geldi."

["BeaverFamilyTree.CauseOfDeath.Hunger.17"]
raw = "The neighboring district shared its food without him — simply because no one knew he was starving."
status = "normal"
enUS = "The neighboring district shared its food without him — simply because no one knew he was starving."
zhCN = "“邻近地区在没有他参与的情况下分享了食物——仅仅是因为没有人知道他正在饥饿。”"
zhTW = "鄰近區域在他不知情的情況下分享了食物——僅僅因為沒有人知道他正在饑餓。"
ruRU = "Соседний район делился своей пищей без него — просто потому, что никто не знал, что он голодает."
jaJP = "「隣接する地区は彼の食べ物を分け合った — ただ誰も彼が飢えていることを知らなかったから。」"
frFR = "Le district voisin a partagé sa nourriture sans lui — simplement parce que personne ne savait qu'il mourait de faim."
deDE = "Der benachbarte Bezirk teilte sein Essen ohne ihn – einfach weil niemand wusste, dass er verhungerte."
plPL = "Sąsiedni rejon dzielił się jedzeniem bez niego — po prostu dlatego, że nikt nie wiedział, że umiera z głodu."
ptBR = "O distrito vizinho compartilhou sua comida sem ele — simplesmente porque ninguém sabia que ele estava morrendo de fome."
koKR = "이웃 구역은 그가 배고픈 줄 몰랐기 때문에 그를 위해 음식을 나누어 주지 않았다."
csCZ = "Vedlejší čtvrť sdílela své jídlo bez něj — jednoduše proto, že nikdo nevěděl, že umírá hlady."
viVN = "Khu vực lân cận đã chia sẻ thực phẩm mà không có anh ta - chỉ đơn giản vì không ai biết anh ta đang đói khát."
trTR = "Komşu bölge yiyeceğini onun yokluğunda paylaştı - çünkü kimse açlık çektiğini bilmiyordu."

["BeaverFamilyTree.CauseOfDeath.Hunger.18"]
raw = "His stomach had long since stopped growling — his body had simply given up and stopped."
status = "normal"
enUS = "His stomach had long since stopped growling — his body had simply given up and stopped."
zhCN = "“他的肚子早已不再咕咕作响——他的身体已经放弃并停止了。”"
zhTW = "他的肚子早已不再咕嚕作響——他的身體簡直放棄了，停止了運作。"
ruRU = "Его живот давно перестал урчать — его тело просто сдалось и остановилось."
jaJP = "「彼の胃はとっくに鳴るのをやめていた — 彼の体はただ参ってしまい、動くのをやめてしまった。」"
frFR = "Son estomac avait longtemps cessé de grogner — son corps avait tout simplement abandonné et s'était arrêté."
deDE = "Sein Magen hatte längst aufgehört zu knurren – sein Körper hatte einfach aufgegeben und gestoppt."
plPL = "Jego żołądek dawno przestał się burczeć — jego ciało po prostu poddało się i przestało."
ptBR = "Seu estômago havia parado de roncá há muito tempo — seu corpo simplesmente desistiu e parou."
koKR = "그의 배고픔을 알리는 소리는 오래전에 끝났고 — 그의 몸은 단순히 포기하고 멈춰버렸다."
csCZ = "Jeho žaludek už dávno přestal hřadit — jeho tělo se prostě vzdalo a přestalo."
viVN = "Bụng của anh ta từ lâu đã ngừng réo — cơ thể anh ta chỉ đơn giản là đã bỏ cuộc và ngừng lại."
trTR = "Midesi çoktan guruldamayı bırakmıştı — bedeni sadece pes etmiş ve durmuştu."

["BeaverFamilyTree.CauseOfDeath.Hunger.19"]
raw = "He stared at the logs and wood chips stacked in the barn, knowing neither one would fill him up."
status = "normal"
enUS = "He stared at the logs and wood chips stacked in the barn, knowing neither one would fill him up."
zhCN = "“他盯着堆放在谷仓里的原木和木屑，知道这两者都无法让他饱腹。”"
zhTW = "他盯著堆積在穀倉中的木材和木屑，知道無論是木材還是木屑都無法讓他填飽肚子。"
ruRU = "Он уставился на бревна и щепки, сложенные в сарае, зная, что ни одно из них не насытит его."
jaJP = "彼は納屋に積まれた丸太と木屑を見つめながら、どちらも自分を満たすことはないと知っていた。"
frFR = "Il fixa les bûches et les copeaux de bois empilés dans la grange, sachant que ni l'un ni l'autre ne le rassasierait."
deDE = "Er starrte auf die im Stall gestapelten Baumstämme und Holzspäne und wusste, dass keiner von beiden ihn sättigen würde."
plPL = "Patrzył na kłody i wióry drewniane ułożone w stodole, wiedząc, że żadne z nich go nie nasyci."
ptBR = "Ele encarou os troncos e lascas de madeira empilhados no celeiro, sabendo que nenhum deles o encheria."
koKR = "그는 헛간에 쌓인 통나무와 나무 조각을 바라보며, 둘 다 그를 배부르게 하지 않을 것임을 알았다."
csCZ = "Sledoval dřevo a piliny naskládané ve stodole, vědouce, že ani jedno ho nenaplní."
viVN = "Anh ta nhìn chằm chằm vào những khúc gỗ và mùn cưa chất đống trong kho, biết rằng không thứ nào có thể làm đầy bụng anh."
trTR = "Ahıra istiflenmiş odun ve talaşa bakarken, ikisinin de onu doyurmayacağını biliyordu."

["BeaverFamilyTree.CauseOfDeath.OldAge.0"]
raw = "He dozed off quietly in the sun, just as he had a thousand times before — only this time he didn't wake up."
status = "normal"
enUS = "He dozed off quietly in the sun, just as he had a thousand times before — only this time he didn't wake up."
zhCN = "他在阳光下静静地打了个盹，正如他之前千千万万次那样——只不过这次他没有醒来。"
zhTW = "他在陽光下靜靜地打盹，正如他之前千百次一樣——只是這一次他再也沒有醒來。"
ruRU = "Он тихо задремал на солнце, как делал это тысячу раз до этого — только на этот раз он не проснулся."
jaJP = "彼は太陽の下で静かにうとうとし、これまで何千回もそうしてきたように — ただ今回は目を覚まさなかった。"
frFR = "Il s'est assoupi tranquillement au soleil, comme il l'avait fait mille fois auparavant — seulement cette fois, il ne s'est pas réveillé."
deDE = "Er döste leise in der Sonne ein, genau wie er es tausendmal zuvor getan hatte – nur diesmal wachte er nicht mehr auf."
plPL = "Zasnął spokojnie na słońcu, tak jak robił to tysiąc razy wcześniej — tylko tym razem się nie obudził."
ptBR = "Ele cochilou tranquilamente ao sol, assim como havia feito mil vezes antes — apenas desta vez ele não acordou."
koKR = "그는 천 번은 그랬던 것처럼 조용히 햇살 아래에서 조는 중이었고, 이번만큼은 깨어나지 않았다."
csCZ = "Tiše usnul na slunci, přesně tak, jak to udělal už tisíckrát předtím — jen tentokrát se neprobral."
viVN = "Ông ngủ thiếp đi nhẹ nhàng dưới ánh nắng, giống như đã hàng nghìn lần trước — chỉ có điều lần này ông không tỉnh dậy."
trTR = "Güneşin altında sessizce uykuya daldı, daha önce binlerce kez olduğu gibi - bu sefer uyanmadı."

["BeaverFamilyTree.CauseOfDeath.OldAge.1"]
raw = "His legs no longer obeyed the way they used to, his teeth were worn down, and his heart simply grew tired of beating."
status = "normal"
enUS = "His legs no longer obeyed as they once did, his teeth were worn down, and his heart had simply grown weary of beating."
zhCN = "“他的腿已经不再像以前那样听话，牙齿磨损了，心脏也渐渐厌倦了跳动。”"
zhTW = "他的腿不再像以前那樣聽話，牙齒也磨損了，心臟只是對跳動感到厭倦。"
ruRU = "Его ноги больше не слушались так, как раньше, зубы были изношены, а сердце просто устало биться."
jaJP = "「彼の脚は以前のように言うことを聞かず、歯は磨耗し、心臓はただ鼓動することに疲れ果ててしまった。」"
frFR = "Ses jambes n'obéissaient plus comme avant, ses dents étaient usées, et son cœur s'était tout simplement lassé de battre."
deDE = "„Seine Beine gehorchten ihm nicht mehr wie früher, seine Zähne waren abgenutzt, und sein Herz wurde einfach müde vom Schlagen.“"
plPL = "Jego nogi już nie słuchały tak, jak kiedyś, jego zęby były starte, a serce po prostu zmęczyło się biciem."
ptBR = "Seus pés já não obedeciam como antes, seus dentes estavam desgastados e seu coração simplesmente se cansou de bater."
koKR = "그의 다리는 예전처럼 움직이지 않았고, 그의 이빨은 닳아버렸으며, 그의 심장은 그저 뛰는 것에 지쳤다."
csCZ = "Jeho nohy už neposlouchaly tak, jak dřív, zuby měl obroušené a jeho srdce se zkrátka unavilo tlouci."
viVN = "Chân của ông không còn tuân theo cách mà chúng đã từng, nướu của ông đã mòn đi, và trái tim của ông đơn giản là mệt mỏi không muốn đập nữa."
trTR = "Bacakları eskisi gibi çalışmıyordu, dişleri aşınmıştı ve kalbi sadece atmaya müsaade etmekten yorulmuştu."

["BeaverFamilyTree.CauseOfDeath.OldAge.2"]
raw = "He'd already told his grandkits everything he knew about dams — and went to his rest with a clear conscience."
status = "normal"
enUS = "He had already told his grandkits everything he knew about dams — and went to his rest with a clear conscience."
zhCN = "“他已经把自己知道的关于水坝的一切都告诉了他的孙子们 —— 带着清晰的良心得到了安息。”"
zhTW = "「他已經告訴他的孫子們關於水壩的所有知識——然後帶著清白的良心安然長眠。」"
ruRU = "Он уже рассказал своим внукам всё, что знал о плотинах, — и ушёл на покой с чистой совестью."
jaJP = "「彼はすでに孫たちにダムについて知っていることをすべて教え、清らかな良心を持って安らかに眠りについた。」"
frFR = "Il avait déjà dit à ses petits-enfants tout ce qu'il savait sur les barrages — et il est parti se reposer avec une conscience tranquille."
deDE = "Er hatte seinen Enkelkits bereits alles erzählt, was er über Dämme wusste – und ging mit einem reinem Gewissen in seine Ruhe."
plPL = "Już opowiedział swoim wnukom wszystko, co wiedział o tamach — i przeszedł na spoczynek z czystym sumieniem."
ptBR = "Ele já tinha contado a seus netinhos tudo o que sabia sobre represas — e partiu para seu descanso com a consciência tranquila."
koKR = "그는 이미 손자들에게 댐에 대해 아는 모든 것을 이야기했으며, 깨끗한 양심으로 평화롭게 쉬러 갔다."
csCZ = "Už svým vnoučatům řekl vše, co věděl o hrázích — a odešel na věčný odpočinek s čistým svědomím."
viVN = "Ông đã kể cho các cháu của mình tất cả những gì ông biết về đập — và ra đi với một lương tâm trong sáng."
trTR = "Barajlar hakkında bildiği her şeyi torunlarına anlatmıştı - ve huzurlu bir şekilde gözlerini kapadı."

["BeaverFamilyTree.CauseOfDeath.OldAge.3"]
raw = "Age quietly took its due, painlessly, right in his own lodge, amid the smell of freshly cut wood."
status = "normal"
enUS = "Age quietly took its due, painlessly, right in his own lodge, amid the smell of freshly cut wood."
zhCN = "“岁月悄然来临，毫无痛苦地在他自己的小屋里，与新切木材的气味相伴。”"
zhTW = "年齡默默地收回了它的代價，無痛地，在他自己舒適的小屋裡，彌漫著新鮮切割木材的氣味。"
ruRU = "Возраст тихо забрал своё, безболезненно, прямо в его собственном доме, среди запаха свежеспиленной древесины."
jaJP = "「歳月は静かにその報いをもたらし、痛みもなく、彼自身の小屋の中で、新しく切り出された木の匂いとともに。」"
frFR = "L'âge a pris son dû en toute tranquillité, sans douleur, dans sa propre hutte, au milieu de l'odeur du bois fraîchement coupé."
deDE = "Das Alter nahm seinen Tribut, schmerzlos, direkt in seiner eigenen Hütte, umgeben vom Geruch von frisch geschnittenem Holz."
plPL = "Wieku spokojnie wziął swoje, bezboleśnie, w jego własnej chacie, wśród zapachu świeżo ściętego drewna."
ptBR = "A idade levou-o tranquilamente, sem dor, bem em sua própria cabana, no meio do cheiro de madeira recém-cortada."
koKR = "나이듦은 조용히 자신의 대대로, 고통 없이, 갓 베어낸 나무의 냄새 속에서 자신의 오두막에서 가져갔다."
csCZ = "Věk si potichu vybral svou daň, bezbolestně, přímo v jeho vlastním doupěti, uprostřed pachu čerstvě nařezaného dřeva."
viVN = "Tuổi tác đã lấy đi một cách âm thầm, không đau đớn, ngay tại chòi của anh, giữa mùi gỗ vừa được cắt."
trTR = "Yaşlılık, acısızca, kendi kulübesinde, taze kesilmiş ahşap kokusu arasında, sessizce alacağını aldı."

["BeaverFamilyTree.CauseOfDeath.OldAge.4"]
raw = "Just yesterday he'd been grumbling at the youngsters over badly stacked logs — today he simply didn't open his eyes."
status = "normal"
enUS = "Just yesterday he'd been grumbling at the youngsters over badly stacked logs — today he simply didn't open his eyes."
zhCN = "“就在昨天，他还在对年轻人堆砌得不好的木头发牢骚——今天他根本没有睁开眼睛。”"
zhTW = "就在昨天，他還在對年輕的樹鼩發牢騷，因為木材堆放得不整齊——今天他卻索性不睜開眼睛。"
ruRU = "Еще вчера он ворчал на молодых из-за плохо сложенных бревен — сегодня он просто не открыл глаза."
jaJP = "「昨日は悪く積まれた木材について若者たちに不平を言っていたが、今日はただ目を閉じていた。」"
frFR = "Juste hier, il avait grogné contre les jeunes à propos de bûches mal empilées - aujourd'hui, il n'a tout simplement pas ouvert les yeux."
deDE = "Er hatte sich erst gestern über die schlecht gestapelten Stämme über die Jungen beschwert – heute hat er einfach seine Augen nicht geöffnet."
plPL = "Jeszcze wczoraj narzekał na młodych za źle poukładane kłody — dzisiaj po prostu nie otworzył oczu."
ptBR = "Justo ontem ele estava resmungando com os jovens sobre toras mal empilhadas — hoje ele simplesmente não abriu os olhos."
koKR = "어제 그는 형편없이 쌓인 통나무 때문에 젊은이들에게 투덜거리고 있었는데 — 오늘은 그저 눈을 감고 있지 않았다."
csCZ = "Ještě včera si stěžoval na mladé kvůli špatně naskládaným kládám — dnes už prostě neotevřel oči."
viVN = "Chỉ hôm qua, ông ấy đã than phiền với những người trẻ về những thanh gỗ xếp không đúng — hôm nay ông ấy đơn giản là không mở mắt."
trTR = "Daha dünkü gibi, kötü yerleştirilmiş odunlar yüzünden gençlere homurdanıyordu - bugün ise gözlerini açmamıştı."

["BeaverFamilyTree.CauseOfDeath.OldAge.5"]
raw = "He'd long since stopped counting the cycles he'd lived — what did it matter, when every day had been good in its own way."
status = "normal"
enUS = "He'd long since stopped counting the cycles he'd lived — what did it matter, when every day had been good in its own way."
zhCN = "“他早已不再计算自己活过的周期——无论如何，这有什么意义，反正每天都有自己的美好。”"
zhTW = "「他早已不再計算自己活過多少個週期——這又有什麼重要的呢，當每一天都以自己的方式過得很好。」"
ruRU = "Он уже давно перестал считать циклы, которые прожил — какая разница, если каждый день был хорош по-своему."
jaJP = "「彼は自分が生きてきたサイクルを数えるのをとっくにやめていた — 毎日がそれぞれの良さを持っていたのだから、それが重要だった。」"
frFR = "Il avait depuis longtemps cessé de compter les cycles qu'il avait vécus — qu'est-ce que cela pouvait bien faire, puisque chaque jour avait été bon à sa manière."
deDE = "Er hatte längst aufgehört, die Zyklen zu zählen, die er gelebt hatte – was machte das schon aus, wenn jeder Tag auf seine eigene Weise gut gewesen war."
plPL = "Od dawna przestał liczyć cykle, które przeżył — co to miało znaczenie, skoro każdy dzień był dobry na swój sposób."
ptBR = "Ele havia há muito parado de contar os ciclos que havia vivido — que importava, se todos os dias foram bons à sua maneira."
koKR = "그는 자신이 살아온 주기를 세는 것을 오래전에 멈췄다 — 매일이 나름의 방식으로 좋았으니, 그것이 무엇이 중요한가."
csCZ = "Dávno přestal počítat cykly, které prožil — co na tom záleželo, když byl každý den dobrý svým vlastním způsobem."
viVN = "Ông đã từ lâu ngừng đếm những vòng đời mà ông đã sống — có ý nghĩa gì, khi mỗi ngày đều tốt đẹp theo cách riêng của nó."
trTR = "Yaşadığı döngüleri saymayı çoktan bırakmıştı - her günün kendi şekilde iyi olduğu zaman, bunun ne önemi vardı ki?"

["BeaverFamilyTree.CauseOfDeath.OldAge.6"]
raw = "The youngsters heard his advice about stacking logs one last time — and he quietly went to his rest."
status = "normal"
enUS = "The youngsters heard his advice about stacking logs one last time — and he quietly went to his rest."
zhCN = "年轻的海狸最后一次听到了他关于堆放木材的建议——然后他静静地安息了。"
zhTW = "年輕的兩隻聽到了他最後一次有關堆疊木材的建議——然後他安靜地進入了永恆的安眠。"
ruRU = "Молодежь в последний раз услышала его совет о том, как складировать бревна — и он тихо ушел на покой."
jaJP = "若者たちは、彼に最後のログの積み重ねについてのアドバイスを聞いた。そして、彼は静かに安らかに眠りについた。"
frFR = "Les jeunes ont entendu ses conseils sur l'empilement des bûches une dernière fois — et il s'est tranquillement reposé."
deDE = "Die jungen Biber hörten seinen Rat, die Stämme ein letztes Mal zu stapeln – und er ging still seinen letzten Frieden."
plPL = "Młodzież usłyszała jego radę o układaniu kłód po raz ostatni — a on cicho odszedł na spoczynek."
ptBR = "Os jovens ouviram seu conselho sobre empilhar toras uma última vez — e ele foi descansar em paz."
koKR = "어린 비버들은 마지막으로 통나무를 쌓는 데 대한 그의 조언을 들었고 — 그는 조용히 영면에 들었다."
csCZ = "Mladíci slyšeli jeho radu ohledně hromadění klád naposledy — a on tiše odešel na svůj odpočinek."
viVN = "Các thanh niên đã nghe lời khuyên của anh ấy về việc xếp gỗ lần cuối cùng - và anh ấy đã lặng lẽ ra đi trong yên nghỉ."
trTR = "Gençler, onun odunları istifleme konusundaki tavsiyelerini son bir kez duydular - ve o sessizce dinlenmeye geçti."

["BeaverFamilyTree.CauseOfDeath.OldAge.7"]
raw = "He still went out to warm himself in the sun every morning, until one morning came without him."
status = "normal"
enUS = "He still went out to warm himself in the sun every morning, until one morning came without him."
zhCN = "“他仍然每天早晨出去晒太阳，直到有一天早晨没有他。”"
zhTW = "他仍然每天早上出去在陽光下取暖，直到有一天早上他再也沒有出來。"
ruRU = "Он все еще выходил погреться на солнце каждое утро, пока одно утро не настало без него."
jaJP = "彼は毎朝日向で温まるために外に出ていましたが、ある朝彼なしでやってきました。"
frFR = "Il sortait encore pour se réchauffer au soleil chaque matin, jusqu'à ce qu'un matin se lève sans lui."
deDE = "Er ging jeden Morgen noch hinaus, um sich in der Sonne zu wärmen, bis eines Morgens ein Tag ohne ihn kam."
plPL = "Codziennie rano wychodził, aby ogrzać się w słońcu, aż pewnego ranka przyszło słońce bez niego."
ptBR = "Ele ainda saía para se aquecer ao sol todas as manhãs, até que uma manhã chegou sem ele."
koKR = "그는 여전히 매일 아침 태양에 몸을 따뜻하게 하러 나갔지만, 어느 아침 그가 없이 찾아왔다."
csCZ = "Každé ráno vycházel, aby se ohřál na slunci, až přišlo jedno ráno bez něj."
viVN = "Ông vẫn ra ngoài để tắm nắng mỗi sáng, cho đến khi một buổi sáng không còn ông nữa."
trTR = "Her sabah güneşte ısınmak için dışarı çıkmaya devam etti, ta ki bir sabah onu olmadan gelen sabaha kadar."

["BeaverFamilyTree.CauseOfDeath.OldAge.8"]
raw = "His fur had long since gone gray, but his eyes still shone to the very last day, looking at the dam he'd helped build."
status = "normal"
enUS = "His fur had long since gone gray, but his eyes still shone to the very last day, looking at the dam he'd helped build."
zhCN = "他的毛发早已变灰，但他的眼睛在最后一天依然闪烁着光芒，注视着他曾帮助建造的坝。"
zhTW = "他的毛皮早已變灰，但他的眼睛在最後一天仍然閃閃發光，注視著他曾經幫助建造的水壩。"
ruRU = "Его мех давно поседел, но глаза все еще сияли до самого последнего дня, глядя на плотину, которую он помог построить."
jaJP = "「彼の毛はとっくに灰色になっていたが、彼の目は最後の日まで輝いており、彼が手伝って作ったダムを見つめていた。」"
frFR = "Son pelage était depuis longtemps devenu gris, mais ses yeux brillaient encore jusqu'au dernier jour, regardant le barrage qu'il avait aidé à construire."
deDE = "Sein Fell war längst grau geworden, aber seine Augen leuchteten bis zum letzten Tag, während er auf den Damm schaute, den er mitgebaut hatte."
plPL = "Jego futro od dawna stało się szare, ale oczy wciąż świeciły do ostatniego dnia, patrząc na tamę, którą pomógł zbudować."
ptBR = "Seu pelo há muito tempo já havia ficado cinza, mas seus olhos ainda brilhavam até o último dia, olhando para a represa que ajudou a construir."
koKR = "그의 털은 오래전부터 회색으로 변했지만, 그의 눈은 마지막 날까지 빛났고, 그가 도운 댐을 바라보았다."
csCZ = "Jeho srst už dávno zešedivěla, ale jeho oči stále zářily až do posledního dne, když se díval na hráz, kterou pomáhal postavit."
viVN = "Lông của ông đã lâu nay chuyển sang màu xám, nhưng ánh mắt của ông vẫn sáng đến ngày cuối cùng, nhìn về con đê mà ông đã giúp xây dựng."
trTR = "Postu çoktan griye dönmüştü, ama gözleri son güne kadar parlamaya devam etti, inşa etmeye yardımcı olduğu barajı izleyerek."

["BeaverFamilyTree.CauseOfDeath.OldAge.9"]
raw = "He died the way he lived — sitting by his favorite dam, the very one he'd helped build cycles ago."
status = "normal"
enUS = "He died the way he lived — sitting by his favorite dam, the very one he'd helped build cycles ago."
zhCN = "他去世的方式与他生活的方式一样——坐在他最喜欢的水坝旁边，那是他几轮之前帮助建造的。"
zhTW = "他死在他生活的方式上——坐在他最喜愛的水壩旁邊，那正是他幾個週期前幫忙建造的水壩。"
ruRU = "Он ушел из жизни так, как и жил — сидя у любимой плотины, той самой, которую он помог построить много циклов назад."
jaJP = "「彼は好きなダムのそばに座って、彼が何サイクルも前に作るのを手伝ったそのダムで、彼が生きた方法で亡くなった。」"
frFR = "Il est mort comme il a vécu — assis près de son barrage préféré, celui qu'il avait aidé à construire il y a des cycles."
deDE = "Er starb, wie er gelebt hatte – sitzend an seinem Lieblingsdamm, dem genau dem, den er vor vielen Zyklen mitgebaut hatte."
plPL = "Zmarł tak, jak żył — siedząc przy swojej ulubionej tamie, tej, którą pomógł zbudować wieki temu."
ptBR = "Ele morreu do jeito que viveu — sentado perto da represa que mais gostava, aquela que ajudou a construir há ciclos atrás."
koKR = "그는 자신이 가장 좋아하는 댐 옆에 앉아 살았던 방식으로 죽었다. 그 댐은 그가 몇 사이클 전에 함께 지었을 바로 그 댐이다."
csCZ = "Zemřel tak, jak žil — seděl u své oblíbené hráze, té, kterou pomáhal postavit před mnoha cykly."
viVN = "Anh ấy đã ra đi như cách sống của mình — ngồi bên con đập yêu thích, chính là nơi anh ấy đã giúp xây dựng từ nhiều vòng trước."
trTR = "En sevdiği barajın yanında oturarak, yıllar önce inşa etmesine yardım ettiği o barajın yanında yaşamını sürdürdüğü gibi öldü."

["BeaverFamilyTree.CauseOfDeath.OldAge.10"]
raw = "His grandkits only noticed grandfather was sleeping too long once the sun was already high in the sky."
status = "normal"
enUS = "His grandkits only noticed grandfather was sleeping too long once the sun was already high in the sky."
zhCN = "“他的孙辈们直到太阳已经高高挂起才注意到爷爷睡得太久了。”"
zhTW = "他的孫子們只有在太陽高懸時才注意到爺爺睡得太久了。"
ruRU = "Его внуки только заметили, что дедушка спит слишком долго, когда солнце уже высоко в небе."
jaJP = "「祖父が長く寝ていることに気づいたのは、太陽が空高く昇ってからだった。」"
frFR = "Ses petits-enfants ont seulement remarqué que grand-père dormait trop longtemps une fois que le soleil était déjà haut dans le ciel."
deDE = "Seine Enkelkits bemerkten erst, dass der Großvater zu lange schlief, als die Sonne bereits hoch am Himmel stand."
plPL = "Jego wnuki zauważyły, że dziadek śpi za długo, dopiero gdy słońce było już wysoko na niebie."
ptBR = "Seus netinhos só perceberam que o avô estava dormindo demais quando o sol já estava alto no céu."
koKR = "손자들은 할아버지가 이미 하늘에 태양이 높이 솟아올랐을 때까지 할아버지가 너무 오랫동안 자고 있다는 것을 깨달았다."
csCZ = "Jeho vnoučata si až když bylo slunce už vysoko na obloze uvědomila, že dědeček spí příliš dlouho."
viVN = "Các cháu của ông chỉ nhận ra ông ngủ quá lâu khi mặt trời đã lên cao trên bầu trời."
trTR = "Torunları, güneş gökyüzünde yüksek olduğunda dedelerinin çok uzun süre uyuduğunu ancak o zaman fark ettiler."

["BeaverFamilyTree.CauseOfDeath.OldAge.11"]
raw = "He quietly stopped breathing somewhere between one heartbeat and the next, never waking from his midday nap."
status = "normal"
enUS = "He quietly stopped breathing somewhere between one heartbeat and the next, never waking from his midday nap."
zhCN = "“他在一次心跳和下一个心跳之间安静地停止了呼吸，从未从他的午睡中醒来。”"
zhTW = "「他靜靜地在一次心跳與下一次心跳之間停止了呼吸，從未從他的午睡中醒來。」"
ruRU = "Он тихо перестал дышать где-то между одним ударом сердца и следующим, так и не проснувшись от своего дневного отдыха."
jaJP = "「彼は昼寝から決して目を覚まさず、一心拍と次の心拍の間に静かに息を引き取りました。」"
frFR = "Il a cessé de respirer tranquillement quelque part entre un battement de cœur et le suivant, ne se réveillant jamais de sa sieste de midi."
deDE = "Er hörte leise zwischen einem Herzschlag und dem nächsten auf zu atmen und erwachte nie wieder aus seinem Mittagsschlaf."
plPL = "Cicho przestał oddychać gdzieś pomiędzy jednym uderzeniem serca a drugim, nigdy nie budząc się z popołudniowej drzemki."
ptBR = "Ele parou de respirar silenciosamente em algum lugar entre um batimento cardíaco e o próximo, nunca acordando de sua soneca de meio-dia."
koKR = "그는 잔잔한 숨결을 거두며 한 박동과 다음 박동 사이에서 조용히 세상을 떠났고, 정오 낮잠에서 깨어나지 못했다."
csCZ = "Tiše přestal dýchat někde mezi jedním tepem a druhým, nikdy se neprobudil ze své polední siesty."
viVN = "Ông lặng lẽ ngừng thở ở đâu đó giữa một nhịp tim và nhịp tim tiếp theo, không bao giờ tỉnh dậy từ giấc ngủ trưa của mình."
trTR = "Bir kalp atışı ile diğerinin arasında sessizce nefes almayı bıraktı, öğle uykusundan bir daha asla uyanmadı."

["BeaverFamilyTree.CauseOfDeath.OldAge.12"]
raw = "His last words were about how the new generation of beavers had completely forgotten how to stack logs properly."
status = "normal"
enUS = "His last words were about how the new generation of beavers had completely forgotten how to stack logs properly."
zhCN = "“他临终前的话是关于新一代的河狸完全忘记了如何正确叠放木头。”"
zhTW = "「他最後的話是關於新一代的海狸完全忘記了如何正確堆疊木頭。」"
ruRU = "Его последние слова касались того, как новое поколение бобров совершенно забыло, как правильно укладывать бревна."
jaJP = "「彼の最後の言葉は、新しい世代のビーバーたちがログを適切に積むことを完全に忘れてしまったということについてだった。」"
frFR = "Ses derniers mots concernaient le fait que la nouvelle génération de castors avait complètement oublié comment empiler les rondins correctement."
deDE = "Seine letzten Worte waren darüber, wie die neue Generation der Biber vollkommen vergessen hatte, wie man Baumstämme richtig stapelt."
plPL = "Jego ostatnie słowa dotyczyły tego, jak nowa generacja bobrów całkowicie zapomniała, jak właściwie układać pnie."
ptBR = "Suas últimas palavras foram sobre como a nova geração de castores havia completamente se esquecido de como empilhar toras corretamente."
koKR = "그의 마지막 말은 새로운 세대의 비버들이 나무를 제대로 쌓는 것을 완전히 잊어버렸다는 것이었다."
csCZ = "Jeho poslední slova se týkala toho, jak nová generace bobrů úplně zapomněla, jak správně skládat klády."
viVN = "Những lời cuối cùng của ông ấy là về việc thế hệ mới của những con rái cá đã hoàn toàn quên cách xếp gỗ một cách hợp lý."
trTR = "Son sözleri, yeni nesil bobriklerin kütükleri doğru bir şekilde nasıl istifleyeceklerini tamamen unuttukları hakkında oldu."

["BeaverFamilyTree.CauseOfDeath.OldAge.13"]
raw = "He'd outlived many others, seen more than one flood and more than one drought — and passed peacefully, in his own lodge."
status = "normal"
enUS = "He'd outlived many others, seen more than one flood and more than one drought — and passed peacefully, in his own lodge."
zhCN = "他比许多人活得更久，经历过不止一次洪水和干旱——最终安详地在自己的小屋中去世。"
zhTW = "「他比其他許多人活得更久，經歷了多次洪水與乾旱——最終安然無恙地過世，安息於自己的小屋中。」"
ruRU = "Он пережил многих других, видел не одну наводнение и не одну засуху — и ушёл мирно, в своем собственном логове."
jaJP = "彼は多くの他者を超えて生き延び、複数の洪水と干ばつを見た — そして、自分の小屋で静かに息を引き取った。"
frFR = "Il avait survécu à de nombreux autres, avait vu plus d'une inondation et plus d'une sécheresse — et est parti paisiblement, dans son propre terrier."
deDE = "Er hatte viele andere überlebt, mehr als eine Flut und mehr als eine Dürre gesehen – und ist friedlich in seiner eigenen Hütte verstorben."
plPL = "Przeżył wielu innych, widział niejedną powódź i niejedną suszę — i odszedł spokojnie, w swojej własnej chacie."
ptBR = "Ele sobreviveu a muitos outros, viu mais de uma enchente e mais de uma seca — e partiu em paz, em sua própria cabana."
koKR = "그는 많은 다른 이들보다 더 오래 살았고, 한 번 이상의 홍수와 한 번 이상의 가뭄을 겪었으며 — 그리고 자신의 오두막에서 평화롭게 세상을 떠났다."
csCZ = "Žil déle než mnozí ostatní, zažil více než jednu povodeň a více než jedno sucho — a odešel v pokoji, ve svém vlastním doupěti."
viVN = "Ông đã sống sót qua nhiều người khác, chứng kiến nhiều trận lũ và nhiều đợt hạn hán — và ra đi bình yên, trong tổ của chính mình."
trTR = "Birçokunu geride bırakmış, birden fazla sel ve birden fazla kuraklık görmüş - ve kendi kulübesinde huzur içinde hayata veda etmişti."

["BeaverFamilyTree.CauseOfDeath.OldAge.14"]
raw = "His body grew tired of carrying the weight of the years, and his heart grew tired of beating against its will."
status = "normal"
enUS = "His body grew tired of carrying the weight of the years, and his heart grew tired of beating against its will."
zhCN = "“他的身体厌倦了承受岁月的重负，而他的心也厌倦了违背意志地跳动。”"
zhTW = "他的身體厭倦了承擔歲月的重擔，他的心臟厭倦了違背意志地跳動。"
ruRU = "Его тело устало носить тяжесть лет, а сердце устало биться против своей воле."
jaJP = "「彼の体は年月の重みを背負うことに疲れ果て、彼の心は自分の意志に逆らって鼓動を打ち続けることに疲れ果てた。」"
frFR = "Son corps s'est épuisé à porter le poids des années, et son cœur s'est lassé de battre contre sa volonté."
deDE = "Sein Körper wurde müde, das Gewicht der Jahre zu tragen, und sein Herz wurde müde, gegen seinen Willen zu schlagen."
plPL = "Jego ciało zmęczyło się noszeniem ciężaru lat, a jego serce zmęczyło się bijąc wbrew własnej woli."
ptBR = "Seu corpo se cansou de carregar o peso dos anos, e seu coração se cansou de bater contra a sua vontade."
koKR = "그의 몸은 세월의 무게를 견디는 것에 지쳤고, 그의 마음은 저항하며 박동치는 것에 지쳤다."
csCZ = "Jeho tělo se unavilo nést váhu let a jeho srdce se unavilo bít proti své vůli."
viVN = "Cơ thể của anh ấy trở nên mệt mỏi khi mang trọng lượng của những năm tháng, và trái tim của anh ấy trở nên mệt mỏi khi phải đập trái ý mình."
trTR = "Bedeni yılların yükünü taşımaktan yoruldu ve kalbi, iradesine karşı atmaktan yoruldu."

["BeaverFamilyTree.CauseOfDeath.OldAge.15"]
raw = "He lived to see his great-grandkits pick up their first logs to build a dam of their own."
status = "normal"
enUS = "He lived to see his great-grandkits pick up their first logs to build a dam of their own."
zhCN = "“他活着看到他的曾孙们捡起第一根木头，自己建起一个水坝。”"
zhTW = "「他活到了看到他的曾孫子們第一次撿起樹木，去建造自己的水壩。」"
