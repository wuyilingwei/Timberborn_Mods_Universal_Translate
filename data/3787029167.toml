frFR = "Le tuyau qui alimentait le réservoir était depuis longtemps sec, et il n'y avait personne pour le réparer."
deDE = "Das Rohr, das den Reservoir speiste, war längst ausgetrocknet, und es gab niemanden mehr, der es reparieren konnte."
plPL = "Rura, która wcześniej zasilała zbiornik, od dawna wyschła, a nikt już nie pozostał, aby ją naprawić."
ptBR = "O cano que costumava abastecer o reservatório secou há muito tempo, e não havia mais ninguém para consertá-lo."
koKR = "저수지를 공급하던 파이프는 오래전에 고갈되었고, 이를 고칠 사람도 남아 있지 않았다."
csCZ = "Trubka, která kdysi zásobovala nádrž, už dávno vyschla, a nikdo ji neopravoval."
