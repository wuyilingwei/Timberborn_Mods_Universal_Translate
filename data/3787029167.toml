jaJP = "彼女はひび割れた大地を舐めて、命を与える湿気が一滴でも得られることを望んだが、二度と灼熱の地面から立ち上がることはなかった。"
frFR = "Elle lécha la terre craquelée, espérant même une goutte d'humidité vivifiante, mais ne se leva plus jamais du sol brûlant."
deDE = "Sie leckte an der rissigen Erde und hoffte auf auch nur einen Tropfen lebensspendender Feuchtigkeit, doch sie erhob sich nie wieder vom brennenden Boden."
plPL = "Lizała spękaną ziemię, licząc na choćby kroplę dającej życie wilgoci, ale nigdy już nie podniosła się z palącej ziemi."
ptBR = "Ela lambeu a terra rachada, esperando por até uma gota de umidade vital, mas nunca se levantou do chão escaldante novamente."
koKR = "그녀는 갈라진 땅을 핥으며 생명을 주는 수분이 한 방울이라도 있기를 바랐지만, 다시는 뜨거운 땅에서 일어나지 못했다."
csCZ = "Lízala prasklou zem, doufajíc v alespoň kapku životodárné vláhy, ale už se nikdy nezdvihla z pálivé země."
