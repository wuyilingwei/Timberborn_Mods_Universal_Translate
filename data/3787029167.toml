frFR = "Elle avait depuis longtemps cessé de transpirer — son corps rationnait même ce qu'il n'avait plus."
deDE = "Sie hatte längst aufgehört zu schwitzen — ihr Körper rationierte sogar das, was er nicht mehr hatte."
plPL = "Od dawna przestała się pocić — jej ciało racjonowało nawet to, czego już nie miało."
ptBR = "Ela havia parado de suar há muito tempo — seu corpo estava racionando até mesmo o que não tinha mais."
koKR = "그녀는 이미 오래전에 땀을 흘리는 것을 멈췄다 — 그녀의 몸은 더 이상 없는 것마저도 절약하고 있었다."
