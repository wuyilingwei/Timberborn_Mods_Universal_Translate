["BeaverFamilyTree.CauseOfDeath.Thirst.F.24"]
new = "She wandered to the district border hoping for a neighboring canal, but the neighbors' sluice was shut to outsiders."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.Thirst.F.25"]
new = "The shimmer over the dry riverbed looked so much like a lake that she crawled toward it with her last strength — and never made it."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.Thirst.F.26"]
new = "She heard water dripping somewhere inside the lodge wall and crawled toward the sound until the sound stopped."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.Thirst.F.27"]
new = "The dam held a full reservoir — just not for her: the line at the watering hole was too long."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.Thirst.F.28"]
new = "She tried to dig a well with her bare paws, but the ground had turned harder than stone after the long drought."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.Thirst.F.29"]
new = "Fog settled over the district for exactly one night — and that one night wasn't enough for her to lick up more than a few drops."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.Thirst.F.30"]
new = "The rain finally came — three days too late."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.Thirst.F.31"]
new = "She watched a fish thrashing in a drying puddle and understood she'd soon be in its place."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.Thirst.F.32"]
new = "The reserve water tank sat locked in the storehouse, and the key belonged to a beaver who hadn't shown up for work that day."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.Thirst.F.33"]
new = "She rationed every sip, saving some for tomorrow — and tomorrow never came for her."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.Thirst.F.34"]
new = "The heat was so fierce that even the shade by the dam gave no relief — the water in her body ran out faster than the day did."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.Thirst.F.35"]
new = "She believed the rains started on the same day every cycle — but this year they were late."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.Thirst.F.36"]
new = "Her last strength went into dragging herself to the dry canal, just to lie down at its bottom."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.Thirst.F.37"]
new = "She'd long since stopped sweating — her body was rationing even what it no longer had."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.Thirst.F.38"]
new = "The ditch around the sawmill had shrunk to cracked mud, and the real river was many times farther still."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.Thirst.F.39"]
new = "She looked at the dam one last time — the very one that was supposed to carry water to her, not past her."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.Hunger.F.20"]
new = "She split her grain ration with a sick neighbor and kept too little back to last herself."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.Hunger.F.21"]
new = "The storehouse was built too late — the harvest rotted in the rain before anyone could bring it in."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.Hunger.F.22"]
new = "She tried chewing on an old leather strap, just to feel like there was something, anything, in her mouth."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.Hunger.F.23"]
new = "The line at the kitchen stretched all day, and there was only enough food for those at the front of it."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.Hunger.F.24"]
new = "She traded her last ration for a warm blanket — and only afterward realized a blanket doesn't fill a stomach."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.Hunger.F.25"]
new = "Field mice stripped the barn's stores faster than the beavers could restock them."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.Hunger.F.26"]
new = "She kept watching them build a new sawmill instead of the storehouse that was needed far more."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.Hunger.F.27"]
new = "Hunger dulled every sense until she stopped noticing even the pain in her paws, worn raw."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.Hunger.F.28"]
new = "The last thing she ate was a handful of sawdust off the sawmill floor — and even that didn't save her from the hunger."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.Hunger.F.29"]
new = "She saved her strength for tomorrow's shift at the dam, not counting on the fact that she wouldn't live to see it."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.Hunger.F.30"]
new = "The badtide washed out half the crops that year, and she was one of the ones the leftovers didn't stretch to."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.Hunger.F.31"]
new = "She pretended she'd already eaten so no one would give up their own ration to her — and kept up the act to the end."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.Hunger.F.32"]
new = "The fresh load of logs arrived right on schedule — the barge with the food was a day later than she could hold out for."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.Hunger.F.33"]
new = "She steered clear of the neighboring district's full granaries, too proud to ask for help."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.Hunger.F.34"]
new = "Her last strength went into hauling her own cart of logs to the storehouse, not into finding a meal."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.Hunger.F.35"]
new = "She was counting on the spring shoots to save her — but spring was late that cycle."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.Hunger.F.36"]
new = "Hunger crept up on her unnoticed through the long shifts, right up until the day her legs simply refused to rise."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.Hunger.F.37"]
new = "She kept telling herself there'd be time to eat after the next shift — but the next shift never ended for her."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.Hunger.F.38"]
new = "She gave up her place in the kitchen line three times running — the fourth time, the line never opened for her at all."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.Hunger.F.39"]
new = "Her empty stomach drowned out even the hammers at the sawmill — but she could never drown out the hunger itself."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.OldAge.F.20"]
new = "She made one last round of the dam, nodding to every familiar log as if saying goodbye."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.OldAge.F.21"]
new = "Her voice grew quieter, her legs slower, but her smile at the sight of her grandkits never changed, right to the end."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.OldAge.F.22"]
new = "She left the youngsters her favorite bench by the water — and quietly took her place in the family's memory instead."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.OldAge.F.23"]
new = "Age never asked permission — it simply came for her one day, as peacefully as it had come for so many before her."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.OldAge.F.24"]
new = "She'd long since taken to living on memories of the great builds of her youth — and one day she simply didn't wake up among them."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.OldAge.F.25"]
new = "The last thing she saw was the morning mist over the river — the very same mist as the day she'd first arrived."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.OldAge.F.26"]
new = "She refused to move to a new lodge, saying she'd die where she'd lived her whole life. And so she did."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.OldAge.F.27"]
new = "Her body gave out before her spirit did — she kept trying to help at the dam right to the last day, long after she could no longer lift a log."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.OldAge.F.28"]
new = "She slipped away quietly in her sleep to the creak of old trees — the very sound that had lulled her whole life."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.OldAge.F.29"]
new = "Her children were long grown, and her grandkits too, and still she watched the river with the same wonder as on her very first day."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.OldAge.F.30"]
new = "That last winter turned out mild, as if nature itself had decided to let her go gently."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.OldAge.F.31"]
new = "She'd just finished passing on the secret of her sturdiest dam when she went to her rest with a light heart."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.OldAge.F.32"]
new = "Her frail paws could no longer hold a log, but they held her grandkits' paws tight right to the end."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.OldAge.F.33"]
new = "She faded away quietly between two strikes of the sawmill bell, never hearing the second one."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.OldAge.F.34"]
new = "The wrinkles on her face were a map of the years she'd lived — and one day that map simply closed."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.OldAge.F.35"]
new = "She dozed off by the fire every evening — and one of those evenings turned out to be her last, though no one noticed the difference right away."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.OldAge.F.36"]
new = "She brought in the last harvest of her life herself, flatly refusing any help from the young ones."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.OldAge.F.37"]
new = "She left as quietly as she'd once arrived in this district — without any fuss, leaving a sturdy dam behind her."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.OldAge.F.38"]
new = "Age took her strength, but never her memory — to the end, she remembered the name of everyone she'd ever taught."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.OldAge.F.39"]
new = "She lay down to rest after a long day, just as she had her whole life — only this time the rest turned out to be forever."
status = "normal"
