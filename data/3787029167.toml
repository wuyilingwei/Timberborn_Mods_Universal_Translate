deDE = "Sie sah das ferne Wasser durch trübe Augen und schaffte es nie, die letzten Meter dorthin zurückzulegen."
plPL = "Ona obserwowała odległą wodę przez zamglone oczy i nigdy nie zdołała pokonać ostatniego odcinka w jej kierunku."
ptBR = "Ela observou a água distante através de olhos embaçados e nunca conseguiu alcançar aquela última distância até ela."
koKR = "그녀는 흐려진 눈으로 먼 물을 바라보았지만, 그 물을 향한 마지막 거리를 결코 완주하지 못했다."
csCZ = "Sledovala vzdálenou vodu skrze zakalené oči a nikdy nedokázala urazit ten poslední úsek k ní."
viVN = "Cô nhìn về phía nước xa xăm qua đôi mắt mờ đục và không bao giờ đạt được quãng đường cuối cùng đến đó."
trTR = "Uzaklardaki suyu bulanık gözlerle izledi ve ona doğru son saate asla ulaşamadı."

["BeaverFamilyTree.CauseOfDeath.Thirst.F.5"]
