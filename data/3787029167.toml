deDE = "Der Graben um die Sägewerk war zu rissigem Schlamm geschrumpft, und der echte Fluss war noch viele Male weiter entfernt."
plPL = "Rów wokół tartaku skurczył się do popękanej błota, a prawdziwa rzeka była jeszcze wiele razy dalej."
