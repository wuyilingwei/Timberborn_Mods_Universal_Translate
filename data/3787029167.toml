koKR = "그녀는 물이 새는 금이 있는지 찾기 위해 전체 댐을 돌았지만, 마른 돌밖에 발견하지 못했다."
csCZ = "Obešla celou hráz a hledala i malou trhlinu, která by prosakovala vodu, ale našla pouze suchý kámen."
viVN = "Cô ấy vòng quanh toàn bộ đập để tìm ngay cả một vết nứt nhỏ rỉ nước, nhưng chỉ tìm thấy đá khô."
trTR = "Bütün barajı dolaşarak su sızan en küçük bir çatlak aradı ama sadece kuru taş buldu."

["BeaverFamilyTree.CauseOfDeath.Thirst.F.6"]
