["BeaverFamilyTree.CauseOfDeath.Thirst.0"]
new = "He licked at the cracked earth, hoping for even a drop of life-giving moisture, but never rose from the scorching ground again."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.Thirst.1"]
new = "His tongue stuck to the roof of his mouth, and the nearest canal was too far — thirst outran his legs."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.Thirst.2"]
new = "He gnawed a little hollow into the parched clay, still believing there was water down there somewhere."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.Thirst.3"]
new = "His throat burned worse than any fire — the water was right there, past the sluice, but the sluice was shut."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.Thirst.4"]
new = "He watched the distant water through clouding eyes and never managed that last stretch toward it."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.Thirst.5"]
new = "He circled the whole dam looking for even a crack seeping water, but found only dry stone."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.Thirst.6"]
new = "The jug by the doorway had stood empty for a week, and the river was too far for his weakened legs."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.Thirst.7"]
new = "He dug his burrow deeper and deeper, hoping to strike an underground spring, and struck only dry sand."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.Thirst.8"]
new = "Even dew on the leaves looked like salvation — but the morning came cloudless, and no dew fell."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.Thirst.9"]
new = "He watched the water flow through the sluice just a few steps away, but couldn't clear that last ledge."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.Thirst.10"]
new = "The hot wind drank the last of his strength before he could reach the watering hole."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.Thirst.11"]
new = "The reservoir had dropped so low that the water was out of reach even of an outstretched paw."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.Thirst.12"]
new = "He gulped at the air as if it could substitute for water — and fell silent halfway to the river."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.Thirst.13"]
new = "The dam held water beautifully — just not on the side where a beaver needed a drink."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.Thirst.14"]
new = "Thirst drove him mad enough that he started gnawing at his own tail, hoping for moisture."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.Thirst.15"]
new = "The last thing he saw was the sky reflected in water too far away to reach."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.Thirst.16"]
new = "He lay down in the dry riverbed, where water once splashed, and never got up again."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.Thirst.17"]
new = "No one noticed the water tank in the lodge had sprung a leak — the beaver noticed too late."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.Thirst.18"]
new = "He dragged himself toward the canal with his last strength, leaving a dry trail of crumbling earth behind him."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.Thirst.19"]
new = "Salt on cracked lips was all that remained of the long hours spent waiting for rain that never came."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.Hunger.0"]
new = "He gnawed and swallowed splinters of wood, hoping to fill his stomach with something — anything — but his strength ran out before the hunger did."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.Hunger.1"]
new = "The pantry had been empty for three days now — and with it went the strength to stay on his feet."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.Hunger.2"]
new = "He stripped the last bark off a log, but wood is no substitute for supper — his stomach stayed just as empty."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.Hunger.3"]
new = "His stomach cramped so badly that even sleep couldn't hide him from the hunger — and there was no one left to save him."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.Hunger.4"]
new = "He kept hauling logs to the dam right to the end, though it had been a long time since he'd held anything edible in his paws."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.Hunger.5"]
new = "He checked every pantry in the district — and found the same hollow echo of emptiness in each one."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.Hunger.6"]
new = "The harvest had failed that cycle, and he held on to hope for longer than his body could manage."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.Hunger.7"]
new = "He watched the others carrying logs and realized he no longer had the strength to carry even one."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.Hunger.8"]
new = "The bark on the young saplings looked like salvation, but there was too little of it, and too late."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.Hunger.9"]
new = "Work at the sawmill never let up for a moment — food, somehow, never showed up at all."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.Hunger.10"]
new = "He split his last scrap with the kits, keeping less and less for himself until there was nothing left."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.Hunger.11"]
new = "Hunger screamed loudest at night — and at night the storehouse was simply too far to walk."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.Hunger.12"]
new = "He tried to snag even a splinter out of the water by the sawmill, but the current was faster than his paws."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.Hunger.13"]
new = "The list of things he hadn't eaten in weeks was longer than the list of things he had."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.Hunger.14"]
new = "He collapsed right at the storehouse door — an empty storehouse that never got restocked in time."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.Hunger.15"]
new = "The young shoots he finally managed to reach turned out bitter and inedible."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.Hunger.16"]
new = "He rationed his strength all day to make it to food by evening — but evening came too late."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.Hunger.17"]
new = "The neighboring district shared its food without him — simply because no one knew he was starving."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.Hunger.18"]
new = "His stomach had long since stopped growling — his body had simply given up and stopped."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.Hunger.19"]
new = "He stared at the logs and wood chips stacked in the barn, knowing neither one would fill him up."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.OldAge.0"]
new = "He dozed off quietly in the sun, just as he had a thousand times before — only this time he didn't wake up."
status = "normal"

["BeaverFamilyTree.CauseOfDeath.OldAge.1"]
