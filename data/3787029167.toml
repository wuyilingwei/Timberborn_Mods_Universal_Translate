["BeaverFamilyTree.CauseOfDeath.Thirst.F.1"]
raw = "Her tongue stuck to the roof of her mouth, and the nearest canal was too far — thirst outran her legs."
status = "normal"
enUS = "Her tongue stuck to the roof of her mouth, and the nearest canal was too far — thirst outran her legs."
zhCN = "她的舌头粘在了上颚上，最近的运河太远——口渴超越了她的腿。"
zhTW = "她的舌頭黏在上顎，最近的運河距離太遠——口渴超越了她的雙腿。"
ruRU = "Её язык прилип к небу, а ближайший канал был слишком далеко — жажда обогнала её ноги."
jaJP = "「彼女の舌は口の上あごにくっつき、最寄りの運河は遠すぎた — 渇きが彼女の脚を超えた。」"
frFR = "Sa langue était collée au plafond de sa bouche, et le canal le plus proche était trop loin — la soif devança ses jambes."
deDE = "Zunge klebte am Gaumen und der nächste Kanal war zu weit entfernt – der Durst übertraf ihre Beine."
plPL = "Jej język przykleił się do podniebienia, a najbliższy kanał był zbyt daleko — pragnienie prześcignęło jej nogi."
ptBR = "Sua língua grudou no céu da boca, e o canal mais próximo estava longe demais — a sede superou suas pernas."
koKR = "그녀의 혀는 입천장에 붙어 있었고, 가장 가까운 운하는 너무 멀었다 — 목마름이 그녀의 다리를 앞질렀다."
csCZ = "Jazyk jí přilepnul k patru a nejbližší kanál byl příliš daleko — žízeň ji předběhla."
viVN = "Lưỡi của cô dính chặt vào vòm miệng, và kênh gần nhất thì quá xa — cơn khát nhanh hơn cả đôi chân cô."
trTR = "Dili damağına yapıştı ve en yakın kanal çok uzaktaydı — susuzluk bacaklarından hızlıydı."

["BeaverFamilyTree.CauseOfDeath.Thirst.F.2"]
raw = "She gnawed a little hollow into the parched clay, still believing there was water down there somewhere."
status = "normal"
enUS = "She gnawed a little hollow into the parched clay, still believing there was water down there somewhere."
zhCN = "“她在干裂的泥土中啃出一个小凹槽，仍然相信那里下方有水。”"
zhTW = "「她在焦渴的泥土上啃出一個小凹坑，仍然相信那裡面有水。」"
ruRU = "Она прогрызла небольшую ямку в пересохшей глине, все еще веря, что там внизу где-то есть вода."
jaJP = "「彼女は乾いた粘土に少し穴を開け、そこにどこか水があるとまだ信じていた。」"
frFR = "Elle a rongé un petit creux dans l'argile desséchée, croyant encore qu'il y avait de l'eau là-dessous quelque part."
deDE = "Sie nagte eine kleine Höhlung in den ausgetrockneten Ton, in der Hoffnung, dass sich irgendwo dort unten Wasser befand."
plPL = "Zgruzgotana trochę w suchą glinę, wciąż wierząc, że gdzieś tam na dole jest woda."
ptBR = "Ela roeu uma pequena cavidade na argila ressecada, ainda acreditando que havia água lá embaixo em algum lugar."
koKR = "그녀는 마른 점토에 작은 움푹 패인 자국을 남겼고, 그곳 어딘가에 물이 있을 것이라고 여전히 믿고 있었다."
csCZ = "Vytvořila v vyprahlé hlíně malou prohlubeň, stále věříc, že tam dole někde je voda."
viVN = "Cô ấy đã gặm một cái hốc nhỏ vào lớp đất khô cằn, vẫn tin rằng có nước ở đâu đó dưới đó."
trTR = "Kuru kilden biraz çiğnedi, orada bir yerde su olduğunu hâlâ inanarak."

["BeaverFamilyTree.CauseOfDeath.Thirst.F.3"]
raw = "Her throat burned worse than any fire — the water was right there, past the sluice, but the sluice was shut."
status = "normal"
enUS = "Her throat burned worse than any fire — the water was right there, past the sluice, but the sluice was shut."
zhCN = "“她的喉咙比任何火焰都要疼 — 水就在那儿，在水闸的另一边，但水闸关着。”"
zhTW = "她的喉嚨燃燒得比任何火焰都要劇烈——水就在那裡，過了水閘，但水閘卻關閉著。"
ruRU = "Её горло горело хуже любого огня — вода была прямо там, за затвором, но затвор был закрыт."
jaJP = "彼女の喉はどんな火よりもひどく焼けるようだった—水はすぐそこに、排水口の向こうにあったが、排水口は閉まっていた。"
frFR = "Sa gorge brûlait plus que n'importe quel feu – l'eau était juste là, derrière le canal, mais le canal était fermé."
deDE = "Ihr Hals brannte schlimmer als jedes Feuer – das Wasser war direkt dort, hinter dem Schleusentor, aber das Schleusentor war geschlossen."
plPL = "„Jej gardło paliło bardziej niż jakikolwiek ogień — woda była tuż obok, za śluzą, ale śluza była zamknięta.”"
ptBR = "Sua garganta ardia mais do que qualquer fogo — a água estava bem ali, além da comporta, mas a comporta estava fechada."
koKR = "그녀의 목은 어떤 불보다 더 뜨겁게 아팠다 — 물은 바로 저기, 수문을 지나 있었지만, 수문은 닫혀 있었다."
csCZ = "Její hrdlo pálilo víc než jakýkoli oheň – voda byla přímo tam, za zámkem, ale zámek byl zavřený."
viVN = "Cổ họng cô ngứa ngáy hơn bất kỳ ngọn lửa nào — nước ngay đó, qua cống, nhưng cống đã bị đóng."
trTR = "Boğazı, tüm ateşlerden daha fazla yanıyordu — su tam oradaydı, kapakların ardında ama kapak kapalıydı."

["BeaverFamilyTree.CauseOfDeath.Thirst.F.4"]
