["Building.TreatedStairs.Description"]
raw = "A refined variant of vertical traversal. The use of treated lumber removes any risk of injury from splintering boards."
status = "normal"
enUS = "A refined variant of vertical traversal. The use of treated lumber removes any risk of injury from splintering boards."
zhCN = "“垂直移动的精炼变体。使用处理过的木材消除了因木板开裂而造成伤害的风险。”"
zhTW = "「一種精緻的垂直通行變體。使用經處理的木材消除了因木板劈裂而造成的傷害風險。」"
ruRU = "Улучшенный вариант вертикального передвижения. Использование обработанной древесины устраняет риск травм от splintering досок."
jaJP = "「垂直移動の洗練されたバリアントです。処理された木材を使用することで、板のささくれからの怪我のリスクが排除されます。」"
frFR = "Une variante raffinée de la traversée verticale. L'utilisation de bois traité élimine tout risque de blessure dû aux éclats de planches."
deDE = "Eine verfeinerte Variante des vertikalen Traversierens. Die Verwendung von behandeltem Holz beseitigt das Risiko von Verletzungen durch splittrige Bretter."
plPL = "Udoskonalona wersja wspinaczki pionowej. Użycie impregnowanego drewna eliminuje ryzyko zranienia od drzazg."
ptBR = "Uma variante refinada de travessia vertical. O uso de madeira tratada elimina qualquer risco de lesão por lascas."
koKR = "수직 이동의 정제된 변형입니다. 처리된 목재의 사용은 갈라진 판재로 인한 부상 위험을 제거합니다."
csCZ = "Vylepšená varianta vertikálního pohybu. Použití ošetřeného dřeva eliminuje jakékoli riziko zranění od třísek."
viVN = "Một biến thể tinh tế của việc di chuyển theo chiều dọc. Việc sử dụng gỗ được xử lý loại bỏ bất kỳ rủi ro nào về chấn thương do các tấm ván bị phân mảnh."
trTR = "Dikey geçişin rafine bir versiyonu. İşlenmiş kereste kullanımı, kıymıklaşan tahtalardan kaynaklanan yaralanma riskini ortadan kaldırır."

["Building.TreatedStairs.FlavorDescription"]
raw = "By incorporating treated planks into the design, beavers achieved all the same up without any of the down(sides)."
status = "normal"
enUS = "By incorporating treated planks into the design, beavers achieved all the same ups without any of the downs."
zhCN = "通过将处理过的木板融入设计，海狸们实现了所有的优点，而没有任何缺点。"
zhTW = "通過將處理過的木板納入設計，海狸們實現了所有的優點，卻沒有任何缺點。"
ruRU = "Включив в дизайн обработанные доски, бобры достигли всех преимуществ без каких-либо недостатков."
jaJP = "「処理された板材をデザインに取り入れることで、ビーバーたちはデメリットを一切排除し、すべての利点を達成しました。」"
frFR = "En intégrant des planches traitées dans la conception, les castors ont réussi à obtenir tout le bon sans aucun des mauvais côtés."
deDE = "Durch die Verwendung von behandeltem Holz in der Konstruktion erreichten die Biber all das Gute, ohne die Nachteile."
plPL = "Wprowadzając zabezpieczone deski do projektu, bobry osiągnęły to samo bez żadnych wad."
ptBR = "Integrando tábuas tratadas no design, os castores conseguiram tudo isso sem nenhuma das desvantagens."
koKR = "처리된 판자를 디자인에 통합하여 비버들은 단점 없이 모든 장점을 얻었습니다."
csCZ = "Zavedením ošetřených prken do designu bizoni dosáhli všech výhod bez jakýchkoli nevýhod."
viVN = "Bằng cách kết hợp các tấm ván đã được xử lý vào thiết kế, những chú thuổng đã đạt được tất cả những điều tích cực mà không gặp phải bất kỳ điều tiêu cực nào."
trTR = "Tasarıma işlenmiş tahtalar ekleyerek, kunduzlar her türlü sorun yaşamadan aynı sonuçları elde ettiler."

