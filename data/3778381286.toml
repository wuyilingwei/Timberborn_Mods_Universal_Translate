["Building.TreatedSpiralStairs.Description"]
raw = "A refined variant of vertical traversal, with a twist. The use of treated lumber removes any risk of injury from splintering boards."
status = "normal"
enUS = "A refined variant of vertical traversal, with a twist. The use of treated lumber removes any risk of injury from splintering boards."
zhCN = "“经过精制的垂直移动变体，带有一个转折。使用处理过的木材消除了因木板裂纹而造成伤害的风险。”"
zhTW = "一種經過精緻加工的垂直攀爬變體，帶有一絲趣味。使用經處理的木材消除了因木板劈裂而造成的傷害風險。"
ruRU = "Отшлифованный вариант вертикального перемещения с изюминкой. Использование обработанной древесины исключает риск травмы от расколотых досок."
jaJP = "「ひねりのある垂直移動の洗練されたバリエーション。処理された木材の使用により、ひび割れたボードによる怪我のリスクが排除されます。」"
frFR = "Une variante raffinée de la traversée verticale, avec une touche. L'utilisation de bois traité élimine tout risque de blessures causées par des planches éclatées."
deDE = "Eine verfeinerte Variante der vertikalen Fortbewegung mit einem Twist. Die Verwendung von behandelt Holz beseitigt jegliches Risiko von Verletzungen durch spaltende Bretter."
plPL = "Udoskonalona wersja pionowego przemieszczania się, z zaskoczeniem. Użycie impregnowanego drewna eliminuje ryzyko obrażeń spowodowanych odpryskami desek."
ptBR = "Uma variante refinada de travessia vertical, com um toque especial. O uso de madeira tratada elimina qualquer risco de lesões devido a tábuas lascadas."
koKR = "비틀림이 있는 수직 이동의 정제된 변형입니다. 처리된 목재를 사용하여 갈라짐으로 인한 부상 위험을 제거합니다."
csCZ = "Zpevněná varianta vertikálního přesunu, se šmrncem. Použití ošetřeného dřeva eliminuje riziko zranění od třísek."
viVN = "Một biến thể tinh chế của việc di chuyển theo chiều dọc, có một chút khác biệt. Việc sử dụng gỗ đã xử lý loại bỏ mọi nguy cơ chấn thương do các thanh gỗ bị splinter."
trTR = "Dönüşlü, dikey geçişin yalın bir varyasyonu. İşlenmiş ahşap kullanımı, tahtaların talaşlanmasından kaynaklanabilecek yaralanma riskini ortadan kaldırır."

["Building.TreatedSpiralStairs.FlavorDescription"]
raw = "\"Now the kits get themselves dizzy without getting hurt.\" —Ma' Ngonel"
status = "normal"
enUS = "\"Now the kits get themselves dizzy without getting hurt.\" —Ma' Ngonel"
zhCN = "“现在工具包自己头晕却不会受伤。” — 马·恩戈内尔"
zhTW = "“現在這些組件可以旋轉而不會受傷。” —馬·恩戈內爾"
ruRU = "\"Теперь наборы кружатся без ущерба для себя.\" —Ма' Нгонел"
jaJP = "「今ではキットたちが傷つくことなく目が回ってしまう。」 —マ・ンゴネル"
frFR = "\"Maintenant, les kits se tournent sans se blesser.\" —Ma' Ngonel"
deDE = "„Jetzt bekommen die Kits Schwindelgefühle, ohne sich dabei weh zu tun.“ —Ma' Ngonel"
plPL = "\"Teraz zestawy dostają zawrotów głowy, nie odnosząc żadnych obrażeń.\" —Ma' Ngonel"
ptBR = "\"Agora os kits ficam tontos sem se machucar.\" —Ma' Ngonel"
koKR = "\"이제 키트들이 다치지 않고도 어지러워진다.\" —마 응곤엘"
csCZ = "\"Nyní se stavebníci točí, aniž by si ublížili.\" —Ma' Ngonel"
viVN = "\"Bây giờ những bộ kit sẽ tự chóng mặt mà không bị thương.\" —Ma' Ngonel"
trTR = "\"Artık setler kendilerini baş döndürüyor ama zarar görmüyor.\" —Ma' Ngonel"
