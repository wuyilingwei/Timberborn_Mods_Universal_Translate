[_meta]
name = "Cheap & Treated Stairs"

["Building.CheapStairs.Description"]
raw = "A cheap and crude form of vertical traversal. Beavers occasionally get splinters from the untreated lumber."
status = "normal"
enUS = "A cheap and crude form of vertical traversal. Beavers occasionally get splinters from the untreated lumber."
zhCN = "一种廉价且粗糙的垂直通行方式。海狸偶尔会因为未处理的木材而扎到刺。"
zhTW = "「一種便宜且粗糙的垂直攀爬方式。河狸偶爾會從未處理的木材上扎到刺。」"
ruRU = "Дешёвая и грубая форма вертикального передвижения. Бобры иногда получают занозы от необработанного дерева."
jaJP = "安価で粗雑な垂直移動の手段。ビーバーは時折、処理されていない木材からささくれをもらうことがあります。"
frFR = "Une forme bon marché et rudimentaire de déplacement vertical. Les castors se coincent parfois des échardes provenant du bois non traité."
deDE = "Eine billige und grobe Form der vertikalen Fortbewegung. Biber bekommen gelegentlich Splitter vom unbehandelten Holz."
plPL = "Tania i prymitywna forma pionowego poruszania się. Bobry czasami dostają drzazg od nieobrobionego drewna."
ptBR = "Uma forma barata e rudimentar de travessia vertical. Castores ocasionalmente se machucam com lascas da madeira não tratada."
koKR = "저렴하고 조잡한 수직 이동 방식입니다. 비버들은 때때로 처리되지 않은 목재에서 나무 조각이 박힙니다."
csCZ = "Levná a hrubá forma vertikálního přechodu. Bobři občas dostanou třísky z neošetřeného dřeva."
viVN = "Một hình thức di chuyển thẳng đứng rẻ tiền và thô kệch. Nhím thỉnh thoảng bị dằm từ gỗ chưa xử lý."
trTR = "Ucuz ve ilkel bir dikey geçiş şekli. Kundaklamadan yapılmış tahtalardan dolayı geyiklerin bazen kıymık vardır."

["Building.CheapSpiralStairs.Description"]
raw = "A cheap and crude form of vertical traversal, with a twist. Beavers occasionally get splinters from the untreated lumber."
status = "normal"
enUS = "A cheap and crude form of vertical traversal, with a twist. Beavers occasionally get splinters from the untreated lumber."
zhCN = "一种便宜且粗糙的垂直通行方式，带有一些曲折。海狸偶尔会从未经处理的木材上扎到刺。"
zhTW = "一種廉價而粗糙的垂直攀爬方式，帶有一點曲折。河狸偶爾會因未經處理的木材而受傷。"
ruRU = "Дешёвая и грубая форма вертикального передвижения с поворотом. Бобры иногда получают занозы от необработанного дерева."
jaJP = "「安価で粗雑な垂直移動の形態、ひねりあり。ビーバーは時々、未処理の木材からささくれをもらいます。」"
frFR = "Une forme bon marché et rudimentaire de traversée verticale, avec une tournure. Les castors obtiennent parfois des échardes du bois non traité."
deDE = "Eine billige und grobe Form der vertikalen Fortbewegung mit einem Dreh. Biber ziehen sich gelegentlich Holzsplitter aus dem unbehandelten Holz."
plPL = "Tanie i prymitywne formy pionowego poruszania się, z małym zagięciem. Bobry czasami dostają drzazg z nieprzetartego drewna."
ptBR = "Uma forma barata e rudimentar de travessia vertical, com uma reviravolta. Os castores ocasionalmente recebem farpas da madeira não tratada."
koKR = "비틀린 형태의 저렴하고 조잡한 수직 통과 방식. 비버들은 가끔 치료되지 않은 목재에서 가시가 나곤 합니다."
csCZ = "Levná a hrubá forma vertikálního pohybu s twistem. Bobři občas dostanou třísky z neošetřeného dřeva."
viVN = "Một hình thức di chuyển thẳng đứng rẻ tiền và thô sơ, với một chút sáng tạo. Những chú nhím đôi khi bị dằm từ những cây gỗ chưa qua chế biến."
trTR = "Ucuz ve ilkel bir dikey geçiş biçimi, bir kıvrımla. Kutlular ara sıra işlenmemiş odunlardan parçalar alıyor."

