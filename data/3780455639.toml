trTR = "Hasat edilen ürünlerden, tatlandırıcılardan ve temiz sudan alkolik içecekler üretir."

["Building.AlcoholStove.FlavorDescription"]
raw = "The rich aroma of brewing alcohol attracts beavers looking for something a little stronger."
status = "normal"
enUS = "The rich aroma of brewing alcohol attracts beavers looking for something a little stronger."
zhCN = "酿造酒精的浓郁香气吸引了寻找更强烈刺激的海狸。"
zhTW = "釀造酒精的濃郁香氣吸引著尋找更強烈飲品的河狸。"
ruRU = "Богатый аромат варки алкоголя привлекает бобров, ищущих что-то чуть посильнее."
jaJP = "醸造されたアルコールの豊かな香りは、少し強めのものを求めるビーバーたちを引き寄せます。"
frFR = "L'arôme riche de l'alcool en cours de fermentation attire les castors à la recherche de quelque chose d'un peu plus fort."
deDE = "Das reiche Aroma von brauendem Alkohol zieht Biber an, die nach etwas Stärkerem suchen."
plPL = "Bogaty aromat warzenia alkoholu przyciąga bobry szukające czegoś nieco mocniejszego."
ptBR = "O rico aroma do álcool em fermentação atrai castores em busca de algo um pouco mais forte."
koKR = "양조된 알코올의 풍부한 향기가 조금 더 강한 것을 찾고 있는 비버들을 끌어들입니다."
csCZ = "Bohatá vůně vaření alkoholu přitahuje bobry hledající něco o něco silnějšího."
viVN = "Ánh thơm đậm đà của rượu đang được ủ thu hút những con thú nhấm nháp tìm kiếm một thứ gì đó mạnh mẽ hơn."
trTR = "Zengin biralar brewing alkol aroması, biraz daha güçlü bir şey arayan kunduzları kendine çekiyor."

