["Building.DrinkStove.Description"]
raw = "Produces refreshing drinks and fruit beverages from harvested crops and fresh water."
status = "normal"
enUS = "Produces refreshing drinks and fruit beverages from harvested crops and fresh water."
zhCN = "“利用收获的农作物和淡水制作清爽的饮品和果汁。”"
zhTW = "將收穫的作物和新鮮水製作成清涼飲品和水果飲料。"
ruRU = "Изготавливает освежающие напитки и фруктовые напитки из собранных культур и пресной воды."
jaJP = "収穫した作物と新鮮な水から、さわやかな飲み物や果実飲料を生成します。"
frFR = "Produits des boissons rafraîchissantes et des boissons aux fruits à partir des cultures récoltées et de l'eau douce."
deDE = "Stellt erfrischende Getränke und Fruchtsäfte aus geernteten Pflanzen und frischem Wasser her."
plPL = "Produkuje orzeźwiające napoje i soki owocowe z zebranych plonów oraz świeżej wody."
ptBR = "Produz bebidas refrescantes e bebidas de frutas a partir de colheitas e água doce."
koKR = "수확한 농작물과 신선한 물로 상큼한 음료와 과일 음료를 만듭니다."
csCZ = "Vyrábí osvěžující nápoje a ovocné nápoje ze sklízených plodin a čerstvé vody."
viVN = "Sản xuất đồ uống ngon refreshing và nước trái cây từ cây trồng thu hoạch và nước sạch."
trTR = "Hasat edilen ürünler ve temiz sudan ferahlatıcı içecekler ve meyve içecekleri üretir."

["Building.DrinkStove.FlavorDescription"]
raw = "The scent of freshly prepared fruit drinks draws thirsty beavers from all around."
status = "normal"
enUS = "The scent of freshly prepared fruit drinks draws thirsty beavers from all around."
zhCN = "“新鲜果饮的香气吸引着四面八方口渴的海狸。”"
zhTW = "新鮮水果飲料的香氣吸引了四周口渴的海狸。"
ruRU = "Запах свежеприготовленных фруктовых напитков привлекает жаждущих бобров со всех концов."
jaJP = "新鮮に作られたフルーツドリンクの香りが、周囲の渇いたビーバーたちを引き寄せる。"
frFR = "Le parfum de boissons aux fruits fraîchement préparées attire les castors assoiffés de partout."
deDE = "Der Duft von frisch zubereiteten Fruchtgetränken zieht durstige Biber aus der ganzen Umgebung an."
plPL = "Zapach świeżo przygotowanych owocowych napojów przyciąga spragnione bobry zewsząd."
ptBR = "O aroma de bebidas de frutas recém-preparadas atrai castores sedentos de todos os lugares."
koKR = "갓 준비한 과일 음료의 향이 목이 마른 비버들을 사방에서 이끌어온다."
csCZ = "Aroma čerstvě připravených ovocných nápojů přitahuje žíznivé bobry ze všech stran."
viVN = "Mùi của những đồ uống trái cây mới được chuẩn bị thu hút những con hải ly khát nước từ khắp nơi."
trTR = "Yeni hazırlanmış meyve içeceklerinin kokusu, her yerden susamış kunduzları çeker."

