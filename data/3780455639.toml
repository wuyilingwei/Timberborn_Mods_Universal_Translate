["Building.SoupStove.Description"]
raw = "Produces hearty soups and nourishing meals from harvested crops and fresh water."
status = "normal"
enUS = "Produces hearty soups and nourishing meals from harvested crops and fresh water."
zhCN = "“从收获的农作物和新鲜水源中制作丰盛的汤和营养餐。”"
zhTW = "從收穫的作物和新鮮水源中製作豐富的湯和營養餐。"
ruRU = "Производит сытные супы и питательные блюда из собранных культур и свежей воды."
jaJP = "「収穫した作物と新鮮な水から、ボリュームたっぷりのスープや栄養満点の食事を作ります。」"
frFR = "Produit des soupes copieuses et des repas nourrissants à partir des cultures récoltées et de l'eau fraîche."
deDE = "Stellt herzhafte Suppen und nahrhafte Mahlzeiten aus geernteten Pflanzen und frischem Wasser her."
plPL = "Produkuje sycące zupy i pożywne posiłki z zebranych upraw i świeżej wody."
ptBR = "Produz sopas sustanciosas e refeições nutritivas a partir de culturas colhidas e água fresca."
koKR = "수확한 농작물과 신선한 물로 푸짐한 수프와 영양가 있는 식사를 만듭니다."
csCZ = "Vyrábí vydatné polévky a výživná jídla z načesaných plodin a čerstvé vody."
viVN = "Chế biến các món súp bổ dưỡng và bữa ăn từ rau củ thu hoạch và nước sạch."
trTR = "Hasat edilen mahsuller ve temiz sudan doyurucu çorbalar ve besleyici yemekler üretir."

["Building.SoupStove.FlavorDescription"]
raw = "The warm aroma of freshly cooked soup fills the air and draws hungry beavers from all around."
status = "normal"
enUS = "The warm aroma of freshly cooked soup fills the air and draws hungry beavers from all around."
zhCN = "“新煮的汤散发出温暖的香气，吸引着四面八方的饥饿海狸。”"
zhTW = "新煮的湯散發出溫暖的香氣，吸引著四周的饑餓海狸。"
ruRU = "Тёплый аромат свежеприготовленного супа наполняет воздух и привлекает голодных бобров со всех концов."
jaJP = "「新しく作ったスープの温かい香りが空気を満たし、周りの空腹のビーバーたちを引き寄せます。」"
frFR = "L'arôme chaud de la soupe fraîchement cuisinée emplit l'air et attire les castors affamés des environs."
deDE = "Der warme Duft von frisch gekochter Suppe erfüllt die Luft und zieht hungrige Biber aus der Umgebung an."
plPL = "Ciepły aromat świeżo ugotowanej zupy wypełnia powietrze i przyciąga głodne bobry z każdej strony."
ptBR = "O aroma quente de sopa recém-cozida preenche o ar e atrai castores famintos de toda parte."
koKR = "갓 요리한 수프의 따뜻한 향기가 공기를 가득 채우고, 주위에서 배고픈 비버들을 이끌어냅니다."
csCZ = "Teplá vůně čerstvě uvařené polévky naplňuje vzduch a přitahuje hladové bobry ze všech stran."
viVN = "Hương thơm ấm áp của món súp mới nấu lan tỏa trong không khí và thu hút những chú hải ly đói từ khắp nơi."
trTR = "Taze pişmiş çorbanın sıcak aroması havayı doldurur ve aç gözlü kunduzları her yerden çeker."

