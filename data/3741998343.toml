["IgorZ.XRay.MeshSettings.IgnoreVisibleLevel.Note"]
raw = "Show the full terrain mesh in X-Ray mode, even when the game's layer visibility tool hides upper levels."
status = "normal"
enUS = "Show the full terrain mesh in X-Ray mode, even when the game's layer visibility tool hides upper levels."
zhCN = "在X-Ray模式下显示完整地形网格，即使游戏的层可见性工具隐藏了上层。"
zhTW = "在X-Ray模式下顯示完整的地形網格，即使遊戲的層級可見性工具隱藏了上層。"
ruRU = "Показать полную сетку местности в режиме рентгена, даже когда инструмент видимости слоев игры скрывает верхние уровни."
jaJP = "ゲームのレイヤー表示ツールが上層を隠している場合でも、X-Rayモードで全地形メッシュを表示します。"
frFR = "Afficher le maillage de terrain complet en mode X-Ray, même lorsque l'outil de visibilité des couches du jeu masque les niveaux supérieurs."
deDE = "Zeige das vollständige Terrain-Mesh im X-Ray-Modus, auch wenn das Sichtbarkeitstool der Ebenen des Spiels die oberen Ebenen ausblendet."
plPL = "Pokaż pełną siatkę terenu w trybie X-Ray, nawet gdy narzędzie widoczności warstw w grze ukrywa górne poziomy."
ptBR = "Mostre a malha completa do terreno no modo X-Ray, mesmo quando a ferramenta de visibilidade de camadas do jogo oculta níveis superiores."
koKR = "게임의 레이어 가시성 도구가 상층을 숨기더라도 X-Ray 모드에서 전체 지형 메쉬를 표시합니다."
csCZ = "Zobrazit celý terénní povrch v režimu X-Ray, i když nástroj pro viditelnost vrstev hry skrývá vyšší úrovně."
viVN = "Hiển thị toàn bộ lưới địa hình trong chế độ X-Ray, ngay cả khi công cụ hiển thị lớp của trò chơi ẩn các lớp trên cùng."
trTR = "X-Ray modunda, oyunun katman görünürlük aracı üst katmanları gizlese bile, tam arazi ağını göster."

