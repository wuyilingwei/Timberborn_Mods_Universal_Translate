["LV.BCEv.BadtideDrainExcavation.O1"]
raw = "The colony commits the goods. For days, beavers cut, brace, haul, and dig at the edge of the poisoned corner until the sealed hooman chamber finally cracks open.\nInside is not a valve. It is not a pump. It is a dormant <RedHighlight>Unstable Core</RedHighlight>.\nThe moment the final seal breaks, the core wakes with a violent hum. Sickly light pulses through the chamber, and the scientist realizes the truth too late. The core was built to destroy the Badtide Drain by tearing the system apart from within. Now it has begun.\nThe core will detonate in a few days. The drain may be destroyed forever, but everything nearby will be destroyed with it.\n<RedHighlight>Prepare the colony!</RedHighlight>\n[[-]]{CP_InjuryVictims_Count} beavers were injured during the excavation."
status = "normal"
enUS = "The colony commits the goods. For days, beavers cut, brace, haul, and dig at the edge of the poisoned corner until the sealed human chamber finally cracks open. Inside is not a valve. It is not a pump. It is a dormant <RedHighlight>Unstable Core</RedHighlight>. The moment the final seal breaks, the core wakes with a violent hum. Sickly light pulses through the chamber, and the scientist realizes the truth too late. The core was built to destroy the Badtide Drain by tearing the system apart from within. Now it has begun. The core will detonate in a few days. The drain may be destroyed forever, but everything nearby will be destroyed with it. <RedHighlight>Prepare the colony!</RedHighlight> [[-]]{CP_InjuryVictims_Count} beavers were injured during the excavation."
zhCN = "殖民地开始投入物资。几天来，海狸们在被污染的角落边缘砍伐、支撑、搬运和挖掘，直到密封的人类密室终于崩裂。\n里面不是阀门，也不是泵。它是一个沉睡的<RedHighlight>不稳定核心</RedHighlight>。\n最后的密封破裂的瞬间，核心发出剧烈的嗡鸣声。病态的光芒在密室中闪烁，科学家意识到真相时已为时已晚。这个核心是为了摧毁坏潮排水装置而从内部撕裂系统而建造的。现在它已经开始。\n核心将在几天内引爆。排水系统可能会被永远摧毁，但周围的一切也将随之毁灭。\n<RedHighlight>准备殖民地！</RedHighlight>\n[[-]]{CP_InjuryVictims_Count} 只海狸在挖掘过程中受伤。"
zhTW = "殖民地開始運送物資。幾天來，海狸們在這個被污染的角落的邊緣不斷地砍伐、加固、搬運和挖掘，直到封閉的人類密室終於裂開。\n裡面不是閥門。也不是水泵。它是一個休眠的<RedHighlight>不穩定核心</RedHighlight>。\n當最後一道封印破裂的那一刻，核心以猛烈的嗡嗡聲甦醒。病態的光芒在密室中脈動，科學家過於遲鈍地意識到真相。這個核心是為了摧毀壞潮排水系統而建，通過從內部撕裂這個系統。現在它已經開始了。\n核心將在幾天內引爆。排水系統可能會永遠被毀，但附近的一切都將隨之毀滅。\n<RedHighlight>準備殖民地！</RedHighlight>\n[[-]]{CP_InjuryVictims_Count} 隻海狸在挖掘過程中受傷。"
ruRU = "Колония выделяет ресурсы. На протяжении нескольких дней бобры рубят, укрепляют, перетаскивают и копают на краю отравленного угла, пока запечатанная человеческая камера наконец не трескается.\nВнутри нет клапана. Это не насос. Это неактивное <RedHighlight>Нестабильное Ядро</RedHighlight>.\nВ тот момент, когда последний seal ломается, ядро пробуждается с violent hum. Больной свет пульсирует по камере, и ученый осознает правду слишком поздно. Ядро было создано, чтобы уничтожить Дренаж Бадтайда, разрывая систему изнутри. Теперь это началось.\nЯдро взорвется через несколько дней. Дренаж может быть уничтожен навсегда, но все вокруг также будет уничтожено.\n<RedHighlight>Подготовьте колонию!</RedHighlight>\n[[-]]{CP_InjuryVictims_Count} бобров были ранены во время раскопок."
jaJP = "コロニーは物資を捧げる。数日間、ビーバーたちは毒に侵されたコーナーの端で切り、支え、運び、掘り続け、ついに封印された人間の部屋がひび割れる。\n中にはバルブもポンプもない。それは休眠中の<RedHighlight>不安定なコア</RedHighlight>だ。\n最後の封印が壊れた瞬間、コアは激しいハム音と共に目を覚ます。病的な光が部屋を照らし、科学者は真実に気づくのが遅すぎた。コアはシステムを内部から引き裂いてバッドタイド排水槽を破壊するために作られた。今、それが始まった。\nコアは数日以内に炸裂するだろう。排水槽は永遠に破壊されるかもしれないが、その近くにあるすべても破壊されるだろう。\n<RedHighlight>コロニーを準備せよ！</RedHighlight>\n[[-]]{CP_InjuryVictims_Count} のビーバーが掘削中に負傷した。"
frFR = "La colonie engage les ressources. Pendant des jours, les castors coupent, renforcent, transportent et creusent au bord du coin empoisonné jusqu'à ce que la chambre scellée des humains finisse par se fissurer. \nÀ l'intérieur, il n'y a pas de vanne. Ce n'est pas une pompe. C'est un <RedHighlight>Noyau Instable</RedHighlight> dormant. \nAu moment où le dernier sceau se brise, le noyau s'éveille avec un bourdonnement violent. Une lumière malade pulse à travers la chambre, et le scientifique réalise la vérité trop tard. Le noyau a été conçu pour détruire le Badtide Drain en déchirant le système de l'intérieur. Maintenant, c'est commencé. \nLe noyau va détoner dans quelques jours. Le drain pourrait être détruit pour toujours, mais tout ce qui l'entoure sera détruit avec lui. \n<RedHighlight>Préparez la colonie !</RedHighlight> \n[[-]]{CP_InjuryVictims_Count} castors ont été blessés pendant les fouilles."
deDE = "Die Kolonie stellt die Güter bereit. Tage lang schneiden, stützen, ziehen und graben die Biber am Rand der vergifteten Ecke, bis die versiegelte Menschenkammer schließlich aufbricht.  \nInnen ist kein Ventil. Es ist keine Pumpe. Es ist ein schlafender <RedHighlight>Instabiler Kern</RedHighlight>.  \nIn dem Moment, in dem das letzte Siegel bricht, erwacht der Kern mit einem gewaltsamen Summen. Kränkliches Licht pulsiert durch die Kammer, und der Wissenschaftler erkennt die Wahrheit zu spät. Der Kern wurde gebaut, um den Badtide Drain zu zerstören, indem er das System von innen heraus auseinanderreißt. Jetzt hat er begonnen.  \nDer Kern wird in wenigen Tagen detonieren. Der Abfluss könnte für immer zerstört werden, aber alles in der Nähe wird mit ihm zerstört.  \n<RedHighlight>Bereitet die Kolonie vor!</RedHighlight>  \n[[-]]{CP_InjuryVictims_Count} Biber wurden während der Ausgrabung verletzt."
plPL = "Kolonia angażuje dobra. Przez dni bobry wycinają, wzmacniają, transportują i kopią na skraju zatrutego zakątka, aż w końcu uszczelniona komora ludzkich zostaje otwarta. \nW środku nie ma zaworu. To nie jest pompa. To uśpione <RedHighlight>Niestałe Jądro</RedHighlight>. \nW chwili, gdy ostateczna uszczelka pęka, jądro budzi się z gwałtownym brzęczeniem. Chory światło pulsuje przez komorę, a naukowiec zdaje sobie sprawę z prawdy za późno. Jądro zostało zbudowane, aby zniszczyć Odpływ Zatrutej Wody poprzez rozdzieranie systemu od wewnątrz. Teraz to się zaczęło. \nJądro wybuchnie za kilka dni. Odpływ może zostać zniszczony na zawsze, ale wszystko w pobliżu zostanie zniszczone razem z nim. \n<RedHighlight>Przygotuj kolonię!</RedHighlight> \n[[-]]{CP_InjuryVictims_Count} bobrów zostało rannych podczas wykopalisk."
ptBR = "A colônia compromete os bens. Por dias, os castores cortam, reforçam, transportam e cavam na borda do canto envenenado até que a câmara selada dos humanos finalmente se rompa.\nDentro não há uma válvula. Não há uma bomba. É um <RedHighlight> núcleo instável </RedHighlight> adormecido.\nNo momento em que o último selo se quebra, o núcleo acorda com um zumbido violento. Uma luz doentia pulsa através da câmara, e o cientista percebe a verdade tarde demais. O núcleo foi construído para destruir o Drenagem de Maré Alta ao despedaçar o sistema de dentro. Agora, começou.\nO núcleo irá detonar em alguns dias. O dreno pode ser destruído para sempre, mas tudo nas proximidades será destruído junto com ele.\n<RedHighlight> Prepare a colônia! </RedHighlight>\n[[-]]{CP_InjuryVictims_Count} castores foram feridos durante a escavação."
koKR = "식민지는 물품을 투입합니다. 며칠 동안 비버들은 독이 스민 구석의 가장자리를 잘라내고, 지지대와 운반, 파내기를 반복합니다. 결국 밀폐된 인간의 방이 마침내 금이 갑니다.\n안에는 밸브가 없습니다. 펌프도 아닙니다. 그것은 비활성 <RedHighlight>불안정한 핵</RedHighlight>입니다.\n마지막 봉인이 깨지는 순간, 핵이 폭발적인 윙윙거림과 함께 깨어납니다. 아픈 빛이 방을 가로질러 맥동하며 과학자는 진실을 너무 늦게 깨닫습니다. 이 핵은 내부에서부터 시스템을 파괴하여 Badtide Drain을 파괴하도록 설계되었습니다. 이제 그 시작입니다.\n핵은 며칠 내에 폭발할 것입니다. 배수구는 영원히 파괴될 수 있지만, 근처의 모든 것도 함께 파괴될 것입니다.\n<RedHighlight>식민지를 준비하라!</RedHighlight>\n[[-]]{CP_InjuryVictims_Count} 명의 비버가 발굴 작업 중 부상을 입었습니다."
csCZ = "Kolonie zavazuje zboží. Dny, bobři seklili, podpírali, tahali a kopali na okraji otráveného místa, dokud se nakonec uzavřená komnata člověka konečně neroztrhne. \nUvnitř není ventil. Není to pumpa. Je to dormantní <RedHighlight>Nestabilní Jádro</RedHighlight>. \nVe chvíli, kdy se poslední pečeť rozbije, jádro se probouzí s násilným humem. Zelená světlo pulzuje komorou a vědec si uvědomuje pravdu příliš pozdě. Jádro bylo postaveno, aby zničilo Badtide Drain tím, že systém roztrhne zevnitř. Nyní začalo. \nJádro vybuchne během několika dní. Odtok může být zničen navždy, ale všechno poblíž bude zničeno spolu s ním. \n<RedHighlight>Připravte kolonii!</RedHighlight> \n[[-]]{CP_InjuryVictims_Count} bobrů bylo zraněno během vykopávky."
viVN = "Colony cam kết hàng hóa. Trong nhiều ngày, những con rái cá đã cắt, chống đỡ, kéo và đào ở rìa góc bị nhiễm độc cho đến khi căn phòng người được niêm phong cuối cùng cũng nứt ra.\nBên trong không phải là một van. Nó không phải là một máy bơm. Nó là một <RedHighlight>Nhân Tố Không Ổn Định</RedHighlight> đang ngủ.\nNgay khoảnh khắc mà con niêm phong cuối cùng bị phá vỡ, nhân tố bùng tỉnh với một tiếng vo ve dữ dội. Ánh sáng ốm yếu chớp nháy khắp phòng, và nhà khoa học nhận ra sự thật quá muộn. Nhân tố được tạo ra để tiêu diệt Badtide Drain bằng cách xé nát hệ thống từ bên trong. Bây giờ điều đó đã bắt đầu.\nNhân tố sẽ phát nổ trong vài ngày. Cống dẫn có thể sẽ bị phá hủy mãi mãi, nhưng mọi thứ xung quanh sẽ cùng bị hủy diệt.\n<RedHighlight>Chuẩn bị cho thuộc địa!</RedHighlight>\n[[-]]{CP_InjuryVictims_Count} con rái cá đã bị thương trong quá trình khai thác."
trTR = "Koloni mal varlıklarını taahhüt ediyor. Günlerce, kunduzlar zehirli köşenin kenarında kesip, destekleyip, taşıyıp ve kazıyorlar, ta ki mühürlü insan odası sonunda çatlayana dek. İçeride bir vana yok. Bir pompa yok. Uykuda olan bir <RedHighlight>Kararsız Çekirdek</RedHighlight> var. Son mühür kırıldığı anda, çekirdek gürültülü bir vızıltıyla uyanıyor. Hasta bir ışık odanın içinde pulsatör gibi yanıp sönüyor ve bilim insanı gerçeği çok geç anlıyor. Çekirdek, Badtide Drenajını içeriden parçalayarak yok etmek için inşa edilmişti. Şimdi bu başlamış durumda. Çekirdek birkaç gün içinde patlayacak. Drenaj sonsuza dek yok olabilir, ama çevresindekilerin hepsiyle birlikte yok olacak. <RedHighlight>Koloniyi hazırlayın!</RedHighlight> [[-]]{CP_InjuryVictims_Count} kunduz kazı sırasında yaralandı."

["LV.BCEv.BadtideDrainExcavation.O2"]
raw = "The order is given to stop.\nThe scientist argues for one more day, one more test, one more look beneath the stone. But the decision holds.\nThe notes are stored away, the tools are carried home, and the Badtide Drain remains untouched."
status = "normal"
enUS = "The order is given to stop.  \nThe scientist argues for one more day, one more test, one more look beneath the stone. But the decision holds.  \nThe notes are stored away, the tools are carried home, and the Badtide Drain remains untouched."
zhCN = "命令下达停止。\n科学家争辩再多一天，再多一次测试，再多看一眼石头下的情况。但决定已定。\n笔记被收起，工具被带回家，汪潮排水依然未被触碰。"
zhTW = "命令下達停止。\n科學家主張再多一天、再多一個測試、再多看一眼石頭底下。但這個決定仍然堅守。\n筆記被存放起來，工具被帶回家，而壞潮排水系統仍然未被觸碰。"
ruRU = "Приказ дан остановиться. Ученый настаивает на еще одном дне, еще одном испытании, еще одном взгляде под камень. Но решение остается в силе. Записки убраны, инструменты унесены домой, и дренаж завода Бэдтайд остается нетронутым."
jaJP = "「命令は停止するように出される。科学者はもう一日、もう一回のテスト、もう一度石の下を見るように主張する。しかし、決定は揺るがない。ノートはしまわれ、道具は持ち帰られ、バッドタイドドレインは手つかずのままである。」"
frFR = "L'ordre est donné d'arrêter.  \nLe scientifique plaide pour un jour de plus, un test de plus, un regard de plus sous la pierre. Mais la décision tient.  \nLes notes sont rangées, les outils sont emportés à la maison, et le Badtide Drain reste intact."
deDE = "Der Befehl wird gegeben, anzuhalten.\nDer Wissenschaftler plädiert für einen weiteren Tag, einen weiteren Test, einen weiteren Blick unter den Stein. Aber die Entscheidung bleibt bestehen.\nDie Notizen werden weggelegt, die Werkzeuge nach Hause getragen und der Badtide Drain bleibt unberührt."
plPL = "Rozkaz został wydany, aby przerwać.\nNaukowiec argumentuje za jeszcze jednym dniem, jeszcze jednym testem, jeszcze jednym spojrzeniem pod kamień. Ale decyzja jest nieodwracalna.\nNotatki są schowane, narzędzia zostają zabrane do domu, a Badtide Drain pozostaje nietknięty."
ptBR = "A ordem é dada para parar.  \nO cientista argumenta por mais um dia, mais um teste, mais uma olhada sob a pedra. Mas a decisão se mantém.  \nAs anotações são guardadas, as ferramentas são levadas para casa, e o Dreno da Maré Ruim permanece intocado."
koKR = "명령이 중지된다.\n과학자는 하루 더, 한 번 더 시험하자고, 돌 밑을 한 번 더 살펴보자고 주장하지만, 결정은 확고하다.\n노트는 치워지고, 도구는 집으로 옮겨지며, 바다의 저체 Drain은 손대지 않은 채로 남아 있다."
csCZ = "Příkaz byl vydán k zastavení.\nVědec se dožaduje ještě jednoho dne, dalšího testu, dalšího pohledu pod kamenem. Ale rozhodnutí zůstává.\nPoznámky jsou uloženy, nástroje odneseny domů a Badtide Drain zůstává nedotčen."
viVN = "Đơn đã được ra lệnh dừng lại.  \nNhà khoa học tranh luận thêm một ngày, thêm một thử nghiệm, thêm một cái nhìn nữa dưới viên đá. Nhưng quyết định vẫn giữ nguyên.  \nCác ghi chú được cất đi, công cụ được mang về nhà, và Badtide Drain vẫn chưa bị động đến."
trTR = "Emir verildi, durdurun.\nBilim insanı bir gün daha, bir test daha, taşa bakmak için bir şans daha istiyor. Ama karar kesin.\nNotlar saklandı, aletler eve götürüldü ve Badtide Drenajı dokunulmamış kaldı."

