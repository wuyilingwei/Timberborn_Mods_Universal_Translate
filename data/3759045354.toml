["LV.BCEv.Taco.Content"]
raw = "A scavenger returns from the old hooman ruins carrying a brittle scrap of stained paper. Most of the words have faded, but one remains clear: <YellowHighlight>Taco</YellowHighlight>. No one knows what it means.\nA crude drawing appears to show food folded inside another kind of food. The cooks believe they could reproduce it, but no one can agree whether the colony needs inspiration or discipline today."
status = "normal"
enUS = "A scavenger returns from the old human ruins carrying a brittle scrap of stained paper. Most of the words have faded, but one remains clear: <YellowHighlight>Taco</YellowHighlight>. No one knows what it means.  \nA crude drawing appears to show food folded inside another kind of food. The cooks believe they could reproduce it, but no one can agree whether the colony needs inspiration or discipline today."
zhCN = "一名清道夫从古老的人类遗迹中返回，手中携带着一块脆弱的污损纸片。大部分文字已褪色，但有一个字仍然清晰可见：<YellowHighlight>塔可</YellowHighlight>。没有人知道它是什么意思。\n一幅粗糙的画显示食品折叠在另一种食品里面。厨师们相信他们可以重现它，但没有人能达成共识，今天是需要灵感还是纪律。"
zhTW = "一名拾荒者從古老的人類遺跡返回，手中攜帶著一塊脆弱的污漬紙張。大部分字詞已經褪色，但有一個字仍然清晰可見：<YellowHighlight>塔可</YellowHighlight>。沒有人知道這是什麼意思。\n一幅粗糙的畫似乎顯示著食物摺疊在另一種食物裡。廚師們相信他們可以重現它，但沒有人能協議殖民地今天需要靈感還是紀律。"
ruRU = "scavenger возвращается из старых руин хора, неся хрупкий кусок запятнанной бумаги. Большинство слов размыло, но одно остается ясным: <YellowHighlight>Taco</YellowHighlight>. Никто не знает, что это значит.  \nГрубо выполненный рисунок, похоже, изображает еду, сложенную внутри другой еды. Поварята верят, что смогут воспроизвести это, но никто не может согласиться, нужно ли колонии вдохновение или дисциплина сегодня."
jaJP = "「古いヒューマンの廃墟から戻ってきた拾い食いの者が、脆い汚れた紙くずを一枚運んでいます。ほとんどの言葉は消えていますが、一つだけははっきりしています：<YellowHighlight>タコ</YellowHighlight>。それが何を意味するのかは誰にもわかりません。\n粗い絵が、食べ物が別の種類の食べ物の中に折りたたまれている様子を示しているようです。料理人たちは再現できると信じていますが、コロニーが今日必要としているのはインスピレーションか、それとも規律なのか、合意が得られません。」"
frFR = "Un scavenger revient des anciennes ruines de hooman portant un morceau de papier taché et fragile. La plupart des mots se sont effacés, mais un reste clair : <YellowHighlight>Taco</YellowHighlight>. Personne ne sait ce que cela signifie.  \nUn dessin rudimentaire semble montrer de la nourriture pliée à l'intérieur d'un autre type de nourriture. Les cuisiniers croient qu'ils pourraient le reproduire, mais personne ne peut s'accorder sur le fait que la colonie ait besoin d'inspiration ou de discipline aujourd'hui."
deDE = "Ein Sammler kehrt aus den alten Menschenruinen zurück und trägt ein brüchiges Stück fleckiges Papier. Die meisten Wörter sind verblasst, aber eines bleibt klar: <YellowHighlight>Taco</YellowHighlight>. Niemand weiß, was es bedeutet.  \nEine grobe Zeichnung scheint zu zeigen, dass Essen in eine andere Art von Essen gefaltet ist. Die Köche glauben, sie könnten es nachmachen, aber niemand kann sich darauf einigen, ob die Kolonie heute Inspiration oder Disziplin benötigt."
plPL = "Zbieracz wraca z starych ruin hoomanów, niosąc kruchy kawałek poplamionego papieru. Większość słów wyblakła, ale jedno pozostaje wyraźne: <YellowHighlight>Taco</YellowHighlight>. Nikt nie wie, co to znaczy.\nProsty rysunek wydaje się przedstawiać jedzenie złożone w inne jedzenie. Kucharze wierzą, że mogliby je odtworzyć, ale nikt nie może uzgodnić, czy kolonia potrzebuje dziś inspiracji, czy dyscypliny."
ptBR = "Um coletor retorna das antigas ruínas dos humanos carregando um pedaço quebradiço de papel manchado. A maioria das palavras desbotou, mas uma permanece clara: <YellowHighlight>Taco</YellowHighlight>. Ninguém sabe o que isso significa.  \nUm desenho rudimentar parece mostrar comida dobrada dentro de outro tipo de comida. Os cozinheiros acreditam que poderiam reproduzi-lo, mas ninguém consegue concordar se a colônia precisa de inspiração ou disciplina hoje."
koKR = "한 채집꾼이 오래된 인간 유적에서 색이 바랜 종이 조각을 들고 돌아온다. 대부분의 글자는 희미해졌지만, 하나는 분명하다: <YellowHighlight>타코</YellowHighlight>. 그 의미를 아는 사람은 없다.\n거칠게 그려진 그림은 음식이 다른 종류의 음식 안에 접혀 있는 모습을 보여준다. 요리사들은 그걸 재현할 수 있다고 믿지만, 오늘 식민지가 영감을 필요로 하는지 훈련을 필요로 하는지에 대해서는 아무도 동의하지 않는다."
csCZ = "Získávač se vrací ze starých lidských ruin s křehkým kouskem skvrnitého papíru. Většina slov vybledla, ale jedno zůstává jasné: <YellowHighlight>Taco</YellowHighlight>. Nikdo neví, co to znamená. \nHrubý nákres se zdá ukazovat jídlo srolované uvnitř jiného druhu jídla. Kuchaři věří, že by to mohli reprodukovat, ale nikdo se nemůže shodnout, zda kolonie dnes potřebuje inspiraci nebo disciplínu."
viVN = "Một kẻ thu gom trở về từ những tàn tích của loài người cũ, mang theo một mảnh giấy dính bám giòn. Phần lớn từ đã mờ đi, nhưng một từ vẫn rõ ràng: <YellowHighlight>Taco</YellowHighlight>. Không ai biết nó có nghĩa gì.  \nMột bức vẽ thô sơ dường như cho thấy thức ăn được gấp bên trong một loại thức ăn khác. Các đầu bếp tin rằng họ có thể tái tạo nó, nhưng không ai có thể đồng ý liệu thuộc địa hôm nay cần cảm hứng hay kỷ luật."
trTR = "Bir toplayıcı, eski insan kalıntılarından, lekeli bir kağıt parçası taşıyarak geri döner. Çoğu kelime silinmiş, ama bir tanesi net kalmıştır: <YellowHighlight>Taco</YellowHighlight>. Bunun ne anlama geldiğini kimse bilmiyor. \nKabaca bir çizim, bir tür yiyeceğin başka bir tür yiyeceğin içinde katlanmış olduğunu gösteriyor gibi görünüyor. Aşçılar bunun yeniden yapabileceğini düşünüyor, ama koloninin bugün ilhama mı yoksa disipline mi ihtiyaç duyduğuna kimse karar veremiyor."

