["LV.BCEv.WaterfallSinkhole.Content"]
raw = "As the final beam is secured, a low rumble rises from beneath the construction. Tools rattle, supports groan, and the ground begins to heave under the beavers' paws.\n\nThen, without warning, a deep crack tears across the earth. Soil and stone collapse inward as the fissure widens into a vast sinkhole, dragging buildings, debris, and anything unable to escape into the darkness below. Beavers scatter in panic while the land around the waterfall shifts, fractures, and gives way.\n\nHowever, from the deepest broken stone, clear water begins to rise. It does not gush like the waterfall above. It seeps upward with steady pressure, cold and stubborn, as if the collapse has opened a hidden spring that drought cannot silence.\n[[C]][[-]]{CP_SinkholeVictims_Count} characters killed and buildings destroyed\n[[C]][[+]]A new water source emerges, permanently immune to drought."
status = "normal"
enUS = "As the final beam is secured, a low rumble rises from beneath the construction. Tools rattle, supports groan, and the ground begins to heave under the beavers' paws.\n\nThen, without warning, a deep crack tears across the earth. Soil and stone collapse inward as the fissure widens into a vast sinkhole, dragging buildings, debris, and anything unable to escape into the darkness below. Beavers scatter in panic while the land around the waterfall shifts, fractures, and gives way.\n\nHowever, from the deepest broken stone, clear water begins to rise. It does not gush like the waterfall above. It seeps upward with steady pressure, cold and stubborn, as if the collapse has opened a hidden spring that drought cannot silence.\n[[C]][[-]]{CP_SinkholeVictims_Count} characters killed and buildings destroyed\n[[C]][[+]]A new water source emerges, permanently immune to drought."
zhCN = "随着最后一根梁被固定，一阵低沉的隆隆声从施工现场下方传来。工具叮当作响，支撑发出呻吟声，地面在海狸的爪子下开始翻动。\n\n然后，突然之间，一道深裂缝撕裂了大地。土壤和石头向内坍塌，裂缝在扩大，形成一个巨大的陷坑，拖拽着无法逃脱的建筑、碎片和任何东西进入黑暗之中。海狸们惊慌失措，四处逃散，而瀑布周围的土地则在移动、裂变并崩溃。\n\n然而，从最深处破碎的岩石中，清水开始涌出。它并不像上方的瀑布那样倾泻而下。它以稳定的压力向上渗出，冰冷而顽强，仿佛坍塌开启了一个隐藏的泉源，干旱无法使其沉默。\n[[C]][[-]]{CP_SinkholeVictims_Count} 角色被杀和建筑被摧毁\n[[C]][[+]]一个新的水源出现，永久免疫于干旱。"
zhTW = "當最後一根橫樑固定好時，從建設下方響起低沉的隆隆聲。工具發出響聲，支撐物發出吱吱聲，地面在海狸的爪下開始顫動。\n\n隨後，毫無預警地，一道深裂縫撕裂了大地。土壤和石頭向內塌陷，裂縫擴大成一個巨大的陷坑，拖延著建築物、碎片和任何無法逃脫的東西進入黑暗之中。海狸們驚慌失措地四散逃開，而瀑布周圍的土地則變化、破裂並崩潰。\n\n然而，從最深處破裂的石頭中，清水開始湧出。它不像上方的瀑布那樣哗啦啦奔湧而出。它以穩定的壓力向上滲透，冰冷而堅韌，彷彿崩塌打開了一個隱藏的泉源，無法被乾旱所阻擋。\n[[C]][[-]]{CP_SinkholeVictims_Count} 人物被殺和建築被摧毀\n[[C]][[+]]一個新的水源出現，永久免疫於乾旱。"
ruRU = "Как только последний балки закрепляется, из-под конструкции доносится низкое гудение. Инструменты трясутся, опоры скрипят, а земля начинает подниматься под лапами бобров.\n\nЗатем, без предупреждения, глубокая трещина разрывает землю. Почва и камни обрушаются внутрь, когда fissure расширяется в обширный провал, затягивая здания, обломки и всё, что не смогло убежать, в темноту внизу. Бобры разбегаются в панике, в то время как земля вокруг водопада смещается, трещит и дает трещину.\n\nОднако из самых глубин разбитого камня начинает подниматься прозрачная вода. Она не бурлит, как водопад выше. Она проникает вверх с постоянным давлением, холодная и упрямая, как будто обрушение открыло скрытый источник, который засуха не может заглушить.\n[[C]][[-]]{CP_SinkholeVictims_Count} персонажей убито и зданий разрушено\n[[C]][[+]]Появляется новый источник воды, постоянно защищенный от засухи."
jaJP = "最後の梁が固定されると、建設物の下から低い轟音が響き渡ります。道具ががたがたと音を立て、支えがうめいて、ビーバーたちの足元で地面が持ち上がり始めます。\n\nすると、突然、深い裂け目が大地を横切ります。土と石が内側に崩れ落ち、亀裂が広がると広大なシンクホールが現れ、建物や残骸、逃げられないものすべてが暗闇の中に引き込まれます。ビーバーたちはパニックになって散り散りになり、水fall周辺の土地は移動し、ひび割れて、崩れ落ちます。\n\nしかし、最も深い壊れた石の中から、澄んだ水が湧き上がり始めます。それは上にある滝のように噴き出すことはありません。穏やかな圧力で上昇し、冷たくて頑固に、崩壊が干ばつによって黙らされない隠れた湧き水を開いたかのようです。\n[[C]][[-]]{CP_SinkholeVictims_Count} 人のキャラクターが死亡し、建物が破壊されました。\n[[C]][[+]]新しい水源が現れ、干ばつに対して永久に免疫です。"
frFR = "Alors que la dernière poutre est sécurisée, un léger grondement s'élève de sous la construction. Les outils s'entrechoquent, les supports gémissent, et le sol commence à se soulever sous les pattes des castors.\n\nPuis, sans avertissement, une profonde fissure déchire la terre. Le sol et la pierre s'effondrent vers l'intérieur alors que la fente s'élargit en un vaste trou béant, entraînant bâtiments, débris et tout ce qui ne peut pas s'échapper dans l'obscurité en dessous. Les castors se dispersent dans la panique tandis que la terre autour de la chute d'eau se déplace, se fracture et s'effondre.\n\nCependant, des profondeurs des pierres brisées, de l'eau claire commence à remonter. Elle ne jaillit pas comme la cascade au-dessus. Elle remonte lentement avec une pression constante, froide et obstinée, comme si l'effondrement avait ouvert une source cachée que la sécheresse ne peut pas étouffer.\n[[C]][[-]]{CP_SinkholeVictims_Count} personnages tués et bâtiments détruits\n[[C]][[+]]Une nouvelle source d'eau émerge, définitivement à l'abri de la sécheresse."
deDE = "„Als der letzte Balken gesichert ist, erhebt sich ein tiefes Grollen aus dem Untergrund der Baustelle. Werkzeuge klirren, Stützen stöhnen und der Boden beginnt unter den Pfoten der Biber zu wanken.\n\nDann, ohne Vorwarnung, reißt ein tiefer Riss die Erde auf. Erde und Steine stürzen nach innen, während der Spalt sich zu einer riesigen Senke weitet und Gebäude, Trümmer und alles, was nicht entkommen kann, in die Dunkelheit darunter zieht. Die Biber verstreuen sich in Panik, während das Land um den Wasserfall herum sich verschiebt, bricht und nachgibt.\n\nDoch aus dem tiefsten gebrochenen Stein beginnt klares Wasser zu steigen. Es strömt nicht wie der Wasserfall oben. Es sickert mit stetigem Druck nach oben, kalt und hartnäckig, als ob der Zusammenbruch eine verborgene Quelle freigelegt hat, die Dürre nicht zum Schweigen bringen kann.  \n[[C]][[-]]{CP_SinkholeVictims_Count} Charaktere getötet und Gebäude zerstört  \n[[C]][[+]]Eine neue Wasserquelle entsteht, die dauerhaft immun gegen Dürre ist.“"
plPL = "Gdy ostatnia belka jest zabezpieczona, z głębi budowy unosi się niski pomruk. Narzędzia dzwonią, podpory jęczą, a ziemia zaczyna się unosić pod łapami bobrów.\n\nNastępnie, bez ostrzeżenia, głęboki pęknięcie rozdziera ziemię. Gleba i kamień zapadają się, gdy szczelina rozszerza się w ogromny lej, wciągając budynki, gruz i wszystko, co nie zdoła się uwolnić w ciemność poniżej. Bobry rozpraszają się w panice, podczas gdy ziemia wokół wodospadu się przemieszcza, pęka i ustępuje.\n\nJednak z najgłębszych złamanych kamieni zaczyna się podnosić czysta woda. Nie tryska jak wodospad powyżej. Wypływa ku górze ze stałym ciśnieniem, zimna i uparta, jak gdyby zawalenie otworzyło ukryte źródło, którego susza nie może uciszyć.  \n[[C]][[-]]{CP_SinkholeVictims_Count} zabitych postaci i zniszczonych budynków  \n[[C]][[+]]Nowe źródło wody pojawia się, na stałe odporne na suszę."
ptBR = "À medida que a última viga é fixada, um baixo rumor sobe debaixo da construção. Ferramentas tilintam, suportes gemem e o chão começa a tremeluzir sob as patas dos castores.\n\nEntão, sem aviso, uma fenda profunda rasga a terra. Solo e pedra desmoronam para dentro enquanto a fenda se alarga em uma vasta cratera, puxando edifícios, destroços e qualquer coisa incapaz de escapar para a escuridão abaixo. Os castores se dispersam em pânico enquanto a terra ao redor da cachoeira se move, se fratura e cede.\n\nNo entanto, das pedras quebradas mais profundas, água limpa começa a subir. Ela não jorra como a cachoeira acima. Ela infiltra-se para cima com pressão constante, fria e teimosa, como se o colapso houvesse aberto uma nascente oculta que a seca não pode silenciar.\n[[C]][[-]]{CP_SinkholeVictims_Count} personagens mortos e edifícios destruídos\n[[C]][[+]]Uma nova fonte de água emerge, permanentemente imune à seca."
koKR = "마지막 빔이 고정되자, 건설 아래에서 낮은 우르릉거림이 들려온다. 도구가 흔들리고, 지지대가 신음하며, 비버들의 발 아래에서 땅이 울적거린다.\n\n그러다 예고 없이 깊은裂痕이 땅을 가로막고 찢어진다. 땅과 돌이 안으로 무너지며 틈새가 넓어져 거대한 싱크홀을 형성하고, 건물과 잔해, 탈출할 수 없는 모든 것이 어둠 속으로 끌려간다. 비버들은 공포에 휩싸여 흩어지고, 폭포 주변의 땅은 흔들리고, 갈라지며, 무너진다.\n\n그러나 깨진 땅속 깊은 곳에서, 맑은 물이 솟아오르기 시작한다. 위의 폭포처럼 분출하지 않는다. 꾸준한 압력으로 위로 스며들며 차갑고 고집스럽게, 마치 무너짐이 가뭄으로 침묵할 수 없는 숨겨진 샘을 열어놓은 듯하다.\n[[C]][[-]]{CP_SinkholeVictims_Count} 캐릭터가 죽고, 건물이 파괴되었습니다.\n[[C]][[+]]새로운 수원지가 등장하며, 가뭄에 영원히 면역이다."
csCZ = "Když je poslední nosník zajištěn, z hlubin stavby se ozve tichý hrom. Nářadí clinká, podpěry vrčí a země začíná pod tlapami bobrů hýbat.\n\nPak, bez varování, se země roztrhne. Půda a kámen se hroutí dovnitř, jak se trhlina rozšiřuje do obrovské propadliny, která vtahuje budovy, trosky a vše, co se nemůže dostat pryč, do temnoty pod zemí. Bobři se v panice rozprchnou, zatímco krajina kolem vodopádu se mění, praská a ustupuje.\n\nNicméně, z nejhlubšího zlomeného kamene začíná vystupovat čistá voda. Nevylévá se jako vodopád výše. Pomalu stoupá s rovnoměrným tlakem, studená a odolná, jako by zhroucení otevřelo skrytou studnu, kterou sucho nemůže umlčet.\n[[C]][[-]]{CP_SinkholeVictims_Count} postav zabitých a budov zničených\n[[C]][[+]]Nový zdroj vody se objevuje, trvale imunní vůči suchu."
viVN = "Khi thanh beam cuối cùng được cố định, một tiếng ầm ầm thấp từ dưới công trình nổi lên. Các công cụ lắc lư, các cột chống than vãn, và mặt đất bắt đầu rung chuyển dưới chân những chú bồ nông.\n\nRồi, mà không có cảnh báo nào, một vết nứt sâu xé toạc mặt đất. Đất và đá sụp đổ vào trong khi vết nứt mở rộng thành một hố sụt lớn, cuốn theo các tòa nhà, mảnh vụn, và bất cứ thứ gì không thể thoát khỏi vào bóng tối bên dưới. Các chú bồ nông hoảng loạn chạy tán loạn trong khi đất đai xung quanh thác nước dịch chuyển, gãy nổ và nhường chỗ.\n\nTuy nhiên, từ những viên đá gãy gọng sâu nhất, nước trong bắt đầu dâng lên. Nó không phun trào như thác nước phía trên. Nó thấm lên với áp lực ổn định, lạnh lẽo và kiên cường, như thể sự sụp đổ đã mở ra một nguồn suối ẩn mà hạn hán không thể làm im lặng.\n[[C]][[-]]{CP_SinkholeVictims_Count} nhân vật đã bị giết và các tòa nhà bị phá hủy\n[[C]][[+]]Một nguồn nước mới xuất hiện, miễn nhiễm vĩnh viễn với hạn hán."
trTR = "Son kiriş sağlamlaştırıldığında, yapımın altından düşük bir homurtu yükselmeye başlar. Aletler tıkırtılar çıkarır, destekler gırıldar ve zemin, kundaklarında castorların ayaklarının altında yükselmeye başlar.\n\nSonra, aniden, derin bir çatlak toprağı yırtar. Toprak ve taş içine çökerek yarık genişleyip dev bir çukura dönüşür, binaları, enkazları ve kaçamayan her şeyi karanlığa sürükler. Kundaklar panikle kaçışırken, şelalenin etrafındaki arazi kayar, çatlar ve devrilir.\n\nAncak, en derin kırık taşlardan, temiz su yükselmeye başlar. Yukarıdaki şelale gibi fışkırmaz. Sabit bir baskıyla, soğuk ve inatçı bir şekilde yukarı sızar, sanki çökme, kuraklığın susturamayacağı gizli bir kaynak açmıştır.\n[[C]][[-]]{CP_SinkholeVictims_Count} karakter öldürüldü ve binalar yok edildi\n[[C]][[+]]Yeni bir su kaynağı ortaya çıkıyor, kuraklığa karşı kalıcı olarak bağışık."

