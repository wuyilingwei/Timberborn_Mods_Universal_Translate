["LV.BCEv.BadtideDrainStudy.O1"]
raw = "At last, the scientist returns with a finished report. The buried hooman structure is real. It may be reachable. By tomorrow morning, the colony must decide whether to dig."
status = "normal"
enUS = "At last, the scientist returns with a finished report. The buried human structure is real. It may be reachable. By tomorrow morning, the colony must decide whether to dig."
zhCN = "最后，科学家带着完成的报告回来了。埋藏的“人类”结构确实存在。它可能是可以到达的。明天早晨，殖民地必须决定是否要挖掘。"
zhTW = "科學家終於帶著完成的報告回來了。埋藏的人類結構確實存在。可能可以到達。到明天早晨，殖民地必須決定是否開始挖掘。"
ruRU = "Наконец, учёный возвращается с готовым отчетом. Похороненная структура хуманов реальна. Возможно, к ней можно добраться. К утру завтрашнего дня колония должна решить, стоит ли копать."
jaJP = "ついに、科学者が完成した報告書を持って戻ってきました。埋もれた人間の構造物は実在します。到達可能かもしれません。明日の朝までに、コロニーは掘削するかどうかを決めなければなりません。"
frFR = "Enfin, le scientifique revient avec un rapport terminé. La structure humaine enterrée est réelle. Elle pourrait être accessible. D'ici demain matin, la colonie doit décider si elle doit creuser."
deDE = "Endlich kehrt der Wissenschaftler mit einem fertigen Bericht zurück. Die vergrabene menschliche Struktur ist echt. Sie könnte erreichbar sein. Bis morgen früh muss die Kolonie entscheiden, ob sie graben will."
plPL = "W końcu naukowiec wraca z gotowym raportem. Zakopana struktura hoomana jest rzeczywista. Może być osiągalna. Do jutrzejszego poranka kolonia musi zdecydować, czy kopać."
ptBR = "Finalmente, o cientista retorna com um relatório pronto. A estrutura enterrada dos humanos é real. Pode ser acessível. Até amanhã de manhã, a colônia deve decidir se irá escavar."
koKR = "마침내 과학자가 완성된 보고서를 가지고 돌아왔다. 묻힌 휴먼 구조물은 실제로 존재한다. 접근할 수 있을지도 모른다. 내일 아침까지 식민지는 발굴 여부를 결정해야 한다."
csCZ = "Konečně se vědec vrací s hotovou zprávou. Pohřbená struktura hooman je skutečná. Může být přístupná. Do zítřejšího rána se kolonie musí rozhodnout, zda kopat."
viVN = "Cuối cùng, nhà khoa học đã trở về với một báo cáo hoàn chỉnh. Cấu trúc hooman bị chôn vùi là có thật. Có thể tiếp cận được. Đến sáng mai, thuộc địa phải quyết định xem có nên đào không."
trTR = "Sonunda, bilim insanı bitmiş bir raporla geri döndü. Gömülü insan yapısı gerçek. Ulaşılabilir olabilir. Koloni, yarın sabah ne yapacağına karar vermek zorunda."

["LV.BCEv.BadtideDrainStudy.O2"]
raw = "The scientist lowers the notebook. The Badtide Drain remains as it has always been: dangerous, familiar, and unanswered."
status = "normal"
enUS = "The scientist lowers the notebook. The Badtide Drain remains as it has always been: dangerous, familiar, and unanswered."
zhCN = "“科学家合上了笔记本。坏潮排水口依然如往常一样：危险，熟悉，且没有答案。”"
zhTW = "科學家放下了筆記本。壞潮排水系統依舊如往常一樣：危險、熟悉，卻沒有答案。"
ruRU = "Ученый опускает блокнот. Слив Бадтема остается таким, как всегда: опасным, знакомым и безответным."
jaJP = "科学者はノートを下ろす。バッドタイド・ドレインは常にあったように、そのままの状態である：危険で、親しみがあり、そして解決されないままで。"
frFR = "Le scientifique abaisse le carnet. Le Drain de Badtide reste tel qu'il a toujours été : dangereux, familier et sans réponse."
deDE = "Der Wissenschaftler senkt das Notizbuch. Der Badtide Drain bleibt, wie er immer war: gefährlich, vertraut und unbeantwortet."
plPL = "Naukowiec opuszcza notatnik. Odpływ Badtide pozostaje taki, jak zawsze: niebezpieczny, znajomy i bez odpowiedzi."
ptBR = "O cientista abaixa o caderno. O Dreno da Maré Baixa permanece como sempre foi: perigoso, familiar e sem respostas."
koKR = "과학자가 노트를 내린다. 배드타이드 배수는 항상 그랬듯: 위험하고, 친숙하며, 답이 없다."
csCZ = "Vědec sníží poznámkový blok. Odvodnění Badtide zůstává takové, jaké vždy bylo: nebezpečné, známé a bez odpovědí."
viVN = "Nhà khoa học hạ cuốn sổ tay xuống. Cống Badtide vẫn như trước đây: nguy hiểm, quen thuộc và không có lời giải."
trTR = "Bilim insanı defteri aşağı indirir. Badtide Drenajı her zamanki gibi kalır: tehlikeli, tanıdık ve yanıtsız."

