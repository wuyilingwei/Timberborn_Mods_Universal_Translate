["LV.BCEv.Taco2.Content"]
raw = "The cooks have deciphered the remaining marks on the hooman recipe. Apparently, the first taco was only the mild version.\nThe newly translated instructions describe stronger spices, a sharper sauce, and something repeatedly labelled <YellowHighlight>extra powerful</YellowHighlight>. Several cooks insist this must mean extra delicious. Others point out that the page is singed around the edges.\nThe colony already knows the original taco works. Now the cooks want to attempt the improved version."
status = "normal"
enUS = "The cooks have deciphered the remaining marks on the human recipe. Apparently, the first taco was only the mild version. The newly translated instructions describe stronger spices, a sharper sauce, and something repeatedly labeled <YellowHighlight>extra powerful</YellowHighlight>. Several cooks insist this must mean extra delicious. Others point out that the page is singed around the edges. The colony already knows the original taco works. Now the cooks want to attempt the improved version."
zhCN = "厨师们已经解读了人类食谱上剩余的标记。显然，第一个塔可只是温和版。\n新翻译的说明描述了更强的香料，更浓烈的酱汁，以及一些反复标记为<YellowHighlight>特效强大</YellowHighlight>的东西。几个厨师坚信这一定意味着额外美味。另一些人则指出页面边缘已经烧焦。\n殖民地已经知道原版塔可可以使用。现在厨师们想尝试改进版。"
zhTW = "廚師已經解讀了人類食譜上剩餘的標記。顯然，第一個塔可只是一個輕口味版本。\n新翻譯的說明描述了更強的香料、更尖銳的醬汁，以及一些反覆標註為<YellowHighlight>超級強力</YellowHighlight>的東西。幾位廚師堅持這一定意味著特別美味。其他人指出頁面邊緣有燒焦的痕跡。\n殖民地已經知道原始塔可的效果。現在廚師們想要嘗試改良版。"
ruRU = "Поваров удалось расшифровать оставшиеся знаки на рецепте человечков. Судя по всему, первый тако был только в Mild версии. Новые переведенные инструкции описывают более сильные специи, более острый соус и что-то, что постоянно помечается как <YellowHighlight>очень мощное</YellowHighlight>. Несколько поваров настаивают, что это должно означать очень вкусно. Другие указывают на то, что страница обожжена по краям. Колония уже знает, что оригинальный тако работает. Теперь повара хотят попробовать улучшенную версию."
jaJP = "料理人たちは、人間のレシピに残された印を解読しました。どうやら、最初のタコスはマイルドなバージョンだけだったようです。\n新しく翻訳された指示には、より強いスパイス、鋭いソース、そして何度も<YellowHighlight>超強力</YellowHighlight>と表示されたものが記されています。数人の料理人は、これはさらに美味しいことを意味するに違いないと主張しています。他の料理人たちは、ページの端が焦げていることを指摘しています。\nコロニーはすでに元のタコスが機能することを知っています。今、料理人たちは改良版に挑戦したいと考えています。"
frFR = "Les cuisiniers ont déchiffré les marques restantes sur la recette humaine. Apparemment, le premier taco n'était que la version douce. Les instructions nouvellement traduites décrivent des épices plus fortes, une sauce plus piquante et quelque chose étiqueté à plusieurs reprises <YellowHighlight>extra puissant</YellowHighlight>. Plusieurs cuisiniers insistent sur le fait que cela doit signifier extra délicieux. D'autres soulignent que la page est brûlée sur les bords. La colonie sait déjà que le taco original fonctionne. Maintenant, les cuisiniers veulent tenter la version améliorée."
deDE = "Die Köche haben die verbleibenden Markierungen im Rezept der Menschen entschlüsselt. Offenbar war der erste Taco nur die milde Version. \nDie neu übersetzten Anweisungen beschreiben stärkere Gewürze, eine schärfere Soße und etwas, das wiederholt als <YellowHighlight>extralustig</YellowHighlight> bezeichnet wird. Mehrere Köche bestehen darauf, dass das extra köstlich bedeuten muss. Andere weisen darauf hin, dass die Seite am Rand angebrannt ist. \nDie Kolonie weiß bereits, dass der ursprüngliche Taco funktioniert. Jetzt wollen die Köche die verbesserte Version ausprobieren."
plPL = "Kucharze rozszyfrowali pozostałe znaki na ludzkim przepisie. Najwyraźniej, pierwszy taco był tylko łagodną wersją. Nowo przetłumaczone instrukcje opisują mocniejsze przyprawy, ostrzejszy sos i coś wielokrotnie oznaczonego jako <YellowHighlight>ekstra mocne</YellowHighlight>. Kilku kucharzy twierdzi, że musi to oznaczać ekstra pyszne. Inni zwracają uwagę, że strona jest przypalona na krawędziach. Kolonia już wie, że oryginalne taco działa. Teraz kucharze chcą spróbować ulepszonej wersji."
ptBR = "Os cozinheiros decifraram as marcas restantes na receita dos humanos. Aparentemente, o primeiro taco era apenas a versão suave. As instruções recém-traduzidas descrevem especiarias mais fortes, um molho mais picante e algo rotulado repetidamente como <YellowHighlight>extra poderoso</YellowHighlight>. Vários cozinheiros insistem que isso deve significar extra delicioso. Outros apontam que a página está chamuscada ao redor das bordas. A colônia já sabe que o taco original funciona. Agora os cozinheiros querem tentar a versão melhorada."
koKR = "요리사들은 인간 레시피에 남아 있는 표시를 해독했습니다. 첫 번째 타코는 순한 버전이었을 뿐이라고 합니다. 새로 번역된 지침은 더 강한 향신료, 더 매운 소스, 그리고 여러 번 <YellowHighlight>특별히 강력한</YellowHighlight>으로 표기된 무언가를 설명하고 있습니다. 여러 요리사들은 이것이 반드시 더 맛있다는 의미라고 주장합니다. 다른 사람들은 페이지 가장자리가 그을린 것을 지적합니다. 식민지는 원래 타코가 효과가 있다는 것을 이미 알고 있습니다. 이제 요리사들은 개선된 버전을 시도하고 싶어합니다."
csCZ = "Kuchaři dešifrovali zbývající značky v lidském receptu. Zřejmě první taco byla pouze mírná verze. Nově přeložené pokyny popisují silnější koření, ostřejší omáčku a něco, co je opakovaně označeno <YellowHighlight>extra silné</YellowHighlight>. Někteří kuchaři trvají na tom, že to musí znamenat extra chutné. Jiní upozorňují, že stránka je spálená kolem okrajů. Kolonie už ví, že původní taco funguje. Nyní se kuchaři chtějí pokusit o vylepšenou verzi."
viVN = "Các đầu bếp đã giải mã những dấu hiệu còn lại trên công thức của loài người. Rõ ràng, taco đầu tiên chỉ là phiên bản nhẹ.\nHướng dẫn vừa được dịch mô tả những gia vị mạnh hơn, một loại sốt sắc nét hơn, và một thứ được gán nhãn liên tục là <YellowHighlight>siêu mạnh</YellowHighlight>. Một vài đầu bếp khăng khăng rằng điều này chắc chắn có nghĩa là cực kỳ ngon miệng. Những người khác chỉ ra rằng trang sách bị cháy xém xung quanh các cạnh.\nThuộc địa đã biết rằng taco gốc hoạt động. Bây giờ các đầu bếp muốn cố gắng phiên bản cải tiến."
trTR = "Aşçılar, insana ait tarifte kalan işaretleri çözdüler. Görünüşe göre, ilk taco sadece hafif versiyondu. Yeni çevrilen talimatlar, daha güçlü baharatlar, daha keskin bir sos ve sürekli olarak <YellowHighlight>ekstra güçlü</YellowHighlight> olarak etiketlenmiş bir şey tanımlıyor. Birkaç aşçı bunun ekstra lezzetli olması gerektiğini ısrarla savunuyor. Diğerleri ise sayfanın kenarlarının yanmış olduğunu belirtiyor. Koloni, orijinal taconun işe yaradığını zaten biliyor. Şimdi aşçılar, geliştirilmiş versiyonu denemek istiyorlar."

