["LV.BCEv.Taco2.Cure.O1"]
raw = "The final barrel arrives just in time.\nAfter several long hours and a colony-wide agreement never to discuss the details, the crisis passes without contaminating the water supply.\nThe cooks burn the extra-powerful recipe."
status = "normal"
enUS = "The final barrel arrives just in time. After several long hours and a colony-wide agreement never to discuss the details, the crisis passes without contaminating the water supply. The cooks burn the extra-powerful recipe."
zhCN = "最后一桶正好及时抵达。经过几个漫长的小时以及全体居民达成的永不讨论细节的协议，危机在没有污染水源的情况下过去了。厨师们把超强食谱给烧焦了。"
zhTW = "最後一桶剛好及時到達。經過幾個漫長的小時和全體殖民者達成的協議，決定絕不談論細節，危機在未污染水源的情況下過去。廚師們把超強的食譜燒焦了。"
ruRU = "Последняя бочка arrives как раз вовремя. После нескольких долгих часов и согласия всей колонии никогда не обсуждать детали, кризис проходит, не загрязнив водоснабжение. Поваренки сжигают сверхмощный рецепт."
jaJP = "最後の樽がちょうど間に合った。  \n数時間の長い時間と、詳細について決して話し合わないという植民地全体の合意の後、危機は水供給を汚染することなく過ぎ去った。  \n料理人たちは特別に強力なレシピを焦がしてしまった。"
frFR = "Le dernier baril arrive juste à temps. Après plusieurs longues heures et un accord unanime de la colonie de ne jamais discuter des détails, la crise passe sans contaminer l'approvisionnement en eau. Les cuisiniers brûlent la recette extra-puissante."
deDE = "Das letzte Fass trifft rechtzeitig ein. Nach mehreren langen Stunden und einer kolonieweiten Vereinbarung, die Details niemals zu besprechen, passiert die Krise, ohne die Wasserversorgung zu kontaminieren. Die Köche verbrennen das extra-starke Rezept."
plPL = "Ostatnia beczka przybywa akurat na czas.\nPo kilku długich godzinach i ogólnokolonijnym porozumieniu, aby nigdy nie omawiać szczegółów, kryzys mija bez zanieczyszczenia źródła wody.\nKucharze palą super mocny przepis."
ptBR = "O barril final chega bem a tempo.  \nApós várias horas longas e um acordo entre a colônia de nunca discutir os detalhes, a crise passa sem contaminar o abastecimento de água.  \nOs cozinheiros queimam a receita superpoderosa."
koKR = "마지막 배럴이 제때 도착합니다.  \n몇 시간의 긴 기다림과 식민지 전체의 논의를 피하겠다는 합의 후, 위기는 물 공급을 오염시키지 않고 지나갑니다.  \n요리사들은 특급 레시피를 태워버립니다."
csCZ = "Konečně dorazil poslední sud v pravý čas.\nPo několika dlouhých hodinách a celokoloniální dohodě, že se podrobnosti nebudou probírat, krize pomine, aniž by kontaminovala vodní zásobování.\nKuchaři spálí extra silný recept."
viVN = "Thùng cuối cùng đến đúng lúc.  \nSau vài giờ dài và một sự đồng thuận toàn cộng đồng không bao giờ thảo luận về chi tiết, cuộc khủng hoảng qua đi mà không làm ô nhiễm nguồn nước.  \nCác đầu bếp đốt cháy công thức siêu mạnh."
trTR = "Son fıçı tam zamanında geliyor.  \nBirkaç uzun saatten sonra ve kolonide detayları asla tartışmama konusunda bir anlaşma sağlandıktan sonra, kriz su kaynağını kirletmeden geçiyor.  \nAşçılar ekstra güçlü tarifi yakıyor."

["LV.BCEv.Taco2.Cure.O2"]
raw = "The concoction is not completed in time.\nSoon afterward, the water watchers notice a foul reddish current seeping into the basin. No one officially identifies the source, but every beaver involved in the taco experiment suddenly becomes very interested in leaving town.\nThe powerful recipe has produced one final, deeply regrettable effect.\n[[C]][[-]]A random water source becomes contaminated for [[time:{F4}d]]"
status = "normal"
enUS = "The concoction is not completed in time.  \nSoon afterward, the water watchers notice a foul reddish current seeping into the basin. No one officially identifies the source, but every beaver involved in the taco experiment suddenly becomes very interested in leaving town.  \nThe powerful recipe has produced one final, deeply regrettable effect.  \n[[C]][[-]]A random water source becomes contaminated for [[time:{F4}d]]"
zhCN = "配方没有及时完成。\n不久之后，水监测员注意到一个恶臭的红色水流渗入水池。没有人正式确认源头，但每个参与塔可实验的海狸都突然对离开小镇产生了浓厚的兴趣。\n这个强大的配方产生了一个最终的、令人深感遗憾的效果。\n[[C]][[-]]一个随机水源在[[time:{F4}d]]内被污染"
zhTW = "「混合物未能按時完成。隨後，水監察員注意到一股惡臭的紅色水流滲入水池。沒有人正式確認來源，但每一隻參與塔可實驗的海狸突然對離開城鎮變得非常感興趣。這一強大的配方產生了一個最終的、深感遺憾的效果。[[C]][[-]]一個隨機的水源在[[time:{F4}d]]內變得受到污染。」"
ruRU = "Смесь не была завершена вовремя. Вскоре после этого наблюдатели за водой замечают грязный красноватый поток, просачивающийся в бассейн. Никто официально не определяет источник, но каждый бобер, участвующий в эксперименте с тако, внезапно проявляет большой интерес к тому, чтобы покинуть город. Мощный рецепт вызвал один последний, глубоко прискорбный эффект. [[C]][[-]]Случайный источник воды становится загрязненным на [[time:{F4}d]]."
jaJP = "混合物は時間内に完成しませんでした。 その後すぐに、水の監視者たちはバスの中に茶色がかった浸透している悪臭を感じる流れに気付きます。 誰も公式にはその出所を特定しませんが、タコス実験に関与した全てのビーバーは急に町を出たいと思うようになります。 強力なレシピは、最後に一つの深く後悔する効果を生み出しました。 [[C]][[-]]ランダムな水源が[[time:{F4}d]]の間汚染されます。"
frFR = "La concoction n'est pas terminée à temps. Peu après, les surveillants de l'eau remarquent un courant rougeâtre nauséabond s'infiltrant dans le bassin. Personne n'identifie officiellement la source, mais chaque castor impliqué dans l'expérience du taco devient soudain très intéressé par le fait de quitter la ville. La recette puissante a produit un dernier effet profondément regrettable. [[C]][[-]]Une source d'eau aléatoire devient contaminée pendant [[time:{F4}d]]"
deDE = "Die Mischung ist nicht rechtzeitig fertiggestellt. Bald darauf bemerken die Wasserwächter einen üblen, rötlichen Strom, der in das Becken sickert. Niemand identifiziert offiziell die Quelle, aber jeder Biber, der am Taco-Experiment beteiligt ist, wird plötzlich sehr daran interessiert, die Stadt zu verlassen. Das mächtige Rezept hat einen letzten, tief bedauerlichen Effekt produziert. [[C]][[-]]Eine zufällige Wasserquelle wird für [[time:{F4}d]] kontaminiert."
plPL = "Mieszanka nie została ukończona na czas. Wkrótce potem strażnicy wody zauważają brudny czerwonawy nurt wpadający do basenu. Nikt oficjalnie nie identyfikuje źródła, ale każda bobra biorąca udział w eksperymencie taco nagle staje się bardzo zainteresowana opuszczeniem miasta. Potężny przepis wyprodukował jeden ostatni, głęboko żałosny efekt. [[C]][[-]]Losowe źródło wody zostaje zanieczyszczone na [[time:{F4}d]]"
ptBR = "A mistura não é concluída a tempo. Logo depois, os observadores da água notam uma corrente vermelha podre seepando na bacia. Ninguém identifica oficialmente a fonte, mas todos os castores envolvidos no experimento do taco de repente ficam muito interessados em deixar a cidade. A poderosa receita produziu um último efeito profundamente lamentável. [[C]][[-]]Uma fonte de água aleatória se torna contaminada por [[time:{F4}d]]."
koKR = "혼합물이 제 시간에 완성되지 않았다. 곧이어 물 감시자들이 불쾌한 붉은 기운이 분지로 스며드는 것을 발견한다. 아무도 공식적으로 출처를 확인하지 않지만, 타코 실험에 연루된 모든 비버는 갑자기 마을을 떠나는 데 매우 관심을 보인다. 강력한 레시피는 하나의 마지막, 깊이 후회스러운 효과를 만들어냈다. [[C]][[-]]무작위 물이 [[시간:{F4}d]] 동안 오염된다."
csCZ = "Směs není dokončena včas. \nKrátce poté si strážci vody všimnou odporného načervenalého proudu, který se vplétá do nádrže. Nikdo oficiálně nedokáže určit zdroj, ale každý bobr zapojený do experimentu s tacos náhle projevuje velký zájem o opuštění města. \nSilný recept způsobil jeden poslední, hluboce litovaný účinek. \n[[C]][[-]]Náhodný zdroj vody se znečistí na [[time:{F4}d]]"
viVN = "Chế phẩm không được hoàn thành kịp thời. \nNgay sau đó, những người quan sát nước phát hiện ra một dòng nước đỏ bẩn thỉu thấm vào bể. Không ai chính thức xác định được nguồn gốc, nhưng mọi con nhím tham gia vào thí nghiệm taco bỗng trở nên rất muốn rời khỏi thị trấn. \nCông thức mạnh mẽ đã tạo ra một tác động cuối cùng, rất đáng tiếc. \n[[C]][[-]]Một nguồn nước ngẫu nhiên bị ô nhiễm trong [[time:{F4}d]]"
trTR = "Karışım zamanında tamamlanmadı. Kısa bir süre sonra, su bekçileri, havuza sızan kötü kokulu kırmızı bir akıntıyı fark eder. Kimse kaynağını resmi olarak tespit etmez, ama taco deneyimine katılan her kunduz aniden şehirden ayrılmaya çok hevesli hale gelir. Güçlü tarif, bir son, derinden pişmanlık verici bir etki üretmiştir. [[C]][[-]]Rastgele bir su kaynağı [[time:{F4}g]] süreyle kirlenir."

