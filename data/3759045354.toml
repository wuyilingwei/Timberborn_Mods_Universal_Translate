["LV.BCEv.BadtideDrainExcavation.Content"]
raw = "Morning comes with the scientist waiting beside the poisoned corner.\nThe report is clear enough to be troubling. Beneath the Badtide Drain lies a sealed hooman structure, built directly into the old system.\nNo one can say exactly how it works. The markings are too broken, the warnings too faded, and the mechanisms too strange.\nBut the design points toward one purpose: <b>stopping the drain permanently.</b>\nReaching it will not be simple. Stone must be cut. Metal must be braced. Tools will break. Supplies will vanish into the work.\nThe colony can commit the goods and dig. Or it can leave the hooman secret buried."
status = "normal"
enUS = "Morning comes with the scientist waiting beside the poisoned corner. The report is clear enough to be troubling. Beneath the Badtide Drain lies a sealed human structure, built directly into the old system. No one can say exactly how it works. The markings are too broken, the warnings too faded, and the mechanisms too strange. But the design points toward one purpose: <b>stopping the drain permanently.</b> Reaching it will not be simple. Stone must be cut. Metal must be braced. Tools will break. Supplies will vanish into the work. The colony can commit the goods and dig. Or it can leave the human secret buried."
zhCN = "早晨来临，科学家在被污染的角落旁等待。报告清晰得让人担忧。在坏潮排水口下方藏着一个密封的人类结构，直接建在旧系统中。没人能确切说出它是如何运作的。标记太破旧，警告太模糊，机制也太奇怪。但设计指向一个目的：<b>永久阻止排水。</b> 到达那里并不简单。石头必须被切割。金属必须被加固。工具会断裂。物资将消失在工作中。殖民地可以投入物资并挖掘。或者，它可以将人类的秘密埋葬。"
zhTW = "清晨，科學家在被污染的角落旁等待。\n報告足夠清晰以至於令人不安。在惡潮排水口下方，躺著一個封閉的人類結構，直接建造在舊系統內。\n沒有人能確切說出它是怎麼運作的。標記過於破損，警告過於模糊，機械過於奇特。\n但設計指向一個目的：<b>永久阻止排水。</b>\n到達那裡並不簡單。必須切割石頭。必須加固金屬。工具將會損壞。物資將在工作中消失。\n殖民地可以投入物資並挖掘。或者可以讓人類的秘密埋藏起來。"
ruRU = "Утро приходит, а ученый ждет рядом с зараженным углом. Отчет достаточно четкий, чтобы вызывать беспокойство. Под Бадтайд Дрейном находится запечатанная человеческая структура, встроенная непосредственно в старую систему. Никто не может точно сказать, как это работает. Знаки слишком повреждены, предупреждения слишком выцвели, а механизмы слишком странные. Но дизайн указывает на одну цель: <b>навсегда остановить дренаж.</b> Добраться до него не будет просто. Камень нужно рубить. Металл нужно укреплять. Инструменты будут ломаться. Запасы исчезнут в работе. Колония может выделить ресурсы и начать копать. Или она может оставить человеческую тайну похороненной."
jaJP = "朝が来ると、科学者は毒された隅で待っている。\n報告は明確であり、心配を引き起こす。バッドタイド排水路の下には、古いシステムに直接組み込まれた封印された人間の構造物がある。\nそれがどのように機能するか正確には誰にも言えない。 markings are too broken, warnings too faded, and mechanisms too strange.\nしかし、デザインは一つの目的を指し示している：<b>排水を永久に止めること。</b>\nそれに到達するのは簡単ではない。石を切らなければならない。金属を補強しなければならない。道具は壊れるだろう。資材は作業に消えていく。\nコロニーは物資を投入して掘り進むことができる。あるいは、人間の秘密を埋めたままにすることもできる。"
frFR = "Le matin se lève avec le scientifique attendant à côté du coin empoisonné.\nLe rapport est suffisamment clair pour être préoccupant. Sous le drain de marée basse se trouve une structure humaine scellée, construite directement dans l'ancien système.\nPersonne ne peut dire exactement comment cela fonctionne. Les marquages sont trop endommagés, les avertissements trop décolorés et les mécanismes trop étranges.\nMais le design pointe vers un seul objectif : <b>arrêter le drain définitivement.</b>\nAtteindre cet endroit ne sera pas simple. La pierre doit être coupée. Le métal doit être renforcé. Les outils vont se briser. Les fournitures vont disparaître dans le travail.\nLa colonie peut engager les ressources et creuser. Ou elle peut laisser le secret humain enfoui."
deDE = "Der Morgen kommt und der Wissenschaftler wartet neben der vergifteten Ecke. Der Bericht ist klar genug, um beunruhigend zu sein. Unter dem Badtide-Abfluss liegt eine versiegelte menschliche Struktur, die direkt in das alte System eingebaut ist. Niemand kann genau sagen, wie es funktioniert. Die Markierungen sind zu zerbrochen, die Warnungen zu verblasst und die Mechanismen zu seltsam. Aber das Design weist auf einen Zweck hin: <b>den Abfluss dauerhaft zu stoppen.</b> Es wird nicht einfach sein, dorthin zu gelangen. Stein muss geschnitten werden. Metall muss verstärkt werden. Werkzeuge werden brechen. Vorräte werden in die Arbeit verschwinden. Die Kolonie kann die Waren aufwenden und graben. Oder sie kann das menschliche Geheimnis begraben lassen."
plPL = "Rano nadchodzi, a naukowiec czeka przy zatrutym zakątku. Raport jest wystarczająco jasny, aby budzić niepokój. Pod Badtide Drain znajduje się zamknięta struktura stworzona przez ludzi, wbudowana bezpośrednio w stary system. Nikt nie potrafi dokładnie powiedzieć, jak to działa. Znaki są zbyt zniszczone, ostrzeżenia zbyt wyblakłe, a mechanizmy zbyt dziwne. Ale projekt wskazuje na jeden cel: <b>trwale zatrzymać odpływ.</b> Dotarcie do niego nie będzie proste. Kamień musi zostać przecięty. Metal musi zostać wzmocniony. Narzędzia się złamią. Zaopatrzenie zniknie podczas pracy. Kolonia może poświęcić dobra i wykopać. Albo może pozostawić sekret ludzi pogrzebany."
ptBR = "Partiu da manhã, e o cientista espera ao lado do canto envenenado.  \nO relatório é claro o suficiente para causar preocupação. Debaixo do Dreno de Maré Baixa, há uma estrutura de hooman selada, construída diretamente no antigo sistema.  \nNinguém pode dizer exatamente como funciona. As marcações estão muito danificadas, os avisos muito apagados e os mecanismos são muito estranhos.  \nMas o design aponta para um único propósito: <b>parar o drenagem permanentemente.</b>  \nChegar até lá não será simples. A pedra deve ser cortada. O metal deve ser reforçado. As ferramentas quebrarão. Os suprimentos desaparecerão no trabalho.  \nA colônia pode comprometer os recursos e cavar. Ou pode deixar o segredo hooman enterrado."
koKR = "아침이 오고 과학자는 독이 든 모서리 옆에서 기다리고 있다.  \n보고서는 걱정할 만큼 명확하다. 바드타이드 배수구 아래에는 고대 시스템에 직접 지어진 밀봉된 인간 구조물이 있다.  \n그것이 정확히 어떻게 작동하는지는 아무도 알 수 없다. 표시가 너무 손상되어 있고, 경고는 너무 바래었으며, 기계는 너무 이상하다.  \n그러나 설계는 하나의 목적을 향하고 있다: <b>배수를 영구적으로 막는 것.</b>  \n그곳에 도달하는 것은 간단하지 않을 것이다. 돌을 잘라야 한다. 금속을 지지해야 한다. 도구는 부서질 것이고. 자원은 작업 속으로 사라질 것이다.  \n식민지는 물품을 맡기고 파낼 수 있다. 아니면 인간의 비밀을 묻어둘 수 있다."
csCZ = "Ráno přichází s vědcem čekajícím vedle zamořeného rohu.  \nZpráva je dost jasná na to, aby byla znepokojivá. Pod Badtide Drain se nachází uzavřená lidská struktura, postavená přímo do starého systému.  \nNikdo nemůže přesně říct, jak to funguje. Značky jsou příliš rozbité, varování příliš vybledlá a mechanismy příliš podivné.  \nAle design směřuje k jednomu cíli: <b>trvale zastavit odtok.</b>  \nDostat se k tomu nebude jednoduché. Kámen musí být řezán. Kov musí být zpevněn. Nástroje se rozbijí. Zásoby zmizí v práci.  \nKolonie může vyčlenit zboží a kopat. Nebo může nechat lidské tajemství pohřbené."
viVN = "Buổi sáng đến với nhà khoa học chờ bên góc đã bị nhiễm độc.  \nBáo cáo rõ ràng đủ để gây lo ngại. Dưới Badtide Drain nằm một cấu trúc hooman được niêm phong, được xây dựng trực tiếp vào hệ thống cũ.  \nKhông ai có thể nói chính xác nó hoạt động như thế nào. Các ký hiệu đã quá hỏng, các cảnh báo đã quá mờ, và các cơ chế thì quá kỳ lạ.  \nNhưng thiết kế chỉ ra một mục đích: <b>dừng việc thoát nước vĩnh viễn.</b>  \nTiếp cận nó sẽ không đơn giản. Đá phải được cắt. Kim loại phải được gia cố. Dụng cụ sẽ gãy. Vật tư sẽ biến mất trong công việc.  \nThuộc địa có thể cam kết vật phẩm và đào. Hoặc nó có thể để bí mật hooman chôn vùi."
trTR = "Sabah, zehirli köşenin yanı başında bekleyen bilim insanıyla geliyor. Rapor, endişe verici olacak kadar net. Badtide Drenajı'nın altında, eski sistemle doğrudan inşa edilmiş mühürlü bir insan yapısı bulunuyor. Bunun nasıl çalıştığını kimse tam olarak söyleyemez. İşaretler çok bozulmuş, uyarılar çok solmuş ve mekanizmalar çok garip. Ancak tasarım tek bir amaca işaret ediyor: <b>drenajı kalıcı olarak durdurmak.</b> Oraya ulaşmak kolay olmayacak. Taş kesilmeli. Metal güçlendirilmelidir. Aletler kırılacak. Malzemeler işe karışacak. Koloni, malları yükleyip kazma işine girebilir. Ya da insan sırrını gömülü bırakabilir."

