["LV.BCEv.Taco.O1"]
raw = "After much debate, several failed experiments, and one flatbread nailed to a workbench, the cooks finally understand the recipe.\nVegetables, grilled roots, and sauce are wrapped inside a warm folded shell. The first bite silences the whole kitchen. Then the cheering begins.\n[[C]][[+]]All beavers gain +{%1} Working Speed for [[time:{F2}d]]"
status = "normal"
enUS = "After much debate, several failed experiments, and one flatbread nailed to a workbench, the cooks finally understand the recipe.  \nVegetables, grilled roots, and sauce are wrapped inside a warm folded shell. The first bite silences the whole kitchen. Then the cheering begins.  \n[[C]][[+]]All beavers gain +{%1} Working Speed for [[time:{F2}d]]"
zhCN = "经过大量的讨论、几次失败的实验，以及一个钉在工作台上的扁平面包，厨师们终于理解了这个食谱。\n蔬菜、烤根和酱汁包裹在温暖的折叠外壳里。第一口让整个厨房安静下来。随后欢呼声开始响起。\n[[C]][[+]]所有海狸获得 +{%1} 工作速度，持续 [[time:{F2}d]]"
zhTW = "經過長時間的討論、幾次失敗的實驗，以及一塊釘在工作台上的薄餅，廚師們終於理解了這個食譜。\n蔬菜、烤根和醬料包裹在溫暖的摺疊外殼中。第一口使整個廚房靜默無聲。隨後，歡呼聲開始響起。\n[[C]][[+]]所有水獺的工作速度增加 +{%1} 直到 [[time:{F2}d]]"
ruRU = "После долгих споров, нескольких неудачных экспериментов и одной лепешки, прибитой к верстаку, повара наконец поняли рецепт. Овощи, жареные корни и соус завернуты в теплую подаваемую обертку. Первый укус заставляет замереть всю кухню. Затем начинается восторг. [[C]][[+]]Все бобры получают +{%1} Скорости Работы на [[time:{F2}d]]"
jaJP = "多くの議論、いくつかの失敗した実験、そして作業台に打ち付けられた一枚のフラットブレッドの後、料理人たちはついにレシピを理解します。\n野菜、焼いた根菜、ソースが温かい折りたたまれたシェルの中に包まれています。最初の一口で厨房全体が静まり返ります。次に歓声が上がります。\n[[C]][[+]]すべてのビーバーは[[time:{F2}d]]の間、+{%1}の作業速度を得ます。"
frFR = "Après de nombreux débats, plusieurs expériences ratées et un pain plat cloué sur un établi, les cuisiniers comprennent enfin la recette.  \nDes légumes, des racines grillées et de la sauce sont enveloppés dans une coquille pliée et chaude. La première bouchée plonge toute la cuisine dans le silence. Puis commencent les acclamations.  \n[[C]][[+]]Tous les castors gagnent +{%1} Vitesse de Travail pendant [[time:{F2}j]]"
deDE = "Nach vielen Debatten, mehreren gescheiterten Experimenten und einem Fladenbrot, das an einer Werkbank befestigt war, verstehen die Köche endlich das Rezept. Gemüse, gegrillte Wurzeln und Sauce sind in einer warmen gefalteten Hülle eingewickelt. Der erste Biss bringt die gesamte Küche zum Schweigen. Dann beginnt der Jubel. [[C]][[+]] Alle Biber erhalten +{%1} Arbeitsgeschwindigkeit für [[time:{F2}d]]."
plPL = "Po wielu dyskusjach, kilku nieudanych eksperymentach i jednej płaskiej bułce przybitej do warsztatu, kucharze w końcu rozumieją przepis.  \nWarzywa, grillowane korzenie i sos są zawijane w ciepłą, złożoną skorupkę. Pierwszy kęs ucisza całą kuchnię. A potem zaczynają się okrzyki radości.  \n[[C]][[+]]Wszystkie bobry zyskują +{%1} Prędkości Pracy na [[time:{F2}d]]"
ptBR = "Após muita discussão, vários experimentos fracassados e um pão achatado pregado a uma mesa de trabalho, os cozinheiros finalmente entendem a receita. Vegetais, raízes grelhadas e molho estão envoltos em uma casca dobrada e quente. A primeira mordida silencia toda a cozinha. Então, a comemoração começa. [[C]][[+]]Todos os castores ganham +{%1} Velocidade de Trabalho por [[time:{F2}d]]"
koKR = "많은 토론과 여러 번의 실패한 실험, 그리고 작업대에 못이 박힌 납작한 빵 뒤에 요리사들은 마침내 레시피를 이해하게 되었습니다.  \n채소, 구운 뿌리, 소스가 따뜻하게 접힌 껍질 안에 싸여 있습니다. 첫 입을 먹고 나자 주방은 조용해집니다. 그리고 환호가 시작됩니다.  \n[[C]][[+]]모든 비버는 [[time:{F2}d]] 동안 +{%1} 작업 속도가 증가합니다."
csCZ = "Po dlouhém debatování, několika neúspěšných experimentech a jednom plochém chlebu přibitém na pracovní stůl, kuchaři konečně pochopili recept.\nZelenina, grilované kořeny a omáčka jsou zabaleny do teplé skládací skořepiny. První sousto umlčí celou kuchyni. Pak začnou oslavné výkřiky.\n[[C]][[+]]Všichni bobři získávají +{%1} Rychlost Práce na [[time:{F2}d]]"
viVN = "Cuộc tranh luận kéo dài, hàng loạt thí nghiệm không thành công, và một chiếc bánh mì phẳng đóng đinh trên bàn làm việc, cuối cùng các đầu bếp đã hiểu công thức.\nRau củ, rễ nướng và sốt được cuộn trong một lớp vỏ ấm. Miếng cắn đầu tiên làm im lặng toàn bộ nhà bếp. Sau đó tiếng cổ vũ bắt đầu vang lên.\n[[C]][[+]]Tất cả động vật có vú đều nhận được +{%1} Tốc độ Làm việc trong [[time:{F2}d]]."
trTR = "Birçok tartışma, birkaç başarısız deney ve bir düz yufkanın bir iş tezgahına çakılmasından sonra aşçılar sonunda tarifi anladı. Sebzeler, ızgara kökler ve sos sıcak bir katlanmış kabuğun içinde sarılır. İlk lokma mutfaktaki tüm sesi keser. Sonra tezahüratlar başlar. [[C]][[+]]Tüm kunduzlar [[time:{F2}g]] için +{%1} Çalışma Hızı kazanır."

["LV.BCEv.Taco.O2"]
raw = "The scrap is discarded, but word of the supposed hooman delicacy has already spread through the colony.\nBeavers grumble that the administration denied them the greatest meal ever invented, despite none of them knowing what it was supposed to taste like.\n[[C]][[-]]All beavers lose {%3} Working Speed for [[time:{F2}d]]"
status = "normal"
enUS = "The scrap is discarded, but word of the supposed human delicacy has already spread through the colony. Beavers grumble that the administration denied them the greatest meal ever invented, despite none of them knowing what it was supposed to taste like. [[C]][[-]]All beavers lose {%3} Working Speed for [[time:{F2}d]]"
zhCN = "废料被丢弃，但关于这种所谓人类美食的传闻已经在殖民地传播开来。\n海狸们抱怨管理层拒绝了他们享用有史以来最伟大的美餐，尽管他们中的没有一个知道那应该是什么味道。\n[[C]][[-]]所有海狸工作速度减少 {%3}，持续时间为 [[time:{F2}d]]"
zhTW = "廢料被丟棄，但有關所謂人類美食的傳聞已經在殖民地傳開。\n河狸們抱怨管理層剝奪了他們有史以來最偉大的餐點，儘管他們都不知道那究竟應該是什麼味道。\n[[C]][[-]]所有河狸的工作速度下降 {%3} 於 [[time:{F2}d]]"
ruRU = "Металлобрухт выбрасывается, но слух о предполагаемом деликатесе от людей уже распространился по колонии. Бобры ворчат, что администрация отказала им в величайшем блюде, когда-либо изобретенном, хотя никто из них не знает, на что оно должно было быть похоже на вкус. [[C]][[-]]Все бобры теряют {%3} Рабочей Скорости на [[время:{F2}д]]"
jaJP = "廃棄物は捨てられたが、いわゆる人間の delicacy の噂はすでにコロニーに広がっている。ビーバーたちは、何を食べるべきかも知らないのに、行政が彼らに今まで発明された最高の食事を拒否したと不満を漏らしている。 [[C]][[-]]すべてのビーバーは [[time:{F2}d]] の間 {%3} 作業速度を失う。"
frFR = "Les déchets sont jetés, mais la rumeur de la supposée délicatesse humaine s'est déjà répandue dans la colonie.\nLes castors grognent que l'administration leur a refusé le plus grand plat jamais inventé, bien qu'aucun d'entre eux ne sache à quoi il était censé goûter.\n[[C]][[-]]Tous les castors perdent {%3} Vitesse de Travail pendant [[time:{F2}j]]"
deDE = "Der Schrott wird verworfen, aber das Gerücht über die angebliche hooman Delikatesse hat sich bereits in der Kolonie verbreitet.  \nDie Biber murren, dass die Verwaltung ihnen die größte je erfundene Mahlzeit verweigert hat, obwohl keiner von ihnen weiß, wie sie schmecken sollte.  \n[[C]][[-]]Alle Biber verlieren {%3} Arbeitsgeschwindigkeit für [[time:{F2}d]]"
plPL = "Odpady są wyrzucane, ale wieści o rzekomej ludzkiej delicji już rozeszły się po kolonii. Bobry narzekają, że administracja odmówiła im największego posiłku, jaki kiedykolwiek wynaleziono, mimo że żadne z nich nie wiedziało, jak to powinno smakować. [[C]][[-]]Wszystkie bobry tracą {%3} Prędkości Pracy na [[czas:{F2}d]]"
ptBR = "O lixo é descartado, mas a palavra sobre a suposta iguaria humana já se espalhou pela colônia. Os castores resmungam que a administração os negou a maior refeição já inventada, apesar de nenhum deles saber como deveria ser o sabor. [[C]][[-]]Todos os castores perdem {%3} de Velocidade de Trabalho por [[time:{F2}d]]"
koKR = "쓰레기는 버려졌지만, 소문에 따르면 소위 인간의 진미에 대한 이야기가 식민지에 퍼졌다.\n비버들은 행정부가 그들이 무엇인지도 모르면서 인류가 발명한 가장 위대한 식사를 거부했다고 불평한다.\n[[C]][[-]]모든 비버는 {%3} 작업 속도를 [[time:{F2}d]] 동안 잃게 된다."
csCZ = "Šrot je odmítnut, ale zpráva o údajném lidském delikatesu se již rozšířila kolonií. Bobři si stěžují, že jim administrativa odepřela největší jídlo, jaké kdy bylo vynalezeno, přestože nikdo z nich neví, jaké to mělo být. [[C]][[-]]Všichni bobři ztrácí {%3} pracovní rychlost na [[čas:{F2}d]]"
viVN = "Những mảnh vụn bị loại bỏ, nhưng tin về món sàng tinh hoa dành cho loài người đã lan ra khắp thuộc địa.\nNhững con béo càu nhàu rằng chính quyền đã từ chối cho chúng món ăn tuyệt nhất từng được phát minh, mặc dù không ai trong số chúng biết nó có vị như thế nào.\n[[C]][[-]]Tất cả những con béo mất {%3} Tốc độ Làm việc trong [[thời gian:{F2}d]]"
trTR = "Atık unutuldu, ancak sözde insan delicacy'sinin haberleri koloniye çoktan yayıldı. \nKunduzlar, yönetimin onlara şimdiye kadar icat edilmiş en iyi yemeği inkar ettiğinden şikayet ediyor, oysa hiçbiri bunun neye benzediğini bilmiyor. \n[[C]][[-]]Tüm kunduzlar {%3} Çalışma Hızını kaybeder [[time:{F2}g]]"

