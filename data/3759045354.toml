["LV.BCEv.StartBonusWaterfall.Content"]
raw = "The colony reaches the foot of the great waterfall, where clean water crashes down from the heights and gathers in bright, restless pools.\nThe air is cool with mist. Moss clings to the stone, and every beaver can hear the steady promise of the stream before the first path is even marked.\nThe scouts find a narrow basin where fresh water has collected, untouched and easy to draw. It could fill the colony's barrels at once.\nOr it could be left undisturbed, for reasons no one fully understands yet."
status = "normal"
enUS = "The colony reaches the foot of the great waterfall, where clean water crashes down from the heights and gathers in bright, restless pools. The air is cool with mist. Moss clings to the stone, and every beaver can hear the steady promise of the stream before the first path is even marked. The scouts find a narrow basin where fresh water has collected, untouched and easy to draw. It could fill the colony's barrels at once. Or it could be left undisturbed, for reasons no one fully understands yet."
zhCN = "殖民地到达了巨大的瀑布脚下，清澈的水从高处倾泻而下，汇聚成明亮而不安静的水潭。\n空气中弥漫着凉爽的雾气。苔藓紧贴在岩石上，每只海狸都能听到在第一条小路标记之前，溪流的稳定承诺。\n侦查者们发现了一个狭窄的盆地，清水聚集在这里，未被触及且易于提取。它可以一次性填满殖民地的水桶。\n或者可以不被打扰，原因至今无人能完全理解。"
zhTW = "殖民地達到了巨大瀑布的腳下，清澈的水從高處奔騰而下，匯集成明亮而不安的水池。空氣中帶著涼爽的水霧。青苔附著在石頭上，每隻海狸都能聽到小溪穩定的承諾，甚至在第一條路徑還未標記之前。偵查者們發現了一個狹窄的盆地，新鮮的水在那裡聚集，未受打擾且易於提取。這可以一次性填滿殖民地的水桶。或者它可以保持不被打擾，原因尚無人能完全理解。"
ruRU = "Колония достигает подножия великого водопада, где чистая вода падает с высоты и собирается в ярких, беспокойных лужах. Воздух прохладен от тумана. Мох прилип к камням, и каждый бобр слышит стойкое обещание ручья, прежде чем будет проложена первая тропа. Разведчики находят узкую чашу, где собирается свежая вода, нетронутая и легкодоступная. Она могла бы сразу заполнить бочки колонии. Или ее можно было бы оставить нетронутой, по причинам, которые пока никто не может полностью понять."
jaJP = "コロニーは大滝のふもとに達し、清らかな水が高みから激しく流れ落ち、明るく落ち着かない水たまりに集まります。  \n空気は霧でひんやりしています。苔が石に張り付き、すべてのビーバーは最初の道がまだ示されていない時点でも流れの堅実な約束を聞くことができます。  \nスカウトたちは新鮮な水が集まった狭い盆地を見つけます。それは手つかずで引き出しやすく、コロニーの樽を一度に満たすことができます。  \nあるいは、誰も完全には理解していない理由から、手を加えずに放置されるかもしれません。"
frFR = "La colonie atteint le pied de la grande cascade, où l'eau claire dévale des hauteurs et se rassemble dans des bassins lumineux et agités. L'air est frais avec de la brume. La mousse s'accroche à la pierre, et chaque castor peut entendre la promesse continue du ruisseau avant même que le premier chemin ne soit marqué. Les éclaireurs trouvent un étang étroit où l'eau douce s'est accumulée, intacte et facile à puiser. Elle pourrait remplir les tonneaux de la colonie en un instant. Ou elle pourrait rester inaltérée, pour des raisons que personne ne comprend encore pleinement."
deDE = "Die Kolonie erreicht den Fuß des großen Wasserfalls, wo sauberes Wasser aus den Höhen herabstürzt und in hellen, unruhigen Becken gesammelt wird. \nDie Luft ist kühl und neblig. Moos haftet an den Steinen, und jeder Biber kann das stetige Versprechen des Baches hören, bevor der erste Weg überhaupt gekennzeichnet ist. \nDie Späher finden ein schmales Becken, in dem frisches Wasser gesammelt ist, unberührt und leicht zu schöpfen. Es könnte die Fässer der Kolonie auf einmal füllen. \nOder es könnte unberührt gelassen werden, aus Gründen, die noch niemand vollständig versteht."
plPL = "Kolonia dociera u stóp wielkiego wodospadu, gdzie czysta woda spływa z wysokości i gromadzi się w jasnych, niespokojnych kałużach.  \nPowietrze jest chłodne od mgły. Mech przylega do kamienia, a każdy bóbr może usłyszeć stałą obietnicę strumienia, zanim pierwsza ścieżka zostanie nawet zaznaczona.  \nSkauci znajdują wąską misę, w której zgromadziła się świeża woda, nietknięta i łatwa do pobrania. Może napełnić beczki kolonii od razu.  \nAlbo może pozostać nietknięta, z powodów, których nikt jeszcze do końca nie rozumie."
ptBR = "A colônia chega ao pé da grande cachoeira, onde a água limpa despenca das alturas e se acumula em poças brilhantes e inquietas. O ar é fresco com névoa. Musgo se agarra à pedra, e cada castor pode ouvir a promessa constante do riacho antes mesmo de o primeiro caminho ser marcado. Os exploradores encontram uma bacia estreita onde água doce se acumulou, intocada e fácil de retirar. Poderia encher os barris da colônia de uma vez. Ou poderia ser deixada intocada, por razões que ninguém entende completamente ainda."
koKR = "식민지가 거대한 폭포의 기슭에 도달하였으며, 맑은 물이 높은 곳에서 쏟아져 내려 밝고 restless한 웅덩이에 모입니다. 공기는 안개로 시원합니다. 이끼가 돌에 달라붙어 있으며, 모든 비버는 첫 번째 길이 표시되기 전에도 개울의 안정된 약속을 들을 수 있습니다. 정찰대는 신선한 물이 모여 있는 좁은 분지를 발견했습니다. 그 물은 손대지 않은 채 쉽게 끌어낼 수 있습니다. 그것은 식민지의 배럴을 한 번에 채울 수 있습니다. 또는 아직 누구도 완전히 이해하지 못하는 이유로 방치될 수 있습니다."
csCZ = "Kolonie dosáhla úpatí velkého vodopádu, kde čistá voda padají z výšky a hromadí se ve světlých, neklidných kalužích. \nVzduch je chladný s mlhou. Mech se drží kamene a každý bobr slyší stálý slib potoka, ještě předtím, než je vůbec vyznačena první cesta. \nPrůzkumníci nacházejí úzkou kotlinu, kde se shromáždila čerstvá voda, neporušená a snadno dostupná. Mohla by naplnit barely kolonie najednou. \nNebo by mohla zůstat nedotčená, z důvodů, které nikdo ještě zcela nechápe."
viVN = "Khu định cư đến chân thác nước lớn, nơi nước sạch đổ xuống từ độ cao và tụ lại thành những hồ trong sáng, không yên.\nKhông khí mát mẻ với sương mù. Rêu bám vào đá, và mọi con rái cá đều có thể nghe được âm thanh nhịp nhàng của dòng suối trước khi con đường đầu tiên được đánh dấu.\nNhững người trinh sát tìm thấy một cái chậu hẹp nơi nước sạch đã hội tụ, chưa bị động chạm và dễ dàng lấy nước. Nó có thể lấp đầy các thùng của khu định cư trong chớp mắt.\nHoặc nó có thể được để yên, vì những lý do mà chưa ai hoàn toàn hiểu được."
trTR = "Koloni, yükseklerden düşen temiz suyun toplandığı parlak, huzursuz havuzların bulunduğu büyük şelalenin eteğine ulaşıyor. Hava, sisle serin. Sedir, kayaya yapışmış durumda ve her kunduz, ilk yol bile belirlenmeden önce akarsuyun sürekli vaatini duyabiliyor. Kaşifler, temiz suyun biriktiği dar bir havza buluyor; dokunulmamış ve çekmesi kolay. Bu, koloninin varillerini bir anda doldurabilir. Ya da henüz kimsenin tam olarak anlayamadığı nedenlerden ötürü, dokunulmamış bırakılabilir."

