["LV.BCEv.Taco2.O1"]
raw = "The new taco burns the tongue, clears the nose, and makes every beaver feel capable of constructing a dam with their bare paws.\nThe colony surges into action with alarming enthusiasm.\n[[C]][[+]]All beavers gain +{%1} Working Speed and Movement Speed for [[time:{F3}d]]"
status = "normal"
enUS = "The new taco burns the tongue, clears the nose, and makes every beaver feel capable of constructing a dam with their bare paws. The colony surges into action with alarming enthusiasm. [[C]][[+]]All beavers gain +{%1} Working Speed and Movement Speed for [[time:{F3}d]]"
zhCN = "新特别玉米饼让舌头火辣，鼻子畅通无阻，让每只海狸都感到能够用双手建造水坝。  \n殖民地以惊人的热情迅速行动起来。  \n[[C]][[+]]所有海狸获得 +{%1} 的工作速度和移动速度，持续 [[time:{F3}d]]"
zhTW = "新的塔可讓舌頭感到燒灼，清理鼻腔，並讓每隻海狸都覺得能夠用赤手建造壩子。  \n殖民地以驚人的熱情全力以赴。  \n[[C]][[+]]所有海狸獲得 +{%1} 工作速度和移動速度，持續 [[時間:{F3}d]]"
ruRU = "Новый тако жжет язык, очищает нос и заставляет каждого бобра чувствовать себя способным построить плотину голыми лапами. Колония начинает действовать с тревожным энтузиазмом. [[C]][[+]]Все бобры получают +{%1} Скорости работы и Скорости движения на [[time:{F3}д]]"
jaJP = "新しいタコスは舌を焼き、鼻をスッキリさせ、すべてのビーバーに素手でダムを建設できると感じさせる。\nコロニーは驚くべき熱意で行動を起こす。\n[[C]][[+]]すべてのビーバーは[[time:{F3}d]]の間、+{%1}作業速度と移動速度を得る。"
frFR = "Le nouveau taco brûle la langue, débouche le nez et donne à chaque castor la sensation d'être capable de construire un barrage avec ses pattes nues. \nLa colonie s’active avec un enthousiasme alarmant. \n[[C]][[+]]Tous les castors gagnent +{%1} de vitesse de travail et de vitesse de déplacement pendant [[time:{F3}d]]"
deDE = "Der neue Taco brennt auf der Zunge, befreit die Nase und lässt jeden Biber glauben, er könne mit seinen bloßen Pfoten einen Damm bauen. \nDie Kolonie stürzt sich mit alarmierender Begeisterung ins Geschehen. \n[[C]][[+]]Alle Biber erhalten +{%1} Arbeitsgeschwindigkeit und Bewegungsgeschwindigkeit für [[time:{F3}d]]"
plPL = "Nowy taco parzy język, oczyszcza nos i sprawia, że każdy bóbr czuje się zdolny do zbudowania tamy swoimi gołymi łapami.\nKolonia wkrótce przystępuje do działania z alarmującym entuzjazmem.\n[[C]][[+]]Wszystkie bobry zyskują +{%1} Prędkości Pracy i Prędkości Ruchu na [[time:{F3}d]]"
ptBR = "O novo taco queima a língua, desentope o nariz e faz cada castor se sentir capaz de construir uma represa com suas próprias patas.\nA colônia entra em ação com um entusiasmo alarmante.\n[[C]][[+]]Todos os castores ganham +{%1} de Velocidade de Trabalho e Velocidade de Movimento por [[time:{F3}d]]"
koKR = "새로운 타코는 혀를 태우고, 코를 시원하게 해주며, 모든 비버가 맨손으로 댐을 건설할 수 있는 능력을 느끼게 합니다. \n식민지는 놀라운 열정으로 행동에 나섭니다. \n[[C]][[+]]모든 비버는 [[time:{F3}d]] 동안 +{%1} 작업 속도 및 이동 속도를 얻습니다."
csCZ = "Nový taco pálí jazyk, uvolňuje nos a dává každému bobrovi pocit, že je schopen postavit hráz holýma tlapama. Kolonie se s alarmujícím nadšením vrhá do akce. [[C]][[+]]Všichni bobři získávají +{%1} Rychlost Práce a Rychlost Pohybu na [[time:{F3}d]]"
viVN = "Những chiếc taco mới gây bỏng lưỡi, thông thoáng mũi, và khiến mọi con hải ly cảm thấy có khả năng xây dựng đập bằng chính đôi tay của chúng.\nColony lao vào hành động với sự nhiệt tình đáng ngạc nhiên.\n[[C]][[+]]Tất cả hải ly nhận +{%1} Tốc độ làm việc và Tốc độ di chuyển trong [[thời gian:{F3}d]]"
trTR = "Yeni taco, dili yakar, burnu açar ve her bir kunduzun çıplak pençeleriyle bir baraj inşa etme yeteneği hissetmesini sağlar. Koloni, endişe verici bir coşku ile harekete geçer. [[C]][[+]]Tüm kunduzlar [[time:{F3}g]] süreyle +{%1} Çalışma Hızı ve Hareket Hızı kazanır."

["LV.BCEv.Taco2.PowerfulPanel"]
raw = "Something powerful has been unleashed. The cooks are watching the colony very closely."
status = "normal"
enUS = "Something powerful has been unleashed. The cooks are watching the colony very closely."
zhCN = "一些强大的东西被释放了。厨师们正在密切关注这个殖民地。"
zhTW = "強大的力量已經被釋放。廚師們正密切觀察這個殖民地。"
ruRU = "«Что-то мощное было высвобождено. Поваров очень внимательно наблюдают за колонией.»"
jaJP = "「何か強力なものが解き放たれました。料理人たちはコロニーを非常に注意深く見守っています。」"
frFR = "Quelque chose de puissant a été libéré. Les cuisiniers surveillent la colonie de très près."
deDE = "Etwas Mächtiges wurde entfesselt. Die Köche beobachten die Kolonie sehr genau."
plPL = "Coś potężnego zostało uwolnione. Kucharze uważnie obserwują kolonię."
ptBR = "Algo poderoso foi liberado. Os cozinheiros estão observando a colônia muito de perto."
koKR = "강력한 무언가가 풀려났다. 요리사들이 식민지를 매우 면밀히 관찰하고 있다."
csCZ = "Něco mocného bylo uvolněno. Kuchaři pečlivě sledují kolonie."
viVN = "Một điều gì đó mạnh mẽ đã được giải phóng. Những người đầu bếp đang theo dõi khu thuộc địa rất chặt chẽ."
trTR = "Güçlü bir şey serbest bırakıldı. Aşçılar koloniyi çok dikkatli izliyor."

["LV.BCEv.Taco2.O2"]
raw = "The cooks return to the original recipe. It lacks the promised hooman power, but it remains delicious, dependable, and unlikely to cause any trouble.\n[[C]][[+]]All beavers gain +{%2} Working Speed for [[time:{F3}d]]"
status = "normal"
enUS = "The cooks return to the original recipe. It lacks the promised human power, but it remains delicious, dependable, and unlikely to cause any trouble.\n[[C]][[+]]All beavers gain +{%2} Working Speed for [[time:{F3}d]]"
zhCN = "厨师们回到了原来的食谱。虽然缺少了承诺的人类力量，但仍然美味、可靠，并且不太可能造成麻烦。  \n[[C]][[+]]所有海狸获得 +{%2} 工作速度，持续 [[time:{F3}d]]"
zhTW = "廚師們回到了原來的食譜。雖然缺乏承諾的人力，但依然美味、可靠，並且不太可能引發任何麻煩。\n[[C]][[+]]所有海狸的工作速度提升 +{%2}，持續[[time:{F3}d]]"
ruRU = "Повары возвращаются к оригинальному рецепту. В нём не хватает обещанной силы хуман, но он остаётся вкусным, надёжным и вряд ли вызовет проблемы. \n[[C]][[+]]Все бобры получают +{%2} Скорости Работы на [[time:{F3}д]]"
jaJP = "クックたちは元のレシピに戻ります。約束された人間の力はありませんが、それでもおいしく、頼りがいがあり、問題を引き起こす可能性は低いままです。  \n[[C]][[+]]すべてのビーバーは[[time:{F3}d]]の間、+{%2}作業速度を得ます。"
frFR = "Les cuisiniers retournent à la recette originale. Elle manque de la puissance humaine promise, mais elle reste délicieuse, fiable et peu susceptible de causer des problèmes.\n[[C]][[+]]Tous les castors obtiennent +{%2} Vitesse de Travail pendant [[time:{F3}d]]"
deDE = "Die Köche kehren zum ursprünglichen Rezept zurück. Es fehlt die versprochene menschliche Kraft, aber es bleibt köstlich, zuverlässig und wahrscheinlich ohne Probleme.\n[[C]][[+]]Alle Biber erhalten +{%2} Arbeitsgeschwindigkeit für [[time:{F3}d]]"
plPL = "Kucharze wracają do oryginalnego przepisu. Brakuje w nim obiecanej mocy ludzkiej, ale pozostał smaczny, niezawodny i mało prawdopodobne, że sprawi jakiekolwiek kłopoty.  \n[[C]][[+]]Wszystkie bobry zyskują +{%2} Szybkości Pracy na [[czas:{F3}d]]"
ptBR = "Os cozinheiros retornam à receita original. Falta o prometido poder humano, mas continua deliciosa, confiável e improvável de causar qualquer problema.  \n[[C]][[+]]Todos os castores ganham +{%2} Velocidade de Trabalho por [[time:{F3}d]]"
koKR = "요리사들은 원래 레시피로 돌아갑니다. 약속된 인간의 힘은 부족하지만, 여전히 맛있고, 믿을 수 있으며, 문제를 일으킬 가능성이 적습니다.  \n[[C]][[+]]모든 바버들은 [[time:{F3}d]] 동안 +{%2} 작업 속도를 얻습니다."
csCZ = "Kuchaři se vrací k původnímu receptu. Chybí mu slíbená síla člověka, ale stále zůstává chutné, spolehlivé a nepravděpodobné, že by způsobilo nějaké problémy.  \n[[C]][[+]]Všichni bobři získávají +{%2} Rychlost Práce na [[time:{F3}d]]"
viVN = "Những người đầu bếp trở lại với công thức ban đầu. Nó thiếu sức mạnh đảm bảo của con người, nhưng vẫn ngon, đáng tin cậy và không có khả năng gây ra rắc rối.  \n[[C]][[+]]Tất cả các con beaver tăng +{%2} Tốc độ Làm Việc trong [[time:{F3}d]]"
trTR = "Şefler orijinal tarife dönüş yapıyor. Tahmin edilen insan gücünden yoksun, ama hala lezzetli, güvenilir ve sorun çıkarması pek olası değil.  \n[[C]][[+]]Tüm kunduzlar [[time:{F3}g]] boyunca +{%2} Çalışma Hızı kazanır."

["LV.BCEv.Taco2.O3"]
raw = "After examining the increasingly suspicious recipe, the cooks agree that some hooman knowledge is best left untranslated.\nThe remaining scraps are locked away, and everyone quietly returns to eating sensible food."
status = "normal"
enUS = "After examining the increasingly suspicious recipe, the cooks agree that some human knowledge is best left untranslated. The remaining scraps are locked away, and everyone quietly returns to eating sensible food."
zhCN = "在仔细审查越来越可疑的食谱后，厨师们一致认为某些人类知识最好留作未翻译。其余的碎片被锁起来，大家安静地回到吃合理的食物上。"
zhTW = "在檢查這道越來越可疑的食譜後，廚師們一致認為，有些人類的知識最好不要翻譯。剩下的碎屑被鎖起來，大家靜靜地回到吃合理的食物上。"
ruRU = "После изучения все более подозрительного рецепта повара соглашаются, что некоторые знания людей лучше оставить в переводе. Оставшиеся кусочки заперты, и все тихо возвращаются к разумной пище."
jaJP = "徐々に疑わしくなってきたレシピを調べた後、料理人たちはいくつかの人間の知識は翻訳せずにおくのが最善だと同意しました。残りのスクラップは鍵をかけられ、皆は静かに常識的な食べ物に戻ります。"
frFR = "Après avoir examiné la recette de plus en plus suspecte, les cuisiniers conviennent que certaines connaissances humaines valent mieux d'être laissées non traduites. Les morceaux restants sont enfermés, et tout le monde retourne en silence à la consommation de nourriture raisonnable."
deDE = "Nachdem das zunehmend verdächtige Rezept untersucht wurde, sind sich die Köche einig, dass einige menschliche Kenntnisse besser unübersetzt bleiben.\nDie verbleibenden Reste werden weggeschlossen, und alle kehren leise zurück, um vernünftige Nahrung zu sich zu nehmen."
plPL = "Po zbadaniu coraz bardziej podejrzanego przepisu, kucharze zgadzają się, że niektóre ludzkie wiedzy najlepiej pozostawić w tłumaczeniu.\nPozostałe resztki są zamknięte, a wszyscy cicho wracają do jedzenia rozsądnego jedzenia."
ptBR = "Após examinar a receita cada vez mais suspeita, os cozinheiros concordam que algum conhecimento humano é melhor deixado sem tradução. Os restos restantes são trancados, e todos voltam silenciosamente a comer alimentos sensatos."
koKR = "점점 의심스러운 레시피를 살펴본 후, 요리사들은 일부 인간의 지식은 번역하지 않는 것이 가장 좋다고 동의합니다. 남은 잔재는 잠궈지고, 모두 조용히 합리적인 음식을 먹는 것으로 돌아갑니다."
csCZ = "Po prozkoumání stále podezřelejšího receptu se kuchaři shodují, že některé lidské znalosti je nejlepší nechat nepřeložené. Zbývající zbytky jsou uzamčeny a všichni se tiše vracejí k pojídání rozumného jídla."
viVN = "Sau khi xem xét công thức ngày càng đáng ngờ, những người đầu bếp đồng ý rằng một số kiến thức của loài người tốt nhất nên để nguyên không dịch.\nCác mảnh vụn còn lại được khóa lại, và mọi người lặng lẽ quay trở lại ăn những món ăn hợp lý."
trTR = "Gitgide şüpheli hale gelen tarife baktıktan sonra, aşçılar bazı insan bilgilerini çevirmemenin en iyisi olduğuna karar verirler. Kalan atıklar kilitlenir ve herkes sessizce akıllıca yiyecekler yemeye döner."

["LV.BCEv.Taco2.Cure.Content"]
raw = "The powerful taco has completed its journey through the colony.\nThe cooks now understand why the hoomans called it <YellowHighlight>extra powerful</YellowHighlight>. The entrance was painful. The exit threatens to become a historical event.\nA hurriedly designed concoction of water and berries may settle every stomach before the consequences reach the waterways."
status = "normal"
enUS = "The powerful taco has completed its journey through the colony. The cooks now understand why the humans called it <YellowHighlight>extra powerful</YellowHighlight>. The entrance was painful. The exit threatens to become a historical event. A hurriedly designed concoction of water and berries may settle every stomach before the consequences reach the waterways."
zhCN = "强大的塔可已经完成了它在殖民地中的旅程。\n厨师们现在明白为什么人类称它为<YellowHighlight>特别强大</YellowHighlight>。入口令人痛苦，出口则有可能成为历史事件。\n一种匆忙设计的水和浆果混合饮料可能会在后果到达水道之前平息每一个胃的反应。"
zhTW = "強大的塔可已經完成了它在殖民地中的旅程。廚師們現在明白為什麼人類叫它<YellowHighlight>超級強力</YellowHighlight>。入口很痛苦，出口則有成為歷史事件的威脅。一種匆匆設計的水與漿果的混合物，或許能在後果到達水道之前平息每個胃。"
ruRU = "Могущественный тако завершил своё путешествие через колонию. Поваренные теперь понимают, почему люди называли его <YellowHighlight>особо мощным</YellowHighlight>. Вход был болезненным. Выход угрожает стать историческим событием. Поспешно изготовленный коктейль из воды и ягод может успокоить каждый желудок, прежде чем последствия доберутся до водных путей."
jaJP = "強力なタコがコロニーを通り抜ける旅を終えました。 \n料理人たちは今、ホーマンたちがそれを<YellowHighlight>超強力</YellowHighlight>と呼んだ理由を理解しています。 \n入口は痛みを伴いました。出口は歴史的な出来事になりそうです。 \n急いで考案された水とベリーの混合物が、結果が水路に達する前にすべての胃を落ち着かせるかもしれません。"
frFR = "Le puissant taco a achevé son voyage à travers la colonie.  \nLes cuisiniers comprennent maintenant pourquoi les hoomans l'appelaient <YellowHighlight>extra puissant</YellowHighlight>. L'entrée était douloureuse. La sortie menace de devenir un événement historique.  \nUne concoction rapidement conçue d'eau et de baies pourrait apaiser tous les estomacs avant que les conséquences n'atteignent les voies navigables."
deDE = "Der mächtige Taco hat seine Reise durch die Kolonie abgeschlossen.  \nDie Köche verstehen jetzt, warum die Hoomans ihn <YellowHighlight>extra mächtig</YellowHighlight> nannten. Der Eingang war schmerzhaft. Der Ausgang droht, ein historisches Ereignis zu werden.  \nEine hastig zusammengestellte Mischung aus Wasser und Beeren könnte jeden Magen beruhigen, bevor die Folgen die Wasserwege erreichen."
plPL = "Potężny taco zakończyło swoją podróż przez kolonię. Kucharze teraz rozumieją, dlaczego hoomani nazywali je <YellowHighlight>ekstra potężnym</YellowHighlight>. Wejście było bolesne. Wyjście grozi, że stanie się wydarzeniem historycznym. Pośpiesznie zaprojektowana mikstura wody i jagód może uspokoić każdy żołądek, zanim konsekwencje dotrą do wód."
ptBR = "O poderoso taco completou sua jornada pela colônia. Os cozinheiros agora entendem por que os hoomans o chamaram de <YellowHighlight>extra poderoso</YellowHighlight>. A entrada foi dolorosa. A saída ameaça se tornar um evento histórico. Uma mistura apressadamente elaborada de água e frutas pode acalmar cada estômago antes que as consequências cheguem às vias aquáticas."
koKR = "강력한 타코가 식민지를 지나 여행을 마쳤습니다. 요리사들은 이제 인간들이 왜 그것을 <YellowHighlight>특별히 강력한</YellowHighlight>이라고 불렀는지를 이해하게 되었습니다. 입구는 고통스러웠고, 출구는 역사적인 사건이 될 수 있습니다. 급하게 설계된 물과 베리의 혼합물이 결과가 수로에 도달하기 전에 모든 배를 안정시킬 수 있을 것입니다."
csCZ = "Silný taco úspěšně dokončil svou cestu kolonií. Kuchaři nyní chápou, proč ho lidé nazvali <YellowHighlight>extra silné</YellowHighlight>. Vstup byl bolestivý. Výstup hrozí, že se stane historickou událostí. Spěšně navržená směs vody a bobulí může uklidnit každé břicho, než následky dosáhnou vodních toků."
viVN = "Taco mạnh mẽ đã hoàn thành hành trình của nó qua thuộc địa.\nCác đầu bếp giờ đã hiểu tại sao những người hơ-mân gọi nó là <YellowHighlight>siêu mạnh</YellowHighlight>. Lối vào thật đau đớn. Lối ra có nguy cơ trở thành một sự kiện lịch sử.\nMột hỗn hợp được thiết kế vội vàng từ nước và trái cây có thể làm dịu mọi dạ dày trước khi những hậu quả đến với các con đường thủy."
trTR = "Güçlü taco, koloni içindeki yolculuğunu tamamladı. Şefler artık insanların ona <YellowHighlight>ekstra güçlü</YellowHighlight> dediklerini anlıyor. Giriş acı vericiydi. Çıkış, tarihi bir olay olma tehdidinde bulunuyor. Aceleyle hazırlanan su ve meyvelerden oluşan bir karışım, sonuçlar su yollarına ulaşmadan önce her mideyi yatıştırabilir."

