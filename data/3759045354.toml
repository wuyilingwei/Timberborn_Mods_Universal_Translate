["LV.BCEv.WaterfallSinkhole.Pref.Content"]
raw = "[[-]]This event will dramatically alter the map. Buildings within the affected area may be destroyed, and any beavers caught there may be killed.\nDo you want to enable this event?"
status = "normal"
enUS = "[[-]]This event will dramatically alter the map. Buildings within the affected area may be destroyed, and any beavers caught there may be killed. Do you want to enable this event?"
zhCN = "[-]此事件将显著改变地图。受影响区域内的建筑物可能会被摧毁，任何被困在那里海狸可能会被杀死。您想要启用此事件吗？"
zhTW = "[[-]]這個事件將會顯著改變地圖。受影響區域內的建築物可能會被摧毀，而被困在那裡的海狸可能會遭到殺死。您要啟用這個事件嗎？"
ruRU = "[[-]]Это событие радикально изменит карту. Постройки в затронутой зоне могут быть разрушены, и любые бобры, оказавшиеся там, могут погибнуть. Вы хотите включить это событие?"
jaJP = "「このイベントはマップを大きく変更します。影響を受けるエリア内の建物は破壊される可能性があり、そこにいるビーバーは死亡するかもしれません。このイベントを有効にしますか？」"
frFR = "[[-]]Cet événement modifiera considérablement la carte. Les bâtiments dans la zone affectée peuvent être détruits, et tous les castors pris là peuvent être tués. Voulez-vous activer cet événement ?"
deDE = "[[-]]Dieses Ereignis wird die Karte dramatisch verändern. Gebäude im betroffenen Gebiet können zerstört werden, und alle dort gefangenen Biber können getötet werden. Möchten Sie dieses Ereignis aktivieren?"
plPL = "[[-]]To wydarzenie w dramatyczny sposób zmieni mapę. Budynki w dotkniętym obszarze mogą zostać zniszczone, a wszelkie bobry, które się tam znajdą, mogą zginąć.  \nCzy chcesz włączyć to wydarzenie?"
ptBR = "[[-]]Este evento alterará dramaticamente o mapa. Edifícios na área afetada podem ser destruídos, e qualquer castor que estiver lá pode ser morto. Você quer ativar este evento?"
koKR = "[[ - ]]이번 이벤트는 맵을 극적으로 변경할 것입니다. 영향을 받는 지역 내의 건물은 파괴될 수 있으며, 그곳에 갇힌 비버들은 죽을 수 있습니다. 이 이벤트를 활성화하시겠습니까?"
csCZ = "[[-]]Tato událost dramaticky změní mapu. Budovy v postižené oblasti mohou být zničeny a jakékoli bobry, které se tam ocitnou, mohou být zabity. Chcete tuto událost povolit?"
viVN = "[[ - ]] Sự kiện này sẽ làm thay đổi đáng kể bản đồ. Các tòa nhà trong khu vực bị ảnh hưởng có thể bị phá hủy, và bất kỳ con beaver nào bị kẹt ở đó có thể bị giết. Bạn có muốn kích hoạt sự kiện này không?"
trTR = "[[ - ]]Bu etkinlik haritayı köklü bir şekilde değiştirecektir. Etkilenen alandaki binalar yok edilebilir ve orada mahsur kalan any bilimler ölebilir. Bu etkinliği etkinleştirmek istiyor musunuz?"

