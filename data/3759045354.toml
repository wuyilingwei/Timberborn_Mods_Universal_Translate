["LV.BCEv.BadtideDrainStudy.Content"]
raw = "Every Badtide, the corner drain wakes again.\nIt rumbles beneath the stone, then spills badwater into the land as if the earth itself has learned to poison the colony.\nMost beavers keep their distance.\nOne scientist does not.\nAfter many measurements, sketches, and sleepless nights, the scientist returns with a strange claim: the drain is not only a drain. Something hooman-made is buried beneath it, connected to the old structure in ways no one fully understands.\nThe markings are damaged, but one meaning seems clear.\nWhatever is buried there was built to stop the drain forever.\nThe first survey will take time, but the scientist says better instruments and old calculations could shorten whatever work remains."
status = "normal"
enUS = "Every Badtide, the corner drain awakens again. It rumbles beneath the stone, then spills bad water into the land as if the earth itself has learned to poison the colony. Most beavers keep their distance. One scientist does not. After many measurements, sketches, and sleepless nights, the scientist returns with a strange claim: the drain is not only a drain. Something human-made is buried beneath it, connected to the old structure in ways no one fully understands. The markings are damaged, but one meaning seems clear. Whatever is buried there was built to stop the drain forever. The first survey will take time, but the scientist says better instruments and old calculations could shorten whatever work remains."
zhCN = "每当潮水低落，角落的排水口再次觉醒。它在石头下隆隆作响，然后将污水倾泻到土地上，就好像大地本身已经学会了毒害这个殖民地。大多数海狸保持距离。一位科学家则不然。在经过多次测量、素描和无数个不眠之夜后，科学家带着一个奇怪的说法回来了：这个排水口不仅仅是一个排水口。某种人造物埋藏在其下，与旧结构以无人完全理解的方式相连。标记受损，但其中一个意义似乎很清楚。无论埋在那里的是什么，都是为了永远阻止排水。第一次勘测将需要时间，但科学家说更好的仪器和旧计算可能会缩短剩余工作的时间。"
zhTW = "每當潮汐來臨，角落的排水口再次甦醒。  \n它在石頭下隆隆作響，然後將污水灑向大地，就像大地本身學會了毒害這個殖民地。  \n大多數海狸保持距離。  \n但有一位科學家不這麼做。  \n經過多次測量、草圖和不眠之夜，科學家帶著一個奇怪的主張回來了：這個排水口不僅僅是一個排水口。某種人類製造的東西埋在其下，並以無人能完全理解的方式與舊結構相連。  \n標記已損壞，但有一個意義似乎很清楚。  \n埋在那裡的東西是為了永遠阻止排水口而建造的。  \n首次調查需要時間，但科學家表示，更好的儀器和舊計算可以縮短剩餘的工作。"
ruRU = "Каждый раз, когда приходит плохая волна, угловой дренаж пробуждается снова. Он гремит под камнями, затем выливает загрязненную воду на землю, словно сама земля научилась отравлять колонию. Большинство бобров держится на расстоянии. Один ученый — нет. После многих измерений, эскизов и бессонных ночей ученый возвращается с странным утверждением: дренаж — это не просто дренаж. Под ним зарыто что-то созданное человеком, связанное со старой конструкцией такими способами, которые никто не понимает полностью. Знаки повреждены, но одно значение кажется ясным. Всё, что там зарыто, было построено, чтобы навсегда остановить дренаж. Первое обследование займет время, но ученый говорит, что лучшие инструменты и старые расчеты могут сократить оставшуюся работу."
jaJP = "毎回の低潮時に、角の排水口が再び目を覚ます。\n石の下でうなり声を上げ、地面に悪水を流し込み、まるで大地がコロニーを毒することを学んだかのようだ。\nほとんどのビーバーは距離を置く。\nしかし、一人の科学者はそうではない。\n多くの測定、スケッチ、そして眠れぬ夜の後、この科学者は奇妙な主張を持って帰ってきた：排水口は単なる排水口ではない。何か人間が作ったものがその下に埋まっており、古い構造と誰も完全には理解していない方法でつながっている。\n markingsは損傷しているが、一つの意味は明らかのようだ。\nそこに埋まっているものは、排水口を永遠に止めるために作られた。\n最初の調査には時間がかかるが、科学者はより良い器具と古い計算が残っている作業を短縮できるだろうと言う。"
frFR = "Chaque marée basse, le drain d'angle se réveille à nouveau.  \nIl gronde sous la pierre, puis déverse de l'eau nocive sur la terre comme si la terre elle-même avait appris à empoisonner la colonie.  \nLa plupart des castors gardent leurs distances.  \nUn scientifique ne le fait pas.  \nAprès de nombreuses mesures, croquis et nuits sans sommeil, le scientifique revient avec une étrange affirmation : le drain n'est pas seulement un drain. Quelque chose fabriqué par l'homme est enterré en dessous, connecté à l'ancienne structure d'une manière que personne ne comprend complètement.  \nLes marques sont endommagées, mais un sens semble clair.  \nQuoi que ce soit qui soit enterré là a été construit pour arrêter le drain pour toujours.  \nLe premier relevé prendra du temps, mais le scientifique dit que de meilleurs instruments et d'anciennes calculs pourraient raccourcir le travail restant."
deDE = "Jede Badtide erwacht der Eckenabfluss erneut. \nEr grollt unter dem Stein und schütte das schlechte Wasser ins Land, als hätte die Erde selbst gelernt, die Kolonie zu vergiften. \nDie meisten Biber halten Abstand. \nEin Wissenschaftler jedoch nicht. \nNach vielen Messungen, Skizzen und schlaflosen Nächten kehrt der Wissenschaftler mit einer seltsamen Behauptung zurück: Der Abfluss ist nicht nur ein Abfluss. Etwas vom Menschen Gemachtes ist darunter begraben, verbunden mit der alten Struktur auf Weisen, die niemand vollständig versteht. \nDie Markierungen sind beschädigt, aber eine Bedeutung scheint klar zu sein. \nWas auch immer dort begraben ist, wurde gebaut, um den Abfluss für immer zu stoppen. \nDie erste Erhebung wird Zeit in Anspruch nehmen, aber der Wissenschaftler sagt, bessere Instrumente und alte Berechnungen könnten die verbleibende Arbeit verkürzen."
plPL = "Każdy Badtide, korytko odpływowe budzi się na nowo. Grzmi pod kamieniem, a następnie wylewa zanieczyszczoną wodę na ziemię, jakby sama ziemia nauczyła się trucizny kolonii. Większość bobrów trzyma się z daleka. Jeden naukowiec nie. Po wielu pomiarach, szkicach i bezsennych nocach, naukowiec wraca z dziwnym stwierdzeniem: odpływ to nie tylko odpływ. Coś stworzonego przez ludzi jest pochowane poniżej, połączone ze starą strukturą w sposób, którego nikt do końca nie rozumie. Znaki są uszkodzone, ale jedno znaczenie wydaje się jasne. Cokolwiek jest tam pochowane, zostało zbudowane, aby zatrzymać odpływ na zawsze. Pierwsza ocena zajmie czas, ale naukowiec mówi, że lepsze narzędzia i stare obliczenia mogłyby skrócić pozostałą pracę."
ptBR = "A cada maré baixa, o dreno do canto desperta novamente. Ele retumba sob a pedra, então derrama água contaminada na terra como se a própria terra tivesse aprendido a envenenar a colônia. A maioria dos castores mantém distância. Um cientista não. Após muitas medições, esboços e noites sem dormir, o cientista retorna com uma afirmação estranha: o dreno não é apenas um dreno. Algo feito por humanos está enterrado sob ele, conectado à antiga estrutura de maneiras que ninguém compreende completamente. As marcas estão danificadas, mas um significado parece claro. O que quer que esteja enterrado ali foi construído para parar o dreno para sempre. O primeiro levantamento levará tempo, mas o cientista diz que instrumentos melhores e cálculos antigos poderiam encurtar o trabalho que resta."
koKR = "매 바다 조류가 일어날 때마다 구석의 배수구가 다시 깨어납니다. 돌 아래에서 우르릉거리고, 지구가 식민지를 중독하는 법을 배운 것처럼 나쁜 물을 땅에 쏟아냅니다. 대부분의 비버들은 거리를 유지합니다. 그러나 한 과학자는 그렇지 않습니다. 많은 측정, 스케치, 불면의 시간을 보낸 후, 과학자는 이상한 주장을 가지고 돌아옵니다: 배수구는 단순한 배수구가 아닙니다. 그 아래에는 인간이 만든 무언가가 묻혀 있으며, 그 오래된 구조와 연결되어 있지만 누구도 완전히 이해하지 못하는 방식으로 연결되어 있습니다. 표시는 훼손되었지만, 하나의 의미는 명확해 보입니다. 그곳에 묻혀 있는 것은 배수구를 영원히 멈추기 위해 만들어졌습니다. 첫 번째 조사는 시간이 걸리겠지만, 과학자는 더 나은 도구와 오래된 계산이 남은 작업을 단축시킬 수 있다고 말합니다."
csCZ = "Každý špatný příliv se koutový odtok znovu probouzí. \nHřmí pod kamenem a pak vypouští kontaminovanou vodu do země, jako by se samotná země naučila otrávit kolonii. \nVětšina bobrů si drží odstup. \nJeden vědec však ne. \nPo mnoha měřeních, skicách a bezesných nocích se vědec vrací s podivným tvrzením: odtok není pouze odtok. Něco, co vytvořil člověk, je pohřbeno pod ním a je spojeno se starou strukturou způsoby, kterým nikdo zcela nerozumí. \nZnačení je poškozené, ale jeden význam se zdá být jasný. \nCokoli, co je tam pohřbeno, bylo postaveno, aby zastavilo odtok navždy. \nPrvní průzkum potrvá, ale vědec říká, že lepší přístroje a staré výpočty by mohly zkrátit jakoukoli zbývající práci."
viVN = "Mỗi lần triều xấu, cống góc lại thức dậy.\nNó rền rĩ dưới đá, rồi tràn nước xấu ra đất như thể chính trái đất đã học được cách đầu độc thuộc địa.\nHầu hết các chú bé không dám lại gần.\nMột nhà khoa học thì không.\nSau nhiều lần đo đạc, phác thảo và những đêm không ngủ, nhà khoa học trở lại với một tuyên bố kỳ lạ: cống không chỉ là một cống. Có thứ gì đó do con người làm bị chôn vùi bên dưới, gắn liền với cấu trúc cũ theo những cách mà không ai hiểu rõ.\nCác dấu hiệu bị hư hại, nhưng một ý nghĩa có vẻ khá rõ ràng.\nBất cứ thứ gì bị chôn vùi ở đó được xây dựng để ngăn cống vĩnh viễn.\nCuộc khảo sát đầu tiên sẽ mất thời gian, nhưng nhà khoa học nói rằng những thiết bị tốt hơn và những tính toán cũ có thể rút ngắn bất kỳ công việc nào còn lại."
trTR = "Her Badtide'da, köşe drenajı yeniden uyanıyor.\nTaşın altından gürültüler geliyor, sonra kötü suyu yeryüzüne döküyor, sanki toprak koloniyi zehirlemeyi öğrenmiş gibi.\nÇoğu kunduz mesafelerini koruyor.\nBir bilim insanı bunu yapmıyor.\nBirçok ölçüm, eskiz ve uykusuz gecenin ardından, bilim insanı garip bir iddiayla geri dönüyor: drenaj sadece bir drenaj değil. Altında gömülü olan, eski yapıyla kimsenin tam olarak anlamadığı şekillerde bağlantılı, insan yapımı bir şey var.\nİşaretler hasar görmüş, ama bir anlam belirgin gibi görünüyor.\nOrada gömülü olan şey, drenajı sonsuza dek durdurmak için yapılmış.\nİlk keşif zaman alacak, ama bilim insanı daha iyi aletlerin ve eski hesaplamaların geri kalan işi kısaltabileceğini söylüyor."

