["LV.BCEv.FirstDroughtWaterfall.Content"]
raw = "The first drought arrives with a dry wind.\nAcross the colony, the river weakens. Channels shrink, mud cracks along the banks, and beavers gather near the gauges with worried tails.\nBut near the waterfall, one clear basin does not fail.\nThe pool left untouched at the colony's founding still seeps from beneath the stone. No one knows whether it is fed by hidden pressure, old roots, or some deep pocket of water the drought has not reached.\nThe scouts lower their paws into the cool stream and stare at one another in silence.\nWhat was spared before now spares the colony.\n[[C]][[+]]One water source remains active during the first drought"
status = "normal"
enUS = "The first drought arrives with a dry wind.  \nAcross the colony, the river weakens. Channels shrink, mud cracks along the banks, and beavers gather near the gauges with worried tails.  \nBut near the waterfall, one clear basin does not fail.  \nThe pool left untouched at the colony's founding still seeps from beneath the stone. No one knows whether it is fed by hidden pressure, old roots, or some deep pocket of water the drought has not reached.  \nThe scouts lower their paws into the cool stream and stare at one another in silence.  \nWhat was spared before now spares the colony.  \n[[C]][[+]]One water source remains active during the first drought."
zhCN = "第一次干旱伴随着干燥的风到来。\n在整个殖民地，河流逐渐减弱。水道缩小，泥土在河岸旁开裂，海狸们聚集在测量仪附近，忧心忡忡地摇着尾巴。\n但在瀑布附近，一个清澈的水池并没有干涸。\n在殖民地成立时未被触碰的水潭仍然从石头下渗出。没有人知道它是由隐藏的压力、古老的根系，还是某个深处的水源供给，干旱未曾触及。\n侦察员们将爪子浸入凉爽的水流中，默默地相视而立。\n之前得到庇护的现在为殖民地提供庇护。\n[[C]][[+]]在第一次干旱期间，仍然有一个水源保持活跃。"
zhTW = "首場乾旱帶著乾燥的風而來。  \n在殖民地中，河流逐漸衰弱。水道縮小，泥土在岸邊開裂，海狸們擔心地聚集在水位計附近，尾巴緊張不已。  \n但在瀑布附近，一個清澈的水池卻依然沒有枯竭。  \n在殖民地建立時未被觸碰的水池仍然從石頭下滲出。沒有人知道它是由隱藏的壓力、古老的根系還是某個未被乾旱影響的深水口供應。  \n偵查員們將爪子浸入涼爽的溪流中，彼此默默對視。  \n曾經被保留的，如今保護著殖民地。  \n[[C]][[+]]第一場乾旱期間仍然有一個水源在運作。"
ruRU = "Первая засуха приходит с сухим ветром. По всей колонии река слабеет. Каналы сужаются, грязь ра裂на по берегам, и бобры собираются у мерных столбиков с тревожными хвостами. Но у водопада один ясный бассейн не иссякает. Лужа, оставшаяся нетронутой с момента основания колонии, все еще просачивается из-под камня. Никто не знает, питается ли она скрытым давлением, старыми корнями или каким-то глубоким водоносным карманом, до которого не добралась засуха. Разведчики опускают лапы в прохладный поток и молча смотрят друг на друга. То, что было спасено раньше, теперь спасает колонию. [[C]][[+]] Один водный источник остается активным во время первой засухи."
jaJP = "最初の干ばつが乾いた風と共に訪れます。  \n植民地全体で、川は弱まり、水路は縮小し、銀行沿いの泥はひび割れ、ビーバーたちは不安そうな尾を持ちながら計器の近くに集まります。  \nしかし、滝の近くにある一つの澄んだ盆地は干ばつに影響されません。  \n植民地が設立された時に手つかずのまま残された池は、石の下からまだしみ出ています。  \nそれが隠れた圧力、古い根、あるいは干ばつが届かない水の深いポケットによって供給されているのかは誰にもわかりません。  \n偵察者たちは冷たい流れに前足を浸し、沈黙の中で互いに見つめ合います。  \n以前に spared されたものが、今植民地を守ります。  \n[[C]][[+]]最初の干ばつの間、1つの水源が活動を続けます。"
frFR = "La première sécheresse arrive avec un vent sec. Dans la colonie, la rivière s'affaiblit. Les canaux rétrécissent, la boue se fissure le long des rives, et les castors se rassemblent près des jauges avec des queues inquiets. Mais près de la cascade, un bassin clair ne faillit pas. La mare laissée intacte à la fondation de la colonie continue de suinter sous la pierre. Personne ne sait si elle est alimentée par une pression cachée, de vieilles racines, ou une poche d'eau profonde que la sécheresse n'a pas atteinte. Les éclaireurs plongent leurs pattes dans le courant frais et se regardent en silence. Ce qui a été épargné auparavant épargne maintenant la colonie. [[C]][[+]]Une source d'eau reste active pendant la première sécheresse."
deDE = "Die erste Dürre kommt mit einem trockenen Wind. \nIm ganzen Kolonie schwächt sich der Fluss. Kanäle schrumpfen, der Schlamm riss entlang der Ufer, und die Biber versammeln sich besorgt bei den Messgeräten mit ängstlichen Schwänzen. \nAber in der Nähe des Wasserfalls versagt ein klarer Becken nicht. \nDer Pool, der bei der Gründung der Kolonie unberührt blieb, sickert weiterhin unter dem Stein hervor. Niemand weiß, ob er durch versteckten Druck, alte Wurzeln oder irgendeine tiefe Wasserblase gespeist wird, die die Dürre nicht erreicht hat. \nDie Pfadfinder senken ihre Pfoten in den kühlen Strom und starren einander schweigend an. \nWas zuvor verschont blieb, verschont jetzt die Kolonie. \n[[C]][[+]]Eine Wasserquelle bleibt während der ersten Dürre aktiv."
plPL = "Pierwsza susza nadchodzi z suchym wiatrem.  \nW całej kolonii rzeka słabnie. Kanały się kurczą, błoto pęka wzdłuż brzegów, a bobry gromadzą się w pobliżu mierników z zmartwionymi ogonami.  \nJednak w pobliżu wodospadu jeden czysty zbiornik nie zawiedzie.  \nBasen pozostający nietknięty od założenia kolonii nadal przesiąka spod kamienia. Nikt nie wie, czy jest zasilany ukrytym ciśnieniem, starymi korzeniami, czy może jakąś głęboką kieszenią wody, która nie została dosięgnięta przez suszę.  \nSkauci zanurzają łapy w chłodnym strumieniu i patrzą na siebie w milczeniu.  \nTo, co zostało ocalone wcześniej, teraz oszczędza kolonię.  \n[[C]][[+]]Jedno źródło wody pozostaje aktywne podczas pierwszej suszy."
ptBR = "A primeira seca chega com um vento seco.  \nPor toda a colônia, o rio enfraquece. Os canais diminuem, o barro racha nas margens e os castores se reúnem perto dos medidores com caudas preocupadas.  \nMas perto da cachoeira, uma bacia clara não falha.  \nA piscina deixada intocada na fundação da colônia ainda vaza debaixo da pedra. Ninguém sabe se é alimentada por pressão oculta, raízes antigas, ou algum bolso profundo de água que a seca não alcançou.  \nOs batedores mergulham as patas no fluxo fresco e se encaram em silêncio.  \nO que foi poupado antes agora poupa a colônia.  \n[[C]][[+]]Uma fonte de água permanece ativa durante a primeira seca."
koKR = "첫 가뭄이 건조한 바람과 함께 다가온다.  \n식민지 전역에서 강이 약해지고, 수로는 줄어들며, 진흙이 강둑을 따라 갈라지고, 비버들은 걱정하는 꼬리를 가진 채 눈금계 near에 모인다.  \n그러나 폭포 근처에서는 하나의 깨끗한 분지가 사라지지 않는다.  \n식민지가 세워졌을 때 아무렇지 않게 남겨진 그 웅덩이는 여전히 바위 아래에서 스며든다. 그곳이 숨겨진 압력, 오래된 뿌리, 또는 가뭄에 도달하지 못한 깊은 물 주머니에 의해 공급되는지 아무도 알지 못한다.  \n정찰병들은 서늘한 흐름 속에 발을 담그고 서로를 조용히 바라본다.  \n이전에는 구제받았던 것이 الآن 식민지를 구제한다.  \n[[C]][[+]]첫 가뭄 동안 활성 상태로 남아 있는 한 개의 수원이 있다."
csCZ = "První sucho přichází s suchým větrem. Po celé kolonii řeka slábne. Kanály se zmenšují, bláto praská podél břehů a bobři se shromažďují blízko měřičů s ustaranými ocasy. Ale poblíž vodopádu jeden jasný bazén nezkrachuje. Tůně, která zůstala nedotčena při založení kolonie, stále prosakuje zpod kamene. Nikdo neví, zda je živena skrytým tlakem, starými kořeny nebo nějakou hlubokou kapsou vody, kterou sucho nedosáhlo. Skauti spouštějí své tlapy do chladného proudu a tiše se na sebe dívají. Co bylo předtím ušetřeno, nyní šetří kolonii. [[C]][[+]]Jedno vodní zdroj zůstává aktivní během prvního sucha."
viVN = "Cơn hạn hán đầu tiên đến cùng với một làn gió khô.\nKhắp thuộc địa, dòng sông yếu đi. Các kênh rút lại, bùn nứt nẻ dọc bờ, và những con castor tụ tập gần những công cụ đo với đuôi lo lắng.\nNhưng gần thác nước, một cái bồn trong suốt không bị hỏng.\nCái hồ không bị đụng chạm từ khi thành lập thuộc địa vẫn rỉ nước từ dưới đá lên. Không ai biết liệu nó được nuôi dưỡng bởi áp lực ẩn, rễ cây cũ, hay một túi nước sâu nào mà cơn hạn hán chưa chạm đến.\nCác cái nhìn thám báo hạ chân xuống dòng suối mát và nhìn nhau trong im lặng.\nNhững gì được cứu trước đây giờ đây cứu lấy thuộc địa.\n[[C]][[+]]Một nguồn nước vẫn hoạt động trong cơn hạn hán đầu tiên."
trTR = "İlk kuraklık kuru bir rüzgarla birlikte gelir. Koloni genelinde nehir zayıflar. Kanallar daralır, kıyılarda çamurlar çatlar ve kunduzlar endişeli kuyruklarla ölçüm aletlerinin yanında toplanır. Ancak şelalenin yakınında, bir temiz havuz ölmez. Koloni kurulduğunda dokunulmamış halde bırakılan bu havuz, taşın altından sızıntı yapmaya devam eder. Bunun gizli bir basınç, eski kökler veya kuraklığın ulaşamadığı derin bir su cebi tarafından beslenip beslenmediğini hiç kimse bilmiyor. İzci kunduzlar, serin akıntıya patilerini daldırır ve sessizce birbirlerine bakarlar. Daha önce kurtarılan, şimdi koloniyi kurtarır. [[C]][[+]] İlk kuraklık sırasında bir su kaynağı aktif kalır."

