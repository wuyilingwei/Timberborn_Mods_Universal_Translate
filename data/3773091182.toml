["LV.BRe.RenovationNote"]
status = "normal"
raw = "- Once started, the building will start gathering materials via Distro Storage. Time only counts down when all materials are collected.\n- Collecting materials and renovating does <b>NOT</b> require Builders or Haulers. Link stockpiles with Distro Storage so materials can be delivered.\n- Only one renovation can be active at a time for each building. Cancelling refunds materials already delivered (as recovered goods). Completed renovations consume the materials and will not be refunded in any way."
enUS = "- Once started, the building will begin gathering materials via Distro Storage. Time only counts down when all materials are collected.\n- Collecting materials and renovating does <b>NOT</b> require Builders or Haulers. Link stockpiles with Distro Storage so materials can be delivered.\n- Only one renovation can be active at a time for each building. Cancelling refunds materials already delivered (as recovered goods). Completed renovations consume the materials and will not be refunded in any way."
zhCN = "- 一旦开始，建筑将通过分配存储开始收集材料。只有在所有材料收集完毕后，时间才会倒计时。\n- 收集材料和翻新不需要建筑工或搬运工。将储物堆与分配存储链接，以便材料能够被送达。\n- 每个建筑一次只能进行一个翻新。取消翻新会退还已交付的材料（作为回收物品）。完成的翻新消耗材料，并且不会以任何方式退还。"
zhTW = "- 一旦開始，建築物將開始通過配送儲藏箱收集材料。只有在收集到所有材料時，時間才會倒數。\n- 收集材料和翻新<b>不需要</b>建築工或搬運工。將儲存庫與配送儲藏箱連接，以便材料可以送達。\n- 每座建築只能同時進行一個翻新。取消翻新會退回已經送達的材料（作為回收到的物品）。完成的翻新將消耗材料，並不會以任何方式退款。"
ruRU = "- Как только начнется, здание начнет собирать материалы через распределительное хранилище. Время отсчитывается только когда все материалы собраны.\n- Сбор материалов и RENOVATION <b>НЕ</b> требует строителей или грузчиков. Свяжите складские запасы с распределительным хранилищем, чтобы материалы могли быть доставлены.\n- В каждом здании может быть активна только одна реновация одновременно. Отмена возвращает уже доставленные материалы (как восстановленные товары). Завершенные реновации расходуют материалы и не подлежат возврату."
jaJP = "- 一度開始されると、建物はDistro Storageを経由して材料を収集し始めます。すべての材料が収集されている間のみ、時間がカウントダウンします。\n- 材料の収集と改修は、<b>ビルダー</b>や<b>ハラー</b>を必要としません。材料が配達されるように、ストックパイルをDistro Storageにリンクしてください。\n- 各建物に対して同時に1つの改修のみがアクティブになれます。キャンセルすると、すでに配達された材料（回収資材）が返金されます。完了した改修は材料を消費し、いかなる形でも返金されません。"
frFR = "- Une fois commencé, le bâtiment commencera à rassembler des matériaux via le stockage Distro. Le temps ne compte à rebours que lorsque tous les matériaux sont collectés.\n- La collecte de matériaux et la rénovation <b>NE</b> nécessitent pas de Constructeurs ou de Transporteurs. Liez les dépôts avec le stockage Distro afin que les matériaux puissent être livrés.\n- Une seule rénovation peut être active à la fois pour chaque bâtiment. L'annulation rembourse les matériaux déjà livrés (en tant que biens récupérés). Les rénovations terminées consomment les matériaux et ne seront remboursées d'aucune manière."
deDE = "- Nachdem der Prozess gestartet wurde, beginnt das Gebäude, Materialien über den Verteilungsspeicher zu sammeln. Die Zeit läuft nur ab, wenn alle Materialien gesammelt sind.\n- Das Sammeln von Materialien und die Renovierung erfordern <b>KEINE</b> Bauarbeiter oder Transportarbeiter. Verbinde Lagerplätze mit dem Verteilungsspeicher, damit die Materialien geliefert werden können.\n- Für jedes Gebäude kann nur eine Renovierung gleichzeitig aktiv sein. Eine Stornierung erstatten die bereits gelieferten Materialien (als zurückgewonnene Waren). Abgeschlossene Renovierungen verbrauchen die Materialien und werden in keiner Weise zurückerstattet."
plPL = "- Po rozpoczęciu, budynek zacznie zbierać materiały za pośrednictwem Distro Storage. Czas liczy się tylko wtedy, gdy wszystkie materiały zostały zebrane.  \n- Zbieranie materiałów i renowacja <b>NIE</b> wymaga Budowniczych ani Transportowców. Połącz składy z Distro Storage, aby materiały mogły być dostarczane.  \n- Tylko jedna renowacja może być aktywna w danym czasie dla każdego budynku. Anulowanie zwraca materiały, które już zostały dostarczone (jako odzyskane towary). Ukończone renowacje zużywają materiały i nie będą w żaden sposób zwracane."
ptBR = "- Uma vez iniciado, o edifício começará a coletar materiais via Armazenamento Distro. O tempo só conta regressivamente quando todos os materiais são coletados.  \n- Coletar materiais e renovar não <b>EXIGE</b> Construtores ou Transportadores. Conecte os depósitos com o Armazenamento Distro para que os materiais possam ser entregues.  \n- Apenas uma reforma pode estar ativa por vez para cada edifício. Cancelar reembolsa os materiais já entregues (como bens recuperados). Reformas concluídas consomem os materiais e não serão reembolsadas de forma alguma."
koKR = "- 시작하면 건물이 Distro Storage를 통해 자재를 모으기 시작합니다. 모든 자재가 수집될 때만 시간이 카운트다운됩니다.  \n- 자재를 수집하고 개조하는 데 <b>건축가</b>나 <b>운반인</b>이 필요하지 않습니다. 자재가 전달될 수 있도록 재고를 Distro Storage와 연결하세요.  \n- 각 건물당 한 번에 하나의 개조만 활성화될 수 있습니다. 취소하면 이미 전달된 자재가 환불됩니다(회수된 자재로). 완료된 개조는 자재를 소모하며 어떤 방식으로도 환불되지 않습니다."
csCZ = "- Jakmile začne, budova začne shromažďovat materiály prostřednictvím Distro Storage. Čas se začne odpočítávat pouze tehdy, když jsou všechny materiály shromážděny.\n- Shromažďování materiálů a renovace <b>NEPOTŘEBUJÍ</b> stavitele ani přepravce. Propojte sklady s Distro Storage, aby materiály mohly být dodány.\n- Pouze jedna renovace může být aktivní v jednom okamžiku pro každou budovu. Zrušení vrací materiály, které již byly dodány (jako rekonstruované zboží). Dokončené renovace spotřebovávají materiály a nebudou vráceny žádným způsobem."
viVN = "- Khi đã bắt đầu, tòa nhà sẽ bắt đầu thu thập vật liệu thông qua Kho Distro. Thời gian chỉ tính khi tất cả vật liệu đã được thu thập.\n- Việc thu thập vật liệu và cải tạo <b>KHÔNG</b> yêu cầu Thợ Xây hoặc Người Vận Chuyển. Liên kết kho với Kho Distro để có thể giao các vật liệu.\n- Chỉ có một cải tạo có thể được thực hiện cùng một lúc cho mỗi tòa nhà. Hủy bỏ sẽ hoàn trả vật liệu đã được giao (như hàng hóa phục hồi). Các cải tạo hoàn thành sẽ tiêu tốn vật liệu và sẽ không được hoàn trả theo bất kỳ cách nào."
trTR = "- Başlatıldıktan sonra, bina Distro Depolama aracılığıyla malzeme toplamaya başlayacaktır. Süre, tüm malzemeler toplandığında geri sayım yapar.\n- Malzeme toplama ve yenileme <b>İHTİYAÇ DUYMAZ</b> İşçiler veya Taşıyıcılara. Malzemelerin teslim edilebilmesi için stok alanlarını Distro Depolama ile bağlayın.\n- Her bina için aynı anda yalnızca bir yenileme aktif olabilir. İptal etme, zaten teslim edilen malzemeleri geri öder (geri kazanılmış mallar olarak). Tamamlanan yenilemeler malzemeleri tüketir ve hiçbir şekilde geri ödenmez."

