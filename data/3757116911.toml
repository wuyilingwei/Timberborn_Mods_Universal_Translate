ptBR = "Apenas o anfitrião pode salvar o jogo no modo multiplayer. Peça ao anfitrião para salvar para que todos os jogadores compartilhem o mesmo estado do jogo."
koKR = "멀티플레이어에서는 호스트만 게임을 저장할 수 있습니다. 모든 플레이어가 동일한 게임 상태를 공유할 수 있도록 호스트에게 저장을 요청하세요."
csCZ = "Pouze hostitel může uložit hru v multiplayeru. Požádejte hostitele, aby hru uložil, aby všichni hráči sdíleli stejný herní stav."
viVN = "Chỉ có chủ phòng mới có thể lưu trò chơi trong chế độ nhiều người chơi. Hãy yêu cầu chủ phòng lưu lại để tất cả người chơi cùng chia sẻ trạng thái trò chơi giống nhau."
