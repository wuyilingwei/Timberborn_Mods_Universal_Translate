["Building.FoodStall.FlavorDescription"]
status = "normal"
raw = "Too many beavers forgot to eat until they were faraway on their job. Now they grab takeout snacks."
enUS = "Too many beavers forgot to eat until they were far away on their job. Now they grab takeout snacks."
zhCN = "“太多的海狸忘记在工作时吃饭，现在他们只能抓点外卖零食。”"
zhTW = "太多的海狸忘了吃飯，直到他們在工作地點遠離。現在他們會攜帶外賣小吃。"
ruRU = "Слишком много бобров забывали поесть, пока были далеко от дома. Теперь они берут с собой закуски."
jaJP = "「仕事が終わるまで食事を忘れてしまったビーバーが多すぎた。今では彼らはお持ち帰りのおやつを手に入れている。」"
frFR = "Trop de castors ont oublié de manger jusqu'à ce qu'ils soient loin de leur travail. Maintenant, ils attrapent des en-cas à emporter."
deDE = "„Zu viele Biber haben vergessen zu essen, bis sie bei ihrer Arbeit weit weg waren. Jetzt holen sie sich Snacks zum Mitnehmen.“"
plPL = "Zbyt wiele bobrów zapomniało o jedzeniu, aż były daleko w pracy. Teraz biorą przekąski na wynos."
ptBR = "Too many beavers forgot to eat until they were far away em seu trabalho. Agora eles pegam lanches para viagem."
koKR = "너무 많은 비버들이 일을 하러 멀리 가기까지 먹는 것을 잊었습니다. 이제 그들은 테이크아웃 간식을 집어 듭니다."
csCZ = "Příliš mnoho bobrů zapomnělo jíst, dokud nebyli daleko od svého zaměstnání. Teď si berou jídlo s sebou."
viVN = "Quá nhiều con nhím đã quên ăn cho đến khi chúng ở xa trong công việc. Giờ đây, chúng lấy đồ ăn nhanh đem theo."
trTR = "Çok fazla kunduz, işlerinin uzağında kalana kadar yemek yemeyi unuttu. Artık paket hizmet atıştırmalıkları alıyorlar."

