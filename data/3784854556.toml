raw = "Collects food and water for on-the-go beavers."
enUS = "Collects food and water for on-the-go beavers."
zhCN = "“为忙碌的海狸收集食物和水。”"
zhTW = "為活動中的海狸收集食物和水源。"
ruRU = "Собирает еду и воду для бобров на ходу."
jaJP = "移動中のビーバーのために食料と水を集めます。"
frFR = "Collecte de la nourriture et de l'eau pour les castors en déplacement."
